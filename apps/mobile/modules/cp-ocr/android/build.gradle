plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.critterpass.ocr'
version = '1.0.0'

android {
  namespace 'app.critterpass.ocr'
}

dependencies {
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  // Text recognition v2, barcode scanning and the document scanner all run in Google Play services,
  // which downloads each model on first use (see CpOcrModule.ensureInstalled), keeping the APK small.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1'
  implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  implementation 'com.google.android.gms:play-services-base:18.11.0'
  testImplementation 'junit:junit:4.13.2'
}
