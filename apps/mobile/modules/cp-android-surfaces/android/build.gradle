// Glance widgets are Compose. The compiler plugin follows the app's Kotlin version (set on the root
// project by Expo's root plugin), the same way cp-alarm applies it.
buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.2.0'
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}"
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'app.critterpass.surfaces'
version = '1.0.0'

android {
  namespace 'app.critterpass.surfaces'
  buildFeatures {
    compose true
  }
}

dependencies {
  // The shared files (snapshot/widgets.json, the pending-actions outbox, endpoints).
  implementation project(':cp-app-group')
  // The FCM service and channels: this module registers its Live Update, widget-refresh and vote
  // handlers and its notification actions there instead of running a second messaging service.
  implementation project(':cp-notifications')
  implementation 'androidx.core:core-ktx:1.19.1'
  implementation 'androidx.work:work-runtime-ktx:2.10.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.glance:glance:1.2.0'
  // Glance layouts take Compose colours and units.
  implementation platform('androidx.compose:compose-bom:2025.06.01')
  implementation 'androidx.compose.runtime:runtime'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.ui:ui-unit'
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is a stub under plain JUnit; the real one parses the fixtures.
  testImplementation 'org.json:json:20240303'
}
