plugins {
  id 'com.android.library'
  // Version pinned to match this exact build's resolved Kotlin Gradle Plugin version, printed by
  // Expo's own root project configuration log ("[ExpoRootProject] ... kotlin: 2.2.0") — a
  // version-less `plugins{}` request for this plugin id fails outright ("must include a version
  // number for this source"), unlike `kotlin-android` itself, which `expo-module-gradle-plugin`
  // applies through its own resolved-version lookup rather than the `plugins{}` DSL.
  id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0'
  id 'expo-module-gradle-plugin'
}

group = 'app.critterpass.spikeandroid'
version = '0.1.0'

android {
  namespace "app.critterpass.spikeandroid"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 1.19.1 is the actual latest published release (verified against Google's maven-metadata.xml)
  // — an earlier "1.13.2" guess doesn't exist as a real androidx.core artifact at all; it silently
  // passed local debug-variant resolution (a transitive dependency elsewhere won the version
  // conflict) but failed for real on EAS's release-variant `releaseRuntimeClasspath` resolution,
  // which is exactly why this module's own local build never caught it — release resolution wasn't
  // exercised locally, only debug.
  implementation "androidx.core:core-ktx:1.19.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
  // Live Update rendering (`Notification.ProgressStyle`/`MetricStyle`) falls back through
  // NotificationCompat below API 36 — compat's own progress bar, not a Glance/Compose concern.
  implementation "androidx.core:core:1.19.1"

  // Glance widget reading the cp-app-group snapshot (T8). 1.2.0 is the latest stable release as
  // of this spike (1.3.x is alpha-only on Google's maven).
  implementation "androidx.glance:glance-appwidget:1.2.0"
  implementation "androidx.glance:glance:1.2.0"

  // FCM v1 data-message receiver. No Firebase project exists yet in this environment (see the
  // ADR) — the library compiles and links against the real `FirebaseMessagingService` API without
  // needing `google-services.json`; `FirebaseApp` simply never auto-initializes without one, which
  // this module's own `AndroidSurfacesPushReceiver` never depends on (it takes a plain
  // `Map<String, String>`, not a `FirebaseApp`-backed type).
  implementation "com.google.firebase:firebase-messaging-ktx:24.1.2"

  // Real org.json on the unit-test classpath: the stub `android.jar` unit tests otherwise run
  // against throws `RuntimeException` for every `org.json` call (as for every other Android SDK
  // method) unless Robolectric is added. `AndroidSurfacesPushPayloadParser`'s parsing tests need a
  // real JSON implementation without pulling in Robolectric for a spike this narrow.
  testImplementation "org.json:json:20240303"
  testImplementation "junit:junit:4.13.2"
}
