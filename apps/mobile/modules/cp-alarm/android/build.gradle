// The full-screen alarm is Compose. The compiler plugin follows the app's Kotlin version (set on
// the root project by Expo's root plugin), the same way expo-modules-core applies it.
buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.2.0'
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}"
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'app.critterpass.alarm'
version = '1.0.0'

android {
  namespace 'app.critterpass.alarm'
  buildFeatures {
    compose true
  }
}

dependencies {
  // The App Group store: the outbox the alarm's buttons queue into and the stored schedule.
  implementation project(':cp-app-group')
  implementation 'androidx.core:core-ktx:1.19.1'
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation platform('androidx.compose:compose-bom:2025.06.01')
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.ui:ui'
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is a stub under plain JUnit; the real one runs the JSON round trips.
  testImplementation 'org.json:json:20240303'
}
