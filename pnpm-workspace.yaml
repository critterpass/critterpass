packages:
  - apps/*
  - services/*
  - packages/*
  - tools/*

saveExact: true

# One pinned version per shared dependency; workspace packages reference them as `catalog:`.
catalog:
  '@eslint/js': 10.0.1
  '@hono/node-server': 2.1.1
  '@hono/zod-openapi': 1.6.3
  '@testcontainers/postgresql': 12.1.0
  '@testcontainers/redis': 12.1.0
  '@types/node': 26.6.3
  '@types/pg': 8.23.1
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.2.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.12.0
  hono: 4.13.9
  pg: 8.23.0
  pino: 10.3.1
  prettier: 3.9.9
  redis: 6.2.1
  testcontainers: 12.1.0
  tsdown: 0.23.0
  tsx: 4.23.15
  turbo: 2.11.4
  typescript: 6.0.3
  typescript-eslint: 8.70.1
  vitest: 5.0.2
  zod: 4.6.5

# pnpm refuses dependency install scripts unless they are listed here.
allowBuilds:
  '@parcel/watcher': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@types/node@26.6.3'
  - '@cloudflare/workers-types@5.20260926.1'
