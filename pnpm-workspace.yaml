# Security floors for transitive dependencies (patched releases of the same major).
overrides:
  '@bacons/xcode>@expo/plist': 0.10.0
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  sharp: 0.35.4

# pnpm refuses dependency install scripts unless they are listed here.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  better-sqlite3: true
  better-sqlite3-multiple-ciphers: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@types/node@26.6.3'
  - '@cloudflare/workers-types@5.20260926.1'
  - pg-boss@12.35.0
