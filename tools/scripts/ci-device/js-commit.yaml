appId: app.critterpass.dev
---
# The device-run workflow's first flow in every shard: proves the app runs the JS exported for this
# run (the commit inlined as EXPO_PUBLIC_JS_COMMIT, shown by the Developer tools build marker) and
# not an embedded or published bundle from another commit. Run with `-e JS_COMMIT=<short sha>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 90000
- tapOn:
    id: 'dev-tools-entry'
- assertVisible:
    id: 'dev-build-marker'
    text: '.*js:${JS_COMMIT}.*'
