appId: app.critterpass.dev
---
# The device-run workflow's first flow in every shard: proves the app runs the JS exported for this
# run (the commit inlined as EXPO_PUBLIC_JS_COMMIT, shown by the Developer tools build marker) and
# not an embedded or published bundle from another commit. Run with `-e JS_COMMIT=<short sha>`.
# Always the first flow on a fresh simulator, so the app starts from a clean install.
# Launched again on each try: on a slow runner the emulator's launcher can still be starting when
# the first launch lands, the app's window gets no input focus, and every tap is dropped until the
# app is brought forward again (the shard's later flows, which launch it themselves, are fine).
- retry:
    maxRetries: 2
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'dev-tools-entry'
          timeout: 90000
      - tapOn:
          id: 'dev-tools-entry'
      - extendedWaitUntil:
          visible:
            id: 'dev-build-marker'
          timeout: 20000
- assertVisible:
    id: 'dev-build-marker'
    text: '.*js:${JS_COMMIT}.*'
# Leave the app as a fresh install for the shard's next flow.
- stopApp
- clearState
