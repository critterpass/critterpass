<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="doodles.js"></script>
</helmet>
<header style="background:rgba(23,20,42,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #2c2750;color:#f4efe4">
<div style="max-width:1240px;margin:0 auto;padding:12px clamp(20px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
<a href="Site%20-%20Home.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#ffd84a" style-hover="transform:rotate(-2deg)"><dc-import name="App Icon" variant="{{ iconPick }}" size="40" hint-size="40px,40px"></dc-import><span style="font:900 26px/1 Archivo,sans-serif;font-stretch:64%;letter-spacing:.01em">CRITTERPASS</span></a>
<nav style="display:flex;align-items:center;gap:clamp(14px,2.2vw,30px);flex-wrap:wrap;font:600 14px Geist,sans-serif">
<a href="Site%20-%20Home.dc.html#how" style="position:relative;text-decoration:none;color:#f4efe4">How it works<sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:50%;bottom:-10px;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:#ffd84a"></span></sc-if></a>
<a href="Site%20-%20Home.dc.html#locals" style="text-decoration:none;color:#f4efe4">The locals</a>
<a href="Site%20-%20Tips.dc.html" style="position:relative;text-decoration:none;color:#f4efe4">Tips<sc-if value="{{ isTips }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:50%;bottom:-10px;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:#ffd84a"></span></sc-if></a>
<a href="Site%20-%20Referral.dc.html" style="position:relative;text-decoration:none;color:#f4efe4">Bring your crew<sc-if value="{{ isCrew }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:50%;bottom:-10px;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:#ffd84a"></span></sc-if></a>
<a href="Site%20-%20Home.dc.html#get" style="display:flex;align-items:center;height:40px;padding:0 18px;border-radius:20px;background:#ffd84a;color:#17142a;text-decoration:none;font:900 13px Archivo,sans-serif;letter-spacing:.06em;transition:transform .2s" style-hover="transform:rotate(-3deg) scale(1.05)">GET THE APP</a>
</nav>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tips&quot;,&quot;crew&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;iconPick&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;face&quot;,&quot;passport&quot;,&quot;stamp&quot;,&quot;sticker&quot;],&quot;default&quot;:&quot;face&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    return { iconPick: this.props.iconPick ?? 'face', isHome: a === 'home', isTips: a === 'tips', isCrew: a === 'crew' };
  }
}
</script>
</body>
</html>
