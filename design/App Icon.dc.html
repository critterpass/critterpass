<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="doodles.js"></script>
<script src="critters-data.js"></script>
<script src="critters-draw-1.js"></script>
<script src="critters-draw-2.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
</helmet>
<div style="width:{{ size }}px;height:{{ size }}px;border-radius:{{ radius }};overflow:hidden;position:relative;flex:none;box-shadow:{{ shadow }}">
<div style="position:absolute;left:0;top:0;width:200px;height:200px;transform:scale({{ k }});transform-origin:0 0">
<div style="position:absolute;inset:0;background:{{ c.bg }} radial-gradient({{ c.dots }} 1.3px,transparent 1.8px) 0 0/9px 9px"></div>
<div style="position:absolute;inset:0;transform:scale({{ art }});transform-origin:50% 50%">
<sc-if value="{{ isFace }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:-90px;top:-34px;line-height:0"><doodle-art kind="gecko" size="380" anim="none" blink="false" seed="41" ink="{{ c.ink }}" fill="{{ c.fill }}" spot="{{ c.spot }}" accent="{{ c.cheek }}" eye="{{ c.eye }}" pupil="{{ c.pupil }}"></doodle-art></div>
</sc-if>
<sc-if value="{{ isPassport }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:6px;line-height:0"><doodle-art kind="gecko" size="200" anim="none" blink="false" seed="41" ink="{{ c.ink }}" fill="{{ c.fill }}" spot="{{ c.spot }}" accent="{{ c.cheek }}" eye="{{ c.eye }}" pupil="{{ c.pupil }}"></doodle-art></div>
<div style="position:absolute;left:42px;top:92px;width:124px;height:150px;border-radius:10px 16px 16px 10px;background:{{ c.pg }};border:3px solid {{ c.pb }};box-sizing:border-box;transform:rotate(-2deg)"></div>
<div style="position:absolute;left:34px;top:98px;width:128px;height:150px;border-radius:8px 16px 16px 8px;background:{{ c.p1 }};border:3px solid {{ c.pb }};box-sizing:border-box;transform:rotate(-4deg);display:flex;flex-direction:column;align-items:center;padding-top:20px;gap:9px;box-shadow:inset 9px 0 0 rgba(0,0,0,.08)">
<div style="position:relative;width:42px;height:42px;border-radius:50%;border:3px solid {{ c.p2 }};box-sizing:border-box;overflow:hidden">
<div style="position:absolute;left:50%;top:-2px;bottom:-2px;width:16px;margin-left:-9.5px;border-radius:50%;border:2.5px solid {{ c.p2 }}"></div>
<div style="position:absolute;left:-2px;right:-2px;top:50%;height:2.5px;margin-top:-1.25px;background:{{ c.p2 }}"></div>
</div>
<span style="font:800 11px Archivo,sans-serif;font-stretch:80%;letter-spacing:.22em;margin-right:-.22em;color:{{ c.p2 }}">PASSPORT</span>
</div>
<div style="position:absolute;left:44px;top:92px;display:flex;gap:1px;transform:rotate(-4deg)"><span style="width:9px;height:10px;border-radius:50%;background:{{ c.hand }};border:2.2px solid {{ c.pb }}"></span><span style="width:9px;height:11px;border-radius:50%;background:{{ c.hand }};border:2.2px solid {{ c.pb }}"></span><span style="width:9px;height:10px;border-radius:50%;background:{{ c.hand }};border:2.2px solid {{ c.pb }}"></span></div>
<div style="position:absolute;left:124px;top:86px;display:flex;gap:1px;transform:rotate(-4deg)"><span style="width:9px;height:10px;border-radius:50%;background:{{ c.hand }};border:2.2px solid {{ c.pb }}"></span><span style="width:9px;height:11px;border-radius:50%;background:{{ c.hand }};border:2.2px solid {{ c.pb }}"></span><span style="width:9px;height:10px;border-radius:50%;background:{{ c.hand }};border:2.2px solid {{ c.pb }}"></span></div>
</sc-if>
<sc-if value="{{ isStamp }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:22px;top:22px;width:156px;height:156px;border-radius:50%;border:7px solid {{ c.p1 }};box-sizing:border-box;transform:rotate(-9deg);display:flex;align-items:center;justify-content:center">
<div style="position:absolute;inset:7px;border-radius:50%;border:2.5px dashed {{ c.p1 }}"></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-4px">
<div style="line-height:0"><doodle-art kind="cp-001" size="92" anim="none" blink="false" seed="7" ink="{{ c.ink }}" fill="{{ c.cfill }}" spot="{{ c.cspot }}" belly="{{ c.cbelly }}" eye="{{ c.eye }}" pupil="{{ c.pupil }}"></doodle-art></div>
<span style="font:800 13px Archivo,sans-serif;font-stretch:80%;letter-spacing:.16em;color:{{ c.p1 }}">HÀ NỘI</span>
</div>
</div>
</sc-if>
<sc-if value="{{ isSticker }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:24px;top:22px;line-height:0;transform:rotate(-8deg)"><doodle-art kind="gecko" size="152" pose="wave" anim="none" blink="false" seed="41" sticker="{{ c.sticker }}" ink="{{ c.ink }}" fill="{{ c.fill }}" spot="{{ c.spot }}" accent="{{ c.cheek }}" eye="{{ c.eye }}" pupil="{{ c.pupil }}"></doodle-art></div>
</sc-if>
</div>
<sc-if value="{{ isTinted }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:#ffd84a;mix-blend-mode:multiply"></div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;face&quot;,&quot;passport&quot;,&quot;stamp&quot;,&quot;sticker&quot;],&quot;default&quot;:&quot;face&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;tinted&quot;,&quot;mono&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;ios&quot;,&quot;circle&quot;,&quot;squircle&quot;,&quot;rounded&quot;,&quot;teardrop&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:180,&quot;min&quot;:16,&quot;max&quot;:512,&quot;tsType&quot;:&quot;number&quot;},&quot;shadow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'face', m = this.props.mode ?? 'light', shape = this.props.shape ?? 'ios', size = +(this.props.size ?? 180);
    const T = '#dfe5cc', D = '#3a4720';
    const gk = {
      light: { ink: '#221e19', fill: '', spot: '', cheek: '', eye: '', pupil: '', cfill: '', cspot: '', cbelly: '' },
      tinted: { ink: '#141414', fill: '#8a8a8a', spot: '#6e6e6e', cheek: '#9a9a9a', eye: '#e6e6e6', pupil: '#141414', cfill: '#8a8a8a', cspot: '#5e5e5e', cbelly: '#c4c4c4' },
      mono: { ink: D, fill: T, spot: T, cheek: T, eye: T, pupil: D, cfill: T, cspot: T, cbelly: T }
    };
    gk.dark = gk.light;
    const Y = 'rgba(255,216,74,.2)', N = 'rgba(23,20,42,.13)', W = 'rgba(255,255,255,.07)';
    const P = {
      face: { light: { bg: '#ffd84a', dots: N }, dark: { bg: '#17142a', dots: 'rgba(255,216,74,.16)' }, tinted: { bg: '#000', dots: W }, mono: { bg: T, dots: 'transparent' } },
      passport: { light: { bg: '#17142a', dots: Y, p1: '#ff9a4d', p2: '#ffd84a', pb: '#221e19', pg: '#f4efe4', hand: '#a9d08c' }, dark: { bg: '#0b0a12', dots: 'rgba(255,216,74,.12)', p1: '#e57f3a', p2: '#ffd84a', pb: '#221e19', pg: '#d9d2c4', hand: '#a9d08c' }, tinted: { bg: '#000', dots: W, p1: '#555', p2: '#b0b0b0', pb: '#141414', pg: '#cfcfcf', hand: '#8a8a8a' }, mono: { bg: T, dots: 'transparent', p1: T, p2: D, pb: D, pg: T, hand: T } },
      stamp: { light: { bg: '#f4efe4', dots: 'rgba(23,20,42,.07)', p1: '#ff5fa8' }, dark: { bg: '#17142a', dots: 'rgba(255,95,168,.14)', p1: '#ff5fa8' }, tinted: { bg: '#000', dots: W, p1: '#a0a0a0' }, mono: { bg: T, dots: 'transparent', p1: D } },
      sticker: { light: { bg: '#17142a', dots: Y, sticker: '#f4efe4' }, dark: { bg: '#0b0a12', dots: 'rgba(255,216,74,.12)', sticker: '#f4efe4' }, tinted: { bg: '#000', dots: W, sticker: '#bdbdbd' }, mono: { bg: T, dots: 'transparent', sticker: T } }
    };
    const c = Object.assign({}, gk[m] || gk.light, (P[v] || P.face)[m] || P.face.light);
    const R = { none: '0', ios: '22.4%', circle: '50%', squircle: '34%', rounded: '16%', teardrop: '50% 50% 50% 16%' };
    return {
      size, k: size / 200, c, radius: R[shape] || R.ios,
      art: ['circle', 'squircle', 'rounded', 'teardrop'].includes(shape) ? 0.8 : 1,
      shadow: this.props.shadow ? '0 1px 2px rgba(20,16,40,.12),0 8px 24px rgba(20,16,40,.14)' : 'none',
      isFace: v === 'face', isPassport: v === 'passport', isStamp: v === 'stamp', isSticker: v === 'sticker', isTinted: m === 'tinted'
    };
  }
}
</script>
</body>
</html>
