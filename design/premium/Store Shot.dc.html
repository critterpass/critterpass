<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Borel&display=swap" rel="stylesheet">
<script src="doodles.js"></script>
</helmet>
<div style="width:360px;height:{{ h }}px;position:relative;overflow:hidden;background:{{ bg }};font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;color:{{ ink }};flex:none;">
<svg width="360" height="{{ h }}" style="position:absolute;inset:0;"><path d="{{ route }}" fill="none" stroke="{{ routeInk }}" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"></path></svg>
<div style="position:absolute;left:26px;right:26px;top:{{ capTop }}px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;">
<span style="white-space:nowrap;flex-shrink:0;line-height:1.2;padding:6px 11px;border-radius:9px;background:{{ kickBg }};color:{{ kickInk }};border:2.5px solid #fff;transform:rotate(-3deg);font-size:11.5px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 10px rgba(20,22,40,.2);">{{ kicker }}</span>
<span style="font-size:{{ ts }}px;font-weight:800;letter-spacing:-0.045em;line-height:.98;text-wrap:balance;">{{ title }}</span>
</div>
<div style="position:absolute;left:-15px;top:{{ py }}px;width:390px;height:844px;transform:scale({{ ps }}) rotate({{ tilt }}deg);transform-origin:50% 0;border-radius:{{ pr }}px;background:{{ phoneBg }};overflow:hidden;box-shadow:{{ bezel }};color:#1c1d24;">
{{ children }}
<sc-if value="{{ ios }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:61;"></div></sc-if>
<sc-if value="{{ android }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;top:16px;width:20px;height:20px;margin-left:-10px;border-radius:10px;background:#000;z-index:61;"></div></sc-if>
<div style="position:absolute;left:0;right:0;top:0;height:54px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 38px;box-sizing:border-box;font-weight:600;font-size:16px;color:{{ phoneInk }};"><span>{{ time }}</span><div style="display:flex;align-items:center;gap:6px;"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect></svg></div></div>
</div>
<div style="position:absolute;left:{{ noteX }}px;top:{{ noteY }}px;z-index:4;max-width:150px;transform:rotate({{ noteR }}deg);padding:12px 13px 9px;background:#fff6c9;border-radius:4px;box-shadow:0 2px 3px rgba(20,22,40,.12),0 12px 22px rgba(20,22,40,.22);font-family:Borel,cursive;font-size:14px;line-height:1.3;color:#6b5a24;">{{ note }}<div style="position:absolute;left:50%;top:-8px;width:46px;height:14px;margin-left:-23px;background:rgba(255,255,255,.72);transform:rotate(-4deg);"></div></div>
<div style="position:absolute;left:{{ crX }}px;top:{{ crY }}px;z-index:5;line-height:0;transform:rotate({{ crR }}deg);filter:drop-shadow(0 8px 10px rgba(20,22,40,.28));"><doodle-art kind="{{ critter }}" size="124" sticker="#ffffff" anim="none" seed="41"></doodle-art></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:780},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#ffd84a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;critter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gecko&quot;,&quot;tanuki&quot;,&quot;axolotl&quot;,&quot;puffin&quot;,&quot;sardine&quot;,&quot;egg&quot;],&quot;default&quot;:&quot;gecko&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;side&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;right&quot;],&quot;default&quot;:&quot;right&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;min&quot;:-6,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;rin&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.28,&quot;tsType&quot;:&quot;number&quot;},&quot;rout&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.28,&quot;tsType&quot;:&quot;number&quot;},&quot;kickBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1c1d24&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kickInk&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffffff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, ios = (p.platform ?? 'ios') !== 'android', dark = p.dark === true || p.dark === 'true';
    const h = ios ? 780 : 640, ps = ios ? 0.8 : 0.72, py = ios ? 272 : 212;
    const left = (p.side ?? 'right') === 'left';
    const ry = (v) => py - 14 + (+(v ?? .25) - .25) * 120;
    const rin = ry(p.rin), rout = ry(p.rout);
    return {
      children: p.children, ios, android: !ios, h, ps, py,
      capTop: ios ? 50 : 34, ts: ios ? 38 : 33,
      pr: ios ? 56 : 44, tilt: +(p.tilt ?? 0),
      bezel: ios ? '0 0 0 10px #0b0b0d,0 0 0 11px #2a2b30,0 0 0 13px #9a9ca3,0 50px 80px -20px rgba(20,22,40,.55)' : '0 0 0 9px #0b0b0d,0 0 0 10px #3a3b40,0 50px 80px -20px rgba(20,22,40,.55)',
      route: `M0 ${rin} C 120 ${rin - 6}, 240 ${rout + 6}, 360 ${rout}`,
      routeInk: dark ? 'rgba(255,255,255,.75)' : 'rgba(23,20,42,.45)',
      bg: p.bg ?? '#ffd84a', ink: dark ? '#ffffff' : '#17142a',
      kickBg: p.kickBg ?? '#1c1d24', kickInk: p.kickInk ?? '#ffffff',
      kicker: p.kicker ?? '', title: p.title ?? '', note: p.note ?? '',
      noteX: left ? 196 : 14, noteY: py + (ios ? 214 : 170), noteR: left ? 5 : -5,
      critter: p.critter ?? 'gecko', crX: left ? -14 : 248, crY: py + (ios ? 330 : 262), crR: left ? -10 : 10,
      phoneBg: p.phoneBg ?? '#f5f5f7', phoneInk: p.phoneInk ?? '#1c1d24', time: p.time ?? '9:41',
    };
  }
}
</script>
</body>
</html>
