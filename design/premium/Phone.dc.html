<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:30px;">
<div style="width:390px;height:844px;border-radius:56px;background:{{ bg }};position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 10px #0b0b0d,0 0 0 11px #2a2b30,0 0 0 13px #9a9ca3,0 0 0 13.5px #55565c,0 60px 100px -30px rgba(20,22,40,.45),0 30px 50px -30px rgba(20,22,40,.35);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;color:#1c1d24;">
  {{ children }}
  <div style="position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:61;box-shadow:inset 0 0 0 1px #16171a;"></div>
  <div style="position:absolute;left:0;right:0;top:0;height:54px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 38px;box-sizing:border-box;font-weight:600;font-size:16px;color:{{ ink }};"><span>{{ time }}</span><div style="display:flex;align-items:center;gap:6px;"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.5 6.9a6.4 6.4 0 0 1 9 0l-1.4 1.4a4.4 4.4 0 0 0-6.2 0zM1 4.4a10 10 0 0 1 14 0l-1.4 1.4a8 8 0 0 0-11.2 0z"></path></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".4"></rect></svg></div></div>
  <div style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:{{ ink }};z-index:61;"></div>
</div>
<sc-if value="{{ label }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:8px;padding-left:8px;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#1c1d24;"><b>{{ code }}</b><span style="color:#6e7180;">{{ label }}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f5f5f7&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;code&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    return {
      children: this.props.children,
      bg: this.props.bg ?? (dark ? '#1c1d24' : '#f5f5f7'),
      ink: this.props.ink ?? (dark ? '#ffffff' : '#1c1d24'),
      time: this.props.time ?? '9:41',
      code: this.props.code ?? '',
      label: this.props.label ?? '',
    };
  }
}
</script>
</body>
</html>
