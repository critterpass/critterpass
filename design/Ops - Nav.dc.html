<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#120f22;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#7fb8ff;text-decoration:none}a:hover{color:#ffd84a}</style>
</helmet>
<nav aria-label="Console" style="box-sizing:border-box;width:240px;height:100%;min-height:900px;background:#120f22;box-shadow:inset -1px 0 0 #221e3d;display:flex;flex-direction:column;gap:2px;padding:18px 12px 16px;color:#f4efe4;font-family:Geist,system-ui,sans-serif">
<div style="display:flex;align-items:center;gap:10px;padding:0 6px 12px">
<dc-import name="App Icon" variant="face" size="32" hint-size="32px,32px"></dc-import>
<span style="font:900 22px/1 Archivo,sans-serif;font-stretch:64%;color:#ffd84a;letter-spacing:.01em">CRITTERPASS</span>
<span style="padding:4px 6px;border-radius:5px;background:#2c2750;color:#d8d3ee;font:800 10.5px/1 Archivo,sans-serif;letter-spacing:.12em">OPS</span>
</div>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
<sc-if value="{{ g.hasLabel }}" hint-placeholder-val="{{ true }}"><div style="padding:14px 12px 6px;font:700 11px/1 Archivo,sans-serif;letter-spacing:.16em;color:#8d87a8">{{ g.label }}</div></sc-if>
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
<sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><a href="{{ it.href }}" aria-current="page" style="position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 14px;border-radius:9px;background:#2c2750;color:#f4efe4;font:600 13.5px/1 Geist,sans-serif;text-decoration:none"><span style="position:absolute;left:0;top:9px;width:3px;height:16px;border-radius:2px;background:#ffd84a"></span>{{ it.label }}<sc-if value="{{ it.urgent }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#ff5fa8;color:#17142a;font:800 11px/20px Archivo,sans-serif;text-align:center">{{ it.count }}</span></sc-if><sc-if value="{{ it.warn }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#ff9a4d;color:#17142a;font:800 11px/20px Archivo,sans-serif;text-align:center">{{ it.count }}</span></sc-if><sc-if value="{{ it.plain }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#3a3466;color:#f4efe4;font:800 11px/20px Archivo,sans-serif;text-align:center">{{ it.count }}</span></sc-if></a></sc-if>
<sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><a href="{{ it.href }}" style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 14px;border-radius:9px;color:#a9a3c0;font:600 13.5px/1 Geist,sans-serif;text-decoration:none" style-hover="background:#1f1b38;color:#f4efe4">{{ it.label }}<sc-if value="{{ it.urgent }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#ff5fa8;color:#17142a;font:800 11px/20px Archivo,sans-serif;text-align:center">{{ it.count }}</span></sc-if><sc-if value="{{ it.warn }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#ff9a4d;color:#17142a;font:800 11px/20px Archivo,sans-serif;text-align:center">{{ it.count }}</span></sc-if><sc-if value="{{ it.plain }}"><span style="margin-left:auto;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#2c2750;color:#d8d3ee;font:800 11px/20px Archivo,sans-serif;text-align:center">{{ it.count }}</span></sc-if></a></sc-if>
</sc-for>
</sc-for>
<div style="margin-top:auto;padding:14px 6px 0;box-shadow:inset 0 1px 0 #221e3d;display:flex;align-items:center;gap:10px">
<span style="width:32px;height:32px;border-radius:50%;background:{{ me.color }};color:#17142a;display:inline-flex;align-items:center;justify-content:center;font:900 14px/1 Archivo,sans-serif;flex:none">{{ me.initial }}</span>
<div style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1">
<span style="font:600 13px/1.2 Geist,sans-serif;color:#f4efe4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ me.name }}</span>
<span style="font:800 10.5px/1 Archivo,sans-serif;letter-spacing:.12em;color:#a9a3c0">{{ me.roles }}</span>
</div>
<a href="{{ signOutHref }}" style="font:600 12px/1 Geist,sans-serif;color:#a9a3c0;padding:8px 4px">Sign out</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;work&quot;,&quot;moderation&quot;,&quot;desk&quot;,&quot;feedback&quot;,&quot;support&quot;,&quot;billing&quot;,&quot;catalogue&quot;,&quot;content&quot;,&quot;community&quot;,&quot;flags&quot;,&quot;partners&quot;,&quot;services&quot;,&quot;jobs&quot;,&quot;audit&quot;,&quot;operators&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;owner&quot;,&quot;ops&quot;,&quot;content&quot;,&quot;support&quot;],&quot;default&quot;:&quot;owner&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  href(id) {
    const F = { home: 'Ops - Home', work: 'Ops - My Work', moderation: 'Ops - Moderation', desk: 'Ops - Desk', feedback: 'Ops - Feedback', support: 'Ops - Support', billing: 'Ops - Billing', catalogue: 'Ops - Catalogue', content: 'Ops - Content Batches', community: 'Ops - Community', flags: 'Ops - Flags', partners: 'Ops - Partners', services: 'Ops - Services', jobs: 'Ops - Jobs', audit: 'Ops - Audit', operators: 'Ops - Operators' };
    const A = { home: 's02', work: 's03', moderation: 's04', desk: 's05', feedback: 's06', support: 's07', billing: 's08', catalogue: 's09', content: 's10', community: 's11', flags: 's12', partners: 's13', services: 's14', jobs: 's15', audit: 's16', operators: 's17' };
    return decodeURIComponent(location.pathname).includes('Ops Console') ? '#' + A[id] : encodeURI(F[id] + '.dc.html');
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    const role = this.props.role ?? 'owner';
    const R = { home: 'all', work: 'all', moderation: 'ops support', desk: 'ops', feedback: 'support', support: 'support', billing: 'support', catalogue: 'content', content: 'content', community: 'ops content', flags: 'ops', partners: 'ops', services: 'ops', jobs: 'ops', audit: 'ops', operators: '' };
    const can = id => role === 'owner' || R[id] === 'all' || R[id].split(' ').includes(role);
    const it = (id, label, count, tone) => ({ id, label, count, href: this.href(id), on: id === active, off: id !== active, urgent: tone === 'u', warn: tone === 'w', plain: tone === 'p' });
    const groups = [
      { label: '', items: [it('home', 'Home'), it('work', 'My work', 5, 'p')] },
      { label: 'QUEUES', items: [it('moderation', 'Moderation', 12, 'u'), it('desk', 'Concierge desk', 4, 'u'), it('feedback', 'Feedback & ideas', 9, 'p')] },
      { label: 'PEOPLE', items: [it('support', 'Support'), it('billing', 'Billing')] },
      { label: 'CONTENT', items: [it('catalogue', 'Catalogue'), it('content', 'Content batches', 2, 'p'), it('community', 'Community & drivers', 3, 'p')] },
      { label: 'PLATFORM', items: [it('flags', 'Flags & config'), it('partners', 'Partners'), it('services', 'Services & spend', 1, 'w'), it('jobs', 'Jobs & DLQ', 7, 'w')] },
      { label: 'GOVERNANCE', items: [it('audit', 'Audit log'), it('operators', 'Operators')] }
    ].map(g => ({ ...g, hasLabel: !!g.label, items: g.items.filter(i => can(i.id)) })).filter(g => g.items.length);
    const people = {
      owner: { name: 'Quoc', initial: 'Q', color: '#ffd84a', roles: 'OWNER' },
      ops: { name: 'Mai Tran', initial: 'M', color: '#ff5fa8', roles: 'OPS' },
      content: { name: 'Linh Pham', initial: 'L', color: '#4f86ff', roles: 'CONTENT' },
      support: { name: 'Arif Rahman', initial: 'A', color: '#54d6a4', roles: 'SUPPORT' }
    };
    return { groups, me: people[role] || people.owner, signOutHref: decodeURIComponent(location.pathname).includes('Ops Console') ? '#s01' : encodeURI('Ops - Sign In.dc.html') };
  }
}
</script>
</body>
</html>
