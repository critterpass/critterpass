- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'ChatMessage'
- takeScreenshot: 21-chat-message
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Composer'
- takeScreenshot: 22-chat-composer
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'StoryPlayer'
- takeScreenshot: 23-story-player
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'LeaveByHero'
- takeScreenshot: 24-leave-by-hero
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'SettleRow'
- takeScreenshot: 25-settle-row
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Viewfinder'
- takeScreenshot: 26-viewfinder
