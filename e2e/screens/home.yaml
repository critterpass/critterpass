appId: app.critterpass.dev
---
# Premium design | device capture of Home, trips, crews and inbox (3.01–3.20) with the Foundations
# states Home reaches (1.01, 1.02, 1.04). A crew of one with nothing planned first, then the Bali
# demo crew in light, then dark for its key screens (Home, the switcher, the inbox, Your trips, crew
# settings). A capture sweep: a state that does not come up is skipped, never failed.
# The dark pass is home-dark.yaml (its own shard).
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: crew_with_code
- runFlow: subflows/home-first-crew.yaml
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: subflows/home-crew.yaml
    env:
      LOOK: light
