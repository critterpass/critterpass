appId: app.critterpass.dev
---
# Design | device captures for the premium UI's wallet: bookings and money. First a crew with
# nothing in its wallet (the demo crew's Bali trip): the empty states, the + becoming the add sheet,
# adding a booking. Then a crew with a stay, tomorrow's flight and two expenses (Đà Nẵng): the
# stack, a flight and a stay, insurance, balances, adding an expense, settling up and the budget,
# in light and then dark (the dark flight detail keeps its light boarding card). Receipt scans,
# rooms and a cancelled flight need a camera or a booking no seed makes: not captured here.
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: subflows/wallet-empty.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: trip_tomorrow
- runFlow:
    file: subflows/wallet-bookings.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/wallet-money.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/appearance.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/wallet-bookings.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/wallet-money.yaml
    env:
      LOOK: dark
