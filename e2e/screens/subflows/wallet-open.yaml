appId: app.critterpass.dev
---
# The Wallet tab on its ${HALF} half (bookings or money; ${LABEL} is the half's name on the switch).
- runFlow:
    file: ../../_shared/tab.yaml
    env:
      TAB: wallet
      LABEL: Wallet
- extendedWaitUntil:
    visible:
      id: 'wallet-switch'
    timeout: 20000
    optional: true
# The tab keeps the half it was left on scrolled where it was (the money half after settling up):
# the switch sits under the title, so the page goes back to its top first.
- runFlow:
    when:
      notVisible:
        id: 'wallet-switch'
    commands:
      - scrollUntilVisible:
          element:
            id: 'wallet-switch'
          direction: UP
          timeout: 10000
          optional: true
- runFlow:
    file: ../../_shared/tap.yaml
    env:
      ID: 'wallet-switch-${HALF}'
      LABEL: ${LABEL}
- extendedWaitUntil:
    visible:
      id: "${HALF == 'money' ? 'money-(ready|none|syncing)' : 'bookings-wallet-(empty|ready)'}"
    timeout: 20000
    optional: true
