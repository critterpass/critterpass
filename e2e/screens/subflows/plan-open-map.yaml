appId: app.critterpass.dev
---
# From Home to the trip's plan on one map: the hub's Plan door (or its Plan tile). The map is
# ready when its top bar's search pill shows.
- runFlow: plan-open-hub.yaml
- runFlow:
    when:
      visible:
        id: 'trip-hub-door-plan'
    commands:
      - tapOn:
          id: 'trip-hub-door-plan'
- runFlow:
    when:
      visible:
        id: 'trip-hub-tile-plan'
    commands:
      - tapOn:
          id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-map-search'
    timeout: 30000
    optional: true
