appId: app.critterpass.dev
---
# Setting up, light, once the trip's setup checklist is on its way: the checklist (4.08), When as
# a heatmap (4.10; no week fits 4.14 when it shows) with its calendar sheet (4.11) and marking days
# by hand (4.12), Budget (4.15 sweet spot, or 4.16 while maxes are missing) and the private max
# (4.17), Getting there (4.18) and the route (4.19), then drafting now (4.20, slow 4.21). Every
# step is conditional: without the checklist nothing happens. Ends wherever drafting left it.
- extendedWaitUntil:
    visible:
      id: 'setup-checklist|setup-when-.*'
    timeout: 20000
    optional: true
# "Set up" can open on the When step instead of the checklist: the crew's heatmap (4.10).
- runFlow:
    when:
      visible:
        id: 'setup-when-.*'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '4.10'
            NAME: when-heatmap
- runFlow:
    when:
      visible:
        id: 'setup-checklist'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '4.08'
            NAME: checklist
      # When: the crew's calendars as one heatmap, its calendar sheet and marking by hand.
      - scrollUntilVisible:
          element:
            id: 'setup-row-dates'
          direction: DOWN
          timeout: 10000
          centerElement: true
          optional: true
      - tapOn:
          id: 'setup-row-dates'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'setup-when-.*'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'setup-when-no-fit'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.14'
                  NAME: no-week-fits
      - runFlow:
          when:
            notVisible:
              id: 'setup-when-no-fit'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.10'
                  NAME: when-heatmap
      - scrollUntilVisible:
          element:
            id: 'own-calendar-action'
          direction: DOWN
          timeout: 8000
          centerElement: true
          optional: true
      - runFlow:
          when:
            visible:
              id: 'own-calendar-action'
          commands:
            - tapOn:
                id: 'own-calendar-action'
            - extendedWaitUntil:
                visible:
                  id: 'calendar-by-hand'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'calendar-connect|calendar-by-hand'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.11'
                        NAME: find-free-days
            - runFlow:
                when:
                  visible:
                    id: 'calendar-by-hand'
                commands:
                  - tapOn:
                      id: 'calendar-by-hand'
                  - extendedWaitUntil:
                      visible:
                        id: 'manual-days-grid'
                      timeout: 10000
                      optional: true
                  - runFlow:
                      when:
                        visible:
                          id: 'manual-days-grid'
                      commands:
                        - runFlow:
                            file: shot.yaml
                            env:
                              CODE: '4.12'
                              NAME: mark-days
            - repeat:
                times: 2
                while:
                  visible:
                    id: 'manual-days-grid|calendar-by-hand'
                commands:
                  - runFlow: ../../_shared/back.yaml
      - runFlow:
          when:
            notVisible:
              id: 'setup-checklist'
          commands:
            - runFlow: ../../_shared/back.yaml
      # Budget: the sweet spot once every max is in, else the wait on the maxes; then my max.
      - scrollUntilVisible:
          element:
            id: 'setup-row-budget'
          direction: DOWN
          timeout: 10000
          centerElement: true
          optional: true
      - tapOn:
          id: 'setup-row-budget'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'budget-step|budget-member.*'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'budget-sweet-spot'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.15'
                  NAME: budget-sweet-spot
      - runFlow:
          when:
            visible:
              id: 'budget-step'
            notVisible:
              id: 'budget-sweet-spot'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.16'
                  NAME: budget-waiting
      - runFlow:
          when:
            visible:
              id: 'budget-own-max'
          commands:
            - tapOn:
                id: 'budget-own-max'
      - extendedWaitUntil:
          visible:
            id: 'budget-member.*'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'budget-member.*'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.17'
                  NAME: private-max
      - repeat:
          times: 2
          while:
            notVisible:
              id: 'setup-checklist'
          commands:
            - runFlow: ../../_shared/back.yaml
      - runFlow:
          file: plan-step.yaml
          env:
            ROW: getting_there
            READY: setup-getting-there
            CODE: '4.18'
            NAME: getting-there
      - runFlow:
          file: plan-step.yaml
          env:
            ROW: route
            READY: setup-route
            CODE: '4.19'
            NAME: route
      # Drafting now: the guide thinking, and past 45 seconds the safe-to-leave page.
      - scrollUntilVisible:
          element:
            id: 'setup-draft-now'
          direction: DOWN
          timeout: 10000
          centerElement: true
          optional: true
      - runFlow:
          when:
            visible:
              id: 'setup-draft-now'
          commands:
            - tapOn:
                id: 'setup-draft-now'
            - extendedWaitUntil:
                visible:
                  id: 'drafting-title'
                timeout: 20000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'drafting-title'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.20'
                        NAME: drafting
                  - extendedWaitUntil:
                      visible:
                        id: 'drafting-close|draft-review'
                      timeout: 90000
                      optional: true
                  - runFlow:
                      when:
                        visible:
                          id: 'drafting-close'
                      commands:
                        - runFlow:
                            file: shot.yaml
                            env:
                              CODE: '4.21'
                              NAME: drafting-slow
                        - tapOn:
                            id: 'drafting-close'
