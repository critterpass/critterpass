appId: app.critterpass.dev
---
# A fresh account with the staging demo crew (a confirmed Bali trip three weeks out): the trip
# hub's header (3k-1) and the first day's hero (3k-2) with Bali's photo under them. Run after
# ../sweep/subflows/start.yaml in ${LANG}. The photo fades in once loaded, so each shot waits.
- runFlow: ../../home/subflows/onboard.yaml
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-header-pre'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${LANG}-3k-1-hub-photo
- tapOn:
    id: 'trip-hub-next'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${LANG}-3k-2-day-of-photo
