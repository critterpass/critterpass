appId: app.critterpass.dev
---
# The shortest pass flow from the splash to Home, like ../../home/subflows/onboard.yaml, but every
# step waits for the next screen and taps again when a tap landed mid-transition: on a slow CI
# emulator or simulator a tap during a page change is dropped, and the flow stalls a page early.
- runFlow: ../../onboarding/subflows/through-name.yaml
- waitForAnimationToEnd
- tapOn:
    id: 'onboarding-photo-guides-ajo'
- tapOn:
    id: 'onboarding-photo-next'
- repeat:
    while:
      notVisible:
        id: 'taste-card-left'
    times: 3
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: 'onboarding-photo-next'
          commands:
            - tapOn:
                id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'taste-card-right'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'taste-done'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'taste-done'
- repeat:
    while:
      notVisible:
        id: 'home-search'
    times: 3
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: 'taste-done'
          commands:
            - tapOn:
                id: 'taste-done'
- extendedWaitUntil:
    visible:
      id: 'home-search'
    timeout: 15000
# The nearest airports are offered first; search only when none is.
- runFlow:
    when:
      visible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-row-SGN'
- runFlow:
    when:
      notVisible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-search'
      - inputText: 'Sing'
      - extendedWaitUntil:
          visible:
            id: 'home-row-SIN'
          timeout: 10000
      - tapOn:
          id: 'home-row-SIN'
- hideKeyboard
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: 'onboarding-issued-save'
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 10000
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer-later'
    timeout: 10000
- tapOn:
    id: 'permissions-primer-later'
