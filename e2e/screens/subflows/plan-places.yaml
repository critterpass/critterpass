appId: app.critterpass.dev
---
# Pitching a place, in ${LOOK}, from the `crew_with_code` Home (a crew with no trip): Search places
# with the field over the keyboard (4.02), a live guide's destination page (4.04), a city without a
# guide on the guest guide (4.03) and its solo pass (4.07, cancelled). Dark: search, the
# destination and the guest guide. Ends on Home.
- scrollUntilVisible:
    element:
      id: 'home-pitch-place'
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- tapOn:
    id: 'home-pitch-place'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'place-search-field'
    commands:
      - tapOn:
          id: 'place-search-field'
      - runFlow:
          file: shot.yaml
          env:
            CODE: '4.02'
            NAME: search-keyboard
      # A live guide's city opens its destination page.
      - inputText: 'Bali'
      - extendedWaitUntil:
          visible:
            id: 'place-result-.*'
          timeout: 30000
          optional: true
      - runFlow:
          when:
            true: ${LOOK == 'light'}
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.02'
                  NAME: search-results
      - runFlow:
          when:
            visible:
              id: 'place-result-.*'
          commands:
            - tapOn:
                id: 'place-result-.*'
                index: 0
            - extendedWaitUntil:
                visible:
                  id: 'explore-destination|guest-page'
                timeout: 30000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'explore-destination'
                commands:
                  - runFlow:
                      when:
                        visible:
                          id: 'explore-destination'
                      commands:
                        - runFlow:
                            file: shot.yaml
                            env:
                              CODE: '4.04'
                              NAME: destination
            - runFlow:
                when:
                  visible:
                    id: 'explore-destination|guest-page'
                commands:
                  - runFlow: ../../_shared/back.yaml
# A city without a guide: the guest guide, then its solo pass.
- runFlow:
    when:
      visible:
        id: 'place-search-field'
    commands:
      - tapOn:
          id: 'place-search-field'
      - eraseText: 20
      - inputText: 'Marrakech'
      - extendedWaitUntil:
          visible:
            id: 'place-result-.*'
          timeout: 30000
          optional: true
      - hideKeyboard
      - runFlow:
          when:
            visible:
              id: 'place-result-.*'
          commands:
            - tapOn:
                id: 'place-result-.*'
                index: 0
            - extendedWaitUntil:
                visible:
                  id: 'guest-notes|guest-error|explore-destination'
                timeout: 60000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'guest-page'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.03'
                        NAME: guest-guide
                  - runFlow:
                      when:
                        true: ${LOOK == 'light'}
                      commands:
                        - scrollUntilVisible:
                            element:
                              id: 'guest-solo'
                            direction: DOWN
                            timeout: 10000
                            centerElement: true
                            optional: true
                        - runFlow:
                            when:
                              visible:
                                id: 'guest-solo'
                            commands:
                              - tapOn:
                                  id: 'guest-solo'
                              - extendedWaitUntil:
                                  visible:
                                    id: 'solo-confirm'
                                  timeout: 10000
                                  optional: true
                              - runFlow:
                                  when:
                                    visible:
                                      id: 'solo-confirm'
                                  commands:
                                    - runFlow:
                                        file: shot.yaml
                                        env:
                                          CODE: '4.07'
                                          NAME: solo
                              - tapOn:
                                  id: 'solo-cancel'
                                  optional: true
- runFlow: plan-home.yaml
