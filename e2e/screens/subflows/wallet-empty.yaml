appId: app.critterpass.dev
---
# The wallet of a crew with nothing in it yet (the demo crew's Bali trip), in ${LOOK}: empty
# bookings (7.01), the + becoming the add sheet (1.06) and its forward toast (1.03), the add page
# (7.03) with the mailbox sheet (7.05), adding by hand with the keyboard up (7.04), and the empty
# ledger (7.16). Nothing is saved.
- runFlow:
    file: wallet-open.yaml
    env:
      HALF: bookings
      LABEL: Bookings
- runFlow:
    file: shot.yaml
    env:
      CODE: '7.01'
      NAME: empty
      LOOK: ${LOOK}
# The + grows into the add sheet; "Forward" copies the crew's address and says so in a toast.
- runFlow:
    file: ../../_shared/tap.yaml
    env:
      ID: 'bookings-add'
      LABEL: 'Add a booking'
- extendedWaitUntil:
    visible:
      id: 'bookings-add-(hand|forward)'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'bookings-add-(hand|forward)'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '1.06'
            NAME: add-sheet
            LOOK: ${LOOK}
      - tapOn:
          id: 'bookings-add-forward'
          optional: true
      - extendedWaitUntil:
          visible: '.*(Forward any confirmation|address).*'
          timeout: 5000
          optional: true
      - takeScreenshot: premium-1.03-forward-toast-${LOOK}
      - swipe:
          start: 50%, 35%
          end: 50%, 95%
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: 'bookings-add-hand'
          commands:
            - runFlow: ../../_shared/back.yaml
# The add page, opened on its mailbox sheet; the sheet closed shows the page itself.
- scrollUntilVisible:
    element:
      id: 'bookings-channel-mailbox'
    direction: DOWN
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'bookings-channel-mailbox'
    commands:
      - tapOn:
          id: 'bookings-channel-mailbox'
      - extendedWaitUntil:
          visible:
            id: 'bookings-mailbox.*'
          timeout: 10000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '7.05'
            NAME: mailbox
            LOOK: ${LOOK}
      - tapOn:
          id: 'bookings-mailbox-close'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'bookings-add-(forward|scan|paste)'
          timeout: 10000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '7.03'
            NAME: add-page
            LOOK: ${LOOK}
      - runFlow: ../../_shared/back.yaml
# Adding by hand: the form, then a flight's airport field with the keyboard up. Left unsaved.
- scrollUntilVisible:
    element:
      id: 'bookings-channel-hand'
    direction: DOWN
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'bookings-channel-hand'
    commands:
      - tapOn:
          id: 'bookings-channel-hand'
      - extendedWaitUntil:
          visible:
            id: 'bookings-form'
          timeout: 10000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '7.04'
            NAME: by-hand
            LOOK: ${LOOK}
      - tapOn:
          id: 'bookings-form-kind-flight'
          optional: true
      - tapOn:
          id: 'bookings-form-from'
          optional: true
      - inputText: 'Denpasar'
      - extendedWaitUntil:
          visible:
            id: 'bookings-form-did-you-mean'
          timeout: 5000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '7.04'
            NAME: flight-keyboard
            LOOK: ${LOOK}
      - hideKeyboard:
          optional: true
      - runFlow: ../../_shared/back.yaml
- runFlow:
    file: wallet-open.yaml
    env:
      HALF: money
      LABEL: Money
- runFlow:
    file: shot.yaml
    env:
      CODE: '7.16'
      NAME: empty-ledger
      LOOK: ${LOOK}
