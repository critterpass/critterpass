appId: app.critterpass.dev
---
# From Home with the staging demo crew's destination vote in its final (Kyoto against Lisbon,
# 2–2, the account still to vote): Home's split card (3b-6), the showdown with both finalists
# (3c-1), then the account's deciding vote and the winner reveal (3c-2). ${PREFIX} names the
# screenshots by language.
- extendedWaitUntil:
    visible:
      id: 'final-split-open'
    timeout: 30000
# Lift the card and its tally strip above the tab bar.
- swipe:
    start: 50%, 70%
    end: 50%, 45%
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3b-6-final
- tapOn:
    id: 'final-split-open'
- extendedWaitUntil:
    visible:
      id: 'showdown'
    timeout: 10000
- assertVisible: 'KYOTO'
- assertVisible: 'LISBON'
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3c-1-showdown
- tapOn:
    id: 'showdown-half-0'
- extendedWaitUntil:
    visible:
      id: 'winner-reveal'
    timeout: 60000
- waitForAnimationToEnd
# The photo, the rays and the halftone are canvases that paint a moment after the screen is up,
# with nothing moving meanwhile for the wait above to see. This wait never finds its id: it only
# gives them three seconds.
- extendedWaitUntil:
    visible:
      id: 'reveal-canvases-painted'
    timeout: 3000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3c-2-reveal
