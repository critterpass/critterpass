appId: app.critterpass.dev
---
# From Home with the staging demo crew: place search (3b-7) for a country nobody guides, the guest
# guide's page (3b-8) with its solo confirm, then PITCH TO THE CREW: the streamed pitch (3b-3) and,
# once added, the board on Home (3b-1). ${PREFIX} names the screenshots by language.
- openLink: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: 'morocc'
- extendedWaitUntil:
    visible:
      id: 'place-search-unguided'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3b-7-search
- tapOn: 'MARRAKECH'
- extendedWaitUntil:
    visible:
      id: 'guest-locals'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'guest-brief-loading'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3b-8-guest
- scrollUntilVisible:
    element:
      id: 'guest-solo'
- tapOn:
    id: 'guest-solo'
- extendedWaitUntil:
    visible:
      id: 'solo-confirm'
    timeout: 5000
- takeScreenshot: ${PREFIX}-3b-8-solo-confirm
- tapOn:
    id: 'solo-cancel'
- tapOn:
    id: 'guest-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3b-3-pitch
- tapOn:
    id: 'pitch-add'
- openLink: critterpass-dev://
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3b-1-board
