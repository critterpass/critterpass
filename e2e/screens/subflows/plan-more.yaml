appId: app.critterpass.dev
---
# Opens the plan map's ⋯ menu and picks ${ITEM} (ideas, days, check, share or settings). Run on
# the map.
- runFlow:
    when:
      visible:
        id: 'plan-map-more'
    commands:
      - tapOn:
          id: 'plan-map-more'
      - extendedWaitUntil:
          visible:
            id: 'plan-map-menu-${ITEM}'
          timeout: 10000
          optional: true
      - tapOn:
          id: 'plan-map-menu-${ITEM}'
          optional: true
      - waitForAnimationToEnd
