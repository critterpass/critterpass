appId: app.critterpass.dev
---
# A wallet with a stay and tomorrow's flight (the Đà Nẵng crew's trip), in ${LOOK}: the stack with
# the next booking on top (7.02), the flight and the stay (7.10, 7.06, 1.13 in dark), and in light
# the boarding pass, booking options, travel insurance with its form's keyboard and its card
# (7.13; a test policy is saved), and past bookings when there are some (7.14).
- runFlow:
    file: wallet-open.yaml
    env:
      HALF: bookings
      LABEL: Bookings
- extendedWaitUntil:
    visible:
      id: 'bookings-next-up'
    timeout: 15000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      CODE: '7.02'
      NAME: stack
      LOOK: ${LOOK}
- runFlow:
    when:
      visible:
        id: 'bookings-open-details'
    commands:
      - tapOn:
          id: 'bookings-open-details'
      - runFlow: wallet-detail.yaml
# The next booking behind it: its header brings it to the front, and the front card opens it.
- runFlow:
    when:
      visible:
        id: 'bookings-closed-.*'
    commands:
      - tapOn:
          id: 'bookings-closed-.*'
      - waitForAnimationToEnd
      # The picked card comes to the front (open it), or opens its detail straight away.
      - runFlow:
          when:
            notVisible:
              id: 'bookings-detail'
          commands:
            - scrollUntilVisible:
                element:
                  id: 'bookings-open-details'
                direction: UP
                timeout: 10000
                optional: true
            - tapOn:
                id: 'bookings-open-details'
                optional: true
      - runFlow: wallet-detail.yaml
- runFlow:
    when:
      true: ${LOOK == 'light'}
    commands:
      - scrollUntilVisible:
          element:
            id: 'bookings-insurance-(add|card)'
          direction: DOWN
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'bookings-insurance-add'
          commands:
            - tapOn:
                id: 'bookings-insurance-add'
            - extendedWaitUntil:
                visible:
                  id: 'bookings-insurance-provider'
                timeout: 10000
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '7.13'
                  NAME: form
                  LOOK: ${LOOK}
            - tapOn:
                id: 'bookings-insurance-provider'
                optional: true
            - inputText: 'Safety Wing'
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '7.13'
                  NAME: form-keyboard
                  LOOK: ${LOOK}
            - tapOn:
                id: 'bookings-insurance-number'
                optional: true
            - inputText: 'SW-2041-7788'
            - tapOn:
                id: 'bookings-insurance-phone'
                optional: true
            - inputText: '+18005550134'
            - hideKeyboard:
                optional: true
            - tapOn:
                id: 'bookings-insurance-save'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'bookings-insurance'
                timeout: 10000
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '7.13'
                  NAME: card
                  LOOK: ${LOOK}
            - runFlow: ../../_shared/back.yaml
      - scrollUntilVisible:
          element:
            id: 'bookings-archive-link'
          direction: DOWN
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'bookings-archive-link'
          commands:
            - tapOn:
                id: 'bookings-archive-link'
            - extendedWaitUntil:
                visible:
                  id: 'bookings-archive'
                timeout: 10000
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '7.14'
                  NAME: archive
                  LOOK: ${LOOK}
            - tapOn:
                id: 'bookings-archive-search'
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '7.14'
                  NAME: search-keyboard
                  LOOK: ${LOOK}
            - hideKeyboard:
                optional: true
            - runFlow: ../../_shared/back.yaml
