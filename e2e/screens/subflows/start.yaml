appId: app.critterpass.dev
---
# A new account holding the api's ${SCENARIO} seed (see e2e/_shared/start-as.yaml), on Home (the
# shared start turns the premium UI on), in ${LANG} (en by default, or vi; the app keeps the language over relaunches). ${output.crewCode} holds the crew's join code when the scenario answers one.
- evalScript: "${output.premiumLang = typeof LANG === 'undefined' || LANG === '' ? 'en' : LANG}"
- runFlow:
    file: ../../_shared/start-as.yaml
    env:
      SCENARIO: ${SCENARIO}
      LANG: ${output.premiumLang}
# A trip that has turned on can show its welcome page over Home at any later step.
- runFlow: ../../_shared/where.yaml
- runFlow:
    when:
      true: ${output.where.indexOf('/hatch') === 0 || output.where === 'unknown'}
    commands:
      - tapOn:
          id: 'critters-hatch-later'
          optional: true
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
