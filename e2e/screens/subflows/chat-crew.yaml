appId: app.critterpass.dev
---
# The Bali crew's chat in ${LOOK}, from Home and back to Home: the chat (5.01; in dark also the
# Foundations dark chat, 1.10), the long-press menu (5.04), the keyboard up over an empty
# composer, the sticker tray (5.08) and, in light, a sticker sent (5.09; only when the tray holds
# one: a seed whose critters were never met has none), the microphone-off sheet
# (5.05) and, on Android, the offline chat with a queued message (5.03).
- runFlow: chat-open-crew.yaml
- runFlow:
    when:
      visible:
        id: 'chat-screen'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '5.01'
            NAME: crew-chat
            LOOK: ${LOOK}
      - runFlow:
          when:
            true: ${LOOK == 'dark'}
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '1.10'
                  NAME: dark-chat
                  LOOK: ${LOOK}
      # Long-press a crewmate's message: the lifted bubble, the reaction bar and the menu.
      - longPressOn:
          text: '.*Uluwatu.at.sunset.*'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'chat-message-menu'
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'chat-message-menu'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '5.04'
                  NAME: long-press
                  LOOK: ${LOOK}
            # The backdrop closes the menu (the system back on Android).
            - runFlow:
                when:
                  platform: Android
                commands:
                  - back
            - runFlow:
                when:
                  platform: iOS
                commands:
                  - tapOn:
                      point: '50%,8%'
            - runFlow: ../../_shared/settle.yaml
      # The keyboard up over an empty composer: nothing is typed or sent, so no draft or new
      # message is left in this shot or the sticker tray's.
      - runFlow:
          when:
            visible:
              id: 'chat-input'
          commands:
            - tapOn:
                id: 'chat-input'
            - runFlow: ../../_shared/settle.yaml
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '5.01'
                  NAME: keyboard
                  LOOK: ${LOOK}
      # The sticker tray swaps in for the keyboard.
      - tapOn:
          id: 'chat-sticker-button'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'chat-sticker-tray'
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'chat-sticker-tray'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '5.08'
                  NAME: sticker-tray
                  LOOK: ${LOOK}
            # The first sticker in the tray goes to the crew and lands in the chat.
            - runFlow:
                when:
                  true: ${LOOK == 'light'}
                  visible:
                    id: 'chat-tray-sticker-.*'
                commands:
                  - tapOn:
                      id: 'chat-tray-sticker-.*'
                  - runFlow: ../../_shared/settle.yaml
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '5.09'
                        NAME: sticker-lands
                        LOOK: ${LOOK}
            # The sticker button again gives the keyboard back.
            - runFlow:
                when:
                  visible:
                    id: 'chat-sticker-tray'
                commands:
                  - tapOn:
                      id: 'chat-sticker-button'
                      optional: true
      - runFlow:
          when:
            true: ${LOOK == 'light'}
          commands:
            - runFlow: chat-crew-mic.yaml
            - runFlow:
                when:
                  platform: Android
                commands:
                  - runFlow: chat-crew-offline.yaml
- runFlow: chat-home.yaml
