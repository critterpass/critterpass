appId: app.critterpass.dev
---
# Opens the guide from the guide circle: Android's floating button, iOS's search-role tab item
# (reached by its label). Ends on the guide sheet when it opened.
- runFlow:
    when:
      visible:
        id: 'guide-fab'
    commands:
      - tapOn:
          id: 'guide-fab'
# Only while the guide isn't up: its composer is labelled "Ask Tokek" too, and a tap there would
# raise the keyboard over the starters.
- runFlow:
    when:
      notVisible:
        id: 'guide-sheet|guide-empty|guide-composer'
    commands:
      - runFlow:
          file: ../../_shared/tap.yaml
          env:
            ID: 'guide-circle'
            LABEL: 'Ask Tokek'
- extendedWaitUntil:
    visible:
      id: 'guide-sheet'
    timeout: 15000
    optional: true
