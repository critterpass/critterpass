appId: app.critterpass.dev
---
# The guide in ${LOOK}, from Home and back to Home. Light: the empty thread with its starters
# (5.13), Food and access needs (consent 5.21, the form 5.22, left unsaved), point and ask (5.16)
# and voice (5.15) opened and closed without using the camera or the microphone, a starter asked
# with the working steps (5.18) and the answer (5.14), and on Android the offline guide with a
# question waiting (5.17). Dark: the thread with its answer and the keyboard up (5.14).
- runFlow: chat-guide-open.yaml
- runFlow:
    when:
      visible:
        id: 'guide-sheet'
    commands:
      - runFlow:
          when:
            true: ${LOOK == 'light'}
          commands:
            - extendedWaitUntil:
                visible:
                  id: 'guide-empty'
                timeout: 10000
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '5.13'
                  NAME: starters
                  LOOK: ${LOOK}
            # Food and access needs: consent first, then the form, left without saving.
            - tapOn:
                id: 'guide-quick-dietary'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'guide-dietary-consent'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'guide-dietary-consent'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '5.21'
                        NAME: dietary-consent
                        LOOK: ${LOOK}
                  - tapOn:
                      id: 'guide-dietary-consent-yes'
                      optional: true
            - extendedWaitUntil:
                visible:
                  id: 'guide-dietary'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'guide-dietary'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '5.22'
                        NAME: dietary-form
                        LOOK: ${LOOK}
            - runFlow:
                file: chat-guide-return.yaml
                env:
                  MARK: 'guide-dietary|guide-dietary-consent|guide-dietary-sheet'
            # Point and ask: the composer's add button opens the menu camera.
            - tapOn:
                text: 'Point the camera at a menu'
                optional: true
            - tapOn:
                text: 'Don.t allow|Deny'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'guide-camera|guide-camera-denied'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'guide-camera|guide-camera-denied'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '5.16'
                        NAME: point-and-ask
                        LOOK: ${LOOK}
            - runFlow:
                file: chat-guide-return.yaml
                env:
                  MARK: 'guide-camera|guide-camera-denied'
            # Voice: a tap on the mic opens the voice screen (its consent first on a new account).
            - tapOn:
                id: 'guide-mic'
                optional: true
            - tapOn:
                text: 'Don.t allow|Deny'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'guide-voice|guide-voice-consent'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'guide-voice|guide-voice-consent'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '5.15'
                        NAME: voice
                        LOOK: ${LOOK}
            - runFlow:
                file: chat-guide-return.yaml
                env:
                  MARK: 'guide-voice|guide-voice-consent'
            # A starter asked: the working steps while it answers, then the answer.
            - tapOn:
                id: 'guide-starter-.*'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'guide-working|guide-thinking'
                timeout: 10000
                optional: true
            # Shot the moment the steps show: waiting for the screen to settle would wait out the
            # answer itself.
            - runFlow:
                when:
                  visible:
                    id: 'guide-working|guide-thinking'
                commands:
                  - takeScreenshot: premium-5.18-working-${LOOK}
            - extendedWaitUntil:
                visible:
                  id: 'guide-answer-(?!live).*'
                timeout: 60000
                optional: true
      # In dark the thread is new too: a starter is asked so the answer (5.14) has something to show.
      - runFlow:
          when:
            true: ${LOOK != 'light'}
            visible:
              id: 'guide-starter-.*'
          commands:
            - tapOn:
                id: 'guide-starter-.*'
            - extendedWaitUntil:
                visible:
                  id: 'guide-answer-(?!live).*'
                timeout: 60000
                optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '5.14'
            NAME: answer
            LOOK: ${LOOK}
      - runFlow:
          when:
            visible:
              id: 'guide-composer'
          commands:
            - tapOn:
                id: 'guide-composer'
            - inputText: 'Best beach'
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '5.14'
                  NAME: keyboard
                  LOOK: ${LOOK}
            - eraseText: 12
            - hideKeyboard
      - runFlow:
          when:
            true: ${LOOK == 'light'}
            platform: Android
          commands:
            - runFlow: chat-guide-offline.yaml
      - runFlow:
          when:
            visible:
              id: 'guide-close'
          commands:
            - tapOn:
                id: 'guide-close'
            - runFlow: ../../_shared/settle.yaml
- runFlow: chat-home.yaml
