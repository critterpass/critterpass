appId: app.critterpass.dev
---
# The guide's voice on real screens in another language: the dev gallery switches the running app's
# language (`LOCALE`, a gallery locale code; not persisted), two back swipes return to the splash,
# Tokek speaks on the name page (3a-2) and the this-or-that quiz (3a-4) on the way to Home, and the
# staging demo seed gives Home a Bali trip with its tip strip (3b-2).
- runFlow: open-gallery.yaml
- tapOn:
    id: 'gallery-locale-${LOCALE}'
- swipe:
    start: 2%, 50%
    end: 90%, 50%
- waitForAnimationToEnd
- swipe:
    start: 2%, 50%
    end: 90%, 50%
# The shortest onboarding pass that also runs on Android: search picks the airport, since Android's
# hideKeyboard presses back when no keyboard is up.
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- tapOn:
    id: 'onboarding-open'
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-field'
    timeout: 10000
- tapOn:
    id: 'onboarding-name-field'
- inputText: 'Winston'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-tokek'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${LOCALE}-3a-2-name
- tapOn:
    id: 'onboarding-name-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-photo'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'taste-card-right'
      - waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${LOCALE}-3a-4-this-or-that
- tapOn:
    id: 'taste-done'
- tapOn:
    id: 'home-search'
- inputText: 'SGN'
- tapOn:
    id: 'home-row-SGN'
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- tapOn:
    id: 'onboarding-issued-save'
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer-later'
    timeout: 10000
- tapOn:
    id: 'permissions-primer-later'
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- extendedWaitUntil:
    visible:
      id: 'home-tip'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${LOCALE}-3b-2-home
