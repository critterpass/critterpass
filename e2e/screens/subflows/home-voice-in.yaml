appId: app.critterpass.dev
---
# The guide's voice on real screens in another language: the dev gallery switches the running app's
# language (`LOCALE`, a gallery locale code; not persisted), two back swipes return to the splash,
# onboarding reaches Home, and the staging demo seed (no inbox cards) gives Home a Bali trip with
# its tip strip (3b-2, `${LOCALE}-3b-2-home`); the inbox then shows Tokek's all-caught-up line (3b-5,
# `${LOCALE}-3b-5-all-caught-up`).
- runFlow: open-gallery.yaml
- tapOn:
    id: 'gallery-locale-${LOCALE}'
- swipe:
    start: 2%, 50%
    end: 90%, 50%
- waitForAnimationToEnd
- swipe:
    start: 2%, 50%
    end: 90%, 50%
# The shortest onboarding pass that also runs on Android: search picks the airport, since Android's
# hideKeyboard presses back when no keyboard is up.
- runFlow: ../../onboarding/subflows/through-name.yaml
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'taste-card-right'
      - waitForAnimationToEnd
- tapOn:
    id: 'taste-done'
- tapOn:
    id: 'home-search'
- inputText: 'SGN'
- tapOn:
    id: 'home-row-SGN'
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- tapOn:
    id: 'onboarding-issued-save'
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer-later'
    timeout: 10000
- tapOn:
    id: 'permissions-primer-later'
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- extendedWaitUntil:
    visible:
      id: 'home-tip'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${LOCALE}-3b-2-home
- openLink: critterpass-dev://inbox
- extendedWaitUntil:
    visible:
      id: 'inbox-caught-up'
    timeout: 15000
- tapOn:
    id: 'inbox-tokek'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${LOCALE}-3b-5-all-caught-up
