appId: app.critterpass.dev
---
# From the setup checklist, opens the row `setup-row-${ROW}`, waits for ${READY} and shoots it as
# ${CODE}/${NAME}, then steps back to the checklist.
- scrollUntilVisible:
    element:
      id: 'setup-row-${ROW}'
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible:
        id: 'setup-row-${ROW}'
    commands:
      - tapOn:
          id: 'setup-row-${ROW}'
      - extendedWaitUntil:
          visible:
            id: '${READY}'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: '${READY}'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: ${CODE}
                  NAME: ${NAME}
            - runFlow: ../../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'setup-checklist'
    timeout: 10000
    optional: true
