appId: app.critterpass.dev
---
# From the dates step to DRAFT MY TRIP for a crew of one: the steps of
# ../../proposal/subflows/setup-to-draft.yaml, with the rooms step accepting the even split (one
# traveller has no rooms to assign, so picking a stay shows none to wait for).
- runFlow:
    when:
      visible:
        id: 'when-cta'
    commands:
      - tapOn:
          id: 'when-pick-week'
      - extendedWaitUntil:
          visible:
            id: 'picker-shorter'
          timeout: 10000
      - waitForAnimationToEnd
      # The first day: three weeks from today, on its own month, by its date.
      - evalScript: ${output.pickDate = new Date(Date.now() + 21 * 86400000).toISOString().slice(0, 10)}
      - runFlow:
          file: ../../happy/subflows/pick-week-day.yaml
          env:
            PICK_DATE: ${output.pickDate}
      - extendedWaitUntil:
          visible:
            id: 'picker-lock'
          timeout: 10000
      - tapOn:
          id: 'picker-lock'
      - extendedWaitUntil:
          visible:
            id: 'budget-lock'
          timeout: 30000
- runFlow:
    when:
      notVisible:
        id: 'budget-lock'
    commands:
      # Days by hand, whatever this phone's calendar already shared on the way in. The step re-lays
      # itself as the shared days sync, which can scroll the row away under a tap: try again then.
      - retry:
          maxRetries: 3
          commands:
            # Centred when the step can scroll that far. A row at the end of the step cannot be
            # centred: it is already clear of the footer there, so the scroll may give up.
            - scrollUntilVisible:
                element:
                  id: 'own-calendar-action'
                timeout: 10000
                centerElement: true
                optional: true
            - waitForAnimationToEnd
            - tapOn:
                id: 'own-calendar-action'
            - extendedWaitUntil:
                visible:
                  id: 'calendar-by-hand'
                timeout: 10000
      - tapOn:
          id: 'calendar-by-hand'
      - extendedWaitUntil:
          visible:
            id: 'manual-days-month'
          timeout: 10000
      # Next month: every day of it is ahead of today. Seven days in a row, each tapped once: free.
      - tapOn:
          id: 'manual-days-next'
      - tapOn:
          id: 'manual-day-.*'
          index: 8
      - tapOn:
          id: 'manual-day-.*'
          index: 9
      - tapOn:
          id: 'manual-day-.*'
          index: 10
      - tapOn:
          id: 'manual-day-.*'
          index: 11
      - tapOn:
          id: 'manual-day-.*'
          index: 12
      - tapOn:
          id: 'manual-day-.*'
          index: 13
      - tapOn:
          id: 'manual-day-.*'
          index: 14
      - tapOn:
          id: 'manual-days-save'
      - extendedWaitUntil:
          notVisible:
            id: 'manual-days-month'
          timeout: 15000
      # The saved days reach the crew's counts, and the organiser has a way on.
      - extendedWaitUntil:
          visible:
            id: 'when-cta|when-pick-week'
          timeout: 60000
      - assertNotVisible:
          text: '(?i)nobody has shared their days yet.*'
      - runFlow:
          when:
            visible:
              id: 'when-cta'
          commands:
            - tapOn:
                id: 'when-cta'
      - runFlow:
          when:
            visible:
              id: 'when-pick-week'
          commands:
            - tapOn:
                id: 'when-pick-week'
            - extendedWaitUntil:
                visible:
                  id: 'picker-lock'
                timeout: 10000
            - tapOn:
                id: 'picker-lock'
- extendedWaitUntil:
    visible:
      id: 'budget-lock'
    timeout: 30000
# The budget is skipped here: nobody else has set a max yet, and skipping is a real path for the
# organiser. Locking it has its own gate flow (e2e/happy/fresh-setup-vnd.yaml).
- tapOn:
    id: 'budget-skip'
# Rooms: a crew of one shares one room, so LOOKS GOOD accepts the even split.
- extendedWaitUntil:
    visible:
      id: 'setup-rooms-lock'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'setup-rooms-lock'
    timeout: 10000
- tapOn:
    id: 'setup-rooms-lock'
- extendedWaitUntil:
    visible:
      id: 'must-dos-add'
    timeout: 30000
- tapOn:
    id: 'must-dos-add'
- extendedWaitUntil:
    visible:
      id: 'add-must-do-field'
    timeout: 10000
- tapOn:
    id: 'add-must-do-field'
- inputText: 'Fushimi Inari at sunrise'
- tapOn:
    id: 'add-must-do-keep'
# Android shows the row's title in capitals; iOS reads the row whole ("Fushimi Inari at sunrise,
# Winston").
- extendedWaitUntil:
    visible:
      text: '(?i)fushimi inari at sunrise.*'
    timeout: 15000
# KEEP closes the sheet and its keyboard with it; hideKeyboard with no keyboard up is a back press on
# Android, which would leave setup.
- scrollUntilVisible:
    element:
      id: 'must-dos-draft'
    timeout: 10000
- tapOn:
    id: 'must-dos-draft'
- extendedWaitUntil:
    visible:
      id: 'drafting-screen'
    timeout: 30000
