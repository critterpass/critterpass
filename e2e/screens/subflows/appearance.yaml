appId: app.critterpass.dev
---
# Sets the app's appearance to ${LOOK} (system, light or dark) on its own sheet, opened by its link
# (`/you/appearance`, the sheet Pass → Edit → Appearance opens), then returns to Home by its link.
- openLink:
    link: critterpass-dev://you/appearance
- extendedWaitUntil:
    visible:
      id: 'you-appearance-${LOOK}'
    timeout: 15000
- tapOn:
    id: 'you-appearance-${LOOK}'
- runFlow: ../../_shared/settle.yaml
- runFlow: ../../_shared/home-link.yaml
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 15000
