appId: app.critterpass.dev
---
# The week of a crew of one, from Home, in ${LOOK}: Home's trip card (3.02), the invite sheet the
# guide's note opens, with the crew's long name in its title (3.10), and the hub (6.01). Ends on
# Home.
- extendedWaitUntil:
    visible:
      id: 'home-next-up'
    timeout: 20000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      CODE: '3.02'
      NAME: trip-card
- runFlow:
    when:
      visible:
        id: 'home-invite-crew'
    commands:
      - tapOn:
          id: 'home-invite-crew'
      - extendedWaitUntil:
          visible:
            id: 'crew-invite'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'crew-invite'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '3.10'
                  NAME: invite-sheet
- runFlow: ../../_shared/to-home.yaml
- runFlow:
    file: trip-open-hub.yaml
    env:
      ZOOM: ''
- runFlow:
    when:
      visible:
        id: 'trip-hub'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '6.01'
            NAME: hub
- runFlow: ../../_shared/to-home.yaml
