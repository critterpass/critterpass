appId: app.critterpass.dev
---
# The premium pass flow from the splash of a cleared install, one screenshot per designed state:
# the splash (2.01), the iOS paste offer when it comes up (2.03), a wrong crew code (2.16), the name
# typing onto the pass and at its 24-letter limit (2.05, 2.06), the photo page (2.08), this or that
# (2.07), home base with nothing found and with its stamp (2.10, 2.09), the issued pass (2.11), the
# save sheet (2.12) and the permission asks (2.13), ending on Home. Light only: a cleared install
# has no appearance choice yet.
- runFlow:
    when:
      visible:
        id: 'paste-link-offer'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '2.03'
            NAME: paste-offer
            LOOK: light
      - tapOn:
          id: 'paste-link-skip'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.01'
      NAME: splash
      LOOK: light

# A code that finds no crew: the pink line, then back to the splash.
- tapOn:
    id: 'onboarding-invite-code'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'invite-code-boxes'
    commands:
      - tapOn:
          id: 'invite-code-boxes'
      - inputText: 'QQQQQQ'
      - extendedWaitUntil:
          visible:
            id: 'invite-code-wrong'
          timeout: 10000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '2.16'
            NAME: wrong-code
            LOOK: light
      - hideKeyboard
      - runFlow:
          file: ../../_shared/back-to.yaml
          env:
            MARK: onboarding-open

# The name, typed onto the pass, then run up to the 24-letter limit (the last letter is refused).
# Right after a cold launch the splash can drop the first tap: it is tapped again while it shows.
- repeat:
    while:
      notVisible:
        id: 'onboarding-name-field'
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: 'onboarding-open'
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: 'onboarding-open'
      - extendedWaitUntil:
          visible:
            id: 'onboarding-name-field'
          timeout: 10000
          optional: true
- tapOn:
    id: 'onboarding-name-field'
    optional: true
- inputText: 'Winston'
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.05'
      NAME: name-typing
      LOOK: light
# More letters while the field still has focus: a second tap can select the typed word on iOS.
- inputText: ' Bartholomew Hales'
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.06'
      NAME: name-limit
      LOOK: light
- hideKeyboard
- tapOn:
    id: 'onboarding-name-next'
    optional: true

# The photo page: the guides and the ways to a real photo (nothing is picked).
- extendedWaitUntil:
    visible:
      id: 'onboarding-photo'
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.08'
      NAME: photo
      LOOK: light
- scrollUntilVisible:
    element:
      id: 'onboarding-photo-options'
    direction: DOWN
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: 'onboarding-photo-options'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '2.08'
            NAME: photo-options
            LOOK: light
- runFlow:
    file: ../../_shared/tap.yaml
    env:
      ID: 'onboarding-photo-next'
      LABEL: 'Next'

# This or that: two picks, the designed mid-quiz state, then the rest answered to the summary.
- extendedWaitUntil:
    visible:
      id: 'quiz-card-left'
    timeout: 10000
    optional: true
- tapOn:
    id: 'quiz-card-left'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'quiz-card-right'
    optional: true
- waitForAnimationToEnd
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.07'
      NAME: this-or-that
      LOOK: light
# "Skip this one" skips a single question: the rest are answered until the summary shows.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'taste-summary'
    commands:
      - tapOn:
          id: 'quiz-card-left'
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'taste-done'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'taste-summary'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '2.07'
            NAME: summary
            LOOK: light
- tapOn:
    id: 'taste-done'
    optional: true

# Home base: a town that finds nothing first, then Singapore and its stamp.
- extendedWaitUntil:
    visible:
      id: 'home-search'
    timeout: 10000
    optional: true
- tapOn:
    id: 'home-search'
    optional: true
- inputText: 'Qzx'
- extendedWaitUntil:
    visible:
      id: 'home-no-results'
    timeout: 10000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.10'
      NAME: nothing-found
      LOOK: light
- eraseText: 3
- inputText: 'Sing'
- extendedWaitUntil:
    visible:
      id: 'home-row-SIN'
    timeout: 10000
    optional: true
- tapOn:
    id: 'home-row-SIN'
    optional: true
# Android's hideKeyboard presses back when picking the row already closed the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'home-stamp'
    timeout: 10000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.09'
      NAME: home-stamp
      LOOK: light
- tapOn:
    id: 'onboarding-home-next'
    optional: true

# The issued pass, the save sheet, then the permission asks.
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    file: shot.yaml
    env:
      CODE: '2.11'
      NAME: issued
      LOOK: light
- tapOn:
    id: 'onboarding-issued-save'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'save-not-now'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '2.12'
            NAME: save-sheet
            LOOK: light
      - tapOn:
          id: 'save-not-now'
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'onboarding-issued-next'
    commands:
      - tapOn:
          id: 'onboarding-issued-next'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'permissions-primer'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '2.13'
            NAME: permissions
            LOOK: light
# Each ask has its own "Later"; no system dialog is opened.
- repeat:
    while:
      visible:
        id: 'primer-later'
    times: 4
    commands:
      - tapOn:
          id: 'primer-later'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 20000
    optional: true
