appId: app.critterpass.dev
---
# Back to Home from a pushed screen: Home's link, and when that doesn't land, back up to three
# times (the first closes a keyboard on Android), then the Home tab.
- runFlow: ../../_shared/home-link.yaml
# The link didn't land on Home (a native sheet it can't close): step back as a person would.
- runFlow:
    when:
      notVisible:
        id: 'home-screen'
    commands:
      - repeat:
          times: 3
          while:
            notVisible:
              id: 'home-screen'
          commands:
            - runFlow: ../../_shared/back.yaml
      - runFlow:
          when:
            notVisible:
              id: 'home-screen'
          commands:
            - runFlow:
                file: ../../_shared/tab.yaml
                env:
                  TAB: home
                  LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 10000
    optional: true
