appId: app.critterpass.dev
---
# From Home after onboarding: the crews sheet over Home, START A CREW and JOIN WITH A CODE opened
# from it (pages over an open sheet), each with ${PREFIX} in its screenshot name.
- openLink: critterpass-dev://crew
- extendedWaitUntil:
    visible:
      id: 'crews-sheet-panel'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3g-3-crews-sheet
- tapOn:
    id: 'crews-start'
- extendedWaitUntil:
    visible:
      id: 'start-crew'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-start-crew
# Back from the page closes the crew area onto Home; the sheet opens again for the code.
- runFlow: ../../onboarding/subflows/back.yaml
- openLink: critterpass-dev://crew
- extendedWaitUntil:
    visible:
      id: 'crews-join-code'
    timeout: 10000
- tapOn:
    id: 'crews-join-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-screen'
    timeout: 10000
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-join-code-from-crews
# Back to Home from the code page. The crews sheet has no ✕ by design, so a second back (Android's
# system back, iOS's escape swipe) closes it if the first one lands on it.
- runFlow: ../../onboarding/subflows/back.yaml
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'crews-sheet-panel'
    commands:
      - runFlow: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'home-first-run'
    timeout: 10000
