appId: app.critterpass.dev
---
# The vote's heroes with Đà Nẵng's photo, in English, for a fresh account with no demo seed: the
# Đà Nẵng pitch card, the Đà Nẵng vs Lisbon final card and showdown, and the reveal. Each shot
# waits for the photo to fade in.
- runFlow: ../happy/subflows/fresh-account.yaml
- runFlow:
    file: sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Company trip'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3b-3-pitch-photo
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'board-pitch'
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 10000
- tapOn:
    id: 'pitch-search'
- inputText: 'lisbon'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- tapOn:
    id: 'pitch-add'
- runFlow:
    when:
      notVisible:
        id: 'destination-board'
    file: ../onboarding/subflows/back.yaml
- scrollUntilVisible:
    element:
      text: '(?i)lisbon, 0 votes'
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn: '(?i)lisbon, 0 votes'
- extendedWaitUntil:
    visible:
      text: '(?i)lisbon, 1 votes, your vote'
    timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'pitch-search'
          file: ../onboarding/subflows/back.yaml
      - scrollUntilVisible:
          element:
            id: 'board-go-to-final'
          timeout: 20000
          centerElement: true
      - waitForAnimationToEnd
      - tapOn:
          id: 'board-go-to-final'
      - extendedWaitUntil:
          visible:
            id: 'final-split'
          timeout: 30000
- scrollUntilVisible:
    element:
      id: 'final-split-open'
    timeout: 10000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3b-6-final-photo
- tapOn:
    id: 'final-split-open'
- extendedWaitUntil:
    visible:
      id: 'showdown'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3c-1-showdown-photo
- tapOn: '(?i)đà nẵng'
- extendedWaitUntil:
    visible:
      id: 'winner-reveal'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3c-2-reveal-photo
