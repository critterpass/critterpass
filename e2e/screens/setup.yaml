appId: app.critterpass.dev
---
# A solo trip's setup in light, on Android (the iPhone sweep shoots it in ios/pages-footers.yaml): a
# crew of one with no trip (`crew_with_code`) pitches a city without a guide, starts the solo pass
# and fills setup's steps, When, free days, budget, getting there and the route (4.07–4.19, through
# subflows/plan-solo-setup.yaml).
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: subflows/plan-solo-setup.yaml
    env:
      LOOK: light
