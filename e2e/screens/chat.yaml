appId: app.critterpass.dev
---
# Screenshots of the crew chat for `pnpm screens:capture`: a fresh account onboards, takes the
# staging demo crew (which has chat history), then walks the chat states in subflows/chat-screens.
- launchApp:
    clearState: true
# A link dialog an earlier flow left open covers the first screen.
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- runFlow:
    file: subflows/chat-screens.yaml
    env:
      PREFIX: en
      SEND: 'Send'
