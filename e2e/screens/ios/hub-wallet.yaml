appId: app.critterpass.dev
---
# The iPhone sweep's trip hub, plan map and wallet, in light (the rest of pages-footers.yaml, on a
# shard of its own): floating glass headers and pinned footers on the hub of a trip that is on
# today, the plan on its map with the day sheet at half, and the wallet's add page.
- runFlow:
    file: ../subflows/start.yaml
    env:
      SCENARIO: trip_today
- runFlow:
    file: ../subflows/trip-open-hub.yaml
    env:
      ZOOM: ''
- runFlow:
    when:
      visible:
        id: 'trip-hub'
    commands:
      - runFlow:
          file: ../subflows/shot.yaml
          env:
            CODE: '6.01'
            NAME: hub
            LOOK: light
- runFlow:
    file: ../subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: ../subflows/plan-map.yaml
    env:
      LOOK: light
- runFlow:
    file: ../subflows/wallet-empty.yaml
    env:
      LOOK: light
