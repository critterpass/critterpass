appId: app.critterpass.dev
---
# The iPhone sweep's guide chat and Find, in light (the rest of sheets-keyboards.yaml, on a shard of
# its own): the guide's chat sheet with its composer, and Find with the keyboard up, a place and
# its Add to plan sheet, on the `everyday` Bali crew.
- runFlow:
    file: ../subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: ../subflows/chat-guide.yaml
    env:
      LOOK: light
# On iOS the guide's chat sheet can stay up after chat-guide: Find starts from Home, by its link or
# by pulling the sheet down (the same account, no new seed).
- runFlow: ../subflows/plan-home.yaml
- runFlow:
    file: ../subflows/plan-find.yaml
    env:
      LOOK: light
