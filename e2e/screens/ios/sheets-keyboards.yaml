appId: app.critterpass.dev
---
# The iPhone sweep's sheets and keyboards, in light: what only iOS draws its own way (native form
# sheets and their grabber, the safe areas inside a sheet, the keyboard and its suggestion strip).
# The pitch sheet over the keyboard and a destination's pitch card, the crew chat with the keyboard
# and the sticker tray, the guide's chat sheet with its composer, and Find with the keyboard up, a
# place and its Add to plan sheet.
- runFlow:
    file: ../subflows/start.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: ../subflows/plan-places.yaml
    env:
      LOOK: light
- runFlow:
    file: ../subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: ../subflows/chat-crew.yaml
    env:
      LOOK: light
- runFlow:
    file: ../subflows/chat-guide.yaml
    env:
      LOOK: light
# On iOS the guide's chat sheet stays up after chat-guide, so Find starts from a fresh Home.
- runFlow:
    file: ../subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: ../subflows/plan-find.yaml
    env:
      LOOK: light
