appId: app.critterpass.dev
---
# Screenshot for `pnpm screens:capture`: the motion lab at rest. Motion freeze stops the shared loop
# clock so every idle loop sits on its resting frame and the capture is deterministic.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 25000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-motion-lab'
    timeout: 10000
- tapOn:
    id: 'dev-nav-motion-lab'
# The first mount starts every loop preset; give a cold simulator room before freezing.
- extendedWaitUntil:
    visible:
      id: 'motion-freeze-toggle'
    timeout: 30000
- tapOn:
    id: 'motion-freeze-toggle'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab
