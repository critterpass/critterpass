appId: app.critterpass.dev
---
# The same Home, crews sheet, Start a crew and inbox screens in Vietnamese: the dev gallery switches
# the running app's language (not persisted), two back swipes return to the splash, then the same
# walk as home-crews.yaml.
- launchApp:
    clearState: true
# A link dialog an earlier flow left open covers the first screen.
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- swipe:
    start: 2%, 50%
    end: 90%, 50%
- waitForAnimationToEnd
- swipe:
    start: 2%, 50%
    end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow: subflows/onboard-settled.yaml
- runFlow:
    file: subflows/home-crews-screens.yaml
    env:
      PREFIX: vi
      POLL: 'Bình chọn'
