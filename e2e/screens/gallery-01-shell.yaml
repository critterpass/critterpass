appId: app.critterpass.dev
---
# Screenshots for `pnpm screens:capture`: the gallery index, then the app shell demos (tab bar with
# the guide FAB, a sheet at its medium detent, a rise modal, and the zoom transition's end state).
- runFlow: subflows/open-gallery.yaml
- takeScreenshot: 01-gallery-index

- tapOn:
    id: 'gallery-shell-sheet'
- extendedWaitUntil:
    visible:
      id: 'sheet-panel'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 33-shell-sheet
- tapOn:
    id: 'sheet-close'
- extendedWaitUntil:
    notVisible:
      id: 'sheet-panel'
    timeout: 5000

- tapOn:
    id: 'gallery-shell-rise'
- extendedWaitUntil:
    visible:
      id: 'rise-panel'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 34-shell-rise-modal
- tapOn:
    id: 'rise-close'
- extendedWaitUntil:
    notVisible:
      id: 'rise-panel'
    timeout: 5000

- tapOn:
    id: 'gallery-shell-zoom'
- extendedWaitUntil:
    visible:
      id: 'zoom-card-kyoto'
    timeout: 10000
- takeScreenshot: 35-shell-zoom-cards
- tapOn:
    id: 'zoom-card-kyoto'
- extendedWaitUntil:
    visible:
      id: 'shared-target-kyoto'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 36-shell-zoom-detail

# The demos have no way back to the gallery index, so the tab shell starts from a fresh launch.
- runFlow: subflows/open-gallery.yaml
- tapOn:
    id: 'gallery-shell-tabs'
- extendedWaitUntil:
    visible:
      id: 'tab-bar'
    timeout: 10000
- assertVisible:
    id: 'guide-fab'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 37-shell-tab-bar
