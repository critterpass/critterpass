appId: app.critterpass.dev
---
# Screenshots of the destination vote for `pnpm screens:capture`: a fresh account onboards, takes
# the staging demo crew, then walks search, the guest guide's page and a pitch onto the board.
- launchApp:
    clearState: true
# A link dialog an earlier flow left open covers the first screen.
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- runFlow:
    file: subflows/vote-screens.yaml
    env:
      PREFIX: en
