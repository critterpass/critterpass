appId: app.critterpass.dev
---
# Screenshots for `pnpm screens:capture`: loading, empty and confirm states, then the paper documents.
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Skeleton'
- takeScreenshot: 11-skeleton
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'EmptyState'
- takeScreenshot: 12-empty-state
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'ScreenLoading'
- takeScreenshot: 12b-screen-loading
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'ScreenMissing'
- takeScreenshot: 12c-screen-missing
- scrollUntilVisible:
    element:
      id: 'screen-missing-own-secondary'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12d-screen-missing-two-actions
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'ConfirmSheet'
- takeScreenshot: 13-confirm-sheet
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'PassportCover'
- takeScreenshot: 14-passport-cover
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Ticket'
- takeScreenshot: 15-ticket
