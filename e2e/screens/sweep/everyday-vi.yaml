appId: app.critterpass.dev
---
# UI sweep (vi): the demo crew with a confirmed trip. Generated by
# tools/scripts/ci-device/sweep-coverage.ts --write; the steps live in subflows/everyday.yaml.
- runFlow:
    file: subflows/start.yaml
    env:
      LANG: vi
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo
- runFlow:
    file: subflows/everyday.yaml
    env:
      LANG: vi
