# tools/scripts/ci-device/sweep-coverage.ts --write; the steps live in subflows/vote-final.yaml.
- runFlow:
    file: subflows/start.yaml
    env:
      LANG: en
- runFlow: ../../home/subflows/onboard.yaml
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-vote-final
- runFlow:
    file: subflows/vote-final.yaml
    env:
      LANG: en
