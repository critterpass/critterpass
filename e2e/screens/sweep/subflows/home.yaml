appId: app.critterpass.dev
---
# Back to Home from anywhere: back steps until the Developer tools entry at the bottom of Home shows.
- repeat:
    while:
      notVisible:
        id: 'dev-tools-entry'
    times: 5
    commands:
      - runFlow: back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 15000
