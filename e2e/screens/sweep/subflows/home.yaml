appId: app.critterpass.dev
---
# Back to Home from anywhere: back steps until Home's screen shows (never one more, which would
# leave the app on Android).
- repeat:
    while:
      notVisible:
        id: 'home-screen'
    times: 5
    commands:
      - runFlow: back.yaml
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 15000
