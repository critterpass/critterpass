appId: app.critterpass.dev
---
# The `vote` seed: the destination board on Home (3b-1), its pitch sheet (3b-3), the organiser's
# GO TO THE FINAL into the split card (3b-6) and the showdown (3c-1) before and after a vote, then
# place search (3b-7), the guest guide's page (3b-8) and its solo confirm.
- scrollUntilVisible:
    element:
      id: 'destination-board'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-1-board
- scrollUntilVisible:
    element:
      id: 'board-pitch'
    centerElement: true
- tapOn:
    id: 'board-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-3-pitch-board
- runFlow:
    file: dismiss.yaml
    env:
      ID: pitch-sheet
      MARK: pitch-search
- scrollUntilVisible:
    element:
      id: 'board-go-to-final'
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-go-to-final'
- extendedWaitUntil:
    visible:
      id: 'final-split'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-6-final-new
- tapOn:
    id: 'final-split-open'
- extendedWaitUntil:
    visible:
      id: 'showdown'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3c-1-showdown-board
- tapOn:
    id: 'showdown-half-0'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${LANG}-3c-1-voted
- runFlow: home.yaml
- runFlow:
    file: open-link.yaml
    env:
      URL: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-7-search-empty
- tapOn:
    id: 'place-search-field'
- inputText: 'morocc'
- extendedWaitUntil:
    visible:
      id: 'place-search-unguided'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-7-search-keyboard
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-7-search
- tapOn: 'MARRAKECH'
- extendedWaitUntil:
    visible:
      id: 'guest-locals'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'guest-brief-loading'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-8-guest
- scrollUntilVisible:
    element:
      id: 'guest-solo'
    centerElement: true
- tapOn:
    id: 'guest-solo'
- extendedWaitUntil:
    visible:
      id: 'solo-confirm'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'solo-cancel'
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-3b-8-solo-confirm
- tapOn:
    id: 'solo-cancel'
- runFlow: home.yaml
