- runFlow:
    file: subflows/start.yaml
    env:
      LANG: vi
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-inbox
- runFlow:
    file: subflows/inbox.yaml
    env:
      LANG: vi
