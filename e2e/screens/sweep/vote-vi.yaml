appId: app.critterpass.dev
---
# UI sweep (vi): the demo crew's destination vote on its board. Generated by
# tools/scripts/ci-device/sweep-coverage.ts --write; the steps live in subflows/vote.yaml.
- runFlow:
    file: subflows/start.yaml
    env:
      LANG: vi
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-vote
- runFlow:
    file: subflows/vote.yaml
    env:
      LANG: vi
