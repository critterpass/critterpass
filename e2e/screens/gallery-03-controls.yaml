appId: app.critterpass.dev
---
# Screenshots for `pnpm screens:capture`: buttons, inputs, chips and people.
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'PillButton'
- takeScreenshot: 06-buttons
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-buttons-more
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'TextField'
- takeScreenshot: 07-text-field
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'CodeBoxes'
- takeScreenshot: 08-code-boxes
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'InfoPill'
- takeScreenshot: 09-info-pill
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Avatar'
- takeScreenshot: 10-avatars
# Further down the same page: avatars that draw a member's chosen face from their user id.
- scrollUntilVisible:
    element:
      id: 'gallery-fixture-by uid.*'
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-avatars-by-uid
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Amount'
- takeScreenshot: 10-amount-column
