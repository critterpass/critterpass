appId: app.critterpass.dev
---
# Screenshots for `pnpm screens:capture`: buttons, inputs, chips and people.
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'PillButton'
- takeScreenshot: 06-buttons
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-buttons-more
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'TextField'
- takeScreenshot: 07-text-field
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'CodeBoxes'
- takeScreenshot: 08-code-boxes
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'InfoPill'
- takeScreenshot: 09-info-pill
- runFlow:
    file: subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Avatar'
- takeScreenshot: 10-avatars
