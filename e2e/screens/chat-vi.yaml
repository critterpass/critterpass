appId: app.critterpass.dev
---
# The crew chat screens in Vietnamese: the dev gallery switches the running app's language (not
# persisted), two back swipes return to the splash, then the same walk as chat.yaml.
- launchApp:
    clearState: true
# A link dialog an earlier flow left open covers the first screen.
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-locale-vi'
    timeout: 15000
- tapOn:
    id: 'gallery-locale-vi'
- swipe:
    start: 2%, 50%
    end: 90%, 50%
- waitForAnimationToEnd
- swipe:
    start: 2%, 50%
    end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- runFlow:
    file: subflows/chat-screens.yaml
    env:
      PREFIX: vi
      SEND: 'Gửi'
