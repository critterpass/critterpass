appId: app.critterpass.dev
---
# Release gate: a brand-new traveller's money in đồng on a trip that is on today, with no demo
# world (subflows/trip-under-way.yaml). The wallet settles in VND; a ₫350,000 lunch and a
# ₫1,250,000 dinner typed on the keypad, each under its own name, land in LATEST and in what the
# crew of one has spent (₫1,600,000), and a ₫9,000,000 hotel takes the total to eight digits
# (₫10,600,000) without it leaving the screen; the history lists all three, whole and grouped,
# never in dollars; a new expense's detail lists no changes; the budget page, with its way back,
# counts them against the budget locked in setup on day 1 of 3; and the trip hub's MONEY tile
# agrees.
- runFlow:
    file: subflows/trip-under-way.yaml
    env:
      SHOTS: money
- extendedWaitUntil:
    visible:
      id: 'tab-wallet'
    timeout: 60000
- tapOn:
    id: 'tab-wallet'
- extendedWaitUntil:
    visible:
      id: 'money-balances'
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: 'VND'
      id: 'money-currency-chip'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: money-empty
# Lunch, ₫350,000.
- tapOn:
    id: 'money-empty'
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'money-add-keypad'
    commands:
      - tapOn: 'ADD'
- extendedWaitUntil:
    visible:
      id: 'money-add-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-add-keypad-key-3'
- tapOn:
    id: 'money-add-keypad-key-5'
- tapOn:
    id: 'money-add-keypad-key-0'
- tapOn:
    id: 'money-add-keypad-key-000'
- assertVisible:
    id: 'money-add-amount'
- runFlow:
    file: subflows/type-expense-name.yaml
    env:
      NAME: 'Lunch'
      SHOT: money-add-details-keyboard
- takeScreenshot: money-add-lunch
- assertVisible: '(?i)lunch'
- assertVisible: '.*350,000.*'
- assertNotVisible: '.*\$.*'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest-row'
    timeout: 30000
- extendedWaitUntil:
    visible: '(?i).*₫ ?350,000 spent.*'
    timeout: 90000
- assertVisible:
    id: 'money-hero-solo'
- waitForAnimationToEnd
- takeScreenshot: money-after-lunch
# Dinner, ₫1,250,000.
- tapOn: 'ADD'
- extendedWaitUntil:
    visible:
      id: 'money-add-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-add-keypad-key-1'
- tapOn:
    id: 'money-add-keypad-key-2'
- tapOn:
    id: 'money-add-keypad-key-5'
- tapOn:
    id: 'money-add-keypad-key-0'
- tapOn:
    id: 'money-add-keypad-key-000'
- runFlow:
    file: subflows/type-expense-name.yaml
    env:
      NAME: 'Dinner'
- takeScreenshot: money-add-dinner
- assertVisible: '.*1,250,000.*'
- tapOn:
    id: 'money-add-submit'
# SPENT SO FAR and the header count both; LATEST is the dinner.
- extendedWaitUntil:
    visible: '(?i).*₫ ?1,600,000 spent.*'
    timeout: 90000
- assertVisible:
    id: 'money-hero-solo'
- assertVisible:
    id: 'money-solo'
- assertVisible:
    id: 'money-latest-row'
    text: '(?i).*dinner.*'
    optional: true
- assertNotVisible: '.*\$.*'
- waitForAnimationToEnd
- takeScreenshot: money-after-dinner
# A bigger one, ₫9,000,000 for the hotel: the total, now eight digits, still reads whole.
- tapOn: 'ADD'
- extendedWaitUntil:
    visible:
      id: 'money-add-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-add-keypad-key-9'
- tapOn:
    id: 'money-add-keypad-key-000'
- tapOn:
    id: 'money-add-keypad-key-000'
- runFlow:
    file: subflows/type-expense-name.yaml
    env:
      NAME: 'Hotel'
- assertVisible: '.*9,000,000.*'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible: '(?i).*₫ ?10,600,000 spent.*'
    timeout: 90000
- assertVisible:
    id: 'money-hero-amount'
- assertNotVisible: '.*\$.*'
- waitForAnimationToEnd
- takeScreenshot: money-after-hotel
# Every expense in the history.
- tapOn:
    id: 'money-history-link'
- extendedWaitUntil:
    visible:
      id: 'money-history'
    timeout: 15000
- assertVisible: '(?i).*lunch.*'
- assertVisible: '(?i).*hotel.*'
- assertVisible: '(?i).*dinner.*'
- assertVisible: '.*1,250,000.*'
- assertVisible: '.*350,000.*'
- assertNotVisible: '.*\$.*'
# The latest one's detail: an expense nobody edited lists no changes.
- tapOn:
    id: 'money-history-row-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'money-expense-detail'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: money-expense-detail
- assertNotVisible:
    id: 'money-detail-history'
# DELETE asks first, in a sheet over the page; CANCEL leaves the expense as it was.
- scrollUntilVisible:
    element:
      id: 'money-detail-delete'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'money-detail-delete'
- extendedWaitUntil:
    visible: '(?i)delete this expense\?'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: money-delete-confirm
- tapOn: '(?i)cancel'
- extendedWaitUntil:
    notVisible: '(?i)delete this expense\?'
    timeout: 10000
- assertNotVisible: '.*\$.*'
- runFlow: ../onboarding/subflows/back.yaml
- runFlow: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'money-balances'
    timeout: 15000
# The budget: what was spent against the budget locked in setup, on day 1 of 3.
- tapOn: 'BUDGET'
- extendedWaitUntil:
    visible:
      id: 'money-budget'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: money-budget
- assertVisible:
    id: 'money-budget-spent'
    text: '.*₫ ?10,600,000.*'
# Day 1, or day 2 when the run crosses midnight in Vietnam.
- assertVisible: '(?i)day [12] of 3'
- assertNotVisible:
    id: 'money-budget-none'
- assertNotVisible: '.*\$.*'
- scrollUntilVisible:
    element:
      id: 'money-budget-line'
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: money-budget-lower
- runFlow: ../onboarding/subflows/back.yaml
# The trip hub's MONEY tile.
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-header-.*'
    timeout: 30000
- runFlow: subflows/answer-visit-offer.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-money'
    direction: DOWN
    timeout: 10000
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: money-hub
- assertNotVisible: '.*\$.*'
