appId: app.critterpass.dev
---
# Release gate: a traveller's money in đồng on a trip that is on today, started as `solo_today` (a
# crew of one, the budget locked in setup, nothing spent yet). The wallet settles in VND; a ₫350,000
# lunch and a ₫1,250,000 dinner typed on the keypad, each under its own name, land in LATEST and in
# what the crew of one has spent (₫1,600,000), and a ₫9,000,000 hotel takes the total to eight
# digits (₫10,600,000) without it leaving the screen; the history lists all three, whole and
# grouped, never in dollars; a new expense's detail lists no changes; the budget page, with its way
# back, counts them against the budget locked in setup on day 1 of 3; and the trip hub's MONEY tile
# agrees.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: solo_today
- runFlow:
    file: subflows/open-wallet.yaml
    env:
      HALF: money
# The crew counts in đồng: the hero's amount carries ₫.
- extendedWaitUntil:
    visible: '.*[₫đ] ?0.*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: money-empty
# Lunch, ₫350,000.
- runFlow: subflows/open-add-expense.yaml
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-key-3'
- tapOn:
    id: 'money-key-5'
- tapOn:
    id: 'money-key-0'
- tapOn:
    id: 'money-key-000'
- assertVisible:
    id: 'money-add-amount'
- runFlow:
    file: subflows/type-expense-name.yaml
    env:
      NAME: 'Lunch'
      SHOT: money-add-details-keyboard
- takeScreenshot: money-add-lunch
# iOS reads the details row as one label (the name and its category): the name is matched
# within it.
- assertVisible: '(?i).*lunch.*'
- assertVisible: '.*350,000.*'
- assertNotVisible: '.*\$.*'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'money-hero-amount'
      text: '.*350,000.*'
    timeout: 90000
- assertVisible:
    id: 'money-hero'
- waitForAnimationToEnd
- takeScreenshot: money-after-lunch
# Dinner, ₫1,250,000.
- runFlow: subflows/open-add-expense.yaml
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-key-1'
- tapOn:
    id: 'money-key-2'
- tapOn:
    id: 'money-key-5'
- tapOn:
    id: 'money-key-0'
- tapOn:
    id: 'money-key-000'
- runFlow:
    file: subflows/type-expense-name.yaml
    env:
      NAME: 'Dinner'
- takeScreenshot: money-add-dinner
- assertVisible: '.*1,250,000.*'
- tapOn:
    id: 'money-add-submit'
# SPENT SO FAR and the header count both; LATEST is the dinner.
- extendedWaitUntil:
    visible:
      id: 'money-hero-amount'
      text: '.*1,600,000.*'
    timeout: 90000
- assertVisible:
    id: 'money-hero'
- assertVisible:
    id: 'money-solo'
- assertVisible:
    id: 'money-latest'
    text: '(?i).*dinner.*'
    optional: true
- assertNotVisible: '.*\$.*'
- waitForAnimationToEnd
- takeScreenshot: money-after-dinner
# A bigger one, ₫9,000,000 for the hotel: the total, now eight digits, still reads whole.
- runFlow: subflows/open-add-expense.yaml
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-key-9'
- tapOn:
    id: 'money-key-000'
- tapOn:
    id: 'money-key-000'
- runFlow:
    file: subflows/type-expense-name.yaml
    env:
      NAME: 'Hotel'
- assertVisible: '.*9,000,000.*'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-hero-amount'
      text: '.*10,600,000.*'
    timeout: 90000
- assertVisible:
    id: 'money-hero-amount'
- assertNotVisible: '.*\$.*'
- waitForAnimationToEnd
- takeScreenshot: money-after-hotel
# Every expense in the history.
- tapOn:
    id: 'money-see-all'
- extendedWaitUntil:
    visible:
      id: 'money-history'
    timeout: 15000
- assertVisible: '(?i).*lunch.*'
- assertVisible: '(?i).*hotel.*'
- assertVisible: '(?i).*dinner.*'
- assertVisible: '.*1,250,000.*'
- assertVisible: '.*350,000.*'
- assertNotVisible: '.*\$.*'
# The latest one's detail: an expense nobody edited lists no changes.
- tapOn:
    id: 'money-history-(?!everyone|filters|nomatch|member|add|search).*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'money-expense-detail'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: money-expense-detail
- assertNotVisible:
    id: 'money-detail-history'
# DELETE asks first, in a sheet over the page; CANCEL leaves the expense as it was.
- scrollUntilVisible:
    element:
      id: 'money-detail-delete'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'money-detail-delete'
- extendedWaitUntil:
    visible: '(?i)delete this.expense\?'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: money-delete-confirm
- tapOn: '(?i)cancel'
- extendedWaitUntil:
    notVisible: '(?i)delete this.expense\?'
    timeout: 10000
- assertNotVisible: '.*\$.*'
- runFlow: ../_shared/back.yaml
- runFlow: ../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'money-(ready|none|syncing)'
    timeout: 15000
# The budget: what was spent against the budget locked in setup, on day 1 of 3.
- tapOn:
    id: 'money-budget'
- extendedWaitUntil:
    visible:
      id: 'money-budget-summary|money-budget-set'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: money-budget
- assertVisible:
    id: 'money-budget-spent'
    text: '.*₫ ?10,600,000.*'
# Day 1, or day 2 when the run crosses midnight in Vietnam.
- assertVisible: '(?i).*day [12] of.3.*'
- assertNotVisible:
    id: 'money-budget-none'
- assertNotVisible: '.*\$.*'
- scrollUntilVisible:
    element:
      id: 'money-budget-pace'
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: money-budget-lower
- runFlow: ../_shared/back.yaml
# The trip hub's MONEY tile.
- runFlow: subflows/open-trip-hub.yaml
- runFlow: subflows/answer-visit-offer.yaml
# Not centred: the tiles sit near the foot of the hub, which cannot scroll them to the middle of
# an iPhone's screen, and a centring scroll that cannot get there fails.
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-money'
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: money-hub
- assertNotVisible: '.*\$.*'
