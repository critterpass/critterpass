appId: app.critterpass.dev
---
# Release gate: a brand-new account's own crew chat, no demo seed. It starts a crew, pitches a
# place into the vote, logs an expense, and in the chat every card draws, a text and a voice note
# send, and the note plays (e2e/happy/subflows/fresh-chat-steps.yaml).
- runFlow:
    file: subflows/fresh-chat-steps.yaml
    env:
      LANG: en
      ADD_EXPENSE: 'ADD AN EXPENSE'
      MESSAGE_FIELD: 'Message.*'
      SEND: 'Send'
      ATTACH: 'Add attachment'
      VOICE_NOTE: 'Voice note'
      PAUSE_VOICE: 'Pause voice note'
