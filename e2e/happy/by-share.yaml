appId: app.critterpass.dev
---
# Release gate: splitting an expense by share. A new account starts with the staging demo crew (a
# Bali trip with four crewmates), types Rp 450.000 on the keypad and picks By share: every member
# row gets a stepper, and two taps on + give the first crewmate three shares. Adding it lands the
# expense in Latest.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: caught_up
- runFlow:
    file: subflows/open-wallet.yaml
    env:
      HALF: money
- runFlow:
    when:
      visible:
        id: 'money-empty-add'
    commands:
      - tapOn:
          id: 'money-empty-add'
- runFlow:
    when:
      notVisible:
        id: 'money-keypad'
    commands:
      - runFlow:
          file: ../_shared/tap.yaml
          env:
            ID: 'money-add'
            LABEL: 'Add an expense'
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'money-key-4'
- tapOn:
    id: 'money-key-5'
- tapOn:
    id: 'money-key-0'
- tapOn:
    id: 'money-key-000'
- tapOn:
    id: 'money-add-mode-weights'
- extendedWaitUntil:
    visible:
      id: 'money-split-weight-.*'
    timeout: 5000
# The second crewmate's shares: one, then up to three.
- scrollUntilVisible:
    element:
      id: 'money-split-weight-.*-up'
      index: 1
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'money-split-weight-.*-up'
    index: 1
- tapOn:
    id: 'money-split-weight-.*-up'
    index: 1
- assertVisible:
    id: 'money-split-weight-.*'
    index: 1
    containsDescendants:
      - text: '3'
- waitForAnimationToEnd
- takeScreenshot: premium-7.18-by-share-light
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-7.17-by-share-added-light
