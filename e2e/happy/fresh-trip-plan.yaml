appId: app.critterpass.dev
env:
  ADD_QUERY: 'cafe'
  SAVE_QUERY: 'Han Market'
---
# Release gate: a traveller plans on her own trip, started as `solo_today` (a crew of one on a trip
# to Đà Nẵng that started today, with a plan of curated places). PLAN opens the plan map (4.25);
# day 1 opens at half with its stops (4.26); its add bar opens Find (4.30), which searches "cafe"
# and adds the first row it can; Add to plan (4.39) says where it goes and puts it on the day,
# named by its place. Its menu's Move opens All days (4.28), where the day's move sheet takes it to
# day 2. A place page's ♡ saves another place, and Ideas (4.40) lists it. The plan check opens.
# After a relaunch, day 2 still shows the moved stop. Every outcome is the server's answer on
# screen: the stop and the idea are found by the names the app showed when they were picked.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: solo_today
- runFlow: subflows/dismiss-visit-offer.yaml
- runFlow: subflows/open-plan.yaml

# Day 1 at half: its stops on the timeline.
- runFlow:
    file: subflows/open-plan-day.yaml
    env:
      DAY: 1
- takeScreenshot: premium-4.26-plan-day-1-light

# The add bar: Find, the first place it can add, then Add to plan.
- tapOn:
    id: 'plan-add-bar'
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
- tapOn:
    id: 'search-field'
- inputText: ${ADD_QUERY}
- extendedWaitUntil:
    visible:
      id: 'search-row-add-[0-9]+'
    timeout: 120000
- hideKeyboard
- takeScreenshot: premium-4.30-plan-search-light
# The add button reads "Add <name>": the stop is found by that name later.
- copyTextFrom:
    id: 'search-row-add-[0-9]+'
    index: 0
- evalScript: ${output.added = maestro.copiedText.replace(/^Add /, '').split(',')[0].trim().replace(/[.*+?^()|[\]\\]/g, '.')}
- tapOn:
    id: 'search-row-add-[0-9]+'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'plan-add-confirm'
      enabled: true
    timeout: 30000
- takeScreenshot: premium-4.39-plan-add-to-plan-light
- tapOn:
    id: 'plan-add-confirm'
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    while:
      notVisible:
        id: 'trip-map'
    times: 3
    commands:
      - runFlow: ../_shared/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'trip-map'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.added}.*'
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: premium-4.26-plan-added-on-day-1-light

# Its menu's Move opens All days; day 1's move sheet takes it to day 2.
- tapOn:
    text: '(?iu).*${output.added}.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'stop-menu'
    timeout: 10000
- tapOn:
    id: 'stop-menu-move'
- extendedWaitUntil:
    visible:
      id: 'all-days'
    timeout: 20000
- longPressOn:
    id: 'all-days-card-1'
- extendedWaitUntil:
    visible:
      id: 'move-stop-sheet'
    timeout: 10000
- tapOn:
    id: 'move-stop-(?!sheet$|days$).*'
    text: '(?iu).*${output.added}.*'
- extendedWaitUntil:
    visible:
      id: 'move-stop-days'
    timeout: 10000
- tapOn:
    id: 'day-chip-2'
- extendedWaitUntil:
    visible:
      id: 'move-preview|all-days'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: 'move-preview-confirm'
    commands:
      - tapOn:
          id: 'move-preview-confirm'
- runFlow:
    when:
      visible:
        id: 'move-preview-ok'
    commands:
      - tapOn:
          id: 'move-preview-ok'
- extendedWaitUntil:
    visible:
      id: 'all-days'
    timeout: 15000
- takeScreenshot: premium-4.28-plan-all-days-moved-light
# Day 2 opens with the stop on it.
- tapOn:
    id: 'all-days-card-2'
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.added}.*'
    direction: DOWN
    timeout: 30000

# A place page's ♡ saves another place.
- repeat:
    while:
      notVisible:
        id: 'plan-map-search'
    times: 3
    commands:
      - runFlow: ../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'plan-map-search'
    timeout: 15000
- tapOn:
    id: 'plan-map-search'
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
- tapOn:
    id: 'search-field'
- inputText: ${SAVE_QUERY}
- extendedWaitUntil:
    visible:
      id: 'search-row-[0-9]+'
    timeout: 60000
- hideKeyboard
# The row reads "<name>, <what and where>": its name is what Ideas lists.
- copyTextFrom:
    id: 'search-row-[0-9]+'
    index: 0
- evalScript: ${output.saved = maestro.copiedText.split(',')[0].trim().replace(/[.*+?^()|[\]\\]/g, '.')}
- tapOn:
    id: 'search-row-[0-9]+'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'place-detail-save'
    timeout: 30000
- takeScreenshot: premium-4.36-plan-place-page-light
- runFlow:
    when:
      notVisible:
        id: 'place-detail-save'
        text: 'Saved.*'
    commands:
      - tapOn:
          id: 'place-detail-save'
- extendedWaitUntil:
    visible:
      id: 'place-detail-save'
      text: 'Saved.*'
    timeout: 15000
- takeScreenshot: premium-4.36-plan-place-saved-light
- repeat:
    while:
      notVisible:
        id: 'trip-map'
    times: 4
    commands:
      - runFlow: ../_shared/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    file: ../_shared/tap.yaml
    env:
      ID: 'plan-map-ideas'
      LABEL: 'Ideas.*'
- extendedWaitUntil:
    visible:
      id: 'ideas-sheet'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.saved}.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: premium-4.40-plan-ideas-light
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'trip-map'

# The plan check, from All days.
- runFlow:
    file: subflows/open-plan.yaml
- runFlow:
    file: subflows/open-plan-day.yaml
    env:
      DAY: 1
- tapOn:
    id: 'timeline-stop-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'stop-menu'
    timeout: 10000
- tapOn:
    id: 'stop-menu-move'
- extendedWaitUntil:
    visible:
      id: 'all-days-check'
    timeout: 60000
- tapOn:
    id: 'all-days-check'
- extendedWaitUntil:
    visible:
      id: 'plan-check'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: premium-4.43-plan-check-light

# After a relaunch, day 2 still has the moved stop.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen|tab-home|plan-check|trip-map|critters-hatch-later'
    timeout: 60000
- runFlow: subflows/open-plan.yaml
- runFlow:
    file: subflows/open-plan-day.yaml
    env:
      DAY: 2
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.added}.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: premium-4.26-plan-day-2-after-relaunch-light
