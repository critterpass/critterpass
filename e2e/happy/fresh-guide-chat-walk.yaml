appId: app.critterpass.dev
---
# A new account's guide chat on staging, no demo world (started as `crew_with_code`: a crew of one
# and no trip), first in Vietnamese and then in English. Vietnamese: the guide's four starters, a
# starter asked, the answer streaming in and settling, and a typed question (without diacritics:
# the Android driver types ASCII only) with the keyboard up. English (switched in Settings, then a
# cold start): the same thread, and a question whose answer uses a local word with its gloss.
#
# Needs the staging api's guide model key and a free meter with answers left.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
      LANG: vi
- runFlow:
    file: subflows/open-guide.yaml
    env:
      GUIDE_LABEL: 'Hỏi .*'

# Vietnamese: the starters.
- extendedWaitUntil:
    visible:
      id: 'guide-starter-.*'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: premium-5.13-walk-guide-starters-vi
# A starter: the dots, the answer typing in, then its saved copy.
- tapOn:
    id: 'guide-starter-.*'
    index: 0
- takeScreenshot: premium-5.14-walk-guide-asked-vi
- extendedWaitUntil:
    visible:
      id: 'guide-answer-(live|[0-9a-f-]{36})'
    timeout: 90000
- takeScreenshot: premium-5.14-walk-guide-streaming-vi
- assertNotVisible:
    id: 'guide-error'
- extendedWaitUntil:
    visible:
      id: 'guide-answer-[0-9a-f-]{36}'
    timeout: 90000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: premium-5.14-walk-guide-answer-vi
# A typed question, the keyboard up under the composer.
- tapOn:
    id: 'guide-composer'
- inputText: 'Da Nang co mon gi ngon?'
- waitForAnimationToEnd
- takeScreenshot: premium-5.14-walk-guide-draft-keyboard-vi
- assertVisible: 'Da Nang co mon gi ngon\?'
# The composer's send carries no id: it is the button labelled Hỏi (Ask).
- tapOn: 'Hỏi'
- extendedWaitUntil:
    visible:
      id: 'guide-live'
    timeout: 30000
    optional: true
- takeScreenshot: premium-5.14-walk-guide-asked-keyboard-vi
- extendedWaitUntil:
    notVisible:
      id: 'guide-live'
    timeout: 120000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: premium-5.14-walk-guide-answer-keyboard-vi
- assertNotVisible:
    id: 'guide-error'
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: premium-5.14-walk-guide-thread-vi

# English: the language switched in Settings, then a cold start; the guide opens from its circle on
# the same thread (never an error), and a local word's gloss.
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'home-screen'
- runFlow:
    file: ../_shared/switch-language.yaml
    env:
      LANG: en
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen|you-language|tab-home'
    timeout: 60000
- runFlow:
    file: ../_shared/to-home.yaml
- runFlow:
    file: subflows/open-guide.yaml
    env:
      GUIDE_LABEL: 'Ask .*'
- extendedWaitUntil:
    visible:
      id: 'guide-answer-[0-9a-f-]{36}'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: premium-5.14-walk-guide-thread-light
- tapOn:
    id: 'guide-composer'
- inputText: 'How do I thank a driver in Bali?'
- assertVisible: 'How do I thank a driver in Bali\?'
- tapOn: 'Ask'
- extendedWaitUntil:
    visible:
      id: 'guide-live'
    timeout: 30000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: 'guide-live'
    timeout: 120000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- assertNotVisible:
    id: 'guide-error'
- takeScreenshot: premium-5.14-walk-guide-gloss-keyboard-light
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: premium-5.14-walk-guide-gloss-light
