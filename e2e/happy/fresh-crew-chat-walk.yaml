appId: app.critterpass.dev
---
# A crew's first day in its chat, two new accounts on one phone and no demo world. The organiser
# (English) starts as `crew_with_code` (a crew of one), finds the new chat (the guide breaks the
# ice), types the first message the moment the field takes focus, and pitches a place so the
# crew's vote posts its card. A friend (Vietnamese) joins with the crew code and reads the chat:
# a reply from the message menu, a reaction, a long message, one with Vietnamese diacritics (typed
# on iOS: the Android driver types ASCII only), the keyboard opening and closing under the newest
# message, scrolling back and jumping to the latest, and the attach sheet. The organiser then logs
# an expense and opens its card from the chat.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code

# The organiser's new chat.
- tapOn:
    id: 'home-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-welcome'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-5.02-walk-chat-new-light
- tapOn:
    id: 'chat-input'
- inputText: 'Fushimi Inari at sunrise'
- takeScreenshot: premium-5.02-walk-first-draft-keyboard-light
- tapOn:
    id: 'chat-send'
- extendedWaitUntil:
    visible:
      text: '.*Fushimi Inari at sunrise.*'
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: '.*(Sent|Read by).*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-first-message-keyboard-light
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-first-message-light
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: home-screen

- runFlow:
    file: subflows/pitch-place.yaml
    env:
      QUERY: 'lisbon'

# The friend, in Vietnamese, on the same phone.
- runFlow:
    file: subflows/join-by-code.yaml
    env:
      PREFIX: vi
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: home-screen
- runFlow:
    when:
      notVisible:
        id: 'home-screen'
    commands:
      - runFlow: ../_shared/to-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-chat'
    timeout: 60000
- tapOn:
    id: 'home-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: '.*Fushimi Inari at sunrise.*'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: premium-5.12-walk-joined-vi

# Reply from the message menu.
- longPressOn: '.*Fushimi Inari at sunrise.*'
- extendedWaitUntil:
    visible:
      id: 'chat-message-menu'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: premium-5.04-walk-message-menu-vi
- tapOn:
    id: 'chat-action-reply'
- extendedWaitUntil:
    visible:
      id: 'chat-strip-cancel'
    timeout: 10000
- tapOn:
    id: 'chat-input'
- inputText: 'count me in'
- waitForAnimationToEnd
- takeScreenshot: premium-5.04-walk-reply-draft-keyboard-vi
- tapOn:
    id: 'chat-send'
- extendedWaitUntil:
    visible:
      text: '.*count me in'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: 'chat-strip-cancel'
    timeout: 10000
- hideKeyboard
- waitForAnimationToEnd

# A reaction from the same menu: its chip counts one.
- longPressOn: '.*Fushimi Inari at sunrise.*'
- extendedWaitUntil:
    visible:
      id: 'chat-react-.*'
    timeout: 10000
- tapOn:
    id: 'chat-react-🔥'
- extendedWaitUntil:
    visible:
      text: '1 (reacted|đã thả cảm xúc)'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-5.04-walk-reply-and-reaction-vi

# A long message wraps.
- tapOn:
    id: 'chat-input'
- inputText: 'Landing 09:40 on VN123, taxi to the old '
- inputText: 'town takes about forty minutes so lets '
- inputText: 'meet at the fountain by eleven and walk'
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-long-draft-keyboard-vi
- tapOn:
    id: 'chat-send'
- extendedWaitUntil:
    visible:
      text: '.*Landing 09:40.*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-long-sent-keyboard-vi
# Scrolled back, the jump returns to the latest; it only shows once the newest message is out of
# view, which a chat this short reaches only on a small screen.
- swipe:
    start: 50%, 22%
    end: 50%, 48%
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'chat-jump-latest'
    commands:
      - takeScreenshot: premium-5.01-walk-scrolled-back-keyboard-vi
      - tapOn:
          id: 'chat-jump-latest'
      - extendedWaitUntil:
          notVisible:
            id: 'chat-jump-latest'
          timeout: 10000
- extendedWaitUntil:
    visible:
      text: '.*Landing 09:40.*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-back-at-latest-keyboard-vi

- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: 'Tối nay ăn phở ở đường Nguyễn Huệ nhé, mình đặt bàn lúc bảy giờ rưỡi'
      - waitForAnimationToEnd
      - takeScreenshot: premium-5.01-walk-vietnamese-draft-keyboard-vi
      - tapOn:
          id: 'chat-send'
      - extendedWaitUntil:
          visible:
            text: '.*Tối nay ăn phở.*'
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: premium-5.01-walk-vietnamese-sent-keyboard-vi

# The scroll back put the keyboard away on Android, where hideKeyboard with no keyboard up would
# press back and leave the chat.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-keyboard-closed-vi
- tapOn:
    id: 'chat-input'
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-keyboard-reopened-vi
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-keyboard-closed-again-vi

- tapOn:
    id: 'chat-attach'
- extendedWaitUntil:
    visible:
      id: 'chat-attach-.*'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: premium-5.01-walk-attach-sheet-vi

# Back to the organiser: an expense, and its card opened from the chat.
- runFlow:
    file: subflows/switch-account.yaml
    env:
      TARGET: 'dev-accounts-switch-0'
- extendedWaitUntil:
    visible:
      id: 'home-screen|tab-home'
    timeout: 60000
- runFlow:
    file: subflows/open-wallet.yaml
    env:
      HALF: money
- runFlow:
    when:
      visible:
        id: 'money-empty-add'
    commands:
      - tapOn:
          id: 'money-empty-add'
- runFlow:
    when:
      notVisible:
        id: 'money-keypad'
    commands:
      - runFlow:
          file: ../_shared/tap.yaml
          env:
            ID: 'money-add'
            LABEL: 'Add an expense|Thêm khoản chi'
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: 'money-key-1'
      - tapOn:
          id: 'money-key-2'
      - tapOn:
          id: 'money-key-5'
      - tapOn:
          id: 'money-add-submit'
      - extendedWaitUntil:
          visible:
            id: 'money-latest'
          timeout: 15000
- runFlow:
    file: ../_shared/to-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-chat'
    timeout: 15000
- tapOn:
    id: 'home-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-expense-view-.*'
    timeout: 30000
- assertNotVisible:
    id: 'chat-unknown-.*'
- waitForAnimationToEnd
- takeScreenshot: premium-5.11-walk-expense-card-vi
- tapOn:
    id: 'chat-expense-view-.*'
- extendedWaitUntil:
    visible:
      id: 'money-expense-detail'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-7.21-walk-expense-opened-vi
