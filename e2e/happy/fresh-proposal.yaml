appId: app.critterpass.dev
---
# Release gate: a real proposal between two brand-new accounts on one phone, no demo world. The
# organiser starts a crew and keeps its code; a second new account (Developer tools → Test
# accounts) joins with that code. Back as the organiser: one place locked in, setup, the guide's
# draft, BUILD THE PROPOSAL and SEND. The friend opens it from crew chat, watches the trailer and
# replies, reads their version and slides to board. The organiser locks the crew in from the
# tracker and the trip is confirmed.
- runFlow: subflows/proposal-sent.yaml

# The friend opens it from crew chat and boards.
- runFlow:
    file: ../proposal/subflows/switch-account.yaml
    env:
      TARGET: 'dev-accounts-switch-1'
- runFlow: ../proposal/subflows/open-proposal-card.yaml
# A trailer proposal opens on its story: a quick reply, then MAYBE goes to the friend's version.
- extendedWaitUntil:
    visible:
      id: 'proposal-trailer|proposal-version'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'proposal-trailer'
    # The trailer plays on by itself and opens the version when it ends: no wait for a still screen,
    # which never comes while it plays. On the iOS simulator each tap waits for the moving story to
    # settle, and the story can end first: the quick reply is then skipped, and the version below is
    # where both paths meet.
    commands:
      - takeScreenshot: en-3f-2-trailer
      - tapOn:
          id: 'trailer-quick'
          optional: true
      - tapOn:
          id: 'trailer-react-okay_wow'
          optional: true
      - tapOn:
          id: 'trailer-maybe'
          optional: true
- extendedWaitUntil:
    visible:
      id: 'proposal-version'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'version-in'
    timeout: 30000
# The friend sees what they are agreeing to: the plan's highlights, from the plan SEND published.
- extendedWaitUntil:
    visible:
      id: 'version-pick-0'
    timeout: 60000
- assertVisible:
    id: 'version-whole-plan'
- waitForAnimationToEnd
- takeScreenshot: en-3f-3-your-version
- tapOn:
    id: 'version-ask'
- extendedWaitUntil:
    visible:
      id: 'objection-reason-cost'
    timeout: 15000
- tapOn:
    id: 'objection-reason-cost'
- extendedWaitUntil:
    visible:
      id: 'objection-later'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: en-3f-4-not-sure
# "Ask me on Sunday" closes the sheet (and schedules the nudge).
- tapOn:
    id: 'objection-later'
- extendedWaitUntil:
    visible:
      id: 'version-in'
    timeout: 15000
- tapOn:
    id: 'version-in'
- extendedWaitUntil:
    visible:
      id: 'board-slide'
    timeout: 30000
- waitForAnimationToEnd
# The pass's barcode and stickers are drawn a moment after the screen settles.
- extendedWaitUntil:
    visible:
      id: 'board-pass-drawn'
    timeout: 4000
    optional: true
- takeScreenshot: en-3f-5-slide
# The knob sits at the start of the track. Android finds it by id; iOS reads the track as one
# element, so the drag starts where the knob rests (low on the screen, at the left).
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: 'board-knob'
          direction: RIGHT
          duration: 1200
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 12%, 86%
          end: 96%, 86%
          duration: 1200
      - runFlow:
          when:
            notVisible:
              id: 'board-egg'
          commands:
            - swipe:
                start: 12%, 83%
                end: 96%, 83%
                duration: 1200
- extendedWaitUntil:
    visible:
      id: 'board-egg'
    timeout: 30000
- assertNotVisible:
    id: 'board-pending'
- waitForAnimationToEnd
- takeScreenshot: en-3f-5-boarded
# In: the friend opens the whole plan from their version and sees day 1.
- tapOn:
    id: 'board-done'
- scrollUntilVisible:
    element:
      id: 'version-whole-plan'
    timeout: 30000
- tapOn:
    id: 'version-whole-plan'
# iOS reads each day card whole by its label ("Day 1, Sat, …"), with the card's own id inside it.
- extendedWaitUntil:
    visible:
      id: 'plan-day-list'
    timeout: 60000
- assertVisible: '(?i)day 1,.*'
- waitForAnimationToEnd
- takeScreenshot: en-3e-1-friend-plan

# The organiser locks the crew in: the trip is confirmed.
- runFlow:
    file: ../proposal/subflows/switch-account.yaml
    env:
      TARGET: 'dev-accounts-switch-0'
- runFlow: ../proposal/subflows/open-proposal-card.yaml
- extendedWaitUntil:
    visible:
      id: 'proposal-tracker'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'tracker-lock'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: en-3f-6-who-s-in
- tapOn:
    id: 'tracker-lock'
- tapOn: '(?i)yes, lock it in'
# Confirmed: the chip says so and LOCK IT IN is gone.
- extendedWaitUntil:
    visible:
      id: 'tracker-lock-note'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'tracker-lock'
    timeout: 15000
- assertVisible:
    text: '(?i)confirmed'
- waitForAnimationToEnd
- takeScreenshot: en-3f-6-locked
