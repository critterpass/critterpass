appId: app.critterpass.dev
---
# Release gate: a real proposal between two new accounts on one phone, no demo world. The organiser
# starts as `draft_ready` (a crew of one, its trip's plan in draft review) and keeps the crew's
# code; a second new account (Developer tools → Test accounts) joins with that code. Back as the
# organiser: the draft from Home, BUILD THE PROPOSAL and SEND. The friend opens it from crew chat,
# watches the trailer and replies, reads their version and slides to board. The organiser locks the
# crew in from the tracker and the trip is confirmed.
- runFlow: subflows/proposal-sent.yaml

# The friend opens it from crew chat and boards.
- runFlow:
    file: subflows/switch-account.yaml
    env:
      TARGET: 'dev-accounts-switch-1'
- runFlow: subflows/open-proposal-card.yaml
# A trailer proposal opens on its story: a quick reply, then MAYBE goes to the friend's version.
- extendedWaitUntil:
    visible:
      id: 'proposal-trailer|proposal-version'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'proposal-trailer'
    commands:
      - takeScreenshot: en-3f-2-trailer
# Android: a quick reply, then MAYBE. iOS leaves the trailer alone: the simulator lands each tap only
# once the playing story is still, which is after it has handed over to the version, so the tap hits
# the version (ASK SARDI) instead. The story ends on the version by itself.
- runFlow:
    when:
      platform: Android
      visible:
        id: 'proposal-trailer'
    commands:
      - tapOn:
          id: 'trailer-quick'
      # With the quick replies open the story holds: well past a five-second slide, and past the
      # last one, the reader is still on the trailer with the replies up.
      - extendedWaitUntil:
          visible:
            id: 'proposal-version'
          timeout: 12000
          optional: true
      - assertVisible:
          id: 'trailer-react-okay_wow'
      - takeScreenshot: en-3f-2-trailer-reply-held
      - tapOn:
          id: 'trailer-react-okay_wow'
      - tapOn:
          id: 'trailer-maybe'
- extendedWaitUntil:
    visible:
      id: 'proposal-version'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'version-in'
    timeout: 30000
# The friend sees what they are agreeing to: the plan's highlights, from the plan SEND published.
- extendedWaitUntil:
    visible:
      id: 'version-pick-0'
    timeout: 60000
- assertVisible:
    id: 'version-whole-plan'
- waitForAnimationToEnd
- takeScreenshot: en-3f-3-your-version
- tapOn:
    id: 'version-ask'
- extendedWaitUntil:
    visible:
      id: 'objection-reason-cost'
    timeout: 15000
- tapOn:
    id: 'objection-reason-cost'
# The guide answers with what it can move, or that nothing moves the cost for one person.
- extendedWaitUntil:
    visible:
      id: 'objection-later|objection-none'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: premium-4.51-not-sure-light
- runFlow:
    when:
      visible:
        id: 'objection-later'
    commands:
      - tapOn:
          id: 'objection-later'
- runFlow:
    when:
      visible:
        id: 'objection-sheet|objection-none'
    commands:
      - runFlow: ../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'version-in'
    timeout: 15000
- tapOn:
    id: 'version-in'
- extendedWaitUntil:
    visible:
      id: 'board-slide'
    timeout: 30000
- waitForAnimationToEnd
# The pass's barcode and stickers are drawn a moment after the screen settles.
- extendedWaitUntil:
    visible:
      id: 'board-pass-drawn'
    timeout: 4000
    optional: true
- takeScreenshot: en-3f-5-slide
- runFlow: subflows/slide-to-board.yaml
- extendedWaitUntil:
    visible:
      id: 'board-egg'
    timeout: 30000
- assertNotVisible:
    id: 'board-pending'
- waitForAnimationToEnd
- takeScreenshot: en-3f-5-boarded
# In: the friend opens the whole plan from their version and sees day 1 (the trip map, or the day
# plan when PLAN opens on the day).
- tapOn:
    id: 'board-done'
- scrollUntilVisible:
    element:
      id: 'version-whole-plan'
    timeout: 30000
- tapOn:
    id: 'version-whole-plan'
- extendedWaitUntil:
    visible:
      id: 'trip-map|day-plan'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'day-chip-1'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: en-7a-1-friend-plan

# The organiser locks the crew in: the trip is confirmed.
- runFlow:
    file: subflows/switch-account.yaml
    env:
      TARGET: 'dev-accounts-switch-0'
- runFlow: subflows/open-proposal-card.yaml
- extendedWaitUntil:
    visible:
      id: 'proposal-tracker'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'tracker-lock'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: en-3f-6-who-s-in
- tapOn:
    id: 'tracker-lock'
- tapOn: '(?i)yes, lock.it.in'
# Confirmed: the "trip is on" card says so and LOCK IT IN is gone.
- extendedWaitUntil:
    visible:
      id: 'tracker-confirmed'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'tracker-lock'
    timeout: 15000
- assertVisible:
    text: '(?i).*confirmed.*'
- waitForAnimationToEnd
- takeScreenshot: en-3f-6-locked
