appId: app.critterpass.dev
---
# Release gate: the wallet for a real first-time traveller, with no demo seed. A new account from Ho
# Chi Minh City (home currency VND) starts as `crew_with_code` (a crew of one), starts a solo trip
# to Hội An in it, and opens the Wallet tab. Money settles in VND and says there is nothing to split
# yet; BOOKINGS | MONEY swaps in place; Add a booking shows the crew's forward address on the
# staging mail domain and copies it; a typed expense lands in SPENT SO FAR and LATEST; and the
# travel insurance form's SAVE sits above the tab bar where it can be tapped.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
# A solo trip in the crew: the guest guide's page for Hội An starts a trip for one.
- openLink: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: 'hoi an'
- extendedWaitUntil:
    visible:
      id: 'place-result-.*'
    timeout: 15000
- tapOn:
    id: 'place-result-.*'
    index: 0
# The result opens the place's Explore page: SOLO TRIP asks once, START SOLO TRIP makes the trip.
- scrollUntilVisible:
    element:
      id: 'explore-solo'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'explore-solo'
- extendedWaitUntil:
    visible:
      id: 'solo-confirm'
    timeout: 10000
- tapOn:
    id: 'solo-start'
- extendedWaitUntil:
    notVisible:
      id: 'solo-confirm'
    timeout: 20000
# The Wallet tab opens on Money: the crew settles in the traveller's home currency.
- runFlow:
    file: ../_shared/open-link.yaml
    env:
      URL: critterpass-dev://wallet/money
- extendedWaitUntil:
    visible:
      id: 'money-(ready|none|syncing)'
    timeout: 60000
# The crew counts in đồng: the hero's amount carries ₫.
- extendedWaitUntil:
    visible:
      id: 'money-empty-hero|money-hero'
      containsDescendants:
        - text: '.*[₫đ].*'
    timeout: 30000
- takeScreenshot: premium-7.16-fresh-wallet-money-empty-light
# BOOKINGS | MONEY swaps the halves in place and back again.
- tapOn:
    id: 'wallet-switch-bookings'
- extendedWaitUntil:
    visible:
      id: 'bookings-wallet-.*'
    timeout: 15000
- tapOn:
    id: 'wallet-switch-money'
- extendedWaitUntil:
    visible:
      id: 'money-(ready|none|syncing)'
    timeout: 15000
- tapOn:
    id: 'wallet-switch-bookings'
- extendedWaitUntil:
    visible:
      id: 'bookings-wallet-.*'
    timeout: 15000
# Add a booking: the forward address is on the staging mail domain, and COPY copies it.
# An empty wallet shows the ways in as tiles; Add a booking opens by its link.
- runFlow: subflows/open-add-booking.yaml
- extendedWaitUntil:
    visible:
      id: 'bookings-add-copy'
    timeout: 30000
# iOS reads the address with its copy hint ("…@in.staging.critterpass.app, copy the address").
- assertVisible: '.*@in\.staging\.critterpass\.app.*'
- tapOn:
    id: 'bookings-add-copy'
# The copy confirms with COPIED on the button (2 s) and a toast. Android shows its own clipboard
# overlay over the app instead, which hides the app from the runner until it goes.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: '(?i)(copied|forward any confirmation to that address\.)'
          timeout: 5000
- takeScreenshot: premium-7.03-fresh-wallet-forward-address-light
- runFlow:
    file: ../_shared/open-link.yaml
    env:
      URL: critterpass-dev://wallet/bookings
# Travel insurance: SAVE sits above the tab bar and can be tapped.
- runFlow:
    when:
      notVisible:
        id: 'bookings-wallet-.*'
    commands:
      - tapOn:
          id: 'wallet-switch-bookings'
- scrollUntilVisible:
    element:
      id: 'bookings-insurance-add'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'bookings-insurance-add'
- extendedWaitUntil:
    visible:
      id: 'bookings-insurance-form'
    timeout: 10000
- tapOn:
    id: 'bookings-insurance-provider'
- inputText: 'Bao Viet'
- tapOn:
    id: 'bookings-insurance-number'
- inputText: 'BV2026100201'
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- takeScreenshot: premium-7.13-fresh-wallet-insurance-light
# The tap reaches SAVE (not the tab bar over it): the policy is saved and its card shows.
- tapOn:
    id: 'bookings-insurance-save'
- extendedWaitUntil:
    visible:
      id: 'bookings-insurance-card'
    timeout: 20000
# A typed expense: 63.000 ₫ lands in LATEST and in what the crew of one has spent.
- runFlow:
    when:
      notVisible:
        id: 'money-(ready|none|syncing)'
    commands:
      - tapOn:
          id: 'wallet-switch-money'
- extendedWaitUntil:
    visible:
      id: 'money-(ready|none|syncing)'
    timeout: 15000
- runFlow: subflows/open-add-expense.yaml
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
# The keys by their ids: a bare '0' would also match the digits of the amount above.
- tapOn:
    id: 'money-key-6'
- tapOn:
    id: 'money-key-3'
- tapOn:
    id: 'money-key-000'
- assertVisible: '.*63,000.*'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'money-hero'
    timeout: 30000
- assertVisible:
    id: 'money-solo'
- assertNotVisible:
    id: 'money-settle'
- takeScreenshot: premium-7.17-fresh-wallet-money-solo-light
