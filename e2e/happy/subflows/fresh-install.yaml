appId: app.critterpass.dev
---
# A fresh install on the splash, so the flow's account is its own and nothing an earlier flow on
# this device left (keychain, storage, an open link dialog) carries over.
# The keychain outlives a cleared install on iOS: without this the new pass would sign back in to
# the account an earlier flow made.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
# On the premium UI (the only one the flows drive), then its splash.
- runFlow: ../../_shared/premium-ui.yaml
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
# The iOS paste offer can cover a cleared install's splash.
- runFlow:
    when:
      visible:
        id: 'paste-link-offer'
    commands:
      - tapOn:
          id: 'paste-link-skip'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
