appId: app.critterpass.dev
---
# A fresh account's own trip, under way today: a crew of one, Đà Nẵng pitched and locked in, dates
# today → today+2 (Vietnam's today), the rest of setup, the guide's draft, and LOCK IT IN alone.
# Ends on Home with the trip confirmed. Steps borrowed from fresh-setup-vnd.yaml and
# fresh-solo-confirm.yaml until the shared fresh-trip-under-way flow lands.
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Just me'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
# One place on the board: the organiser locks it in, and it wins.
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- extendedWaitUntil:
    visible:
      id: 'setup-step-when'
    timeout: 20000
# Today in Vietnam, three days (today → today+2): the first day tapped in the picker's heatmap,
# the length taken down to three, and the lock's own label checked before it is tapped.
- evalScript: ${var d = new Date(Date.now() + 7 * 3600000); var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; output.lockLabel = '(?i)lock ' + months[d.getUTCMonth()].slice(0, 3) + ' ' + d.getUTCDate() + '\\D.*'; output.monthLabel = '(?i)' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); output.pickId = 'heat-pick-' + d.toISOString().slice(0, 10)}
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
- extendedWaitUntil:
    visible:
      id: 'picker-shorter'
    timeout: 10000
- waitForAnimationToEnd
# The sheet opens on the month of the suggested week, which can be another one: page to the
# day's month first. The dates step under the sheet has its own month and arrows, so both are
# looked up inside the sheet.
- repeat:
    while:
      notVisible:
        text: ${output.monthLabel}
        childOf:
          id: 'week-picker-panel'
    times: 6
    commands:
      - tapOn:
          id: 'heatmap-prev'
          childOf:
            id: 'week-picker-panel'
      - waitForAnimationToEnd
- repeat:
    while:
      notVisible:
        text: ${output.monthLabel}
        childOf:
          id: 'week-picker-panel'
    times: 6
    commands:
      - tapOn:
          id: 'heatmap-next'
          childOf:
            id: 'week-picker-panel'
      - waitForAnimationToEnd
- assertVisible:
    text: ${output.monthLabel}
    childOf:
      id: 'week-picker-panel'
# The sheet's own cell for the day, by its date.
- tapOn:
    id: ${output.pickId}
- extendedWaitUntil:
    visible:
      id: 'picker-lock'
    timeout: 10000
- repeat:
    while:
      notVisible: '3 days'
    times: 30
    commands:
      - tapOn:
          id: 'picker-shorter'
- assertVisible: '3 days'
- assertVisible:
    id: 'picker-lock'
    text: ${output.lockLabel}
- waitForAnimationToEnd
- takeScreenshot: fresh-critters-03-dates
- tapOn:
    id: 'picker-lock'
# The rest of setup, as e2e/proposal/subflows/setup-to-draft.yaml walks it, without a stay.
- extendedWaitUntil:
    visible:
      id: 'budget-lock'
    timeout: 30000
# The budget is skipped here: nobody else has set a max yet, and skipping is a real path for the
# organiser. Locking it has its own gate flow (e2e/happy/fresh-setup-vnd.yaml).
- tapOn:
    id: 'budget-skip'
# Rooms: pick the first stay when the place has stay prices and wait for its rooms; with none,
# LOOKS GOOD accepts the even split.
- extendedWaitUntil:
    visible:
      id: 'setup-rooms-lock'
    timeout: 30000
# A crew of one takes the even split: no stay is picked (LOOKS GOOD accepts it).
- scrollUntilVisible:
    element:
      id: 'setup-rooms-lock'
    timeout: 10000
- tapOn:
    id: 'setup-rooms-lock'
- extendedWaitUntil:
    visible:
      id: 'must-dos-add'
    timeout: 30000
- tapOn:
    id: 'must-dos-add'
- extendedWaitUntil:
    visible:
      id: 'add-must-do-field'
    timeout: 10000
- tapOn:
    id: 'add-must-do-field'
- inputText: 'Son Tra at sunrise'
- tapOn:
    id: 'add-must-do-keep'
# Android shows the row's title in capitals; iOS reads the row whole ("Son Tra at sunrise,
# Winston").
- extendedWaitUntil:
    visible:
      text: '(?i)son tra at sunrise.*'
    timeout: 15000
# KEEP closes the sheet and its keyboard with it; hideKeyboard with no keyboard up is a back press on
# Android, which would leave setup.
- scrollUntilVisible:
    element:
      id: 'must-dos-draft'
    timeout: 10000
- tapOn:
    id: 'must-dos-draft'
- extendedWaitUntil:
    visible:
      id: 'drafting-screen'
    timeout: 30000
# The draft job (outline, every day, checks) takes a few minutes on staging.
- extendedWaitUntil:
    visible:
      id: 'draft-review'
    timeout: 600000
- waitForAnimationToEnd
- takeScreenshot: fresh-critters-04-draft
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
- tapOn:
    id: 'draft-propose'
- extendedWaitUntil:
    visible:
      id: 'build-lock-alone'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'build-lock-alone'
- extendedWaitUntil:
    visible:
      id: 'home-countdown|home-in-trip'
    timeout: 60000
