appId: app.critterpass.dev
---
# A fresh account's own trip, under way today: a crew of one, Đà Nẵng pitched and locked in, dates
# today → today+2 (Vietnam's today), the rest of setup, the guide's draft, and LOCK IT IN alone.
# Ends on Home with the trip confirmed. Steps borrowed from fresh-setup-vnd.yaml and
# fresh-solo-confirm.yaml until the shared fresh-trip-under-way flow lands.
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Just me'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
# One place on the board: the organiser locks it in, and it wins.
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- extendedWaitUntil:
    visible:
      id: 'setup-step-when'
    timeout: 20000
# Today in Vietnam, three days (today → today+2): the first day tapped in the picker's heatmap,
# the length taken down to three, and the lock's own label checked before it is tapped.
- evalScript: ${var d = new Date(Date.now() + 7 * 3600000); var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; var first = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)); output.pickLabel = months[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', .*'; output.lockLabel = '(?i)lock ' + months[d.getUTCMonth()].slice(0, 3) + ' ' + d.getUTCDate() + '\\D.*'; output.pickColumn = (d.getUTCDay() + 6) % 7; output.pickRow = Math.floor((((first.getUTCDay() + 6) % 7) + d.getUTCDate() - 1) / 7); output.pickTry = 0}
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
- extendedWaitUntil:
    visible:
      id: 'picker-shorter'
    timeout: 10000
- waitForAnimationToEnd
# iOS finds the day's cell by its spoken label: the sheet's own when the step under it shows the
# same day (the second match), else the only one.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: ${output.pickLabel}
          index: 1
          optional: true
      - runFlow:
          when:
            notVisible:
              id: 'picker-lock'
          commands:
            - tapOn:
                text: ${output.pickLabel}
# On Android the sheet's cells carry no id or label of their own (only the step under it does), so
# the cell is tapped where the sheet draws it on the runner's Pixel 7: its weekday column, and a
# few heights around its week's row until the lock names the day.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            notVisible:
              id: 'picker-lock'
              text: ${output.lockLabel}
          times: 9
          commands:
            - tapOn:
                point: ${Math.round(8.26 + (output.pickColumn + 0.5) * 11.925) + '%, ' + Math.round(40 + output.pickRow * 5.25 + output.pickTry * 2) + '%'}
            - evalScript: ${output.pickTry = output.pickTry + 1}
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'picker-lock'
    timeout: 10000
- repeat:
    while:
      notVisible: '3 days'
    times: 30
    commands:
      - tapOn:
          id: 'picker-shorter'
- assertVisible: '3 days'
- assertVisible:
    id: 'picker-lock'
    text: ${output.lockLabel}
- waitForAnimationToEnd
- takeScreenshot: fresh-critters-03-dates
- tapOn:
    id: 'picker-lock'
- extendedWaitUntil:
    visible:
      id: 'budget-lock'
    timeout: 45000
- runFlow: ../../proposal/subflows/setup-to-draft.yaml
# The draft job (outline, every day, checks) takes a few minutes on staging.
- extendedWaitUntil:
    visible:
      id: 'draft-review'
    timeout: 600000
- waitForAnimationToEnd
- takeScreenshot: fresh-critters-04-draft
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
- tapOn:
    id: 'draft-propose'
- extendedWaitUntil:
    visible:
      id: 'build-lock-alone'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'build-lock-alone'
- extendedWaitUntil:
    visible:
      id: 'home-countdown|home-in-trip'
    timeout: 60000
