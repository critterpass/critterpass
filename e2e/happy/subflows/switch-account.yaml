appId: app.critterpass.dev
---
# Developer tools → Test accounts: ${TARGET} keeps the signed-in account and either starts a new
# one (dev-accounts-new) or signs a kept one back in (dev-accounts-switch-<n>, in the order they
# were kept). The app clears its local data and restarts on the new session.
- runFlow: ../../_shared/open-dev-tools.yaml
# The list can open scrolled down (it keeps its place): back to its top, then down to the row,
# centred, so the tap lands on it and not on the edge of the screen.
- scrollUntilVisible:
    element:
      id: 'dev-build-marker'
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'dev-nav-accounts'
    timeout: 15000
    speed: 20
    centerElement: true
- tapOn:
    id: 'dev-nav-accounts'
- extendedWaitUntil:
    visible:
      id: ${TARGET}
    timeout: 20000
- tapOn:
    id: ${TARGET}
# The app restarts on the new session; Home sends a brand-new account to onboarding.
- waitForAnimationToEnd:
    timeout: 5000
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
# The restart can come back on Developer tools: back out to the splash (a new account) or Home.
- extendedWaitUntil:
    visible:
      id: 'onboarding-open|home-screen|tab-home|dev-build-marker|dev-nav-.*'
    timeout: 60000
- runFlow:
    file: ../../_shared/back-to.yaml
    env:
      MARK: 'onboarding-open|home-screen|tab-home'
