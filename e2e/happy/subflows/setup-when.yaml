appId: app.critterpass.dev
---
# The setup's When step as organiser with nobody's days marked: mark a week of next month free by
# hand, save (set_availability), wait for the crew window the worker recomputes, and lock the dates
# (lock_trip_dates), from the window card or the week picker.
- tapOn:
    id: 'own-calendar-action'
- runFlow:
    when:
      visible:
        id: 'calendar-by-hand'
    commands:
      - tapOn:
          id: 'calendar-by-hand'
- extendedWaitUntil:
    visible:
      id: 'manual-days'
    timeout: 10000
# Next month: every day of it is ahead of today.
- tapOn:
    id: 'manual-days-next'
# Seven days in a row, each tapped once: free.
- tapOn:
    id: 'manual-day-.*'
    index: 8
- tapOn:
    id: 'manual-day-.*'
    index: 9
- tapOn:
    id: 'manual-day-.*'
    index: 10
- tapOn:
    id: 'manual-day-.*'
    index: 11
- tapOn:
    id: 'manual-day-.*'
    index: 12
- tapOn:
    id: 'manual-day-.*'
    index: 13
- tapOn:
    id: 'manual-day-.*'
    index: 14
- tapOn:
    id: 'manual-days-save'
- extendedWaitUntil:
    notVisible:
      id: 'manual-days'
    timeout: 15000
# The crew window: a lock button on the window card, or pick the week in the picker.
- extendedWaitUntil:
    visible:
      id: 'when-cta|when-pick-week'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'when-cta'
    commands:
      - tapOn:
          id: 'when-cta'
- runFlow:
    when:
      visible:
        id: 'when-pick-week'
    commands:
      - tapOn:
          id: 'when-pick-week'
      - extendedWaitUntil:
          visible:
            id: 'picker-lock'
          timeout: 10000
      - tapOn:
          id: 'picker-lock'
