appId: app.critterpass.dev
---
# The visit history offer rises on the trip hub (only there), about 4 s after the hub settles once
# the trip is under way. Run right after landing on the hub: give it the time to rise and answer
# NOT NOW, so it never covers the tiles or takes the next tap. Before the trip starts it never
# comes, and this only waits.
- extendedWaitUntil:
    visible: 'NOT NOW'
    timeout: 8000
    optional: true
- runFlow: dismiss-visit-offer.yaml
