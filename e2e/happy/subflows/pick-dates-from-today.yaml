appId: app.critterpass.dev
---
# The setup's When step as organiser, picked by hand: today in Vietnam as the first day (or
# ${START_OFFSET_DAYS} days from today), three days long (the first day and the day two after tapped), so the trip is under way the moment it is
# confirmed (or starts tomorrow). The
# lock's own label is checked before it is tapped, so a tap that landed on another day fails here
# instead of locking the wrong dates.
# The days are tapped by pick-days.yaml (its header says how to use it from another flow).
- evalScript: ${var d = new Date(Date.now() + 7 * 3600000 + (typeof START_OFFSET_DAYS === 'undefined' || START_OFFSET_DAYS === '' ? 0 :Number(START_OFFSET_DAYS)) * 86400000); var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; output.lockLabel = '(?i)lock ' + months[d.getUTCMonth()].slice(0, 3) + ' ' + d.getUTCDate() + '\\D.*'; output.pickDate = d.toISOString().slice(0, 10)}
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
# The first day and the day two after, each on its own month, by its date.
- runFlow:
    file: pick-days.yaml
    env:
      PICK_DATE: ${output.pickDate}
      PICK_DAYS: 3
# The length is read off the summary line when it is on screen. With the length chips above the
# calendar it sits under the lock on a short screen, so the lock's own label (the first and last
# day, checked next) is what holds the three days.
- assertVisible:
    id: 'picker-length'
    text: '3 days .*'
    optional: true
- assertVisible:
    id: 'picker-lock'
    text: ${output.lockLabel}
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-dates-today
- tapOn:
    id: 'picker-lock'
