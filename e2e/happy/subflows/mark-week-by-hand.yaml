appId: app.critterpass.dev
---
# In the open "Mark your days" sheet: next month (every day of it is ahead of today), reached by
# the grid's next arrow, then seven days in a row painted with the Free brush, each tapped once,
# and Save. Waits for the sheet to close.
- extendedWaitUntil:
    visible:
      id: 'manual-days-grid'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'manual-days-grid-next'
- waitForAnimationToEnd
- tapOn:
    id: 'manual-tool-free'
- tapOn:
    id: 'manual-day-.*'
    index: 8
- tapOn:
    id: 'manual-day-.*'
    index: 9
- tapOn:
    id: 'manual-day-.*'
    index: 10
- tapOn:
    id: 'manual-day-.*'
    index: 11
- tapOn:
    id: 'manual-day-.*'
    index: 12
- tapOn:
    id: 'manual-day-.*'
    index: 13
- tapOn:
    id: 'manual-day-.*'
    index: 14
- tapOn:
    id: 'manual-days-save'
- extendedWaitUntil:
    notVisible:
      id: 'manual-days-grid'
    timeout: 15000
