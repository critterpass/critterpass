appId: app.critterpass.dev
---
# The shortest pass flow from the splash to Home (iOS primer; Android taps "Allow" instead):
# a name, a guide avatar, six this-or-thats, Singapore as home, no save, no permissions yet.
# ${HOME_IATA} with ${HOME_QUERY} (e.g. SGN, 'Ho Chi') names the home to search for instead when
# the nearest airports don't offer Ho Chi Minh City; a crew started from SGN settles in VND.
- evalScript: "${output.homeIata = typeof HOME_IATA === 'undefined' || HOME_IATA === '' ? 'SIN' : HOME_IATA}"
- evalScript: "${output.homeQuery = typeof HOME_QUERY === 'undefined' || HOME_QUERY === '' ? 'Sing' : HOME_QUERY}"
- runFlow: through-name.yaml
- tapOn:
    id: 'avatar-ajo'
- tapOn:
    id: 'onboarding-photo-next'
# On a busy simulator the photo page can still be settling when these land, and the taps are
# dropped (the page stays, any guide works): THAT'S ME is tapped again when it is still there.
- extendedWaitUntil:
    visible:
      id: 'quiz-card-left'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'onboarding-photo-next'
    commands:
      - tapOn:
          id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'quiz-card-left'
    timeout: 20000
# Six picks show DONE; a tap the slow simulator drops just means one more pick.
- repeat:
    while:
      notVisible:
        id: 'taste-done'
    times: 9
    commands:
      - tapOn:
          id: 'quiz-card-right'
      - waitForAnimationToEnd
- tapOn:
    id: 'taste-done'
# The nearest airports are offered first; search only when none is.
- runFlow:
    when:
      visible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-row-SGN'
- runFlow:
    when:
      notVisible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-search'
      - inputText: ${output.homeQuery}
      - extendedWaitUntil:
          visible:
            id: 'home-row-${output.homeIata}'
          timeout: 20000
      # The results catch up with the typed query a moment later and redraw: a tap during that
      # redraw is lost, and the page stays without a home.
      - waitForAnimationToEnd
      - tapOn:
          id: 'home-row-${output.homeIata}'
# The picked row reads as selected (its stamp may sit below the keyboard), and only then does NEXT
# go on.
- extendedWaitUntil:
    visible:
      id: 'home-row-.*'
      selected: true
    timeout: 10000
# The page footer rides the keyboard, so NEXT is reachable with it up. On Android hideKeyboard is a
# BACK press when no keyboard is open, which leaves this page for the taste result.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- tapOn:
    id: 'onboarding-issued-save'
# The save sheet (a form sheet on both platforms): not now.
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: 'save-not-now'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'onboarding-issued-next'
    commands:
      - tapOn:
          id: 'onboarding-issued-next'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer'
    timeout: 10000
# One primer per permission the phone still has to ask for.
- repeat:
    while:
      visible:
        id: 'primer-later'
    times: 4
    commands:
      - tapOn:
          id: 'primer-later'
      - waitForAnimationToEnd
