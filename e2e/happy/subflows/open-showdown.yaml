appId: app.critterpass.dev
---
# Opens the destination vote's final (4.05) from the trip's hub: a trip still voting says so on its
# planning line, whose "Voting" button opens the showdown once the vote is in its final. The note
# repeats the button's words and the button has no id, so the button is the second match.
- runFlow: open-trip-hub.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-planning'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    text: 'Voting|Đang bình chọn'
    index: 1
- extendedWaitUntil:
    visible:
      id: 'showdown'
    timeout: 20000
