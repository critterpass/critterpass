appId: app.critterpass.dev
---
# A brand-new traveller's trip that is on today, with no demo world. A fresh account whose home is
# Ho Chi Minh City starts a crew of one (which settles in đồng), pitches Đà Nẵng from Home and locks
# it in, sets the trip up from today for three days with the budget locked in đồng, the rooms and
# one must-do, has the guide draft it, and with nobody to send it to locks the plan in alone. It
# ends on the screen the lock leaves the traveller on. ${SHOTS} prefixes the screenshots;
# ${START_OFFSET_DAYS} (optional) starts the trip that many days from today instead.
- runFlow:
    file: fresh-account.yaml
    env:
      HOME_IATA: SGN
      HOME_QUERY: 'Ho Chi'
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Da Nang crew'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
# The sheet usually closes onto Home by itself; back out only if it is still open.
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
# One place on the board: the organiser locks it in, and it wins.
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- extendedWaitUntil:
    visible:
      id: 'setup-step-when'
    timeout: 20000
- runFlow:
    file: pick-dates-from-today.yaml
    env:
      START_OFFSET_DAYS: ${typeof START_OFFSET_DAYS === 'undefined' ? '' : START_OFFSET_DAYS}
# The budget, in đồng, locked as the guide suggests it.
- extendedWaitUntil:
    visible:
      id: 'budget-track'
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: 'budget-bars|budget-bars-missing'
    timeout: 30000
- assertVisible:
    id: 'budget-track'
    text: '.*₫.*'
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-budget
- tapOn:
    id: 'budget-lock'
# Rooms: pick the first stay when the place has stay prices and wait for its rooms; with none,
# LOOKS GOOD accepts the even split.
- extendedWaitUntil:
    visible:
      id: 'setup-rooms-lock'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'setup-rooms-stay-option-.*'
    commands:
      - tapOn:
          id: 'setup-rooms-stay-option-.*'
          index: 0
      - extendedWaitUntil:
          visible:
            id: 'setup-rooms-room-.*'
          timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-rooms
- scrollUntilVisible:
    element:
      id: 'setup-rooms-lock'
    timeout: 10000
- tapOn:
    id: 'setup-rooms-lock'
- extendedWaitUntil:
    visible:
      id: 'must-dos-add'
    timeout: 30000
- tapOn:
    id: 'must-dos-add'
- extendedWaitUntil:
    visible:
      id: 'add-must-do-field'
    timeout: 10000
- tapOn:
    id: 'add-must-do-field'
- inputText: 'Mi Quang for breakfast'
# Kept as typed, once the place search has answered (places, or none) and the row stops moving.
- extendedWaitUntil:
    visible:
      id: 'add-must-do-place-.*|add-must-do-none'
    timeout: 20000
    optional: true
- tapOn:
    id: 'add-must-do-keep'
- extendedWaitUntil:
    visible:
      text: '(?i)mi quang for breakfast.*'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'must-dos-draft'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-must-dos
- tapOn:
    id: 'must-dos-draft'
- extendedWaitUntil:
    visible:
      id: 'drafting-screen'
    timeout: 30000
# The draft job (outline, every day, checks) takes a few minutes on staging.
- extendedWaitUntil:
    visible:
      id: 'draft-review'
    timeout: 600000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-draft-review
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
- tapOn:
    id: 'draft-propose'
# Nobody to pitch it to: lock it in alone.
- extendedWaitUntil:
    visible:
      id: 'build-lock-alone'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-lock-alone
- tapOn:
    id: 'build-lock-alone'
- extendedWaitUntil:
    notVisible:
      id: 'build-lock-alone'
    timeout: 60000
