appId: app.critterpass.dev
---
# A trip confirmed on its first day turns "in trip" on the worker's ten-minute sweep, from noon in
# Vietnam, and Home then shows it as on without a relaunch. Wait for that here, so the steps after
# see the trip under way. The visit history offer rises only on the trip's own screen (see
# answer-visit-offer.yaml), never over Home.
- runFlow:
    when:
      true: ${new Date(Date.now() + 7 * 3600000).getUTCHours() >= 12}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'home-in-trip'
          timeout: 900000
- assertVisible:
    id: 'home-next-up|home-in-trip'
