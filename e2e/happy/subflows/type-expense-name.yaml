appId: app.critterpass.dev
---
# On Add an expense: types ${NAME} into "What was it?" and puts the keyboard away. ${SHOT}, when set,
# names a screenshot with the name typed and the keyboard up.
- tapOn:
    id: 'money-add-description'
- inputText: ${NAME}
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof SHOT !== 'undefined' && SHOT !== ''}
    commands:
      - takeScreenshot: ${SHOT}
- hideKeyboard
- waitForAnimationToEnd
