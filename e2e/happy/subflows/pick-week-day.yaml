appId: app.critterpass.dev
---
# Taps the day ${PICK_DATE} (YYYY-MM-DD) in the open "Pick your days" sheet.
#
# The sheet opens on the month of the suggested week, which can be another month than the day's.
# Its month arrows (`picker-next`, `picker-previous`) step to the day's month, and the cell is
# tapped by its id (`picker-day-<date>`, which only the sheet's cells carry), never by position.
- evalScript: ${output.pickWeekCell = 'picker-day-' + PICK_DATE}
- extendedWaitUntil:
    visible:
      id: 'picker-day-.*'
    timeout: 10000
# A day picked is never before today: forward first, then back in case the sheet opened later.
- repeat:
    while:
      notVisible:
        id: ${output.pickWeekCell}
    times: 12
    commands:
      - tapOn:
          id: 'picker-next'
          optional: true
      - waitForAnimationToEnd
- repeat:
    while:
      notVisible:
        id: ${output.pickWeekCell}
    times: 12
    commands:
      - tapOn:
          id: 'picker-previous'
          optional: true
      - waitForAnimationToEnd
- tapOn:
    id: ${output.pickWeekCell}
