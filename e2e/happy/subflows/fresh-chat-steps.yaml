appId: app.critterpass.dev
---
# A crew of one's chat as its first cards arrive: a pitch (Lisbon) and an expense post their cards
# into the chat, a text goes out, and a voice note is recorded, sent and played back. ${LANG} is
# the app's language (en or vi), naming the screenshots.
- runFlow:
    file: ../../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
      LANG: ${LANG}
- runFlow:
    file: pitch-place.yaml
    env:
      QUERY: 'lisbon'
- runFlow:
    file: ../../_shared/to-home.yaml
- runFlow:
    file: open-wallet.yaml
    env:
      HALF: money
- runFlow:
    when:
      visible:
        id: 'money-empty-add'
    commands:
      - tapOn:
          id: 'money-empty-add'
- runFlow:
    when:
      notVisible:
        id: 'money-keypad'
    commands:
      - runFlow:
          file: ../../_shared/tap.yaml
          env:
            ID: 'money-add'
            LABEL: 'Add an expense|Thêm khoản chi'
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: 'money-key-1'
      - tapOn:
          id: 'money-key-2'
      - tapOn:
          id: 'money-key-5'
      - tapOn:
          id: 'money-add-submit'
      - extendedWaitUntil:
          visible:
            id: 'money-latest'
          timeout: 15000
- runFlow:
    file: ../../_shared/to-home.yaml
- extendedWaitUntil:
    visible:
      id: 'home-chat'
    timeout: 15000
- tapOn:
    id: 'home-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 15000
# The expense and the pitch's poll arrive as cards.
- extendedWaitUntil:
    visible:
      id: 'chat-expense-view-.*'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'poll-option-0'
    timeout: 30000
- assertNotVisible:
    id: 'chat-unknown-.*'
- tapOn:
    id: 'chat-input'
- inputText: 'see you friday'
- tapOn:
    id: 'chat-send'
- extendedWaitUntil:
    visible:
      text: '.*see you.friday.*'
    timeout: 10000
- hideKeyboard
- takeScreenshot: premium-5.01-fresh-crew-${LANG}
# A voice note: the mic records (the permission asked once), the recorder's send posts it.
- tapOn:
    id: 'chat-mic'
- runFlow:
    when:
      visible: 'Allow|OK|While using the.app|Only this.time'
    commands:
      - tapOn: 'Allow|OK|While using the.app|Only this.time'
- extendedWaitUntil:
    visible:
      id: 'chat-recorder'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'chat-recorder-send'
- extendedWaitUntil:
    visible:
      id: 'chat-voice-play-.*'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'chat-recorder'
    timeout: 10000
- tapOn:
    id: 'chat-voice-play-.*'
    index: 0
- extendedWaitUntil:
    visible: 'Pause voice.note|Dừng tin nhắn.thoại'
    timeout: 15000
- takeScreenshot: premium-5.01-fresh-crew-voice-playing-${LANG}
