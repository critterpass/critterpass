appId: app.critterpass.dev
---
# Two new accounts on one phone, up to a sent proposal: the organiser starts as `draft_ready` (a
# crew of one whose Đà Nẵng trip has its plan waiting in draft review) and keeps the crew's code; a
# second new account joins with it; the organiser opens the draft from Home, builds the proposal
# and sends it. Ends on "It's on its way" as the organiser (account 0); the friend is account 1.
- runFlow:
    file: ../../_shared/start-as.yaml
    env:
      SCENARIO: draft_ready

# The friend: a second new account on this phone joins the crew with its code.
- runFlow:
    file: switch-account.yaml
    env:
      TARGET: 'dev-accounts-new'
- runFlow: onboard.yaml
# Onboarding may finish on another tab; Home has JOIN WITH A CODE.
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-join-code'
    timeout: 30000
- tapOn:
    id: 'home-join-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 15000
- runFlow:
    file: type-crew-code.yaml
    env:
      CODE: ${output.crewCode}
# Once the code is found the keyboard makes way: the crew card shows whole, with JOIN under it.
- extendedWaitUntil:
    visible:
      text: '(?i)found it.*'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'invite-code-join'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-2.15-code-found-light
- tapOn:
    id: 'invite-code-join'
- extendedWaitUntil:
    notVisible:
      id: 'invite-code-screen'
    timeout: 30000

# The organiser again (kept first).
- runFlow:
    file: switch-account.yaml
    env:
      TARGET: 'dev-accounts-switch-0'
# With someone to send it to, the trip's step on Home is "send the plan": its button opens the
# draft.
- runFlow:
    file: hub-turn.yaml
    env:
      BUTTON: 'Send the plan'
- extendedWaitUntil:
    visible:
      id: 'draft-review|draft-propose'
    timeout: 30000

# BUILD THE PROPOSAL, then SEND to the one friend.
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
- tapOn:
    id: 'draft-propose'
- extendedWaitUntil:
    visible:
      id: 'proposal-build'
    timeout: 30000
- assertVisible:
    id: 'build-format-trailer'
- extendedWaitUntil:
    visible:
      id: 'build-send'
      enabled: true
    timeout: 60000
# PREVIEW AS <friend> shows once the guide has written their version.
- extendedWaitUntil:
    visible:
      id: 'build-preview-.*'
    timeout: 180000
- waitForAnimationToEnd
- takeScreenshot: premium-4.52-build-light
- tapOn:
    id: 'build-send'
- extendedWaitUntil:
    visible:
      id: 'proposal-sent'
    timeout: 60000
# The guide writes the friend's version on staging's AI.
- extendedWaitUntil:
    visible:
      text: '(?i).*version.is.ready|.*wrote the.group.version.*'
    timeout: 300000
- takeScreenshot: premium-4.51-sent-light
