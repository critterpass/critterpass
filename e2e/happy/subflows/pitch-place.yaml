appId: app.critterpass.dev
---
# Pitches a place to the account's crew from search: ${QUERY} is typed, the first result opens its
# page, PITCH TO THE CREW streams the guide's pitch and ADD TO THE VOTE puts it on the board.
- openLink: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: ${QUERY}
- extendedWaitUntil:
    visible:
      id: 'place-result-.*'
    timeout: 15000
# The row, not the query: text matching would also find what was typed.
- tapOn:
    id: 'place-result-.*'
    index: 0
# A place with a guide opens its Explore page (PITCH TO THE CREW is `explore-pitch`); any other
# place opens the guest guide's page (`guest-pitch`). Either button opens the pitch.
- scrollUntilVisible:
    element:
      id: 'explore-pitch|guest-pitch'
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'explore-pitch'
    commands:
      - tapOn:
          id: 'explore-pitch'
      # With more than one crew the page asks which one.
      - runFlow:
          when:
            visible:
              id: 'explore-crew-picker'
          commands:
            - tapOn:
                id: 'explore-crew-(?!picker).*'
                index: 0
- runFlow:
    when:
      visible:
        id: 'guest-pitch'
    commands:
      - tapOn:
          id: 'guest-pitch'
      - runFlow:
          when:
            visible:
              id: 'guest-crew-.*'
          commands:
            - tapOn:
                id: 'guest-crew-.*'
                index: 0
- extendedWaitUntil:
    visible:
      id: 'pitch-card'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'pitch-add'
      enabled: true
    timeout: 60000
- tapOn:
    id: 'pitch-add'
