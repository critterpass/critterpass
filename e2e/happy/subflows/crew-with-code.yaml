appId: app.critterpass.dev
---
# A new account (no demo world) starts a crew named ${CREW} and keeps its join code in
# ${output.crewCode}.
- runFlow: fresh-account.yaml
- openLink: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: ${CREW}
# START THE CREW rides on top of the keyboard.
- waitForAnimationToEnd
- takeScreenshot: crew-new-name-typed
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-code'
    timeout: 30000
# The code's tiles read out the code itself (the ticket around them reads "Copy the crew code").
- copyTextFrom:
    id: 'crew-on-code'
- evalScript: ${output.crewCode = maestro.copiedText.replace(/[^A-Z0-9]/g, '').slice(-6)}
- tapOn:
    id: 'start-crew-done'
