appId: app.critterpass.dev
---
# SLIDE TO BOARD on the boarding pass. The knob sits at the start of the track. Android finds it by
# id; iOS reads the track as one element, so the drag starts where the knob rests: low on the
# screen at the left, about 79% down on the gate's iPhone 17, a little higher or lower when the
# pass above it wraps differently. Each try runs only while the boarded egg hasn't shown.
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: 'board-knob'
          direction: RIGHT
          duration: 1200
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'board-egg'
          commands:
            - swipe:
                start: 15%, 79%
                end: 96%, 79%
                duration: 1200
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            notVisible:
              id: 'board-egg'
          commands:
            - swipe:
                start: 15%, 82%
                end: 96%, 82%
                duration: 1200
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            notVisible:
              id: 'board-egg'
          commands:
            - swipe:
                start: 15%, 76%
                end: 96%, 76%
                duration: 1200
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            notVisible:
              id: 'board-egg'
          commands:
            - swipe:
                start: 15%, 86%
                end: 96%, 86%
                duration: 1200
            - waitForAnimationToEnd:
                timeout: 3000
