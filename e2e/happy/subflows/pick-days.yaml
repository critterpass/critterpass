appId: app.critterpass.dev
---
# Picks ${PICK_DAYS} days from ${PICK_DATE} in the open "Pick your days" sheet: the first day, then
# the last, each by its id. Waits for the lock; the caller taps it.
- evalScript: ${output.pickLast = new Date(Date.parse(PICK_DATE + 'T12:00:00Z') + (Number(PICK_DAYS) - 1) * 86400000).toISOString().slice(0, 10)}
- extendedWaitUntil:
    visible:
      id: 'picker-day-.*'
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'picker-clear'
    commands:
      - tapOn:
          id: 'picker-clear'
- runFlow:
    file: pick-week-day.yaml
    env:
      PICK_DATE: ${PICK_DATE}
- runFlow:
    file: pick-week-day.yaml
    env:
      PICK_DATE: ${output.pickLast}
- extendedWaitUntil:
    visible:
      id: 'picker-lock'
    timeout: 10000
