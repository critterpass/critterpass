appId: app.critterpass.dev
---
# A friend on a new phone joins the crew whose code is in ${output.crewCode}: a second new account
# on this phone, from the splash. "Got a code?", the code (the keyboard makes way for the crew card
# and JOIN), then the three-tap pass. A code carries no name or home, so the sheet that asks for
# them opens by itself; picking a home puts the keyboard away and brings the button back in reach.
# ISSUE MY PASS, "Not now" on the save sheet, and the crew manifest with the newcomer on it.
# ${PREFIX} is the language (en or vi) and names the screenshots.
# The language is this phone's and outlives the account switch: set it first, from the
# organiser's own settings.
- runFlow:
    when:
      true: ${PREFIX != 'en'}
    commands:
      - runFlow:
          file: ../../_shared/switch-language.yaml
          env:
            LANG: ${PREFIX}
- runFlow:
    file: switch-account.yaml
    env:
      TARGET: 'dev-accounts-new'
- extendedWaitUntil:
    visible:
      id: 'onboarding-invite-code'
    timeout: 60000
- tapOn:
    id: 'onboarding-invite-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 15000
- tapOn:
    id: 'invite-code-boxes'
- inputText: ${output.crewCode}
- extendedWaitUntil:
    visible:
      id: 'invite-code-join'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: premium-2.15-code-found-${PREFIX}
- tapOn:
    id: 'invite-code-join'

# The pass page asks for the name and the home by itself.
- extendedWaitUntil:
    visible:
      id: 'invite-edit-name'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-2.14-ask-name-${PREFIX}
- tapOn:
    id: 'invite-edit-name'
- inputText: 'Mai'
- tapOn:
    id: 'invite-edit-home'
- inputText: 'Sing'
- extendedWaitUntil:
    visible:
      id: 'invite-edit-home-SIN'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: premium-2.14-ask-home-keyboard-${PREFIX}
- tapOn:
    id: 'invite-edit-home-SIN'
- extendedWaitUntil:
    visible:
      id: 'invite-edit-home-picked'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: premium-2.14-home-picked-${PREFIX}
- tapOn:
    id: 'invite-edit-done'
- extendedWaitUntil:
    visible:
      id: 'invite-pass-issue'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: premium-2.14-pass-code-joiner-${PREFIX}
- tapOn:
    id: 'invite-pass-issue'
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 20000
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'invite-manifest-screen|invite-manifest'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: premium-2.19-manifest-code-joiner-${PREFIX}
