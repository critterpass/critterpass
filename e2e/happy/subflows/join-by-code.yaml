appId: app.critterpass.dev
---
# A friend on a new phone joins the crew whose code is in ${output.crewCode}: a second new account
# on this phone, from the splash. "Got a code?", the code, JOIN where it comes up on top of the
# keyboard, then the three-tap pass. A code carries no name or home, so the sheet that asks for
# them opens by itself; picking a home puts the keyboard away and brings the button back in reach.
# ISSUE MY PASS, "Not now" on the save sheet, and the crew manifest with the newcomer on it.
# ${PREFIX} is the language (en or vi) and names the screenshots.
- runFlow:
    file: ../../proposal/subflows/switch-account.yaml
    env:
      TARGET: 'dev-accounts-new'
# The dev gallery switches the running app's language (not persisted); two steps back to the splash.
- runFlow:
    when:
      true: ${PREFIX != 'en'}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'dev-tools-entry'
          timeout: 60000
      - tapOn:
          id: 'dev-tools-entry'
      - extendedWaitUntil:
          visible:
            id: 'dev-nav-gallery'
          timeout: 10000
      - tapOn:
          id: 'dev-nav-gallery'
      - extendedWaitUntil:
          visible:
            id: 'gallery-locale-${PREFIX}'
          timeout: 15000
      - tapOn:
          id: 'gallery-locale-${PREFIX}'
      - runFlow: ../../onboarding/subflows/back.yaml
      - waitForAnimationToEnd
      - runFlow: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'onboarding-invite-code'
    timeout: 60000
- tapOn:
    id: 'onboarding-invite-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 15000
- tapOn:
    id: 'invite-code-boxes'
- inputText: ${output.crewCode}
- extendedWaitUntil:
    visible:
      id: 'invite-code-join'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-11-code-found-first-run
- tapOn:
    id: 'invite-code-join'

# The pass page asks for the name and the home by itself.
- extendedWaitUntil:
    visible:
      id: 'invite-edit-name'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-12-ask-name
- tapOn:
    id: 'invite-edit-name'
- inputText: 'Mai'
- tapOn:
    id: 'invite-edit-home'
- inputText: 'Sing'
- extendedWaitUntil:
    visible:
      id: 'invite-edit-home-SIN'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-12-ask-home-keyboard
- tapOn:
    id: 'invite-edit-home-SIN'
- extendedWaitUntil:
    visible:
      id: 'invite-edit-home-picked'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-12-home-picked
- tapOn:
    id: 'invite-edit-done'
- extendedWaitUntil:
    visible:
      id: 'invite-pass-issue'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-12-pass-code-joiner
- tapOn:
    id: 'invite-pass-issue'
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 20000
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'invite-manifest-newcomer'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-13-manifest-code-joiner
