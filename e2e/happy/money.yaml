appId: app.critterpass.dev
---
# Release gate: crew money. A new account starts with the staging demo crew (a Bali trip with four
# crewmates, no expenses yet), adds Rp 450.000 it paid, split evenly, on the keypad: the expense
# lands in Latest and the Settle button counts the taps to square up. Settle up lists who pays
# whom; the account asks one crewmate for their share and confirms it arrived, and that payment is
# settled.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: caught_up
- runFlow:
    file: subflows/open-wallet.yaml
    env:
      HALF: money
# With nothing spent yet the empty state offers the add; otherwise the header's +.
- runFlow:
    when:
      visible:
        id: 'money-empty-add'
    commands:
      - tapOn:
          id: 'money-empty-add'
- runFlow:
    when:
      notVisible:
        id: 'money-keypad'
    commands:
      - runFlow:
          file: ../_shared/tap.yaml
          env:
            ID: 'money-add'
            LABEL: 'Add an expense'
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
- tapOn:
    id: 'money-key-4'
- tapOn:
    id: 'money-key-5'
- tapOn:
    id: 'money-key-0'
- tapOn:
    id: 'money-key-000'
- tapOn:
    id: 'money-add-mode-equal'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: '(?i).*settle in [0-9]+.taps?.*'
    timeout: 30000
- tapOn:
    id: 'money-settle'
- extendedWaitUntil:
    visible:
      id: 'money-settle-row-.*'
    timeout: 15000
- tapOn:
    id: 'money-settle-row-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'money-pay-request'
    timeout: 15000
- takeScreenshot: premium-7.26-payment-request-light
- tapOn:
    id: 'money-pay-request'
- extendedWaitUntil:
    notVisible:
      id: 'money-pay-request'
    timeout: 20000
# The crewmate marks it paid once asked; their payment comes back for this account to confirm.
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'money-settle-row-.*'
- extendedWaitUntil:
    visible:
      text: '(?i).*requested.*'
    timeout: 20000
- tapOn:
    id: 'money-settle-row-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'money-pay-confirm'
    timeout: 30000
- tapOn:
    id: 'money-pay-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'money-pay-confirm'
    timeout: 20000
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'money-settle-row-.*|money-settle-reward|money-settle-square'
- extendedWaitUntil:
    visible:
      text: '.*Paid ✓.*|.*Everyone is.square.*'
    timeout: 20000
