appId: app.critterpass.dev
---
# Release gate: the trip day. A fresh account takes the staging demo crew (a confirmed Bali trip
# three weeks out). The TRIPS tab opens the trip's hub, counting down to wheels up; the first
# day's card opens the day-of screen, where the account adds "Sunscreen" to its pack list and
# ticks it, both through the api. A relaunch comes back on that day-of screen with the tick still
# there. On Android the phone then loses its signal: the hub turns to the offline card with
# nothing left to send (the pack list reached the server), and comes back when the signal does.
- runFlow:
    file: subflows/fresh-account.yaml
    env:
      SEED: dev-seed-demo-caught-up
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-header-pre'
    timeout: 30000
- assertVisible:
    id: 'trip-hub-countdown'
- assertVisible:
    id: 'trip-hub-tile-plan'
- tapOn:
    id: 'trip-hub-next'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'trip-day-pack-add'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'trip-day-pack-add'
- inputText: 'Sunscreen'
- pressKey: Enter
# Android shows the chip's text; iOS reads the chip whole, by its label.
- extendedWaitUntil:
    visible:
      text: 'SUNSCREEN|Sunscreen, just you'
    timeout: 10000
- tapOn:
    text: 'SUNSCREEN|Sunscreen, just you'
- runFlow: subflows/sunscreen-packed.yaml
# Give the upload queue a moment, then relaunch: the ticked row comes back from the database.
- waitForAnimationToEnd:
    timeout: 5000
# A cold start comes back on the screen the app was left on: the day-of screen, with no tap.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: 'SUNSCREEN|Sunscreen, just you'
    direction: DOWN
    timeout: 20000
- runFlow: subflows/sunscreen-packed.yaml
# Runner: /network turns Wi-Fi and data off, then on (Android only).
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - extendedWaitUntil:
          visible:
            id: 'trip-hub'
          timeout: 15000
      - evalScript: "${http.post('http://127.0.0.1:7788/network?state=off', { body: '' }).status}"
      # Weeks before the trip the hub stays as it is and says there is no signal; the pill opens
      # the offline page.
      - extendedWaitUntil:
          visible:
            id: 'trip-hub-offline-pill'
          timeout: 30000
      - assertVisible:
          id: 'trip-hub-header-pre'
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: en-3k-1-no-signal
      - tapOn:
          id: 'trip-hub-offline-pill'
      - extendedWaitUntil:
          visible:
            id: 'trip-offline-page'
          timeout: 15000
      - assertVisible:
          id: 'trip-offline-still-works'
      - assertNotVisible:
          id: 'trip-offline-sends'
      - runFlow: ../onboarding/subflows/back.yaml
      - extendedWaitUntil:
          visible:
            id: 'trip-hub'
          timeout: 15000
      - evalScript: "${http.post('http://127.0.0.1:7788/network?state=on', { body: '' }).status}"
      - extendedWaitUntil:
          notVisible:
            id: 'trip-hub-offline-pill'
          timeout: 60000
