appId: app.critterpass.dev
---
# Release gate: an activity's partner link. A new account starts on a Đà Nẵng trip that is on today,
# finds a museum from the plan map, opens its tickets and tours from the place page (Viator's in-app
# booking is switched off, so each card is a plain partner link) and taps Open Klook. The app records the click with the api first, then
# opens the attribution bridge on the staging go host (`/out/{sub_id}`), which redirects to Klook
# only once it knows the click: landing on Klook's page (or the partner redirect on the way there)
# is the outcome.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: trip_today
- runFlow: subflows/dismiss-visit-offer.yaml
# Find from the plan map: a museum's page offers its tickets and tours.
- runFlow: subflows/open-plan.yaml
- tapOn:
    id: 'plan-map-search'
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
- tapOn:
    id: 'search-field'
- inputText: 'museum'
- extendedWaitUntil:
    visible:
      id: 'search-row-[0-9]+'
    timeout: 60000
- hideKeyboard
- tapOn:
    id: 'search-row-[0-9]+'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'place-detail'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'explore-offers-open'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'explore-offers-open'
- extendedWaitUntil:
    visible:
      id: 'supplier-offer-klook'
    timeout: 30000
- assertVisible:
    id: 'supplier-disclosure'
- tapOn:
    id: 'supplier-open-klook'
# The browser takes over once the click is on the server.
- extendedWaitUntil:
    notVisible:
      id: 'supplier-offers'
    timeout: 30000
# A fresh emulator's Chrome asks its first-run questions before loading the page.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '(?i)(accept & continue|use without an account|continue without an account)'
          optional: true
      - tapOn:
          text: '(?i)(no thanks|no, thanks)'
          optional: true
# The outcome is the hand-off, not Klook's page: what Klook serves (a bot check on CI) and Safari's
# first-run tips, which hide the rest of its hierarchy, address bar included, are not the app's.
# iOS: Safari is in front with its way back to the app. Android: Chrome's address bar shows the
# partner redirect or Klook, which the go host only redirects to once it knows the click.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'breadcrumb'
            text: '(?i)return to critterpass.*'
          timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: '(?i).*(klook|tp\.media).*'
          timeout: 60000
