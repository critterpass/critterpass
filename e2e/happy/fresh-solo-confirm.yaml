appId: app.critterpass.dev
---
# Release gate: a crew of one confirms its trip, no demo world. A new account starts as
# `crew_with_code` (a crew of one), pitches one place and locks it in, sets the trip up, and the
# guide drafts it. With nobody to send it to, BUILD THE PROPOSAL offers LOCK IT IN (or INVITE
# FRIENDS FIRST); locking confirms the trip, and Home shows it counting down.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: subflows/pitch-place.yaml
    env:
      QUERY: 'lisbon'
- openLink: critterpass-dev://
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- runFlow: subflows/open-setup-when.yaml
- runFlow: subflows/setup-to-draft-week-out.yaml
# The draft job (outline, every day, checks) takes a few minutes on staging.
- extendedWaitUntil:
    visible:
      id: 'draft-review'
    timeout: 600000
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
- tapOn:
    id: 'draft-propose'
# Nobody to pitch it to: lock it in, or invite friends first.
- extendedWaitUntil:
    visible:
      id: 'build-lock-alone'
    timeout: 30000
- assertVisible:
    id: 'build-invite'
- waitForAnimationToEnd
- takeScreenshot: en-3f-1-alone
- tapOn:
    id: 'build-lock-alone'
# The trip is confirmed: Home shows it as the next trip, counting down.
- extendedWaitUntil:
    visible:
      id: 'home-countdown'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: en-3b-2-home-confirmed
