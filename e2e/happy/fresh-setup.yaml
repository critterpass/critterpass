appId: app.critterpass.dev
---
# Release gate: trip setup for a brand-new crew, with no demo world. A new account starts as
# `crew_with_code` (a crew of just itself), pitches one place and locks it in: the place wins and
# SET UP opens the dates step. The account marks a week of next month free by hand and saves
# (set_availability): the step shows those days counted and a way on, the crew's window to lock or a
# week to pick, and locking it moves setup to the budget.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: subflows/pitch-place.yaml
    env:
      QUERY: 'lisbon'
# One place on the board: the organiser locks it in, and it wins. Home from a cold start through a
# screen link (TRIPS, then the HOME tab): a link opened over the place page would put Home on top
# of it with a back into it, and a bare app link restores the place page.
- stopApp
- openLink: critterpass-dev://trips
- extendedWaitUntil:
    visible:
      id: 'tab-home|home-screen|trip-list-row-.*|trip-list-empty|trip-hub'
    timeout: 30000
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: home
      LABEL: Home
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- runFlow: subflows/open-setup-when.yaml
# Days by hand, whatever this phone's calendar already shared on the way in. The step re-lays
# itself as the shared days sync, which can scroll the row away under a tap: try again then.
- retry:
    maxRetries: 3
    commands:
      - scrollUntilVisible:
          element:
            id: 'own-calendar-action'
          timeout: 10000
      # The calendar row is the step's last: at the end of the scroll it stands clear of the
      # footer. Higher up, the footer's button is drawn over it and takes the tap (LOCK).
      - swipe:
          start: 50%, 55%
          end: 50%, 25%
      - swipe:
          start: 50%, 55%
          end: 50%, 25%
      - waitForAnimationToEnd
      - tapOn:
          id: 'own-calendar-action'
      - extendedWaitUntil:
          visible:
            id: 'calendar-by-hand'
          timeout: 10000
- tapOn:
    id: 'calendar-by-hand'
- runFlow: subflows/mark-week-by-hand.yaml
# The saved days reach the crew's counts, and the organiser has a way on.
- extendedWaitUntil:
    visible:
      id: 'when-cta|when-pick-week'
    timeout: 60000
- assertNotVisible:
    text: '(?i)nobody has shared their days.yet.*'
- runFlow: subflows/lock-dates.yaml
- extendedWaitUntil:
    visible:
      id: 'budget-lock'
    timeout: 30000
