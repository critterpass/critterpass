appId: app.critterpass.dev
---
# Release gate, in Vietnamese: the friend of e2e/happy/fresh-join-code.yaml reads the app in
# Vietnamese from the splash on: "Got a code?", the crew found and joined, the pass page asking
# for a name and a home, the pass issued and the crew manifest.
# The organiser starts as `crew_with_code`: only the friend's way in is this flow's journey.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: subflows/join-by-code.yaml
    env:
      PREFIX: vi
