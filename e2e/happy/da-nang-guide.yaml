appId: app.critterpass.dev
---
# Release gate: a brand-new user's crew picks Đà Nẵng and meets its own guide, Chà Vá, not the
# guest Tokek. With no demo seed, a fresh account starts a crew, pitches Đà Nẵng (Chà Vá pitches
# it) and Lisbon from Home, votes for Đà Nẵng, takes the top two to the final (which closes at once:
# the crew's only ballot is already on a finalist), sets the trip up from the reveal, and opens the
# guide sheet: its header is Chà Vá.
#
# Data: staging with the Vietnam set linked to Chà Vá and the Đà Nẵng destination.
- runFlow: subflows/fresh-account.yaml
- runFlow:
    file: ../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Company trip'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
# Đà Nẵng first: its live guide writes the pitch.
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- assertVisible: '(?i).*chà vá.*'
- waitForAnimationToEnd
- takeScreenshot: happy-da-nang-pitch
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
# A second place, so the vote has a final.
- scrollUntilVisible:
    element:
      id: 'board-pitch'
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 10000
- tapOn:
    id: 'pitch-search'
- inputText: 'lisbon'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- tapOn:
    id: 'pitch-add'
- runFlow:
    when:
      notVisible:
        id: 'destination-board'
    file: ../onboarding/subflows/back.yaml
# The crew's only member votes Đà Nẵng on the board. Going to the final with every ballot already
# on a finalist closes the vote at once: the winner is revealed without a showdown.
- scrollUntilVisible:
    element:
      text: '(?i)đà nẵng, 0 votes'
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn: '(?i)đà nẵng, 0 votes'
- extendedWaitUntil:
    visible:
      text: '(?i)đà nẵng, 1 votes, your vote'
    timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'pitch-search'
          file: ../onboarding/subflows/back.yaml
      - scrollUntilVisible:
          element:
            id: 'board-go-to-final'
          timeout: 20000
          centerElement: true
      - waitForAnimationToEnd
      - tapOn:
          id: 'board-go-to-final'
      - extendedWaitUntil:
          visible:
            id: 'winner-reveal'
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 15000
- assertVisible: '(?i).*đà nẵng.*'
- takeScreenshot: happy-da-nang-reveal
- tapOn:
    id: 'reveal-set-up'
# Trip setup opens; back out to the tab bar, where the guide button lives.
- runFlow:
    when:
      notVisible:
        id: 'guide-fab'
    file: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'guide-fab'
    timeout: 30000
- tapOn:
    id: 'guide-fab'
- extendedWaitUntil:
    visible:
      id: 'guide-composer'
    timeout: 15000
- assertVisible: '(?i)chà vá'
- waitForAnimationToEnd
- takeScreenshot: happy-da-nang-guide
