appId: app.critterpass.dev
---
# Release gate: adding a booking by pasting its confirmation. A new account starts with the staging
# demo crew's Bali trip; the pasted flight confirmation goes to the api, the guide reads it into a
# candidate, ADD files it, the wallet stack shows the flight card, and its details show the
# reference. A pasted confirmation carries no boarding pass barcode (the pass comes from scanning it
# at check-in), so the card offers no pass.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: caught_up
# The Wallet tab opens on Money; Bookings opens by its link.
- openLink: critterpass-dev://wallet/bookings/add
- extendedWaitUntil:
    visible:
      id: 'bookings-add'
    timeout: 20000
# The add page's Paste row opens the paste sheet.
- tapOn:
    id: 'bookings-add-paste'
- extendedWaitUntil:
    visible:
      id: 'bookings-paste-field'
    timeout: 10000
- evalScript: ${output.day = new Date(Date.now() + 21 * 86400000).toISOString().slice(0, 10)}
- evalScript: ${output.paste = 'Singapore Airlines booking confirmed. Booking reference K7Q2PX. Passenger WINSTON. Flight SQ 938 from Singapore (SIN) to Denpasar Bali (DPS) on ' + output.day + ', departs 09:10, arrives 11:55.'}
# Android: the runner turns the soft keyboard off, so typed keys go straight into the field and no
# keyboard panel is left over the sheet's Read it; it comes back after the send.
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: "${http.post('http://127.0.0.1:7788/keyboard?state=off', { body: '{}' }).status}"
- tapOn:
    id: 'bookings-paste-field'
# Runner: types the confirmation on Android in short chunks with a pause after each (Maestro's
# inputText waits after every key, and one long `input text` outruns the field until Android drops
# the queued keys); iOS types it with inputText.
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: "${http.post('http://127.0.0.1:7788/type', { body: output.paste }).status}"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${output.paste}
# The runner answers at once and types in the background: wait for the end of the confirmation.
- extendedWaitUntil:
    visible:
      text: '.*arrives 11:55.*'
    timeout: 300000
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- tapOn:
    id: 'bookings-paste-send'
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: "${http.post('http://127.0.0.1:7788/keyboard?state=on', { body: '{}' }).status}"
# The api queues the read; the candidate shows once the guide has read the confirmation.
- extendedWaitUntil:
    visible:
      id: 'bookings-candidate-.*-add'
    timeout: 180000
- assertVisible: '.*SQ ?938.*'
- tapOn:
    id: 'bookings-candidate-.*-add'
- openLink: critterpass-dev://wallet/bookings
- extendedWaitUntil:
    visible:
      id: 'bookings-next-up|bookings-wallet-stack|bookings-stack'
    timeout: 30000
- assertVisible: '.*SQ ?938.*'
# The open card is the flight card; with no pass scanned it offers none.
- extendedWaitUntil:
    visible:
      id: 'bookings-next-up'
    timeout: 15000
- assertNotVisible:
    id: 'bookings-next-up-pass'
- tapOn:
    id: 'bookings-open-details'
- extendedWaitUntil:
    visible:
      id: 'bookings-detail'
    timeout: 15000
# The flight's details have no reference row; the reference the guide read is in its edit form.
- runFlow:
    when:
      notVisible: '.*K7Q2PX.*'
    commands:
      - scrollUntilVisible:
          element:
            id: 'bookings-edit'
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: 'bookings-edit'
      - scrollUntilVisible:
          element:
            id: 'bookings-form-ref'
          direction: DOWN
          timeout: 15000
      - assertVisible:
          id: 'bookings-form-ref'
          text: '.*K7Q2PX.*'
      - runFlow: ../_shared/back.yaml
      - extendedWaitUntil:
          visible:
            id: 'bookings-detail'
          timeout: 15000
# The details sit in the Wallet tab: their last rows (EDIT, DELETE) end above the tab bar and its
# guide button.
- scrollUntilVisible:
    element:
      id: 'bookings-delete'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: premium-7.10-detail-end-light
