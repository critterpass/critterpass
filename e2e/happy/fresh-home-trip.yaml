appId: app.critterpass.dev
---
# Release gate: a brand-new user's first trip, with no demo seed. A fresh account starts its own
# crew under a long name, pitches Da Nang from Home's Pitch a place, and so has one trip still
# voting with one place. Home shows the crew name as its title and the vote as the next thing; the
# TRIPS tab lists that trip and its hub says the trip is still voting, with every activity read as
# copy; back on Home the vote is still there. The same screens are captured again in Vietnamese.
- runFlow: subflows/fresh-account.yaml
- runFlow:
    file: ../_shared/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'The head still didnt look so goo'
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- assertVisible:
    id: 'home-crew-switcher'
- waitForAnimationToEnd
- takeScreenshot: premium-3.01-fresh-crew-no-trip-light
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-card'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'pitch-add'
      enabled: true
    timeout: 60000
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
- assertNotVisible:
    id: 'home-next-up'
- waitForAnimationToEnd
- takeScreenshot: premium-3.02-fresh-vote-light
- runFlow: subflows/open-trip-hub.yaml
# A trip still choosing its place: the hub's planning line says it is voting.
- scrollUntilVisible:
    element:
      id: 'trip-hub-planning'
    direction: DOWN
    timeout: 15000
- assertNotVisible: '.*ACTIVITY\..*'
- assertNotVisible: '.*_ADDED.*'
- waitForAnimationToEnd
- takeScreenshot: premium-6.01-fresh-voting-light
- runFlow:
    file: ../_shared/to-home.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 20000
# The same screens in Vietnamese.
- runFlow:
    file: ../_shared/switch-language.yaml
    env:
      LANG: vi
- runFlow:
    file: ../_shared/to-home.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-3.02-fresh-vote-vi
- runFlow: subflows/open-trip-hub.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-planning'
    direction: DOWN
    timeout: 15000
- assertVisible: '.*Đang bình.chọn.*'
- assertNotVisible: '.*ACTIVITY\..*'
- waitForAnimationToEnd
- takeScreenshot: premium-6.01-fresh-voting-vi
- runFlow:
    file: ../_shared/to-home.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 20000
