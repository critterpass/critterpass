appId: app.critterpass.dev
---
# Release gate: a Vietnamese crew's first trip, with no demo world. A fresh account whose home is
# Ho Chi Minh City starts a crew (which settles in VND), pitches Đà Nẵng and locks it in, and sets
# the trip up the way the first real crew did: starting tomorrow, three days long, picked by hand
# on the dates step. The budget step then prices and steps in đồng, LOOKS GOOD locks first time
# (no retry, no skip) and setup moves on to the rooms.
#
# Data: staging with the Đà Nẵng destination.
- runFlow:
    file: subflows/fresh-account.yaml
    env:
      HOME_IATA: SGN
      HOME_QUERY: 'Ho Chi'
- runFlow:
    file: ../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Da Nang crew'
# START THE CREW rides on top of the keyboard.
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'da nang'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
# One place on the board: the organiser locks it in, and it wins.
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- extendedWaitUntil:
    visible:
      id: 'setup-step-when'
    timeout: 20000
# Tomorrow in Vietnam, three days, picked in the day picker by each day's own id (the first and the
# last), so nothing depends on the screen's size. The picker opens on the month of its suggested
# week, which may be another month than tomorrow's: pick-days.yaml turns the sheet to each day. Every
# run first picks the 1st of next month (the lock names it), then comes back for tomorrow. The
# lock's label is checked before it is tapped, so a tap that landed on another day fails here
# instead of locking the wrong dates.
- evalScript: ${var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; var d = new Date(Date.now() + 31 * 3600000); var first = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + Number(d.getUTCDate() !== 1), 1)); output.pickDate = d.toISOString().slice(0, 10); output.lockLabel = '(?i)lock ' + months[d.getUTCMonth()] + ' ' + d.getUTCDate() + '\\D.*'; output.firstDate = first.toISOString().slice(0, 10); output.firstLabel = '(?i)lock ' + months[first.getUTCMonth()] + ' 1\\D.*'}
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
- runFlow:
    file: subflows/pick-days.yaml
    env:
      PICK_DATE: ${output.firstDate}
      PICK_DAYS: 3
- extendedWaitUntil:
    visible:
      id: 'picker-lock'
      text: ${output.firstLabel}
    timeout: 10000
- runFlow:
    file: subflows/pick-days.yaml
    env:
      PICK_DATE: ${output.pickDate}
      PICK_DAYS: 3
- assertVisible:
    id: 'picker-length'
    text: '3 days .*'
- assertVisible:
    id: 'picker-lock'
    text: ${output.lockLabel}
- waitForAnimationToEnd
- takeScreenshot: en-fresh-vnd-dates
- tapOn:
    id: 'picker-lock'
# The budget, in đồng: the knob shows once the step is known, and the split (or "No prices yet"
# when these dates have no fares) once the prices are read.
- extendedWaitUntil:
    visible:
      id: 'budget-track'
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: 'budget-bars|budget-bars-missing'
    timeout: 30000
- assertVisible:
    id: 'budget-track'
    text: '.*₫.*'
- waitForAnimationToEnd
- takeScreenshot: en-fresh-vnd-budget
# LOOKS GOOD, once: the rooms step is next, with no "didn't lock" line on the way.
- tapOn:
    id: 'budget-lock'
- extendedWaitUntil:
    visible:
      id: 'setup-rooms'
    timeout: 30000
- assertNotVisible:
    id: 'budget-lock-line'
- waitForAnimationToEnd
- takeScreenshot: en-fresh-vnd-rooms
