appId: app.critterpass.dev
---
# Release gate: the Critterdex for a brand-new traveller. A new account started as `crew_with_code`
# (a crew of one, no trip) opens the Critterdex from the PASS tab: the catalogue has synced from
# staging, nothing is found yet, Found says so, and a ranked place opens its set page with every
# critter still a silhouette; back from it, the dex is where it was left. A link to a critter that
# does not exist says so, with a way back. With a home set, Explore at home is turned on through
# the api and is still on after a relaunch.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: crew_with_code
- runFlow: subflows/open-critterdex.yaml
- assertNotVisible:
    id: 'critters-here-now'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: premium-8.01-dex-nothing-found-light
- tapOn:
    id: 'critters-dex-filter-found'
- extendedWaitUntil:
    visible:
      id: 'critters-dex-empty'
    timeout: 10000
- tapOn:
    id: 'critters-dex-filter-all'
- scrollUntilVisible:
    element:
      id: 'critters-set-1'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'critters-set-1'
- extendedWaitUntil:
    visible:
      id: 'critters-set'
    timeout: 10000
- assertVisible:
    id: 'critters-set-cell-.*'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: premium-8.03-set-nothing-found-light
- runFlow: ../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'critters-set-1'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: premium-8.01-dex-after-set-return-light
- openLink: critterpass-dev://critters/0192f000-0000-7000-8000-00000000dead
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'critters-detail-missing'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: premium-8.02-critter-missing-light
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'critters-dex|you-profile|home-screen'
- runFlow:
    when:
      notVisible:
        id: 'critters-dex|critters-dex-header'
    commands:
      - runFlow: subflows/open-critterdex.yaml
- scrollUntilVisible:
    element:
      id: 'critters-dex-header'
    direction: UP
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'critters-home-set'
    commands:
      - scrollUntilVisible:
          element:
            id: 'critters-explore-at-home'
          direction: DOWN
          timeout: 10000
      # The card's switch is the one checkable element labelled Explore at home.
      - tapOn:
          text: 'Explore.at.home'
          checked: false
      - extendedWaitUntil:
          visible:
            text: 'Explore.at.home'
            checked: true
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 5000
      - stopApp
      - launchApp
      # The relaunch can restore the dex: Home draws first, the restored dex a moment later.
      - extendedWaitUntil:
          visible:
            id: 'home-screen|critters-dex'
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: 'critters-dex'
          timeout: 10000
          optional: true
      - runFlow: subflows/open-critterdex.yaml
      - scrollUntilVisible:
          element:
            id: 'critters-explore-at-home'
          direction: DOWN
          timeout: 10000
      - extendedWaitUntil:
          visible:
            text: 'Explore.at.home'
            checked: true
          timeout: 20000
