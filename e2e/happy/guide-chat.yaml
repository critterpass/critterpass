appId: app.critterpass.dev
---
# Happy path: ask the guide a question on staging and get a streamed answer. The guide circle opens
# the guide's sheet over Home, the question goes to the turn route, and the answer types in. The
# "Who sees this" switch then shows Me (a thread of its own, without the group's question) and
# Group (the answer back).
#
# Data: a new account starts as the staging demo world (`everyday`), which gives it a confirmed Bali
# trip with Tokek as its guide. Needs the staging api's guide model key (the turn route is not
# mounted without one) and a free meter with answers left (a fresh account starts at 0 of 30).
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: subflows/open-guide.yaml
    env:
      GUIDE_LABEL: 'Ask .*'
- tapOn:
    id: 'guide-composer'
- inputText: 'What should we pack for rain in Ubud?'
# The composer's send carries no id: it is the button labelled Ask.
- tapOn: 'Ask'
- extendedWaitUntil:
    visible:
      id: 'guide-answer-(live|[0-9a-f-]{36})'
    timeout: 90000
- assertNotVisible:
    id: 'guide-error'
- takeScreenshot: premium-5.13-guide-answer-light
- runFlow:
    when:
      visible:
        id: 'guide-mode'
    commands:
      - tapOn:
          id: 'guide-mode-private'
      - waitForAnimationToEnd:
          timeout: 3000
      - assertNotVisible: '.*What should we pack for rain in.Ubud\?.*'
      - assertNotVisible:
          id: 'guide-answer-live'
      - takeScreenshot: premium-5.13-just-me-after-group-turn-light
      - tapOn:
          id: 'guide-mode-group'
      - extendedWaitUntil:
          visible:
            id: 'guide-answer-(live|[0-9a-f-]{36})'
          timeout: 20000
      - takeScreenshot: premium-5.13-group-after-just-me-light
