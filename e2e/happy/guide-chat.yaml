appId: app.critterpass.dev
---
# Happy path: ask the guide a question on staging and get a streamed answer. The guide button
# opens the sheet (3j-1) over Home, the question goes to the turn route, and the answer types in.
#
# Data: a fresh account onboards, then the staging demo seed gives it a confirmed Bali trip with
# Tokek as its guide. Needs the staging api's guide model key (the turn route is not mounted
# without one) and a free meter with answers left (a fresh account starts at 0 of 30).
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo
- tapOn:
    id: 'guide-fab'
# The sheet's root id isn't in iOS's accessibility tree; its composer is.
- extendedWaitUntil:
    visible:
      id: 'guide-composer'
    timeout: 15000
# iOS reads the field's label and its placeholder together (the same words twice).
- tapOn: 'Ask, or hold to talk.*'
- inputText: 'What should we pack for rain in Ubud?'
- tapOn: 'Send'
# The answer streams in: the live answer once its first words arrive, or its saved copy once it has
# synced. A short answer can finish streaming before the flow looks, so the live turn itself is not
# awaited; either element holds answer text.
- extendedWaitUntil:
    visible:
      id: 'guide-answer-(live|[0-9a-f-]{36})'
    timeout: 90000
- assertNotVisible:
    id: 'guide-error'
- takeScreenshot: happy-guide-chat
# With a crew on the trip the sheet has GROUP / JUST ME. Just me is its own thread: the group's
# question and its answer are not carried over, and they are back on Group.
- runFlow:
    when:
      visible:
        id: 'guide-modes'
    commands:
      - tapOn: 'Just me'
      - waitForAnimationToEnd:
          timeout: 3000
      - assertNotVisible: 'What should we pack for rain in Ubud\?'
      - assertNotVisible:
          id: 'guide-answer-live'
      - takeScreenshot: en-3j-1-just-me-after-group-turn
      - tapOn: 'Group'
      - extendedWaitUntil:
          visible: 'What should we pack for rain in Ubud\?'
          timeout: 20000
      - takeScreenshot: en-3j-1-group-after-just-me
