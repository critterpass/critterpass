appId: app.critterpass.dev
---
# Release gate: the crew's destination vote, from a pitch to the reveal. A new account starts with
# the staging demo world's `vote` scenario (Bali Demo Crew's open vote, organised by the account)
# and pitches Cusco from Home: the guide's pitch streams in and Cusco joins the vote, which the
# crew chat's vote card shows. Then a second account starts in the `vote_final` scenario (Kyoto and
# Lisbon 2–2 in the final): the trip's hub opens the showdown, the account's ballot is the last
# one, the vote closes and the winner is revealed with Set up for the organiser.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: vote
- scrollUntilVisible:
    element:
      id: 'home-pitch'
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 10000
- tapOn:
    id: 'pitch-search'
- inputText: 'cusco'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 15000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-card'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'pitch-add'
      enabled: true
    timeout: 60000
- tapOn:
    id: 'pitch-add'
- extendedWaitUntil:
    notVisible:
      id: 'pitch-add'
    timeout: 30000
# The vote's card in the crew chat lists Cusco.
- runFlow:
    file: ../_shared/to-home.yaml
- tapOn:
    id: 'home-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '(?i).*cusco.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: premium-5.01-vote-cusco-pitched-light

# The final: the last ballot closes it and the winner is revealed.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: vote_final
- runFlow: subflows/open-showdown.yaml
# Each half reads as "Kyoto, 2 votes" on iOS and shows KYOTO on Android.
- assertVisible: '(?i).*kyoto.*'
- assertVisible: '(?i).*lisbon.*'
- waitForAnimationToEnd
- takeScreenshot: premium-4.05-vote-showdown-light
- tapOn:
    id: 'showdown-vote-0'
- extendedWaitUntil:
    visible:
      id: 'reveal'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'reveal-stamp'
    timeout: 15000
- assertVisible:
    id: 'reveal-tally'
- assertVisible:
    id: 'reveal-set-up'
- takeScreenshot: premium-4.06-vote-reveal-light
