appId: app.critterpass.dev
---
# Release gate: a fresh install makes a new account on staging. Name, guide avatar, six
# this-or-thats and a home airport go to the api; the pass is issued with its stamp; Home opens
# with no crew yet; and the session survives a relaunch (the app does not start over).
- runFlow: subflows/fresh-install.yaml
- runFlow: subflows/through-name.yaml
- tapOn:
    id: 'avatar-ajo'
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'quiz-card-left'
    timeout: 10000
- repeat:
    while:
      notVisible:
        id: 'taste-done'
    times: 9
    commands:
      - tapOn:
          id: 'quiz-card-right'
      - waitForAnimationToEnd
- tapOn:
    id: 'taste-done'
- runFlow:
    when:
      visible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-row-SGN'
- runFlow:
    when:
      notVisible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-search'
      - inputText: 'Sing'
      - extendedWaitUntil:
          visible:
            id: 'home-row-SIN'
          # The airport search answers from the api; a simulator on a busy runner can take a while.
          timeout: 30000
      - tapOn:
          id: 'home-row-SIN'
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- tapOn:
    id: 'onboarding-home-next'
# The pass is issued: the stamp lands on it with the name given above.
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'issued-stamp'
    timeout: 10000
- assertVisible: '.*WINSTON.*'
- tapOn:
    id: 'onboarding-issued-save'
# The save sheet (a form sheet on both platforms): not now, then the permission asks, later.
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'save-not-now'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'onboarding-issued-next'
    commands:
      - tapOn:
          id: 'onboarding-issued-next'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer'
    timeout: 10000
- repeat:
    while:
      visible:
        id: 'primer-later'
    times: 4
    commands:
      - tapOn:
          id: 'primer-later'
      - waitForAnimationToEnd
# Home, with no crew yet: start one or join with a code.
- extendedWaitUntil:
    visible:
      id: 'home-first-run'
    timeout: 30000
- assertVisible:
    id: 'home-join-code'
# The account is kept: a relaunch opens Home again, not the splash.
- stopApp
- launchApp
# A slow iOS simulator can still be bringing the process up when launchApp returns, and Maestro
# takes an app it cannot read yet for a crash. The wait for the first screen is looked at again
# rather than the app launched again: an app that really died stays down and still fails here.
- retry:
    maxRetries: 2
    commands:
      - extendedWaitUntil:
          visible:
            id: 'home-first-run'
          timeout: 30000
- assertNotVisible:
    id: 'onboarding-open'
