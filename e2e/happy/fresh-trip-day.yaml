appId: app.critterpass.dev
---
# Release gate: a traveller's trip day, started as `solo_today` (a crew of one on a trip to Đà Nẵng
# that started today, nothing booked yet). The TRIPS tab opens the hub on day 1 of 3 with the next
# thing and the tiles; the next thing opens the day-of screen with the day's timeline, where the
# traveller says I'M UP when there is an early start, adds "Sunscreen" to the pack list and ticks
# it. The screen is still there after the app goes to the background and comes back, the tick
# survives a relaunch, and the hub's morning briefing settles (ready, or nothing today) instead of
# staying on "writing".
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: solo_today
- runFlow: subflows/wait-for-trip-start.yaml
- runFlow: subflows/open-trip-hub.yaml
- runFlow: subflows/answer-visit-offer.yaml
- waitForAnimationToEnd
- takeScreenshot: day-hub
# Day 1, or day 2 when the run crosses midnight in Vietnam.
- assertVisible: '(?i).*day [12] of 3.*'
- assertVisible:
    id: 'trip-briefing-.*'
# The day's entries sit under the briefing and the tiles.
- scrollUntilVisible:
    element:
      id: 'trip-hub-(next|today)'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-money'
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: day-hub-tiles
- assertNotVisible: '.*ACTIVITY\..*'
- assertNotVisible: '.*\$.*'
# The day-of screen.
- scrollUntilVisible:
    element:
      id: 'trip-hub-(next|today)'
    direction: UP
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'trip-hub-(next|today)'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: 'trip-hub-(next|today)'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: day-of
- assertVisible:
    id: 'trip-day-hero-.*'
# The hub's next stop may be tomorrow's first: that day says it is tomorrow and offers the way
# back to today, which leads with what is still ahead or says the day is done.
- runFlow:
    when:
      visible:
        id: 'trip-day-to-today'
    commands:
      - assertVisible: '(?i)tomorrow · .*'
      - runFlow: subflows/dismiss-visit-offer.yaml
      - tapOn:
          id: 'trip-day-to-today'
      - runFlow: subflows/dismiss-visit-offer.yaml
      - runFlow:
          when:
            visible:
              id: 'trip-day-to-today'
          commands:
            - tapOn:
                id: 'trip-day-to-today'
      - extendedWaitUntil:
          notVisible:
            id: 'trip-day-to-today'
          timeout: 15000
      - waitForAnimationToEnd
      - takeScreenshot: day-of-today
- assertVisible:
    id: 'trip-day-eyebrow'
- runFlow:
    when:
      visible:
        id: 'trip-day-im-up'
    commands:
      - tapOn:
          id: 'trip-day-im-up'
      - extendedWaitUntil:
          notVisible:
            id: 'trip-day-im-up'
          timeout: 15000
      - waitForAnimationToEnd
      - takeScreenshot: day-of-im-up
# Packing.
- runFlow: subflows/dismiss-visit-offer.yaml
- scrollUntilVisible:
    element:
      id: 'trip-day-pack-add'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'trip-day-pack-add'
# The field takes the focus as it opens (the keyboard can cover it).
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: subflows/type-pack-item.yaml
    env:
      ITEM: 'Sunscreen'
# Android shows the chip's text; iOS reads the chip whole, by its label.
- extendedWaitUntil:
    visible:
      text: 'Sunscreen'
    timeout: 10000
- tapOn:
    text: 'Sunscreen'
- runFlow: subflows/sunscreen-packed.yaml
- waitForAnimationToEnd
- takeScreenshot: day-of-packed
- scrollUntilVisible:
    element:
      id: 'trip-day-timeline'
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: day-of-timeline
- runFlow: subflows/dismiss-visit-offer.yaml
# To the background and back: the same day, still drawn, the tick still there.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: day-of-reopened
- scrollUntilVisible:
    element:
      text: 'Sunscreen'
    direction: UP
    timeout: 20000
- runFlow: subflows/sunscreen-packed.yaml
# A relaunch: the tick comes back from the database.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'trip-day|trip-hub|home-screen|tab-home|critters-hatch-later'
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: 'trip-day|trip-hub'
    commands:
      - runFlow: subflows/open-trip-hub.yaml
- runFlow:
    when:
      visible:
        id: 'trip-hub'
      notVisible:
        id: 'trip-day'
    commands:
      - scrollUntilVisible:
          element:
            id: 'trip-hub-(next|today)'
          direction: DOWN
          timeout: 15000
          centerElement: true
      - tapOn:
          id: 'trip-hub-(next|today)'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- runFlow: subflows/dismiss-visit-offer.yaml
# The hub's next stop may be tomorrow's: the pack list ticked is today's.
- runFlow:
    when:
      visible:
        id: 'trip-day-to-today'
    commands:
      - tapOn:
          id: 'trip-day-to-today'
      - extendedWaitUntil:
          notVisible:
            id: 'trip-day-to-today'
          timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Sunscreen'
    direction: DOWN
    timeout: 20000
- runFlow: subflows/sunscreen-packed.yaml
# Back on the hub the morning briefing has settled.
- runFlow: ../_shared/back.yaml
- extendedWaitUntil:
    visible:
      id: 'trip-hub'
    timeout: 15000
- runFlow: subflows/dismiss-visit-offer.yaml
- extendedWaitUntil:
    visible:
      id: 'trip-briefing-ready|trip-briefing-none'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: day-hub-briefing
