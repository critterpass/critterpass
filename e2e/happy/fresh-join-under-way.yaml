appId: app.critterpass.dev
---
# Release gate: a friend joins a trip that is already under way. Four new accounts on one phone,
# no demo world. The organiser starts as `draft_today` (a crew of one whose Đà Nẵng trip, first day
# today, has its plan waiting in draft review);
# one friend joins with the crew code before the proposal, boards it, and the organiser locks the
# crew in. Then another new account joins with the same crew code: the trip is confirmed and, from
# noon in Da Nang, under way. Their Home, trip hub, plan and crew chat are captured, the organiser
# adds an expense split between everyone on the trip, and the newcomer's Home is captured again
# once the trip has started. The newcomer is on the trip: the plan opens and the expense is theirs
# to share. A fourth account joins earlier, while the proposal is out, and never answers it: after
# the lock their Home has the JOIN THE TRIP card, and the tap puts them on the trip.
# Whether it is past noon on the trip's clock (Da Nang, UTC+7), when the trip turns under way.
- evalScript: ${var d = new Date(Date.now() + 7 * 3600000); output.afterNoon = d.getUTCHours() >= 12}
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: draft_today

# The friend: a second new account on this phone joins the crew with its code.
# The switch goes through Developer tools from a cold start; a tap that lands mid-launch is
# tried once more.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-new'
- runFlow: subflows/onboard.yaml
# Onboarding may finish on another tab; Home has JOIN WITH A CODE.
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-join-code'
    timeout: 30000
- tapOn:
    id: 'home-join-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 15000
- runFlow:
    file: subflows/type-crew-code.yaml
    env:
      CODE: ${output.crewCode}
- extendedWaitUntil:
    visible:
      text: '(?i)found it.*'
    timeout: 20000
# A found code puts the keyboard away by itself, so JOIN is in reach.
- extendedWaitUntil:
    visible:
      id: 'invite-code-join'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'invite-code-join'
- extendedWaitUntil:
    notVisible:
      id: 'invite-code-screen'
    timeout: 30000

# The organiser again (kept first).
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-switch-0'
# With someone to send it to, the trip's step is "send the plan": the hub's button opens the draft.
- runFlow:
    file: subflows/hub-turn.yaml
    env:
      BUTTON: 'Send the plan'
- extendedWaitUntil:
    visible:
      id: 'draft-review|draft-propose'
    timeout: 30000

# BUILD THE PROPOSAL, then SEND to the one friend.
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
- tapOn:
    id: 'draft-propose'
- extendedWaitUntil:
    visible:
      id: 'proposal-build'
    timeout: 30000
- assertVisible:
    id: 'build-format-trailer'
- extendedWaitUntil:
    visible:
      id: 'build-send'
      enabled: true
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'build-send'
- extendedWaitUntil:
    visible:
      id: 'proposal-sent'
    timeout: 60000
# The guide writes the friend's version on staging's AI.
- extendedWaitUntil:
    visible:
      text: '(?i).*version is ready|.*wrote the group version.*'
    timeout: 300000

# Someone who joins while the proposal is out: in the crew, with no version of their own to answer
# and so no seat when the organiser locks.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-new'
- runFlow: subflows/onboard.yaml
# Onboarding may finish on another tab; Home has JOIN WITH A CODE.
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-join-code'
    timeout: 30000
- tapOn:
    id: 'home-join-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 15000
- runFlow:
    file: subflows/type-crew-code.yaml
    env:
      CODE: ${output.crewCode}
- extendedWaitUntil:
    visible:
      text: '(?i)found it.*'
    timeout: 20000
# A found code puts the keyboard away by itself, so JOIN is in reach.
- extendedWaitUntil:
    visible:
      id: 'invite-code-join'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'invite-code-join'
- extendedWaitUntil:
    notVisible:
      id: 'invite-code-screen'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'invite-manifest-screen'
    timeout: 60000

# The friend opens it from crew chat and boards.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-switch-1'
- runFlow: subflows/open-proposal-card.yaml
- extendedWaitUntil:
    visible:
      id: 'proposal-version'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'version-in'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'version-in'
- extendedWaitUntil:
    visible:
      id: 'board-slide'
    timeout: 30000
- waitForAnimationToEnd
- runFlow: subflows/slide-to-board.yaml
- extendedWaitUntil:
    visible:
      id: 'board-egg'
    timeout: 30000
- assertNotVisible:
    id: 'board-pending'
- waitForAnimationToEnd

# The organiser locks the crew in: the trip is confirmed.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-switch-0'
- runFlow: subflows/open-proposal-card.yaml
- extendedWaitUntil:
    visible:
      id: 'proposal-tracker'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'tracker-lock'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'tracker-lock'
- tapOn: '(?i)yes, lock it in'
- extendedWaitUntil:
    visible:
      id: 'tracker-confirmed'
    timeout: 30000
# The trip's first day is today, so the trip day starts for the organiser at once and the app asks
# whether to remember the places they visit. It is answered here, on the trips tab, so the sheet
# is not met later in the middle of an account switch (the answer holds for the phone).
- openLink:
    link: critterpass-dev://trips
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'visit-consent-decline'
    timeout: 90000
    optional: true
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000

# From here on someone on the trip can be asked, once the trip day has started, whether to remember
# the places they visit. The sheet covers the screen under it, so wherever it is up it is answered
# "Not now" before a capture or an account switch.
# The newcomer: one more new account joins with the crew code, after the trip was confirmed.
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-new'
- runFlow: subflows/onboard.yaml
# Onboarding may finish on another tab; Home has JOIN WITH A CODE.
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-join-code'
    timeout: 30000
- tapOn:
    id: 'home-join-code'
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 15000
- runFlow:
    file: subflows/type-crew-code.yaml
    env:
      CODE: ${output.crewCode}
- extendedWaitUntil:
    visible:
      text: '(?i)found it.*'
    timeout: 20000
# A found code puts the keyboard away by itself, so JOIN is in reach.
- extendedWaitUntil:
    visible:
      id: 'invite-code-join'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'invite-code-join'
- extendedWaitUntil:
    notVisible:
      id: 'invite-code-screen'
    timeout: 30000
# The manifest welcomes them. The join put them on the trip, so its button opens the plan.
- extendedWaitUntil:
    visible:
      id: 'invite-manifest-screen'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-manifest
- tapOn:
    id: 'invite-manifest-plan'
- extendedWaitUntil:
    visible:
      id: 'trip-map|day-plan'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-landing
# Home for the crew, then the trip's hub, its plan and the crew chat.
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-chat'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'home-mode-(everyday|in_trip)|home-(next-up|in-trip)'
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-home
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: trips
      LABEL: Trips
- extendedWaitUntil:
    visible:
      id: 'trip-hub|trip-list-row-.*|trip-list-empty'
    timeout: 30000
    optional: true
# Your trips lists the trip once this account is on it; its row opens the hub.
- runFlow:
    when:
      visible:
        id: 'trip-list-row-.*'
      notVisible:
        id: 'trip-hub'
    commands:
      - tapOn:
          id: 'trip-list-row-.*'
          index: 0
      - extendedWaitUntil:
          visible:
            id: 'trip-hub'
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-trip
- runFlow:
    when:
      visible:
        id: 'trip-hub-door-plan|trip-hub-tile-plan'
    commands:
      - tapOn:
          id: 'trip-hub-door-plan|trip-hub-tile-plan'
      - extendedWaitUntil:
          visible:
            id: 'trip-map|day-plan'
          timeout: 30000
          optional: true
      - waitForAnimationToEnd:
          timeout: 8000
      - runFlow:
          when:
            visible:
              id: 'visit-consent-decline'
          commands:
            - tapOn:
                id: 'visit-consent-decline'
            - waitForAnimationToEnd:
                timeout: 5000
      - takeScreenshot: en-join-under-way-newcomer-plan
      - runFlow: subflows/leave-plan.yaml
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-chat'
    timeout: 30000
- tapOn:
    id: 'home-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 20000
- extendedWaitUntil:
    visible: '(?i).*the proposal.*'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-chat

# The organiser pays for dinner: the split names everyone on the trip.
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-switch-0'
# The switch restarts the app where it last was: back to Home.
- extendedWaitUntil:
    visible:
      id: 'tab-home|home-screen|trip-list-row-.*|trip-hub'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-organiser-home
- openLink: critterpass-dev://wallet/money
- extendedWaitUntil:
    visible:
      id: 'money-(ready|none|syncing)'
    timeout: 60000
- runFlow: subflows/open-add-expense.yaml
- extendedWaitUntil:
    visible:
      id: 'money-keypad'
    timeout: 10000
# 9 then the 000 key: ₫9,000 (the crew settles in đồng), each key by its id (a digit's text also
# matches the amount's own digits).
- tapOn:
    id: 'money-key-9'
- tapOn:
    id: 'money-key-000'
# EVENLY splits between everyone on the trip: PAID BY shows each of them, and ₫9,000 three ways
# reads "₫3,000 each" (two people would read 4,500, four 2,250).
- extendedWaitUntil:
    visible: '.*3,000 each.*'
    timeout: 20000
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-expense-split
- evalScript: ${output.threeWays = false}
- runFlow:
    when:
      visible: '.*3,000 each.*'
    commands:
      - evalScript: ${output.threeWays = true}
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 30000
# The saved expense at the top of the list (the row can sit under the guide button, so it is
# captured in place rather than opened).
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-expense-shares

# The newcomer again. From noon in Da Nang the lifecycle sweep (every ten minutes) starts a trip
# whose first day is today, and Home turns to the trip day.
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-switch-3'
# The switch restarts the app where it last was: back to Home.
- extendedWaitUntil:
    visible:
      id: 'tab-home|home-screen|trip-list-row-.*|trip-hub'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-chat'
    timeout: 60000
- runFlow:
    when:
      true: ${output.afterNoon == true}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'home-mode-in_trip'
          timeout: 660000
          optional: true
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-home-later
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: trips
      LABEL: Trips
- extendedWaitUntil:
    visible:
      id: 'trip-hub|trip-list-row-.*|trip-list-empty'
    timeout: 30000
    optional: true
# Your trips lists the trip once this account is on it; its row opens the hub.
- runFlow:
    when:
      visible:
        id: 'trip-list-row-.*'
      notVisible:
        id: 'trip-hub'
    commands:
      - tapOn:
          id: 'trip-list-row-.*'
          index: 0
      - extendedWaitUntil:
          visible:
            id: 'trip-hub'
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-trip-later

# The newcomer is on the trip: the organiser's split named three people, the plan opens with its
# days, and the dinner is in their wallet.
- assertTrue: ${output.threeWays == true}
- extendedWaitUntil:
    visible:
      id: 'trip-hub-door-plan|trip-hub-tile-plan'
    timeout: 30000
- tapOn:
    id: 'trip-hub-door-plan|trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'trip-map|day-plan'
    timeout: 60000
- openLink: critterpass-dev://wallet/money
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 60000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-newcomer-money

# The one who joined while the proposal was out: Home says where the crew is and JOIN THE TRIP puts
# them on it; the card goes once their seat has synced.
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/switch-account.yaml
          env:
            TARGET: 'dev-accounts-switch-2'
# The switch restarts the app where it last was: back to Home.
- extendedWaitUntil:
    visible:
      id: 'tab-home|home-screen|trip-list-row-.*|trip-hub'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-join-trip'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-not-on-trip-card
- tapOn:
    id: 'home-join-trip-cta'
- extendedWaitUntil:
    notVisible:
      id: 'home-join-trip'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-not-on-trip-joined
- runFlow: subflows/open-trip-hub.yaml
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: en-join-under-way-not-on-trip-hub
