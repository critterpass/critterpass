appId: app.critterpass.dev
env:
  LANG: en
  NAV: dev-nav-help-lab
  LIST: 'help-lab-.*'
---
# UI sweep (en), lab scenes: the help centre and feedback.
# Generated from tools/scripts/ci-device/sweep-manifest.json (sweep-flows.ts --write).
- runFlow: subflows/open-lab.yaml
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-3p-1-hub
      READY: help-hub
      SHOT: en-3p-1-hub
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-hub-search
      READY: help-article-pass-plus-refunds
      SHOT: en-3p-1-search
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-hub-no-match
      READY: help-ask-human
      SHOT: en-3p-1-no-match
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-hub-english
      READY: help-english-note
      SHOT: en-3p-1-english
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-article
      READY: help-article-title
      SHOT: en-help-article
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-3p-2-feedback
      READY: feedback-send
      SHOT: en-3p-2-feedback
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-feedback-problem
      READY: feedback-topic-bug
      SHOT: en-3p-2-problem
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-3p-3-sent
      READY: feedback-sent-done
      SHOT: en-3p-3-sent
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-sent-offline
      READY: feedback-sent-done
      SHOT: en-3p-3-offline
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-3p-4-board
      READY: help-ideas-votes-left
      SHOT: en-3p-4-board
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-board-new
      READY: help-idea-mine
      SHOT: en-3p-4-new
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-board-shipped
      READY: help-idea-maps
      SHOT: en-3p-4-shipped
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-board-no-votes
      READY: help-ideas-votes-left
      SHOT: en-3p-4-no-votes
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-3p-5-suggest
      READY: help-suggest-matches
      SHOT: en-3p-5-suggest
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-suggest-many
      READY: help-suggest-vote-receipts
      SHOT: en-3p-5-many
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: help-lab-suggest-no-match
      READY: help-suggest-post
      SHOT: en-3p-5-no-match
