appId: app.critterpass.dev
env:
  LANG: en
  NAV: dev-nav-explore-lab
  LIST: 'explore-lab-.*'
---
# UI sweep (en), lab scenes: destinations, places, the crew split and the swipe deck.
# Generated from tools/scripts/ci-device/sweep-manifest.json (sweep-flows.ts --write).
- runFlow: subflows/open-lab.yaml
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      ITEM: explore-lab-destination
      READY: explore-months
      SHOT: en-7g-3-destination
- runFlow:
    file: subflows/lab-scene.yaml
