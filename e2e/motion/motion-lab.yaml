appId: app.critterpass.dev
---
# docs/code-standards.md §17 "Motion/visual": Maestro assertScreenshot in motion-freeze mode for key
# screens. Opens the dev motion-lab (apps/mobile/src/app/(dev)/motion-lab.tsx) via its deep link,
# freezes every animation at its resting frame, then walks the pattern/preset/cue list taking a
# named screenshot per state — `maestro test` diffs named screenshots against their recorded
# baseline. `appId`/the deep-link scheme match the `e2e-test` build profile's `APP_VARIANT=development`
# (apps/mobile/app.config.ts's `development` variant — same as e2e/smoke/app-launch.yaml's `appId`).
# Waits for the home screen before deep-linking: opening the link before the JS bundle/navigation
# container finishes mounting (fonts/i18n gate `_layout.tsx`'s first render) drops the link silently.
# A custom scheme with no host needs a third slash (`scheme:///path`) — `scheme://path` parses
# "path" as the (ignored) host and routes to "/" instead (React Navigation linking's own documented
# gotcha for schemes without a host segment).
- launchApp
- extendedWaitUntil:
    visible: 'Critterpass \(Dev\)'
    timeout: 30000
- openLink: critterpass-dev:///motion-lab
- extendedWaitUntil:
    visible:
      id: 'motion-freeze-toggle'
    timeout: 15000
- tapOn:
    id: 'motion-freeze-toggle'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab-frozen-loops

# Exercise slowmo without leaving motion-freeze on, then confirm each rate is selectable.
- tapOn:
    id: 'motion-freeze-toggle'
- tapOn:
    id: 'slowmo-2x'
- assertVisible:
    id: 'slowmo-2x'
- tapOn:
    id: 'slowmo-4x'
- tapOn:
    id: 'slowmo-1x'

# Every motion mode renders without crashing (full/reduced/off).
- tapOn:
    id: 'mode-reduced'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab-reduced-motion
- tapOn:
    id: 'mode-off'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab-motion-off
- tapOn:
    id: 'mode-full'

# Every feedback cue is tappable (haptic + SFX fire; no assertion beyond "doesn't crash", since
# haptics/audio aren't observable from a Maestro flow).
- tapOn:
    id: 'cue-thud.heavy'
- tapOn:
    id: 'cue-slap'
- tapOn:
    id: 'cue-success'
- tapOn:
    id: 'cue-warning'
- tapOn:
    id: 'cue-error'
- tapOn:
    id: 'cue-sos'

# The island toast demo button shows a toast (covered end to end in island-toast.yaml).
- tapOn:
    id: 'show-toast-button'
- assertVisible:
    id: 'island-toast-pill'
