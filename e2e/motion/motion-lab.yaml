appId: app.critterpass.dev
---
# docs/code-standards.md §17 "Motion/visual": Maestro assertScreenshot in motion-freeze mode for key
# screens. Opens the dev motion-lab (apps/mobile/src/app/(dev)/motion-lab.tsx) via its deep link,
# freezes every animation at its resting frame, then walks the pattern/preset/cue list taking a
# named screenshot per state — `maestro test` diffs named screenshots against their recorded
# baseline. `appId`/the deep-link scheme match the `e2e-test` build profile's `APP_VARIANT=development`
# (apps/mobile/app.config.ts's `development` variant — same as e2e/smoke/app-launch.yaml's `appId`).
# Waits for the home screen before deep-linking: opening the link before the JS bundle/navigation
# container finishes mounting (fonts/i18n gate `_layout.tsx`'s first render) drops the link silently.
# iOS shows a one-time system confirmation sheet ("Open in \"Critterpass (Dev)\"?") the first time a
# custom-scheme link is opened from outside the app — left undismissed, it blocks the app underneath
# indefinitely (and, since it's system UI rather than app UI, persists across separate flow files run
# in the same `maestro test` invocation, which is why an un-dismissed sheet from island-toast.yaml
# broke this flow's very first assertion too). A known Maestro/iOS-simulator flakiness (mobile-dev-inc/
# Maestro#2610): the first openLink's URL is dropped even once "Open" is tapped and the app
# foregrounds (it lands back on "/", not the deep-linked route) — confirmed via a failure screenshot,
# not a guess. Opening the same link again once the scheme is already trusted (no more confirmation
# sheet) delivers it as a plain warm Linking event, which does navigate correctly. Re-opening the
# link immediately after the foreground re-launch crashed the app once (XCTestDriver "kAXErrorServer
# NotFound", confirmed in the run's own maestro.log) — asserting the home screen is stable first
# avoids racing the second openLink against an in-flight app-state transition.
- launchApp
- assertVisible: 'Critterpass \(Dev\)'
- openLink: critterpass-dev://motion-lab
- tapOn:
    text: 'Open'
    optional: true
- launchApp:
    stopApp: false
- assertVisible: 'Critterpass \(Dev\)'
- openLink: critterpass-dev://motion-lab
- extendedWaitUntil:
    visible:
      id: 'motion-freeze-toggle'
    timeout: 20000
- tapOn:
    id: 'motion-freeze-toggle'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab-frozen-loops

# Exercise slowmo without leaving motion-freeze on, then confirm each rate is selectable.
- tapOn:
    id: 'motion-freeze-toggle'
- tapOn:
    id: 'slowmo-2x'
- assertVisible:
    id: 'slowmo-2x'
- tapOn:
    id: 'slowmo-4x'
- tapOn:
    id: 'slowmo-1x'

# Every motion mode renders without crashing (full/reduced/off).
- tapOn:
    id: 'mode-reduced'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab-reduced-motion
- tapOn:
    id: 'mode-off'
- assertVisible:
    id: 'loop-bob'
- takeScreenshot: motion-lab-motion-off
- tapOn:
    id: 'mode-full'

# Every feedback cue is tappable (haptic + SFX fire; no assertion beyond "doesn't crash", since
# haptics/audio aren't observable from a Maestro flow).
- tapOn:
    id: 'cue-thud.heavy'
- tapOn:
    id: 'cue-slap'
- tapOn:
    id: 'cue-success'
- tapOn:
    id: 'cue-warning'
- tapOn:
    id: 'cue-error'
- tapOn:
    id: 'cue-sos'

# The island toast demo button shows a toast (covered end to end in island-toast.yaml).
- tapOn:
    id: 'show-toast-button'
- assertVisible:
    id: 'island-toast-pill'
