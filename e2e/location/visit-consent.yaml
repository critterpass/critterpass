appId: app.critterpass.dev
---
# The "Remember places you visit" sheet (the visit history offer) in English and then
# Vietnamese, opened from the location engine's developer screen. Named
# <lang>-visit-consent for compare mode.
- launchApp:
    clearState: true
- runFlow:
    file: ../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: location-engine
      READY: dev-location-engine
- scrollUntilVisible:
    element:
      id: 'dev-location-consent'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'dev-location-consent'
- extendedWaitUntil:
    visible:
      id: 'visit-consent-accept'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: en-visit-consent
- tapOn:
    id: 'visit-consent-decline'
# Vietnamese: the developer gallery switches the running app's language. Back to Home, then
# into the developer tools again (their list starts at the top, where the gallery is).
- repeat:
    while:
      notVisible:
        id: 'dev-tools-entry'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-locale-vi'
    timeout: 15000
- tapOn:
    id: 'gallery-locale-vi'
- runFlow: ../onboarding/subflows/back.yaml
- scrollUntilVisible:
    element:
      id: 'dev-nav-location-engine'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-location-engine'
- scrollUntilVisible:
    element:
      id: 'dev-location-consent'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'dev-location-consent'
- extendedWaitUntil:
    visible:
      id: 'visit-consent-accept'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: vi-visit-consent
