appId: app.critterpass.dev
# Signal comes back even when a step fails, so the next flow on this device starts online.
onFlowComplete:
  - setAirplaneMode: disabled
---
# 3a-4 → 3a-5: five answers and one skip land on the pass, then home base from the bundled
# airport search, which also works in airplane mode.
- launchApp:
    clearState: true
- runFlow: subflows/through-name.yaml
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'taste-card-left'
      - waitForAnimationToEnd
- tapOn:
    id: 'taste-skip'
- assertVisible:
    id: 'taste-disclosure'
- tapOn:
    id: 'taste-done'
- setAirplaneMode: enabled
- tapOn:
    id: 'home-search'
- inputText: 'sin'
- extendedWaitUntil:
    visible:
      id: 'home-row-SIN'
    timeout: 10000
- tapOn:
    id: 'home-row-SIN'
# Android's hideKeyboard presses back when picking the row already closed the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
# The stamp sits under the result list, which a short query fills past the screen.
- scrollUntilVisible:
    element:
      id: 'home-stamp'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- setAirplaneMode: disabled
