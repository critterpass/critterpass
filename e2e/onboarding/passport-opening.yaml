appId: app.critterpass.dev
---
# OPEN YOUR PASS on video: the cover swings open, the page under it grows into page one's pass
# card, the name page fades in over it and only then does the keyboard rise. The recording
# (passport-opening.mp4) lands in the flow's screenshots folder in the shard artifact, for frame
# review; the still before it creates that folder, which the recording needs.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: passport-opening-start
- startRecording: passport-opening
- tapOn:
    id: 'onboarding-open'
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-field'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- stopRecording
# Android CI emulators run with system animations off, which the app reads as reduced motion:
# there the page opens without the choreography.
- assertVisible:
    id: 'onboarding-name-field'
