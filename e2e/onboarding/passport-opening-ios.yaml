appId: app.critterpass.dev
---
# OPEN YOUR PASS on video: the cover swings open, the page under it grows into page one's pass
# card, the name page fades in over it and only then does the keyboard rise. The recording
# (passport-opening.mp4) lands in the shard artifact beside this flow's logs for frame review.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- waitForAnimationToEnd
- startRecording: passport-opening
- tapOn:
    id: 'onboarding-open'
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-field'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- stopRecording
- assertVisible:
    id: 'onboarding-name-next'
