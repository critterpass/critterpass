appId: app.critterpass.dev
---
# From the splash (3a-1) through the name page (3a-2) to the photo page (3a-3).
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
# Right after a cold launch on a busy simulator the splash can still be settling and drop the tap
# (the button presses, the page stays): OPEN YOUR PASS is tapped again while the splash is up.
- repeat:
    while:
      notVisible:
        id: 'onboarding-name-field'
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: 'onboarding-open'
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: 'onboarding-open'
      - extendedWaitUntil:
          visible:
            id: 'onboarding-name-field'
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-field'
    timeout: 10000
- tapOn:
    id: 'onboarding-name-field'
- inputText: 'Winston'
- hideKeyboard
- tapOn:
    id: 'onboarding-name-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-photo'
    timeout: 10000
# The keyboard may still be closing as the photo page slides in, which moves its buttons: let the
# page settle before a caller taps them.
- waitForAnimationToEnd
