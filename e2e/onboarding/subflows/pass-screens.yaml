appId: app.critterpass.dev
---
# Walks the whole pass flow from the splash, taking one screenshot per designed screen (3a-1 …
# 3a-9) with ${PREFIX} in each name. Pass numbers and the nearest-airport hint depend on the api
# the app points at; offline they show the designed placeholder states instead.
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-1-splash
- tapOn:
    id: 'onboarding-open'
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-field'
    timeout: 10000
- tapOn:
    id: 'onboarding-name-field'
- inputText: 'Winst'
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-2-name-keyboard
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-2-name
# A second tap into the field can select the typed word (iOS), so the name is typed again whole.
- tapOn:
    id: 'onboarding-name-field'
- eraseText
- inputText: 'Winston'
- hideKeyboard
- tapOn:
    id: 'onboarding-name-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-photo'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-3-photo
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
# Street cart, then one neighbourhood: the designed "3 OF 6" with two tags on the pass.
- tapOn:
    id: 'taste-card-left'
- waitForAnimationToEnd
- tapOn:
    id: 'taste-card-right'
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-4-this-or-that
- tapOn:
    id: 'taste-card-left'
- waitForAnimationToEnd
- tapOn:
    id: 'taste-card-left'
- waitForAnimationToEnd
- tapOn:
    id: 'taste-card-right'
- waitForAnimationToEnd
# The stamped tags pile up by the sixth question; in longer languages Skip sits below the fold.
# The last pick's cards are still settling, so wait before looking for it.
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'taste-skip'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'taste-skip'
- extendedWaitUntil:
    visible:
      id: 'taste-summary'
    timeout: 10000
- takeScreenshot: ${PREFIX}-3a-4-summary
- tapOn:
    id: 'taste-done'
- extendedWaitUntil:
    visible:
      id: 'home-search'
    timeout: 10000
- tapOn:
    id: 'home-search'
- inputText: 'Sing'
- extendedWaitUntil:
    visible:
      id: 'home-row-SIN'
    timeout: 10000
- tapOn:
    id: 'home-row-SIN'
# Android's hideKeyboard presses back when picking the row already closed the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-5-home
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${PREFIX}-3a-6-issued
- tapOn:
    id: 'onboarding-issued-save'
- extendedWaitUntil:
    visible:
      id: 'save-phone'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-7-save
- tapOn:
    id: 'save-phone'
- extendedWaitUntil:
    visible:
      id: 'phone-number'
    timeout: 10000
- tapOn:
    id: 'phone-number'
- inputText: '91234567'
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-8-phone-keyboard
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-8-phone
# The country code sheet (undesigned): its list must run to the bottom edge of the sheet.
- tapOn:
    id: 'phone-country'
- extendedWaitUntil:
    visible:
      id: 'country-picker-panel'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-8-country
- tapOn:
    id: 'country-picker-close'
- waitForAnimationToEnd
- runFlow: back.yaml
- extendedWaitUntil:
    visible:
      id: 'save-not-now'
    timeout: 10000
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-3a-9-permissions
