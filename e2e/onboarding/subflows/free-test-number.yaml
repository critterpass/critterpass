appId: app.critterpass.dev
---
# Frees the staging test number (+65 9123 4567) before a flow saves a pass with it, and ends on the
# splash of a fresh install. The number's holder is signed in to ("I already have a pass") and
# erased, but only when these flows made it: a brand-new account without a pass, or one whose crew
# is the marker "CP Test Sign-out". Any other holder stops the flow before anything is erased.
# Needs `-e OTP_TEST_CODE=<the api's OTP_TEST_CODE>`.
- runFlow: ../../happy/subflows/fresh-install.yaml
- extendedWaitUntil:
    visible:
      id: 'onboarding-sign-in'
    timeout: 60000
- tapOn:
    id: 'onboarding-sign-in'
- runFlow: ../../you/subflows/phone-sign-in.yaml
# The number had an account (Home), a closed one a run left behind (the restore page: restored
# first, so the check below still sees whose it is) or now has a new one without a pass (the name
# page).
- extendedWaitUntil:
    visible:
      id: 'home-screen|onboarding-name-field|you-closed-restore'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'you-closed-restore'
    commands:
      - tapOn:
          id: 'you-closed-keep'
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 60000
- runFlow: ../../you/subflows/guard-test-number.yaml
- runFlow: ../../you/subflows/start-fresh.yaml
