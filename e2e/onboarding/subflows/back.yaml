appId: app.critterpass.dev
---
# One step back: the edge swipe on iOS, the system back on Android (an injected edge swipe doesn't
# start Android's gesture-navigation back).
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      platform: Android
    commands:
      - back
