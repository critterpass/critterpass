appId: app.critterpass.dev
# Signal comes back even when a step fails, so the next flow on this device starts online.
onFlowComplete:
  - setAirplaneMode: disabled
---
# First launch with no signal: the whole pass is made and issued on the device (placeholder number
# with SYNCING), then signal returns and the queued issue goes up. Android only: Maestro's airplane
# mode cannot cut the iOS simulator's network, so there the pass is issued online at once.
- setAirplaneMode: enabled
- launchApp:
    clearState: true
- runFlow: subflows/through-name.yaml
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'taste-skip'
- tapOn:
    id: 'taste-done'
- tapOn:
    id: 'home-search'
- inputText: 'KUL'
- tapOn:
    id: 'home-row-KUL'
# Android's hideKeyboard presses back when picking the row already closed the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- assertVisible:
    text: 'CP-····'
- setAirplaneMode: disabled
