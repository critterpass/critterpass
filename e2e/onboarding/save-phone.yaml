appId: app.critterpass.dev
---
# 3a-7 → 3a-8: the save sheet over the issued pass, the phone number step with a staging test
# number (+65 9123 4567 in the api's OTP_TEST_NUMBERS, never sent a message), its fixed code, and
# on to the permissions page. Run with `-e OTP_TEST_CODE=<the api's OTP_TEST_CODE>`.
- launchApp:
    clearState: true
- runFlow: subflows/through-name.yaml
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'taste-skip'
- tapOn:
    id: 'taste-done'
- tapOn:
    id: 'home-search'
- inputText: 'SIN'
- tapOn:
    id: 'home-row-SIN'
# Android's hideKeyboard presses back when picking the row already closed the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- tapOn:
    id: 'onboarding-issued-save'
- tapOn:
    id: 'save-phone'
- tapOn:
    id: 'phone-number'
- inputText: '91234567'
- hideKeyboard
- tapOn:
    id: 'phone-send'
- extendedWaitUntil:
    visible:
      id: 'phone-sent'
    timeout: 20000
- takeScreenshot: en-3a-8-code-sent
- inputText: '${OTP_TEST_CODE}'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer'
    timeout: 20000
