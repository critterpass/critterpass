appId: app.critterpass.dev
---
# The same screens in Vietnamese: the dev gallery switches the running app's language (not
# persisted), then two back swipes return to the splash.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow: subflows/back.yaml
- waitForAnimationToEnd
- runFlow: subflows/back.yaml
- runFlow:
    file: subflows/pass-screens.yaml
    env:
      PREFIX: vi
