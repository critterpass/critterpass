appId: app.critterpass.dev
---
# 3a-1 → 3a-3: open the pass, type a name (the pass prints it), pick Pon as the passport photo.
- launchApp:
    clearState: true
- runFlow: subflows/through-name.yaml
- assertVisible:
    id: 'onboarding-photo-frame'
- tapOn:
    id: 'onboarding-photo-guides-pon'
- tapOn:
    id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
