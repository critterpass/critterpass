appId: app.critterpass.dev
---
# 3b-3 → 3b-1: from a guest place, PITCH TO THE CREW opens the pitch sheet; the guide's pitch
# streams in section by section (sticker, chips, headline, reasons, quote); ADD TO THE VOTE puts
# the place on the crew's board and Home shows WHERE NEXT? with its sticker.
#
# Data: a fresh account onboards and starts its only crew, so the crew has no destination vote yet
# and a pitch goes straight to it. Needs an api with the place index and the pitch route enabled.
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- openLink: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 10000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Pitch Crew'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 20000
- tapOn:
    id: 'start-crew-done'
- openLink: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: 'lisbon'
- extendedWaitUntil:
    visible:
      text: 'LISBON'
    timeout: 10000
# The row, not the query: text matching would also find the typed 'lisbon'.
- tapOn:
    id: 'place-result-.*'
    index: 0
# The pitch action sits below the guest guide's brief.
- scrollUntilVisible:
    element:
      id: 'guest-pitch'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'guest-pitch'
# Until the new crew has synced the page asks which crew to pitch to; pick it there.
- runFlow:
    when:
      visible:
        id: 'crew-picker'
    commands:
      - tapOn:
          id: 'crew-pick-.*'
          index: 0
- extendedWaitUntil:
    visible:
      id: 'pitch-sheet'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'pitch-card'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'pitch-add'
      enabled: true
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 3b-3
- tapOn:
    id: 'pitch-add'
- openLink: critterpass-dev://
- extendedWaitUntil:
    visible:
      id: 'board-sticker-0'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 3b-1
