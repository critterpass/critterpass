appId: app.critterpass.dev
---
# 3b-3 → 3b-1: from a place (its Explore page, or the guest guide's page where no guide lives), PITCH TO THE CREW opens the pitch sheet; the guide's pitch
# streams in section by section (sticker, chips, headline, reasons, quote); ADD TO THE VOTE puts
# the place on the crew's board and Home shows WHERE NEXT? with its sticker.
#
# Data: a fresh account onboards and starts its only crew, so the crew has no destination vote yet
# and a pitch goes straight to it. Needs an api with the place index and the pitch route enabled.
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- openLink: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 10000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Pitch Crew'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 20000
- tapOn:
    id: 'start-crew-done'
- openLink: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: 'lisbon'
- extendedWaitUntil:
    visible:
      text: 'LISBON'
    timeout: 10000
# The row, not the query: text matching would also find the typed 'lisbon'.
- tapOn:
    id: 'place-result-.*'
    index: 0
# A place with a guide opens its Explore page (PITCH TO THE CREW is `explore-pitch`); any other
# place opens the guest guide's page (`guest-pitch`). Either button opens the pitch.
- scrollUntilVisible:
    element:
      id: 'explore-pitch|guest-pitch'
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'explore-pitch'
    commands:
      - tapOn:
          id: 'explore-pitch'
      # With one crew the pitch opens at once; before the new crew has synced the page asks
      # which crew gets it (and says there is none until the crew arrives).
      - runFlow:
          when:
            visible:
              id: 'explore-pitch-no-crew'
          commands:
            - extendedWaitUntil:
                visible:
                  id: 'explore-pitch-crews'
                timeout: 30000
      - runFlow:
          when:
            visible:
              id: 'explore-pitch-crews'
          commands:
            - tapOn:
                id: 'explore-pitch-crew-.*'
                index: 0
- runFlow:
    when:
      visible:
        id: 'guest-pitch'
    commands:
      - tapOn:
          id: 'guest-pitch'
      # Until the new crew has synced the page asks which crew to pitch to; pick it there.
      - runFlow:
          when:
            visible:
              id: 'crew-picker'
          commands:
            - tapOn:
                id: 'crew-pick-.*'
                index: 0
- extendedWaitUntil:
    visible:
      id: 'pitch-sheet'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'pitch-card'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'pitch-add'
      enabled: true
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 3b-3
- tapOn:
    id: 'pitch-add'
- openLink: critterpass-dev://
- extendedWaitUntil:
    visible:
      id: 'board-sticker-0'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 3b-1
