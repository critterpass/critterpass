appId: app.critterpass.dev
---
# 3b-1 → 3b-6: with two places or more on the board, the organiser's GO TO THE FINAL folds the
# board into the split card on Home (the two leaders, the tally strip, who is still to vote and
# where a tie goes); tapping it opens the showdown (3c-1).
#
# Data: a fresh account onboards, then the staging demo seed's `vote` scenario gives it Bali Demo
# Crew's open destination vote, organised by the account: four places on the board, Kyoto and
# Lisbon two ballots each, so GO TO THE FINAL needs no pick.
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-vote
# The board sits below the next-up card: scroll its GO TO THE FINAL clear of the tab bar first.
- scrollUntilVisible:
    element:
      id: 'board-go-to-final'
    timeout: 20000
- tapOn:
    id: 'board-go-to-final'
- extendedWaitUntil:
    visible:
      id: 'final-split'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 3b-6
- tapOn:
    id: 'final-split-open'
- extendedWaitUntil:
    visible:
      id: 'showdown'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 3c-1
