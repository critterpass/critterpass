appId: app.critterpass.dev
env:
  SIDE: '0'
---
# 3c-1 → 3c-2: the account taps a showdown half (the half squashes, the VS disc punches toward
# it); its vote is the last one needed, so the poll closes and the app opens the winner reveal
# once: the stamp, the tally and SET UP for the organiser. Relaunching does not show it again.
#
# Data: a fresh account onboards, then the staging demo seed's `vote_final` scenario puts Bali
# Demo Crew's destination vote in its final, Kyoto against Lisbon, with the four crewmates already
# voted 2–2. ${SIDE} (0 or 1) picks the half, and so the winner.
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-vote-final
- extendedWaitUntil:
    visible:
      id: 'final-split-open'
    timeout: 20000
- tapOn:
    id: 'final-split-open'
- extendedWaitUntil:
    visible:
      id: 'showdown'
    timeout: 10000
# Both finalists are on screen before the account has voted for either.
- assertVisible: 'KYOTO'
- assertVisible: 'LISBON'
- waitForAnimationToEnd
- takeScreenshot: 3c-1
- tapOn:
    id: 'showdown-half-${SIDE}'
- extendedWaitUntil:
    visible:
      id: 'winner-reveal'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 3c-2
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 25000
- assertNotVisible:
    id: 'winner-reveal'
