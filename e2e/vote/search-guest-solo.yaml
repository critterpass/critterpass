appId: app.critterpass.dev
---
# 3b-7 → 3b-8: search finds a city and opens its page (the guest guide's page with NO LIVE GUIDE
# YET where nobody guides it); SOLO TRIP confirms and starts a trip for one, and setup
# opens once the server has made it. A refusal would show "That didn't go through" and keep the
# confirm open, captured here when it happens.
#
# Data: a fresh account onboards, so it has no crew yet: the server starts its crew of one. Needs an api with the place index (the 61 places and their
# cities) and the guest brief enabled.
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- openLink: critterpass-dev://places/search
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: 'marrakech'
# Every city on staging now has a guide of its own, so a search row opens the place's Explore page;
# a place nobody guides (NO LIVE GUIDE YET) opens the guest guide's page instead. Both pages
# save the place and offer SOLO TRIP.
- extendedWaitUntil:
    visible:
      id: 'place-result-.*'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: 'place-search-unguided'
    commands:
      - assertVisible: 'NO LIVE GUIDE YET'
      - waitForAnimationToEnd
      - takeScreenshot: 3b-7
- tapOn:
    id: 'place-result-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'guest-brief|explore-destination'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 3b-8
- runFlow:
    when:
      visible:
        id: 'guest-brief'
    commands:
      - assertVisible: 'GUEST GUIDE: .*'
      - tapOn:
          id: 'guest-save'
      - assertVisible: '♥ SAVED'
      - scrollUntilVisible:
          element:
            id: 'guest-solo'
      - tapOn:
          id: 'guest-solo'
      - assertVisible:
          id: 'solo-confirm'
      - waitForAnimationToEnd
      - takeScreenshot: 3b-8-solo-confirm
      - tapOn:
          id: 'solo-start'
- runFlow:
    when:
      visible:
        id: 'explore-destination'
    commands:
      - scrollUntilVisible:
          element:
            id: 'explore-solo'
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: 'explore-solo'
      - extendedWaitUntil:
          visible:
            id: 'explore-solo-confirm'
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: 3b-8-solo-confirm
      - tapOn:
          id: 'explore-solo-start'
# Up to about 30 s for the trip to be made; a refusal toast on the way is captured.
- repeat:
    times: 15
    while:
      notVisible:
        id: 'when-cta|when-pick-week'
    commands:
      - runFlow:
          when:
            visible: "That didn't go through"
          commands:
            - takeScreenshot: 3b-8-solo-refused
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: 'when-cta|when-pick-week'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 3c-3-solo-setup
