appId: app.critterpass.dev
---
# A poll in crew chat: the "+" menu's Poll entry opens the new-poll sheet, POST puts the poll card
# in the thread, and a tap on an answer votes at once (offline too) with the count moving.
#
# Needs before it can pass: an onboarded account that is an active member of crew ${CREW_ID}.
- launchApp
- openLink: critterpass-dev://crew/${CREW_ID}/chat
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 15000
# The composer's + button, by its label; `chat-attach` is the menu sheet it opens.
- tapOn: 'Add attachment'
- extendedWaitUntil:
    visible:
      id: 'chat-attach'
    timeout: 5000
- tapOn: 'Poll'
- extendedWaitUntil:
    visible:
      id: 'new-poll'
    timeout: 10000
- tapOn:
    id: 'new-poll-question'
- inputText: 'Dinner tonight?'
- tapOn:
    id: 'new-poll-option-0'
- inputText: 'Tacos'
- tapOn:
    id: 'new-poll-option-1'
- inputText: 'Ramen'
- waitForAnimationToEnd
- takeScreenshot: chat-new-poll
- tapOn:
    id: 'new-poll-post'
- extendedWaitUntil:
    visible:
      text: 'Dinner tonight?'
    timeout: 15000
- tapOn:
    id: 'poll-option-0'
- waitForAnimationToEnd
- takeScreenshot: chat-poll-voted
