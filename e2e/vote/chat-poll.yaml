appId: app.critterpass.dev
---
# A poll in crew chat: the "+" menu's Poll entry opens the new-poll sheet, POST puts the poll card
# in the thread, and a tap on an answer votes at once (offline too) with the count moving.
#
# Data: a fresh account onboards, then the staging demo seed gives it Bali Demo Crew and its chat.
- launchApp:
    clearState: true
- runFlow: ../home/subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo
- tapOn:
    id: 'home-header-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 15000
# The composer's + button, by its label; `chat-attach` is the menu sheet it opens.
- tapOn: 'Add attachment'
- extendedWaitUntil:
    visible:
      # The sheet's panel: iOS leaves the sheet's full-screen root out of its hierarchy.
      id: 'chat-attach-panel'
    timeout: 5000
- tapOn: 'Poll'
- extendedWaitUntil:
    visible:
      id: 'new-poll'
    timeout: 10000
- tapOn:
    id: 'new-poll-question'
- inputText: 'Dinner tonight?'
# POST stays above the keyboard, with the line that says what is still missing.
- assertVisible:
    id: 'new-poll-post'
- assertVisible:
    id: 'new-poll-reason'
- waitForAnimationToEnd
- takeScreenshot: en-3g-1-new-poll-reason
- tapOn:
    id: 'new-poll-option-0'
- inputText: 'Tacos'
- tapOn:
    id: 'new-poll-option-1'
- inputText: 'Ramen'
- waitForAnimationToEnd
- takeScreenshot: chat-new-poll
# POST is pinned over the keyboard: no scrolling and no hiding the keyboard to reach it.
- assertNotVisible:
    id: 'new-poll-reason'
- tapOn:
    id: 'new-poll-post'
# The card sets the question in capitals.
- extendedWaitUntil:
    visible:
      text: '(?i)dinner tonight\?'
    timeout: 15000
- tapOn:
    id: 'poll-option-0'
- waitForAnimationToEnd
- takeScreenshot: chat-poll-voted
