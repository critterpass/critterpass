appId: app.critterpass.dev
---
# Makes sure this phone shows the premium UI, the only UI the flows drive. Run from the splash or
# Home (both carry the "Developer tools" entry), right after a cleared install: `start-as.yaml` and
# `happy/subflows/fresh-install.yaml` end with it, so every flow that starts from either is on the
# premium screens.
#
# While the app still carries Developer tools' "Premium UI on here" switch, the switch is tapped
# (it keeps the choice in the default MMKV store, which a cleared install drops) and the app is
# relaunched into it. Once the app has no switch, nothing is tapped: the app is only relaunched
# onto the same screen. A build without the premium native modules (`dev-premium-ui-source-binary`)
# fails here, since no flow can pass on it.
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry|home-screen|tab-home|paste-link-offer'
    timeout: 60000
# The iOS paste offer can cover a cleared install's splash.
- runFlow:
    when:
      visible:
        id: 'paste-link-offer'
    commands:
      - tapOn:
          id: 'paste-link-skip'
      - waitForAnimationToEnd
# The entry sits at the foot of a long Home.
- scrollUntilVisible:
    element:
      id: 'dev-tools-entry'
    direction: DOWN
    timeout: 20000
    optional: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: 'dev-tools-entry'
          commands:
            - tapOn:
                id: 'dev-tools-entry'
      - extendedWaitUntil:
          visible:
            id: 'dev-nav-.*|dev-premium-ui-on'
          timeout: 15000
# The switch sits near the top of the list; a list that opens scrolled is searched both ways.
- scrollUntilVisible:
    element:
      id: 'dev-premium-ui-on'
    direction: DOWN
    timeout: 8000
    speed: 20
    optional: true
- scrollUntilVisible:
    element:
      id: 'dev-premium-ui-on'
    direction: UP
    timeout: 8000
    speed: 20
    optional: true
- assertNotVisible:
    id: 'dev-premium-ui-source-binary'
- runFlow:
    when:
      visible:
        id: 'dev-premium-ui-on'
    commands:
      - tapOn:
          id: 'dev-premium-ui-on'
      # The switch restarts the JS.
      - waitForAnimationToEnd
# A stop and a plain launch make sure this run reads the choice (and leave Developer tools).
- stopApp
- launchApp
# A cold launch right after the stop can take a few seconds to register on iOS, and a hierarchy
# read before then fails the flow as "App crashed or stopped" though the app is starting (no crash
# report; its log carries on). Settling on screenshots first never reads the hierarchy.
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'onboarding-open|home-screen|tab-home|critters-hatch-later|visit-consent-decline'
    timeout: 60000
