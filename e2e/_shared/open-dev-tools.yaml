appId: app.critterpass.dev
---
# Opens Developer tools the way a tester does: Home (or the splash, before onboarding),
# down to the "Developer tools" entry at its foot, and a tap. Ends on the Developer tools list.
# Home's link brings Home to the front from any screen (a run of backs can leave the app from a
# tab's root); before onboarding it opens the splash.
- runFlow:
    when:
      notVisible:
        id: 'home-screen|onboarding-open'
    commands:
      - openLink:
          link: critterpass-dev://
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - tapOn: 'Open'
- runFlow:
    when:
      visible:
        id: 'critters-hatch-later'
    commands:
      - tapOn:
          id: 'critters-hatch-later'
- extendedWaitUntil:
    visible:
      id: 'home-screen|onboarding-open'
    timeout: 30000
# Centred (or to the list's end): a scroll that stops as soon as the entry is in the viewport can
# leave it under the floating tab bar, and the tap lands on Home instead.
- scrollUntilVisible:
    element:
      id: 'dev-tools-entry'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-build-marker|dev-nav-.*'
    timeout: 15000
