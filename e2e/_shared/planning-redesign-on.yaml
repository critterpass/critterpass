appId: app.critterpass.dev
---
# Turns the section 7 planning screens on for this phone only (a Developer tools override of the
# synced `planning.redesign`; the shared config is never touched) and returns to Home. Run from
# Home after onboarding. The override is kept across launches; "Start as a new user" clears it.
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 30000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-planning-redesign-on'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'dev-planning-redesign-on'
- extendedWaitUntil:
    visible:
      id: 'dev-planning-redesign-state-on'
    timeout: 10000
- assertVisible:
    id: 'dev-planning-redesign-source-override'
- runFlow: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 15000
