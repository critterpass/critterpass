appId: app.critterpass.dev
---
# Brings Home to the front by its link from whatever screen or sheet is showing, in a couple of
# seconds, and never fails: the caller checks for `home-screen` and falls back to stepping back.
# The device run pre-approves the app's link schemes (ci-device/ios-device.sh), so no "Open in"
# prompt is waited for. A trip that has turned on can show its welcome page over Home.
- openLink:
    link: critterpass-dev://
- extendedWaitUntil:
    visible:
      id: 'home-screen|critters-hatch-later'
    timeout: 6000
    optional: true
# Where the link landed, in the flow's log.
- runFlow: where.yaml
- runFlow:
    when:
      true: ${output.where.indexOf('/hatch') === 0 || output.where === 'unknown'}
    commands:
      - tapOn:
          id: 'critters-hatch-later'
          optional: true
