appId: app.critterpass.dev
---
# Switches the app to ${LANG} (en or vi) as a person would: PASS → Settings → Language, then the
# language's row. Ends on the Language page in the new language; the caller goes on from there
# (`back-to.yaml`, or a tab).
- runFlow:
    file: tab.yaml
    env:
      TAB: pass
      LABEL: Pass
- extendedWaitUntil:
    visible:
      id: 'you-profile'
    timeout: 30000
- runFlow:
    file: tap.yaml
    env:
      ID: 'you-profile-settings'
      LABEL: 'Settings|Cài đặt'
- extendedWaitUntil:
    visible:
      id: 'you-settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'you-settings-language'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'you-settings-language'
- extendedWaitUntil:
    visible:
      id: 'you-language-${LANG}'
    timeout: 15000
- tapOn:
    id: 'you-language-${LANG}'
- waitForAnimationToEnd:
    timeout: 5000
