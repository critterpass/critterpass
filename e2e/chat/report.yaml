appId: app.critterpass.dev
---
# Report a crewmate's message with a reason, muting them at the same time; their messages leave
# this device's timeline and a thank-you toast confirms the report.
#
# Data: the demo crew's chat, where Jordan Demo asked about Uluwatu.
- runFlow: subflows/open-demo-chat.yaml
- longPressOn: 'Can we do Uluwatu at sunset on day two\?'
- tapOn: 'Report'
- extendedWaitUntil:
    visible:
      id: 'chat-report'
    timeout: 5000
- tapOn: 'Bullying or harassment'
# The switch, not its title: only the switch flips the row. Title and switch share the label, so
# try the second match (the switch) and fall back to the first when the row is a single node.
- tapOn:
    text: 'Also mute Jordan'
    index: 1
    optional: true
- runFlow:
    when:
      notVisible:
        text: 'Also mute Jordan'
        checked: true
    commands:
      - tapOn:
          text: 'Also mute Jordan'
          index: 0
- assertVisible:
    text: 'Also mute Jordan'
    checked: true
- takeScreenshot: chat-report-sheet
- tapOn:
    id: 'chat-report-send'
- extendedWaitUntil:
    visible:
      text: 'Thanks. Our team will take a look.'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: 'Can we do Uluwatu at sunset on day two\?'
    timeout: 30000
