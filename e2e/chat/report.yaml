appId: app.critterpass.dev
---
# Report a crewmate's message with a reason, muting them at the same time; their messages leave
# this device's timeline and a thank-you toast confirms the report.
#
# Needs before it can pass: an onboarded account in crew ${CREW_ID} where ${OTHER_NAME} has sent
# ${OTHER_MESSAGE}.
- launchApp
- openLink: critterpass-dev://crew/${CREW_ID}/chat
- extendedWaitUntil:
    visible:
      text: ${OTHER_MESSAGE}
    timeout: 15000
- longPressOn: ${OTHER_MESSAGE}
- tapOn: 'Report'
- extendedWaitUntil:
    visible:
      id: 'chat-report'
    timeout: 5000
- tapOn: 'Bullying or harassment'
- tapOn: 'Also mute ${OTHER_NAME}'
- takeScreenshot: chat-report-sheet
- tapOn:
    id: 'chat-report-send'
- extendedWaitUntil:
    visible:
      text: 'Thanks. Our team will take a look.'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: ${OTHER_MESSAGE}
    timeout: 30000
