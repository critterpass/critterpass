appId: app.critterpass.dev
---
# Report a crewmate's message with a reason, muting them at the same time; their messages leave
# this device's timeline and a thank-you toast confirms the report.
#
# Data: the demo crew's chat, where Jordan Demo asked about Uluwatu.
- runFlow: subflows/open-demo-chat.yaml
- longPressOn: 'Can we do Uluwatu at sunset on day two\?'
- tapOn: 'Report'
- extendedWaitUntil:
    visible:
      id: 'chat-report'
    timeout: 5000
- tapOn: 'Bullying or harassment'
# The switch, not its title: only the switch flips the row. The switch's accessibility text adds
# its state to the title, which the plain title does not match.
- tapOn:
    text: 'Also mute Jordan.+'
- assertVisible:
    text: 'Also mute Jordan.+'
    checked: true
- takeScreenshot: chat-report-sheet
# Don't wait for the timeline to settle after the tap: the muted sender's rows animate out for
# longer than the thank-you toast stays up. Android folds the toast into one node.
- tapOn:
    id: 'chat-report-send'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      text: '.*Thanks\. Our team will take a look\..*'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: 'Can we do Uluwatu at sunset on day two\?'
    timeout: 30000
