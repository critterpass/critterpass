appId: app.critterpass.dev
---
# Screenshots of the crew chat's states for review against 3g-1: the timeline, the attach menu,
# the recorder bar and the empty chat of a new crew.
#
# Data: the demo crew's chat, then a crew this account starts, which has no messages yet.
- runFlow: subflows/open-demo-chat.yaml
- takeScreenshot: chat-3g-1-timeline
- tapOn: 'Add attachment'
- extendedWaitUntil:
    visible:
      # The sheet's panel: iOS leaves the sheet's full-screen root out of its hierarchy.
      id: 'chat-attach-panel'
    timeout: 5000
- takeScreenshot: chat-attach-menu
- tapOn: 'Voice note'
- extendedWaitUntil:
    visible:
      id: 'chat-recorder'
    timeout: 10000
- takeScreenshot: chat-voice-recorder
- tapOn: 'Cancel'
- openLink: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 10000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Quiet Crew'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 20000
- tapOn:
    id: 'start-crew-done'
# Make the new crew the active one, so Home's chat button opens its chat.
- openLink: critterpass-dev://crew
- extendedWaitUntil:
    visible:
      id: 'crews-sheet'
    timeout: 10000
- tapOn: 'Quiet Crew'
- extendedWaitUntil:
    notVisible:
      id: 'crews-sheet'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'home-header-chat'
    timeout: 15000
- tapOn:
    id: 'home-header-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-empty'
    timeout: 15000
- takeScreenshot: chat-empty
