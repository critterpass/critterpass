appId: app.critterpass.dev
---
# 3g-1: this device writes to the crew and a crewmate on another device answers. The other side is
# the staging demo seed: reseeding while this account's message is the newest makes Maya Demo
# reply through the api, and the reply reaches this device through sync.
- runFlow: subflows/open-demo-chat.yaml
- takeScreenshot: chat-3g-1-open
- tapOn:
    text: 'Message.*'
# Short on purpose: on the Android emulator each typed character can take seconds, and one
# inputText must finish inside the driver's two-minute call deadline.
- inputText: 'at six'
- tapOn: 'Send'
- extendedWaitUntil:
    visible:
      text: 'at six'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: 'Sending'
    timeout: 30000
# Back to Home (on Android the first back may only close the keyboard).
- runFlow: ../onboarding/subflows/back.yaml
- runFlow:
    when:
      notVisible:
        id: 'dev-tools-entry'
    file: ../onboarding/subflows/back.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo
- tapOn:
    id: 'home-header-chat'
- extendedWaitUntil:
    visible:
      text: 'Got it, see you there.*'
    timeout: 30000
- assertVisible: 'at six'
- takeScreenshot: chat-3g-1-conversation
