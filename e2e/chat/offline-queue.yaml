appId: app.critterpass.dev
---
# Offline, a message shows at once as sending under the "send when you're back" banner; back
# online it is delivered once, in order after what was already there.
#
# Needs before it can pass: an onboarded account that is an active member of crew ${CREW_ID}. The
# runner toggles airplane mode around the marked steps (`xcrun simctl status_bar` cannot cut the
# network; use the Network Link Conditioner "100% Loss" profile on iOS, `adb shell svc wifi/data`
# on Android).
- launchApp
- openLink: critterpass-dev://crew/${CREW_ID}/chat
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 15000
# Runner: network off here.
- extendedWaitUntil:
    visible:
      id: 'chat-offline'
    timeout: 20000
- tapOn:
    text: 'Message.*'
- inputText: 'we made it!!'
- tapOn: 'Send'
- assertVisible: 'Sending'
- takeScreenshot: chat-3k-4-offline-sending
# Runner: network back on here.
- extendedWaitUntil:
    notVisible:
      text: 'Sending'
    timeout: 60000
- assertVisible: 'we made it!!'
- takeScreenshot: chat-offline-delivered
