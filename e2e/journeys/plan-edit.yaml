appId: app.critterpass.dev
env:
  # A word Đà Nẵng answers with many rows: the first row with a + is added, and its name (read from
  # Add to plan) is followed through the journey. Then a market whose page is saved to Ideas.
  ADD_QUERY: 'cafe'
  SAVE_QUERY: 'Han Market'
---
# Journey: editing the plan of a trip that is on. A new account starts as the `trip_today`
# scenario (a locked three-day Đà Nẵng trip, its plan of editorial places). TRIPS → PLAN opens day
# 1; its add bar searches "cafe", Add to plan puts the first place it can add on the day; the
# stop's sheet moves it to day 2. A place page's ♡ saves another place and Ideas lists it. After
# a relaunch, day 2 has the moved stop. The stop and the idea are found
# by the names the app showed when they were picked.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: trip_today
- runFlow: subflows/pass-trip-welcome.yaml
- runFlow: subflows/open-day-plan.yaml
- tapOn:
    id: 'day-plan-day-chips-1'
- extendedWaitUntil:
    visible:
      id: 'stop-[0-9]+'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: en-journey-plan-edit-day-1
# The add bar: search, Add to plan, ADD.
- scrollUntilVisible:
    element:
      id: 'day-plan-add'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: 'day-plan-add'
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
- tapOn:
    id: 'search-field'
- inputText: ${ADD_QUERY}
- extendedWaitUntil:
    visible:
      id: 'search-row-add-[0-9]+'
    timeout: 120000
- hideKeyboard
- tapOn:
    id: 'search-row-add-[0-9]+'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'plan-add-confirm'
      enabled: true
    timeout: 30000
- copyTextFrom:
    id: 'plan-add-name'
- evalScript: ${output.added = maestro.copiedText.replace(/[.*+?^()|[\]\\]/g, '.')}
- scrollUntilVisible:
    element:
      id: 'plan-add-confirm'
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 100
- tapOn:
    id: 'plan-add-confirm'
# ADD closes the sheet onto the search it came from, which may close too: back only while the
# search is still up, never past the day plan.
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'day-plan|search-screen'
    timeout: 15000
- repeat:
    while:
      visible:
        id: 'search-screen'
    times: 3
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.added}.*'
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: en-journey-plan-edit-added
# Its sheet moves it to day 2 (the first start that works on day 2 is taken when offered).
- tapOn:
    text: '(?iu).*${output.added}.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'plan-item-save'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-item-move-2'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: 'plan-item-move-2'
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    while:
      visible:
        id: 'plan-item-use-start'
    times: 3
    commands:
      - tapOn:
          id: 'plan-item-use-start'
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'plan-item-save'
      enabled: true
    timeout: 10000
- tapOn:
    id: 'plan-item-save'
- extendedWaitUntil:
    visible:
      id: 'island-toast-message|plan-item-confirm'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: 'plan-item-confirm'
    commands:
      - tapOn:
          id: 'plan-item-confirm-confirm'
- runFlow:
    when:
      visible:
        id: 'plan-item-sheet'
    file: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 15000
# A place page: ♡ saves it, and Ideas lists it.
- scrollUntilVisible:
    element:
      id: 'day-plan-add'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: 'day-plan-add'
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
- tapOn:
    id: 'search-field'
- inputText: ${SAVE_QUERY}
- extendedWaitUntil:
    visible:
      id: 'search-row-[0-9]+'
    timeout: 60000
- hideKeyboard
- tapOn:
    id: 'search-row-[0-9]+'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'place-detail-save|place-detail-saved'
    timeout: 30000
- copyTextFrom:
    id: 'place-detail-name'
- evalScript: ${output.saved = maestro.copiedText.replace(/[.*+?^()|[\]\\]/g, '.')}
- runFlow:
    when:
      visible:
        id: 'place-detail-save'
    commands:
      - tapOn:
          id: 'place-detail-save'
- extendedWaitUntil:
    visible:
      id: 'place-detail-saved'
    timeout: 15000
- repeat:
    while:
      notVisible:
        id: 'day-plan'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
# ALL DAYS sits at the head of the day, above wherever the last step left it scrolled.
- scrollUntilVisible:
    element:
      id: 'day-plan-all-days'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'day-plan-all-days'
- extendedWaitUntil:
    visible:
      id: 'all-days-ideas'
    timeout: 20000
- tapOn:
    id: 'all-days-ideas'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.saved}.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: en-journey-plan-edit-ideas
# Ideas, all days and the day plan are pushed over the tabs: back out to the tab bar.
- tapOn:
    id: 'plan-ideas-back'
- repeat:
    while:
      notVisible:
        id: 'tab-trips'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
# A relaunch, then the plan opens again from TRIPS: day 2 has the moved stop. The app can bring
# back a screen pushed over the tabs a moment after they show, so the tab bar is awaited again.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'tab-trips'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: subflows/pass-trip-welcome.yaml
- repeat:
    while:
      notVisible:
        id: 'tab-trips'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: subflows/open-day-plan.yaml
- tapOn:
    id: 'day-plan-day-chips-2'
- scrollUntilVisible:
    element:
      text: '(?iu).*${output.added}.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: en-journey-plan-edit-after-relaunch
