appId: app.critterpass.dev
---
# Journey: the way to Pass+. A new account starts as the `everyday` scenario (the Bali demo crew,
# on the free plan). The PASS tab is its profile; Settings has the plan row, which
# opens Your plan on the free plan; SEE PASS+ rises the paywall with the Pass+ visa and its button;
# "What's in each" opens the comparison, and closing it comes back to the paywall, which closes
# back onto Your plan. Nothing is bought: the build's only store is the real one (RevenueCat over
# Google Play or the App Store), so the journey stops before the store's sheet.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: everyday
# You: the PASS tab is the profile; Settings is its header's glass action.
- runFlow:
    file: ../_shared/tab.yaml
    env:
      TAB: pass
      LABEL: Pass
- extendedWaitUntil:
    visible:
      id: 'you-profile'
    timeout: 60000
- runFlow:
    file: ../_shared/tap.yaml
    env:
      ID: 'you-profile-settings'
      LABEL: 'Settings'
# Settings: the plan row.
- extendedWaitUntil:
    visible:
      id: 'you-settings-plan'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: premium-9.04-journey-settings-light
- tapOn:
    id: 'you-settings-plan'
# Your plan, on the free plan.
- extendedWaitUntil:
    visible:
      id: 'plan-free'
    timeout: 20000
- assertVisible:
    id: 'plan-summary'
- scrollUntilVisible:
    element:
      id: 'plan-upgrade'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: premium-9.17-journey-your-plan-light
- tapOn:
    id: 'plan-upgrade'
# The paywall: the visa and the button that would open the store's sheet (never tapped here).
- extendedWaitUntil:
    visible:
      id: 'paywall-visa'
    timeout: 20000
- assertVisible:
    id: 'paywall-buy'
- assertVisible:
    id: 'paywall-restore'
- waitForAnimationToEnd
- takeScreenshot: premium-9.10-journey-paywall-light
# What's in each: the comparison rises over the paywall (its link is in the paywall's footer).
- tapOn:
    id: 'paywall-compare'
- extendedWaitUntil:
    visible:
      id: 'compare-table'
    timeout: 20000
- assertVisible:
    id: 'compare-buy-pass'
- waitForAnimationToEnd
- takeScreenshot: premium-9.11-journey-whats-in-each-light
# Back: the comparison closes onto the paywall, and the paywall onto Your plan.
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'paywall-buy'
- extendedWaitUntil:
    notVisible:
      id: 'compare-table'
    timeout: 15000
- assertVisible:
    id: 'paywall-buy'
- runFlow:
    file: ../_shared/back-to.yaml
    env:
      MARK: 'plan-free'
- extendedWaitUntil:
    notVisible:
      id: 'paywall-buy'
    timeout: 15000
- assertVisible:
    id: 'plan-free'
- waitForAnimationToEnd
- takeScreenshot: premium-9.17-journey-back-on-your-plan-light
