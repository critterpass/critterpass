appId: app.critterpass.dev
---
# From Home with no crew yet: START A CREW, named "CP Test Sign-out" (the marker that lets
# erase-test-account.yaml erase this account later), and its join code kept in ${output.crewCode}.
# Ends on Home with the crew in the header.
- extendedWaitUntil:
    visible:
      id: 'home-first-run'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'home-start-crew'
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'CP Test Sign-out'
# START THE CREW rides on top of the keyboard.
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-code'
    timeout: 30000
- copyTextFrom:
    id: 'start-crew-code'
# iOS copies a spoken label: the code is its last six characters.
- evalScript: ${output.crewCode = maestro.copiedText.replace(/[^A-Z0-9]/g, '').slice(-6)}
- scrollUntilVisible:
    element:
      id: 'start-crew-done'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 100
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-header-crew-name'
    timeout: 30000
