appId: app.critterpass.dev
---
# Frees the staging test number (+65 9123 4567) before a journey saves a pass with it, and ends on
# the splash of a fresh install. Whoever holds the number is signed in to ("I already have a pass")
# and erased, but only when these flows made it (erase-test-account.yaml checks first). Journeys
# that use the number must not run at the same time on two devices: each would erase the other's
# account. Needs `-e OTP_TEST_CODE=<the api's OTP_TEST_CODE>`.
- runFlow: fresh-install.yaml
- extendedWaitUntil:
    visible:
      id: 'onboarding-sign-in'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
# The splash can still be settling after a cold start and drop the tap.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'onboarding-sign-in'
      - extendedWaitUntil:
          visible:
            id: 'phone-number'
          timeout: 10000
- runFlow: test-number-sign-in.yaml
# The number had an account (Home), a closed one a run left behind (the restore page: restored
# first, so the check still sees whose it is) or now has a new one without a pass (the name page).
- extendedWaitUntil:
    visible:
      id: 'home-screen|onboarding-name-field|you-closed-restore'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'you-closed-restore'
    commands:
      - tapOn:
          id: 'you-closed-keep'
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 60000
- runFlow: erase-test-account.yaml
