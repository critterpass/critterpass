appId: app.critterpass.dev
---
# From Home: the profile, then Settings, scrolled until the ACCOUNT row `you-settings-${ROW}` is
# whole and clear of the bottom edge, and waited for until it can be used (the account rows are
# off until the server has answered for the account).
- runFlow:
    file: ../../_shared/back-to.yaml
    env:
      MARK: 'home-screen|you-profile'
- runFlow:
    file: ../../_shared/tab.yaml
    env:
      TAB: pass
      LABEL: Pass
- extendedWaitUntil:
    visible:
      id: 'you-profile'
    timeout: 30000
- runFlow:
    file: ../../_shared/tap.yaml
    env:
      ID: 'you-profile-settings'
      LABEL: 'Settings'
- extendedWaitUntil:
    visible:
      id: 'you-settings'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'you-settings-${ROW}'
    direction: DOWN
    timeout: 60000
    # ACCOUNT is the last group: a fast scroll cannot pass it.
    speed: 70
    visibilityPercentage: 100
    centerElement: true
- extendedWaitUntil:
    visible:
      id: 'you-settings-${ROW}'
      enabled: true
    timeout: 60000
- waitForAnimationToEnd
