appId: app.critterpass.dev
---
# A member adds their one must-do from the guide's push link, it lands in the list, and the fit
# check the server runs shows on the row.
#
# Needs before it can pass: an onboarded account ${UID} taking part in a trip ${TRIP_ID} whose
# setup is on the must-dos step (the staging demo seed's setup scenario), destination places
# synced to the phone.
- launchApp
- openLink: critterpass-dev://trip/${TRIP_ID}/setup/must-dos/add
- extendedWaitUntil:
    visible:
      id: 'add-must-do-field'
    timeout: 20000
- inputText: 'ramen'
- extendedWaitUntil:
    visible:
      id: 'add-must-do-keep'
    timeout: 10000
- takeScreenshot: 3c-10-add-must-do
- tapOn:
    id: 'add-must-do-place-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'must-dos-screen'
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: '(?i)ramen.*'
    timeout: 10000
# The fit check runs on the server and reaches the row through sync.
- extendedWaitUntil:
    visible:
      id: 'must-do-pill-.*'
    timeout: 60000
- takeScreenshot: 3c-7-must-dos
