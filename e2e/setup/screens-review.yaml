appId: app.critterpass.dev
---
# The review subset of trip setup screenshots for review against 3c-3…3c-10, in English: the designed screens and
# each state around them, drawn by the real views from fixed scenes (developer tools, no backend).
- launchApp:
    clearState: true
- runFlow:
    file: ../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: setup
      READY: setup-scene-3c-3-when
- runFlow:
    file: subflows/review.yaml
    env:
      PREFIX: en
