appId: app.critterpass.dev
---
# Opens one trip setup scene from the dev list (apps/mobile/src/app/(dev)/setup.tsx), lets its
# motion settle, takes `${PREFIX}-${SCENE}` and goes back to the list.
# Slow: a fast swipe on iOS flings the list past the row before it is read.
- scrollUntilVisible:
    element:
      id: 'setup-scene-${SCENE}'
    direction: DOWN
    timeout: 60000
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: 'setup-scene-${SCENE}'
# A tap while the list is still settling only stops it: tap again when the row is still there.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: 'setup-scene-${SCENE}'
    commands:
      - tapOn:
          id: 'setup-scene-${SCENE}'
          # The first tap may still open the scene while this one looks for the row.
          optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${PREFIX}-${SCENE}
# Android: the system back (the corner sits under the status bar there); iOS: the corner button.
- runFlow:
    when:
      platform: Android
    commands:
      - back
# A scene with the keyboard up spends the first back on closing it.
- runFlow:
    when:
      platform: Android
      notVisible:
        id: 'setup-scene-list'
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      visible:
        id: 'setup-scene-back'
    commands:
      - tapOn:
          id: 'setup-scene-back'
# A scene with a sheet up hides everything outside the sheet from iOS's accessibility tree, the
# back control included; it still takes a tap where it sits (top right, under the status bar).
# Nothing of the lab in the tree (no back control, no list row) means that sheet is up.
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'setup-scene-.*'
    commands:
      - tapOn:
          point: 94%, 9%
