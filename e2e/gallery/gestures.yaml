appId: app.critterpass.dev
---
# Each component that pairs two gestures on one control: the tap and the other gesture both
# still fire on the device, and one never triggers the other. Every screenshot shows the state an
# action left behind. Coordinates are iPhone 17 points, and on Android the matching pixels on the
# 1080 × 2400 Pixel emulator (420 dpi), on the gallery pages as laid out today.

# Composer mic: a tap starts recording; a hold records only while held (so it stops on release),
# and a hold longer than a tap never counts as one.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Composer'
- tapOn: 'Record a voice message'
- extendedWaitUntil:
    visible: 'Stop and send voice message'
    timeout: 5000
- takeScreenshot: gesture-mic-tap-records
- longPressOn: 'Stop and send voice message'
- extendedWaitUntil:
    visible: 'Record a voice message'
    timeout: 5000
- takeScreenshot: gesture-mic-hold-released

# Story player, in its held state (the bars stand still, as while a reply panel is open; the
# playing story above it moves on by itself): a tap in the middle steps on, a tap on the start
# third steps back, and a hold steps nowhere.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'StoryPlayer'
- scrollUntilVisible:
    element: 'Slide 1 of 2.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: 'Slide 1 of 2.*'
- extendedWaitUntil:
    visible: 'Slide 2 of 2.*'
    timeout: 5000
- takeScreenshot: gesture-story-tap-steps
- tapOn:
    point: 15%, 50%
- extendedWaitUntil:
    visible: 'Slide 1 of 2.*'
    timeout: 5000
# A tap of that length would have stepped on: the hold leaves the slide where it is.
- longPressOn: 'Slide 1 of 2.*'
- assertVisible: 'Slide 1 of 2.*'
- takeScreenshot: gesture-story-hold-stays

# Day row: a tap opens the day; a drag reorders it without opening it.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'DayRow'
- tapOn: 'Day 2, Tue, Ubud centre.*'
- extendedWaitUntil:
    visible:
      id: 'day-row-opened'
      text: 'Opened Ubud centre'
    timeout: 5000
- takeScreenshot: gesture-day-row-tap-opens
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 200, 265
          end: 200, 440
          duration: 1500
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 540, 676
          end: 540, 1135
          duration: 1500
- extendedWaitUntil:
    visible: 'Day 3, Mon, Arrive \+ pool.*'
    timeout: 5000
- assertVisible:
    id: 'day-row-opened'
    text: 'Opened Ubud centre'
- takeScreenshot: gesture-day-row-drag-reorders

# Timeline block: the one-hour lunch is drawn 36 pt tall inside a touch area that grows to the
# minimum target (44 pt on iOS, 48 dp on Android). A tap at the touch area's top edge, a few
# points above the drawn block, selects it for the stepper, and a drag from the block moves it
# later. The tap is placed relative to the block so it holds on any screen size.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'DayTimeline'
- tapOn:
    id: 'timeline-block-lunch'
    point: '50%,3%'
- extendedWaitUntil:
    visible: 'Lunch · Biah Biah · 11:30.AM'
    timeout: 5000
- takeScreenshot: gesture-timeline-slop-tap-selects
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 148, 407
          end: 148, 443
          duration: 1500
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 390, 1048
          end: 390, 1143
          duration: 1500
# The pan activation distance eats part of the swipe, so the block lands 45 or 60 minutes later.
- extendedWaitUntil:
    visible: 'Lunch · Biah Biah · 12:(15|30).PM'
    timeout: 5000
- takeScreenshot: gesture-timeline-drag-moves
