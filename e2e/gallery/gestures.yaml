appId: app.critterpass.dev
---
# Each component that pairs two gestures on one control: the tap and the other gesture both
# still fire on the device, and one never triggers the other. Every screenshot shows the state an
# action left behind. Coordinates are iPhone 17 points on the gallery pages as laid out today.

# Composer mic: a tap starts recording; a hold records only while held (so it stops on release),
# and a hold longer than a tap never counts as one.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'Composer'
- tapOn: 'Record a voice message'
- extendedWaitUntil:
    visible: 'Stop and send voice message'
    timeout: 5000
- takeScreenshot: gesture-mic-tap-records
- longPressOn: 'Stop and send voice message'
- extendedWaitUntil:
    visible: 'Record a voice message'
    timeout: 5000
- takeScreenshot: gesture-mic-hold-released

# Story player: paused from its pill, a tap on the start third steps back and one in the middle
# steps on without resuming; a hold pauses while held and resumes on release.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'StoryPlayer'
- tapOn: 'Pause'
- extendedWaitUntil:
    visible: 'Play'
    timeout: 5000
# It may have auto-advanced before the pause landed: two taps on the start third step back to the
# first slide from anywhere.
- tapOn:
    point: 15%, 50%
- tapOn:
    point: 15%, 50%
- extendedWaitUntil:
    visible: 'Slide 1 of 3.*'
    timeout: 5000
- tapOn: 'Slide 1 of 3.*'
- extendedWaitUntil:
    visible: 'Slide 2 of 3.*'
    timeout: 5000
- takeScreenshot: gesture-story-tap-steps
# Only a hold that began can resume a pill pause, so the pill reading Pause proves the hold fired.
# The slide itself is not checked afterwards: once resumed it runs on while Maestro catches up.
- longPressOn: 'Slide 2 of 3.*'
- assertVisible: 'Pause'
- takeScreenshot: gesture-story-hold-resumes

# Day row: a tap opens the day; a drag reorders it without opening it.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'DayRow'
- tapOn: 'Day 2, Tue, Ubud centre.*'
- extendedWaitUntil:
    visible:
      id: 'day-row-opened'
      text: 'Opened Ubud centre'
    timeout: 5000
- takeScreenshot: gesture-day-row-tap-opens
- swipe:
    start: 200, 265
    end: 200, 440
    duration: 1500
- extendedWaitUntil:
    visible: 'Day 3, Mon, Arrive \+ pool.*'
    timeout: 5000
- assertVisible:
    id: 'day-row-opened'
    text: 'Opened Ubud centre'
- takeScreenshot: gesture-day-row-drag-reorders

# Timeline block: the one-hour lunch is drawn 36 pt tall; a tap 2 pt above it, inside its
# enlarged touch area, selects it for the stepper, and a drag from the block moves it later.
- runFlow:
    file: ../screens/subflows/open-gallery-component.yaml
    env:
      COMPONENT: 'DayTimeline'
- tapOn:
    point: 148, 387
- extendedWaitUntil:
    visible: 'Lunch · Biah Biah · 11:30.AM'
    timeout: 5000
- takeScreenshot: gesture-timeline-slop-tap-selects
- swipe:
    start: 148, 407
    end: 148, 443
    duration: 1500
# The pan activation distance eats part of the swipe, so the block lands 45 or 60 minutes later.
- extendedWaitUntil:
    visible: 'Lunch · Biah Biah · 12:(15|30).PM'
    timeout: 5000
- takeScreenshot: gesture-timeline-drag-moves
