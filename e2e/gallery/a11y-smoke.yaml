appId: app.critterpass.dev
---
# Accessibility smoke on the dev gallery: the controls the Jest audit covers render and stay
# reachable by their spoken labels at the AX3 text size, with Reduce Motion and increased contrast
# on. The gallery is reached through the home screen's "Developer tools" entry (never `openLink`).
- runFlow: ../screens/subflows/open-gallery.yaml
- tapOn:
    id: 'gallery-motion-reduced'
- tapOn:
    id: 'gallery-contrast-high'
- tapOn:
    id: 'gallery-font-scale-2'
- scrollUntilVisible:
    element:
      id: 'gallery-component-PillButton'
    direction: DOWN
    timeout: 90000
- tapOn:
    id: 'gallery-component-PillButton'
- extendedWaitUntil:
    visible:
      id: 'gallery-detail-PillButton'
    timeout: 15000
- assertVisible:
    text: '.*2x · high contrast.*'
- scrollUntilVisible:
    element:
      text: 'Leave crew'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Maybe later'
- takeScreenshot: a11y-pill-buttons-ax3
- scrollUntilVisible:
    element:
      id: 'gallery-fixture-small and long label'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 5
- takeScreenshot: a11y-pill-long-label-ax3

# The text field and its clear control at AX3.
- runFlow:
    file: ../screens/subflows/open-gallery-component-in.yaml
    env:
      COMPONENT: 'TextField'
      LOCALE: 'en'
      SCALE: '2'
- assertVisible: 'Email'
- takeScreenshot: a11y-text-field-ax3

# Header pills wrap their action label instead of cutting it off.
- runFlow:
    file: ../screens/subflows/open-gallery-component-in.yaml
    env:
      COMPONENT: 'HeaderPills'
      LOCALE: 'en'
      SCALE: '2'
- takeScreenshot: a11y-header-pills-ax3
