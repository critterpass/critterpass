appId: app.critterpass.dev
---
# A message to a place on a real account (staging demo crew): the traveller sees the exact text,
# taps SEND, and, while the desk's WhatsApp number is off, the api hands the text back to share
# from their own WhatsApp. The trip's messages then list the thread as a draft to share.
- runFlow:
    file: ../happy/subflows/fresh-account.yaml
    env:
      SEED: dev-seed-demo-caught-up
- tapOn:
    id: 'dev-tools-entry'
- runFlow: subflows/open-lab.yaml
- extendedWaitUntil:
    visible:
      text: 'Live message to .*'
    timeout: 60000
- tapOn:
    id: 'supplier-lab-live-draft'
- extendedWaitUntil:
    visible:
      id: 'vendor-draft-text'
    timeout: 15000
- tapOn:
    id: 'vendor-draft-send'
- extendedWaitUntil:
    visible:
      id: 'vendor-draft-(self-send|approved)'
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 20%
          end: 50%, 95%
- extendedWaitUntil:
    visible:
      id: 'supplier-lab-live-messages'
    timeout: 15000
- tapOn:
    id: 'supplier-lab-live-messages'
- extendedWaitUntil:
    visible:
      id: 'vendor-thread-(self_send|draft|approved)'
    timeout: 30000
