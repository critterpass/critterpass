appId: app.critterpass.dev
---
# Opens one supplier lab scene (apps/mobile/src/app/(dev)/supplier-lab.tsx), waits for `${READY}`, takes
# `${SHOT}` and goes back to the list (Android back, iOS edge swipe).
- scrollUntilVisible:
    element:
      id: 'supplier-lab-${SCENE}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'supplier-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      platform: Android
    commands:
      - back
      # A sheet scene takes the first back itself (the sheet closes); the second leaves the scene.
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            notVisible:
              id: 'supplier-lab-${SCENE}'
          commands:
            - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'supplier-lab-${SCENE}'
    timeout: 10000
