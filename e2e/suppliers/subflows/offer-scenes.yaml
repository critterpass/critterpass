        SCENE: book-expired,
        READY: supplier-book-hold_expired,
        SHOT: '${PREFIX}-supplier-book-expired',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: book-unavailable,
        READY: supplier-book-unavailable,
        SHOT: '${PREFIX}-supplier-book-unavailable',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: cancel-quote,
        READY: supplier-cancel-refund,
        SHOT: '${PREFIX}-supplier-cancel-quote',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: cancel-not-cancellable,
        READY: supplier-cancel-quote,
        SHOT: '${PREFIX}-supplier-cancel-not-cancellable',
