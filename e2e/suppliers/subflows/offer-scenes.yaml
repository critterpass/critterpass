        READY: supplier-book-hold-line,
        SHOT: '${PREFIX}-supplier-book-not-held',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: book-payment-failed,
        READY: supplier-book-error,
        SHOT: '${PREFIX}-supplier-book-payment-failed',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: book-pending,
        READY: supplier-book-pending_operator,
        SHOT: '${PREFIX}-supplier-book-pending',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: book-confirmed,
        READY: supplier-book-confirmed,
        SHOT: '${PREFIX}-supplier-book-confirmed',
      }
- runFlow:
