appId: app.critterpass.dev
---
# Supplier offers (6f-1), the Viator booking sheet and the cancel sheet, prefixed `${PREFIX}`.
- runFlow:
    file: scene.yaml
    env: { SCENE: offers-links, READY: supplier-offer-klook, SHOT: '${PREFIX}-6f-1-links' }
- runFlow:
    file: scene.yaml
    env: { SCENE: offers-live, READY: supplier-offer-viator-5510BATUR, SHOT: '${PREFIX}-6f-1-live' }
- runFlow:
    file: scene.yaml
    env: { SCENE: offers-loading, READY: supplier-offers-loading, SHOT: '${PREFIX}-6f-1-loading' }
- runFlow:
    file: scene.yaml
    env: { SCENE: offers-offline, READY: supplier-offers-notice, SHOT: '${PREFIX}-6f-1-offline' }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: offers-partner-off, READY: supplier-offer-error, SHOT: '${PREFIX}-6f-1-partner-off' }
- runFlow:
    file: scene.yaml
    env: { SCENE: book-choose, READY: supplier-book-choose, SHOT: '${PREFIX}-supplier-book-choose' }
- runFlow:
