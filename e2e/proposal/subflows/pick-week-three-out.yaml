appId: app.critterpass.dev
---
# The dates step's day picker, as organiser: a week starting three weeks from today (Vietnam
# time), far enough out that a proposal can still be answered. The sheet opens on the month of the
# suggested week, which can be another one; the shared pick-days subflow turns it to each day's
# month and taps the first and the last day by their ids.
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
- evalScript: ${output.pickDate = new Date(Date.now() + 7 * 3600000 + 21 * 86400000).toISOString().slice(0, 10)}
- runFlow:
    file: ../../happy/subflows/pick-days.yaml
    env:
      PICK_DATE: ${output.pickDate}
      PICK_DAYS: 7
- tapOn:
    id: 'picker-lock'
