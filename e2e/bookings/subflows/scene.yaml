appId: app.critterpass.dev
---
# Opens one bookings lab scene (apps/mobile/src/app/(dev)/bookings-lab.tsx), waits for `${READY}`, takes
# `${SHOT}` and goes back to the list (Android back; iOS reopens the lab from Home).
- scrollUntilVisible:
    element:
      id: 'bookings-lab-${SCENE}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'bookings-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      platform: Android
    commands:
      - back
      # A sheet scene takes the first back itself (the sheet closes); the second leaves the scene.
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            notVisible:
              id: 'bookings-lab-${SCENE}'
          commands:
            - back
# iOS reopens the lab from Home rather than swiping back from the edge: a scene's gestures or
# sheet can take the swipe, and the list never comes back.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ../../home/subflows/open-dev-tools.yaml
      - runFlow: open-lab.yaml
- extendedWaitUntil:
    visible:
      id: 'bookings-lab-${SCENE}'
    timeout: 10000
