appId: app.critterpass.dev
---
# Screenshots of the insurance card and policy form for `pnpm screens:compare`: the bookings lab's scenes over the Bali Six
# fixtures, named by state.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow: subflows/open-lab.yaml
- runFlow:
    file: subflows/insurance-scenes.yaml
    env: { PREFIX: en }
