appId: app.critterpass.dev
---
# A link opened with the app closed puts a pushed page on screen with nothing under it. The page
# waits for the session (the loading state, never "That didn't load"), and its back control lands on
# Home instead of doing nothing.
#
# A fresh account, then the inbox link with the app stopped.
- runFlow: ../home/subflows/fresh-install.yaml
- runFlow: ../home/subflows/onboard.yaml
- extendedWaitUntil:
    visible:
      id: 'home-join-code'
    timeout: 60000
- stopApp
- openLink: critterpass-dev://inbox
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'inbox-back'
    timeout: 60000
- assertVisible:
    id: 'inbox-screen'
- assertNotVisible: '(?i)that didn.t load'
- waitForAnimationToEnd
- takeScreenshot: cold-entry-inbox
- tapOn:
    id: 'inbox-back'
- extendedWaitUntil:
    visible:
      id: 'home-join-code'
    timeout: 30000
- assertNotVisible:
    id: 'inbox-screen'
- waitForAnimationToEnd
- takeScreenshot: cold-entry-back-home
