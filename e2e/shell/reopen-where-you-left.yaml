appId: app.critterpass.dev
---
# The app is closed on a screen and opened again within half an hour: the same screen comes back
# with its data, never "That didn't load". A cold start restores the saved screen only once the
# session's local database is open, so the screen has something to read.
#
# Two screens that read the local database as they mount: a booking's details (the flight pasted
# by e2e/happy/bookings.yaml on a fresh account with the demo trip) and the trip's money. A sheet
# is never reopened: closed on the guide sheet, the app comes back on Home, the screen under it.
- runFlow: ../happy/bookings.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'bookings-detail'
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: '.*K7Q2PX.*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: reopen-booking-detail

- openLink: critterpass-dev://wallet/money
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'money-balances'
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'money-balances'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: reopen-trip-money

- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'guide-fab'
    timeout: 30000
- tapOn:
    id: 'guide-fab'
- extendedWaitUntil:
    visible:
      id: 'guide-composer'
    timeout: 15000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'guide-fab'
    timeout: 60000
# The restore runs once the session is up; give it its moment before looking for the sheet.
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: 'guide-composer'
- takeScreenshot: reopen-under-guide-sheet
- assertNotVisible: '(?i)that didn.t load'
