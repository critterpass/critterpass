appId: app.critterpass.dev
---
# Sheets and rise modals from the gallery demos (apps/mobile/src/app/(dev)/gallery/sheet-demo.tsx,
# rise-demo.tsx), reached by tapping through "Developer tools" → "Component gallery" (never
# `openLink` into a (dev) route: see e2e/critters/sticker-lab.yaml). Covers the mandatory ✕,
# drag-dismiss from the grab zone, a short drag that springs back, detent snapping and, on
# Android, system back closing the sheet.
# A plain relaunch reopens the last screen, so state is cleared; the launch then fetches the
# freshly published JS before its first render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-shell-sheet'
    timeout: 10000

# ✕ dismisses.
- tapOn:
    id: 'gallery-shell-sheet'
- extendedWaitUntil:
    visible:
      id: 'sheet-panel'
    timeout: 5000
- tapOn:
    id: 'sheet-close'
- extendedWaitUntil:
    notVisible:
      id: 'sheet-panel'
    timeout: 5000

# Medium detent: a short drag springs back, a drag up snaps to large, a long drag down from the
# grab zone steps back to medium and then dismisses.
- tapOn:
    id: 'gallery-shell-sheet'
- extendedWaitUntil:
    visible:
      id: 'sheet-panel'
    timeout: 5000
- swipe:
    start: 50%, 53%
    end: 50%, 58%
    duration: 400
- assertVisible:
    id: 'sheet-panel'
- swipe:
    start: 50%, 53%
    end: 50%, 20%
    duration: 400
- assertVisible:
    id: 'sheet-demo-Row 1'
- swipe:
    start: 50%, 16%
    end: 50%, 60%
    duration: 300
- assertVisible:
    id: 'sheet-panel'
- swipe:
    start: 50%, 53%
    end: 50%, 95%
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: 'sheet-panel'
    timeout: 5000

# Android: system back closes the sheet.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'gallery-shell-sheet'
      - extendedWaitUntil:
          visible:
            id: 'sheet-panel'
          timeout: 5000
      - pressKey: back
      - extendedWaitUntil:
          notVisible:
            id: 'sheet-panel'
          timeout: 5000
      - assertVisible:
          id: 'gallery-shell-sheet'

# Rise modal: ✕, then a drag from its taller grab zone.
- tapOn:
    id: 'gallery-shell-rise'
- extendedWaitUntil:
    visible:
      id: 'rise-panel'
    timeout: 5000
- tapOn:
    id: 'rise-close'
- extendedWaitUntil:
    notVisible:
      id: 'rise-panel'
    timeout: 5000
- tapOn:
    id: 'gallery-shell-rise'
- extendedWaitUntil:
    visible:
      id: 'rise-panel'
    timeout: 5000
- swipe:
    start: 50%, 12%
    end: 50%, 90%
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: 'rise-panel'
    timeout: 5000
