appId: app.critterpass.dev
---
# Shell tab bar: reaches the gallery's tab demo (apps/mobile/src/app/(dev)/gallery/tabs/) by tapping
# through "Developer tools" → "Component gallery" (never `openLink` into a (dev) route: see
# e2e/critters/sticker-lab.yaml). Switches every tab, then exercises the guide button: a tap opens
# the guide sheet, a long-press (320 ms) the Help hub lookup and not the sheet.
# A plain relaunch reopens the last screen, so state is cleared; the launch then fetches the
# freshly published JS before its first render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-gallery'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-shell-tabs'
    timeout: 10000
- tapOn:
    id: 'gallery-shell-tabs'

- extendedWaitUntil:
    visible:
      id: 'gallery-tab-index'
    timeout: 10000
- assertVisible:
    id: 'tab-bar'
- assertVisible:
    id: 'guide-fab'

- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'gallery-tab-trips'
    timeout: 5000
- tapOn:
    id: 'tab-wallet'
- extendedWaitUntil:
    visible:
      id: 'gallery-tab-wallet'
    timeout: 5000
- tapOn:
    id: 'tab-pass'
- extendedWaitUntil:
    visible:
      id: 'gallery-tab-pass'
    timeout: 5000
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'gallery-tab-index'
    timeout: 5000

# The guide button's tap opens the guide sheet (its root id isn't in iOS's accessibility tree; its
# composer is). No tap retry: on a slow Android emulator the sheet hasn't changed the screen when
# Maestro checks, and its retry lands a second touch on the button mid-transition, which opens
# Help instead.
- tapOn:
    id: 'guide-fab'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'guide-composer'
    timeout: 15000
- assertNotVisible:
    id: 'shell-target-help'
- waitForAnimationToEnd
# The sheet has no ✕: its scrim closes it.
- tapOn:
    point: 50%, 8%
- extendedWaitUntil:
    notVisible:
      id: 'guide-composer'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'guide-fab'
    timeout: 5000

# The guide button's long-press (320 ms) wins over its tap: Help opens, the guide sheet does not.
- longPressOn:
    id: 'guide-fab'
- extendedWaitUntil:
    visible:
      id: 'shell-target-help'
    timeout: 5000
- assertNotVisible:
    id: 'guide-composer'
