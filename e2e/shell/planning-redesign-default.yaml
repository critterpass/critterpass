appId: app.critterpass.dev
---
# A fresh install, signed out, from the splash: Developer tools reads the planning redesign as on
# with no override, from the default before the public config syncs or from the synced config once
# it has (staging syncs it within seconds; the unit tests pin the default itself).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# The section sits near the top of the list, under the demo data buttons.
- extendedWaitUntil:
    visible:
      id: 'dev-planning-redesign-source-(default|config)'
    timeout: 30000
- assertVisible:
    id: 'dev-planning-redesign-state-on'
- waitForAnimationToEnd
- takeScreenshot: shell-planning-redesign-default
