appId: app.critterpass.dev
---
# Opens one money lab scene (apps/mobile/src/app/(dev)/money-lab.tsx), waits for `${READY}`, takes
# `${SHOT}` and goes back to the list (Android back, iOS edge swipe).
- scrollUntilVisible:
    element:
      id: 'money-lab-${SCENE}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'money-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'money-lab-${SCENE}'
    timeout: 10000
