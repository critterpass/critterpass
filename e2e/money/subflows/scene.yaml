appId: app.critterpass.dev
---
# Opens one money lab scene (apps/mobile/src/app/(dev)/money-lab.tsx), waits for `${READY}`, takes
# `${SHOT}` and goes back to the list (Android back; iOS drags back from the edge or reopens the lab).
# The list keeps its place between scenes, and a scene can sit above the last one opened (scan-aim
# is listed before scan-failure): look up first, then down.
- runFlow:
    when:
      notVisible:
        id: 'money-lab-${SCENE}'
    commands:
      - scrollUntilVisible:
          element:
            id: 'money-lab-${SCENE}'
          direction: UP
          timeout: 10000
          optional: true
- scrollUntilVisible:
    element:
      id: 'money-lab-${SCENE}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'money-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      platform: Android
    commands:
      - back
# iOS: a slow drag from the very edge pops the scene; when a scene's gestures or sheet take it
# and the list isn't back, the lab is reopened from Home.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 0%, 50%
          end: 85%, 50%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'money-lab-${SCENE}'
    commands:
      - runFlow: ../../home/subflows/open-dev-tools.yaml
      - runFlow: open-lab.yaml
      # The reopened list starts at its top.
      - scrollUntilVisible:
          element:
            id: 'money-lab-${SCENE}'
          direction: DOWN
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'money-lab-${SCENE}'
    timeout: 10000
