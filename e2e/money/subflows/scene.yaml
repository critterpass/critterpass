appId: app.critterpass.dev
---
# Opens one money lab scene (apps/mobile/src/app/(dev)/money-lab.tsx), waits for `${READY}`, takes
# `${SHOT}` and goes back to the list (Android back; iOS reopens the lab from Home).
- scrollUntilVisible:
    element:
      id: 'money-lab-${SCENE}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'money-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      platform: Android
    commands:
      - back
# iOS reopens the lab from Home rather than swiping back from the edge: a scene's gestures or
# sheet can take the swipe, and the list never comes back.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ../../home/subflows/open-dev-tools.yaml
      - runFlow: open-lab.yaml
- extendedWaitUntil:
    visible:
      id: 'money-lab-${SCENE}'
    timeout: 10000
