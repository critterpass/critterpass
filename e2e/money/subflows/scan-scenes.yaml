appId: app.critterpass.dev
---
# The receipt scan (3i-3, 3i-4) and the steps around it, prefixed `${PREFIX}`.
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-review, READY: money-review, SHOT: '${PREFIX}-3i-3-scan' }
# Who had a line, for a crew too big for one screen: the avatars scroll inside the sheet and
# EVERYONE and DONE stay at its foot.
- runFlow:
    file: scene.yaml
    env:
      { SCENE: scan-assign-crowd, READY: money-member-done, SHOT: '${PREFIX}-money-assign-crowd' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: scan-check-lines,
        READY: money-review-check-l4,
        SHOT: '${PREFIX}-money-scan-check-lines',
      }
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-failure, READY: money-failure, SHOT: '${PREFIX}-3i-4-cant-read' }
# The scenes from here are listed above the ones before: back to the top of the list first, since
# it keeps its place (a downward scroll from scan-failure never reaches scan-aim).
- scrollUntilVisible:
    element:
      id: 'money-lab-balances'
    direction: UP
    timeout: 20000
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-aim, READY: money-scan-aim, SHOT: '${PREFIX}-money-scan-aim' }
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-denied, READY: money-scan-denied, SHOT: '${PREFIX}-money-scan-denied' }
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-reading, READY: money-scan-reading, SHOT: '${PREFIX}-money-scan-reading' }
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-offline, READY: money-scan-offline, SHOT: '${PREFIX}-money-scan-offline' }
- runFlow:
    file: scene.yaml
    env: { SCENE: scan-type-lines, READY: money-type-lines, SHOT: '${PREFIX}-money-type-lines' }
