appId: app.critterpass.dev
---
# Settle up (3i-5) and the payment screens around it, prefixed `${PREFIX}`.
- runFlow:
    file: scene.yaml
    env: { SCENE: settle, READY: money-settle, SHOT: '${PREFIX}-3i-5-settle' }
- runFlow:
    file: scene.yaml
    env: { SCENE: settle-nothing, READY: money-settle, SHOT: '${PREFIX}-money-settle-nothing' }
- runFlow:
    file: scene.yaml
    env: { SCENE: settle-square, READY: money-settled-tokek, SHOT: '${PREFIX}-money-settle-square' }
- runFlow:
    file: scene.yaml
    env: { SCENE: payment-payer, READY: money-payment, SHOT: '${PREFIX}-money-payment-payer' }
- runFlow:
    file: scene.yaml
    env: { SCENE: payment-disputed, READY: money-payment, SHOT: '${PREFIX}-money-payment-disputed' }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: payout-methods, READY: money-payout-methods, SHOT: '${PREFIX}-money-payout-methods' }
