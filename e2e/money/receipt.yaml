appId: app.critterpass.dev
---
# The receipt scan screens over the drawn Ibu Oka receipt in the money lab: the itemised review
# (3i-3: Jordan pays $1.50, everyone else $13.34), the crumpled receipt's three ways forward (3i-4)
# and the steps around them. The live scan stays behind the `money.receipts` flag until the receipt
# eval passes on real photos, and needs a build with the on-device reader.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow: subflows/open-lab.yaml
- runFlow:
    file: subflows/scan-scenes.yaml
    env:
      PREFIX: en
