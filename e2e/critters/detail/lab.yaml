appId: app.critterpass.dev
---
# Critter detail (3l-3): a guide's own critter with two forms found, wearing its rare look, with
# all four forms, and a local critter, in English then Vietnamese: the critters lab's fixed-data
# scenes (apps/mobile/src/app/(dev)/critters-lab.tsx), named `<lang>-<design id>-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-critters-lab'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: 'dev-nav-critters-lab'
- extendedWaitUntil:
    visible:
      id: 'critters-lab-3l-2-pass'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'critters-lab-3l-3-detail'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'critters-lab-3l-3-detail'
- extendedWaitUntil:
    visible:
      id: 'critters-detail'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-3-detail
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
# The swipe back can overshoot to the developer tools list or the splash; step back into the lab.
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- runFlow:
    when:
      notVisible:
        id: 'critters-lab-3l-3-detail'
    commands:
      - scrollUntilVisible:
