appId: app.critterpass.dev
---
# The screens that look different on an iPhone: the hatch ceremony (3l-1), the encounter's hold
# ring once ready (3l-4) and the here-now card's form labels on one line (3l-2), in English.
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-1-hatch'
- extendedWaitUntil:
    visible:
      id: 'critters-hatched'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-1-hatch
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-4-ready'
- extendedWaitUntil:
    visible:
      id: 'critters-encounter-hold'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-4-ready
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-pass'
- extendedWaitUntil:
    visible:
      id: 'critters-here-now'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-pass
