appId: app.critterpass.dev
---
# Type and layout against the renders: the PASS counter, the here-now header and the home set's
# title (3l-2), and the hatch ceremony's welcome, egg and hatched line (3l-1) in English and
# Vietnamese, with a Đà Nẵng trip's red egg.
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-pass'
- extendedWaitUntil:
    visible:
      id: 'critters-here-now'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-pass
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-here-now-long-place'
- extendedWaitUntil:
    visible:
      id: 'critters-here-now'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-here-now-long-place
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-1-egg-cracking'
- extendedWaitUntil:
    visible:
      id: 'critters-hatched'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-1-egg-cracking
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-1-egg-chava'
- extendedWaitUntil:
    visible:
      id: 'critters-hatched'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-1-egg-chava
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-locale-vi'
    timeout: 15000
- tapOn:
    id: 'gallery-locale-vi'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
# Going back lands on the developer tools list or, on some runs, on the splash.
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-critters-lab'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: 'dev-nav-critters-lab'
- extendedWaitUntil:
    visible:
      id: 'critters-lab-3l-2-pass'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'critters-lab-3l-1-egg-cracking'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'critters-lab-3l-1-egg-cracking'
- extendedWaitUntil:
    visible:
      id: 'critters-hatched'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-3l-1-egg-cracking
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- scrollUntilVisible:
    element:
      id: 'critters-lab-3l-1-egg-chava'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'critters-lab-3l-1-egg-chava'
- extendedWaitUntil:
    visible:
      id: 'critters-hatched'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-3l-1-egg-chava
