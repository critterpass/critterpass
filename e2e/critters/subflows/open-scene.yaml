appId: app.critterpass.dev
---
# Opens one critters lab scene (${SCENE}) from a fresh launch, through the developer tools list.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-critters-lab'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'dev-nav-critters-lab'
- extendedWaitUntil:
    visible:
      id: 'critters-lab-3l-2-pass'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'critters-lab-${SCENE}'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'critters-lab-${SCENE}'
