appId: app.critterpass.dev
---
# The trip egg's shape wherever it is drawn: the PASS egg card (waiting, ready, hatched but unseen)
# and the hatch ceremony held on its wobble and its crack (3l-1), in English, plus the here-now
# header with a short and a long place name.
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-egg-waiting'
- extendedWaitUntil:
    visible:
      id: 'critters-egg-waiting'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-egg-waiting
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-egg-ready'
- extendedWaitUntil:
    visible:
      id: 'critters-egg-ready'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-egg-ready
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-egg-unseen'
- extendedWaitUntil:
    visible:
      id: 'critters-egg-unseen'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-egg-unseen
# The here-now header beside the egg card: the place and the form count never overlap, with a
# long place name too.
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-2-here-now-long-place'
- extendedWaitUntil:
    visible:
      id: 'critters-here-now'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3l-2-here-now-long-place
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-1-egg-wobbling'
- extendedWaitUntil:
    visible:
      id: 'critters-hatch-egg-wobbling'
    timeout: 15000
- takeScreenshot: en-3l-1-egg-wobbling
- runFlow:
    file: subflows/open-scene.yaml
    env:
      SCENE: '3l-1-egg-cracking'
- extendedWaitUntil:
    visible:
      id: 'critters-hatch-egg-cracking'
    timeout: 15000
- takeScreenshot: en-3l-1-egg-cracking
