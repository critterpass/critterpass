appId: app.critterpass.dev
---
# The plan's views walked again by a fresh account on real staging (English, a locked five-day
# Bali plan drafted by the guide, the planning screens on for this phone only). Each step is one a
# first-time traveller got stuck on; the assertions are the behaviour, the frames
# (`plan-rewalk-<nn>-<what>`) are the proof.
#   1. The trip map: a back arrow, the first camera on the day's stops, chips with something
#      behind them, days named by date.
#   2. Into a day from the collapsed sheet and back: "← Trip" lands on the trip map, on that day.
#   3. The half sheet: a stop tapped twice opens it over the map; pulled up, the sheet keeps the
#      day; ALL DAYS is the whole trip.
#   4. The day's map: a card opens the stop over the map and closes back to it.
#   5. All days: a day tapped there is the day shown underneath; "← Trip" still lands on the trip.
#   6. A stop moved from a card's MOVE A STOP, then the day's maps: neither is blank.
#   7. The places list and back: the day she was on. SHARE sends the plan. The back arrow leaves.
- runFlow:
    file: plan-views-subflows/locked-bali-plan.yaml
    env:
      SHOTS: plan-rewalk-00-setup
- extendedWaitUntil:
    visible:
      id: 'home-mode-.*'
    timeout: 60000
- runFlow: ../../happy/subflows/dismiss-visit-offer.yaml
- runFlow: ../../_shared/planning-redesign-on.yaml
- waitForAnimationToEnd
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline|trip-hub-header-.*'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'trip-hub-tile-plan'
# 1. The trip map.
- extendedWaitUntil:
    visible:
      id: 'trip-map-peek'
    timeout: 60000
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 10000
- assertVisible:
    id: 'trip-map-back'
# Nothing is saved and the crew is one person: no chip that would show nothing.
- assertNotVisible:
    id: 'chip-saved'
- assertNotVisible:
    id: 'chip-crew'
- takeScreenshot: plan-rewalk-01-trip-map-first-camera
- tapOn:
    id: 'trip-map-day-chips-2'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 6000
- takeScreenshot: plan-rewalk-02-trip-map-day-2
# 2. Into the day from the collapsed sheet, and back to the trip.
- tapOn:
    id: 'trip-map-peek-open-day-pill'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 6000
- takeScreenshot: plan-rewalk-03-day-plan-day-2
- scrollUntilVisible:
    element:
      id: 'stop-4'
    direction: DOWN
    timeout: 8000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: plan-rewalk-04-day-plan-day-2-lower
- scrollUntilVisible:
    element:
      id: 'day-plan-back'
    direction: UP
    timeout: 10000
- tapOn:
    id: 'day-plan-back'
- extendedWaitUntil:
    visible:
      id: 'trip-map-peek'
    timeout: 15000
- takeScreenshot: plan-rewalk-05-back-on-trip-map-day-2
# 3. The half sheet.
- swipe:
    start: 50%, 70%
    end: 50%, 46%
    duration: 700
- extendedWaitUntil:
    visible:
      id: 'trip-map-half'
    timeout: 10000
- assertVisible:
    id: 'trip-map-open-day-pill'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: plan-rewalk-06-half-day-2
- tapOn:
    id: 'stop-2'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 3000
- takeScreenshot: plan-rewalk-07-half-stop-2-on-the-map
- tapOn:
    id: 'stop-2'
- extendedWaitUntil:
    visible:
      id: 'plan-item-sheet'
    timeout: 10000
- takeScreenshot: plan-rewalk-08-stop-2-opened-over-the-map
- back
- extendedWaitUntil:
    visible:
      id: 'trip-map-half'
    timeout: 10000
# Pulled up to read the rest of the day: the sheet keeps the day.
- swipe:
    start: 50%, 60%
    end: 50%, 15%
    duration: 700
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'trip-map-half'
- assertNotVisible:
    id: 'trip-map-full'
- assertNotVisible:
    id: 'trip-map-stop-label'
- takeScreenshot: plan-rewalk-09-pulled-up-still-the-day
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: plan-rewalk-10-the-day-scrolled-to-its-end
- scrollUntilVisible:
    element:
      id: 'trip-map-all-days'
    direction: UP
    timeout: 10000
- tapOn:
    id: 'trip-map-all-days'
- extendedWaitUntil:
    visible:
      id: 'trip-map-full'
    timeout: 10000
- takeScreenshot: plan-rewalk-11-the-whole-trip
# The phone's back button brings the raised sheet straight down, keeping the day.
- back
- extendedWaitUntil:
    visible:
      id: 'trip-map-peek'
    timeout: 10000
- takeScreenshot: plan-rewalk-12-one-back-brings-the-sheet-down
- tapOn:
    id: 'trip-map-day-chips-3'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 5000
# 4. The day's map: a card opens the stop over the map.
- tapOn:
    id: 'trip-map-peek-open-day-pill'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- tapOn:
    id: 'day-plan-mini-map'
- extendedWaitUntil:
    visible:
      id: 'day-map'
    timeout: 15000
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: plan-rewalk-13-day-map-day-3
- tapOn:
    id: 'day-map-card-1'
- extendedWaitUntil:
    visible:
      id: 'plan-item-sheet'
    timeout: 10000
- takeScreenshot: plan-rewalk-14-day-map-card-opened-in-place
- back
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'day-map'
- takeScreenshot: plan-rewalk-15-closed-back-to-the-day-map
- tapOn:
    id: 'day-map-back'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 10000
# 5. All days, a day from the grid, and "← Trip".
- tapOn:
    id: 'day-plan-all-days'
- extendedWaitUntil:
    visible:
      id: 'all-days'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: plan-rewalk-16-all-days
- tapOn:
    id: 'all-days-card-4'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: plan-rewalk-17-day-4-from-all-days
- tapOn:
    id: 'day-plan-back'
- extendedWaitUntil:
    visible:
      id: 'trip-map'
    timeout: 15000
- assertNotVisible:
    id: 'all-days'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 5000
- takeScreenshot: plan-rewalk-18-trip-link-lands-on-the-trip-day-4
# 6. A stop moved with MOVE A STOP, then the maps of the day it left.
- tapOn:
    id: 'trip-map-open-day-pill|trip-map-peek-open-day-pill'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- tapOn:
    id: 'day-plan-all-days'
- extendedWaitUntil:
    visible:
      id: 'all-days'
    timeout: 15000
- tapOn:
    id: 'all-days-move-2'
- extendedWaitUntil:
    visible:
      id: 'move-stop-sheet'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Not shot: the screenshot check reads the dimmed page behind this sheet as a frame. The next
# frame shows the move it leads to.
# The day's second stop (never the must-do, which the draft puts first on its day).
- tapOn:
    id: 'move-stop-[0-9a-f]{8}-.*'
    index: 1
- extendedWaitUntil:
    visible:
      id: 'move-stop-days-5'
    timeout: 10000
- tapOn:
    id: 'move-stop-days-5'
- extendedWaitUntil:
    visible:
      id: 'move-preview-confirm|move-preview-ok'
    timeout: 10000
- takeScreenshot: plan-rewalk-20-move-preview
- tapOn:
    id: 'move-preview-confirm|move-preview-ok'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: plan-rewalk-21-all-days-after-the-move
- tapOn:
    id: 'all-days-card-2'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 15000
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 6000
- takeScreenshot: plan-rewalk-22-day-2-after-the-move-mini-map
- tapOn:
    id: 'day-plan-mini-map'
- extendedWaitUntil:
    visible:
      id: 'day-map'
    timeout: 15000
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: plan-rewalk-23-day-map-after-the-move
- tapOn:
    id: 'day-map-back'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 10000
# 7. SHARE, the places list and back, and the way out.
- tapOn:
    id: 'day-plan-share'
- extendedWaitUntil:
    visible:
      id: 'plan-share-send'
    timeout: 10000
- takeScreenshot: plan-rewalk-24-share-sends-the-plan
- back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'day-plan-back'
- extendedWaitUntil:
    visible:
      id: 'trip-map'
    timeout: 15000
- tapOn:
    id: 'trip-map-list'
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 5000
- takeScreenshot: plan-rewalk-25-places-list
- back
- extendedWaitUntil:
    visible:
      id: 'trip-map'
    timeout: 15000
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: plan-rewalk-26-back-from-places-still-day-2
# The phone's back button brings a raised sheet straight down, then leaves the map: two presses at
# most, and the back arrow leaves at once.
- tapOn:
    id: 'trip-map-back'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|trip-hub'
    timeout: 15000
- takeScreenshot: plan-rewalk-27-back-arrow-leaves-to-the-hub
