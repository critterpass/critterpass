appId: app.critterpass.dev
---
# What she can do on the day itself, walked in English by a fresh account on real staging (a
# three-day Đà Nẵng trip that starts today, locked in alone, the planning screens on for this phone
# only). The steps and what each frame proves are in subflows/on-trip-day-actions.yaml.
- runFlow:
    file: subflows/on-trip-start-english.yaml
    env:
      SHOTS: day-actions-en-00-setup
- runFlow:
    file: subflows/on-trip-day-actions.yaml
    env:
      SHOTS: day-actions-en
