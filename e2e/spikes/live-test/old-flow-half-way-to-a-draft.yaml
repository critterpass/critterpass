appId: app.critterpass.dev
---
# A trip stopped half way through the earlier set-up (dates and budget locked, no draft), opened
# with the new planning screens on, carried on to a draft from where the new screens send her:
# PLAN's LET … DRAFT IT, then whatever the set-up asks again, up to the guide's draft and its
# review. A walk: steps the app does not offer are optional, and every screen is shot
# (`new-b2-…`).
- runFlow:
    file: old-flow-subflows/old-flow-trip.yaml
    env:
      SHOTS: old-b2-00-setup
      START_OFFSET_DAYS: 17
      STOP_AFTER_BUDGET: 'yes'
- runFlow:
    file: old-flow-subflows/planning-redesign.yaml
    env:
      MODE: 'follow'
      SHOT: new-b2-00-redesign-follows-config
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan'
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- tapOn:
    id: 'trip-hub-tile-plan'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'trip-map-empty-draft'
    timeout: 30000
    optional: true
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 5000
- takeScreenshot: new-b2-01-plan-empty
- tapOn:
    id: 'trip-map-empty-draft'
    optional: true
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 6000
- takeScreenshot: new-b2-02-draft-it-tapped
# The set-up asks for the dates again: the same four days, locked again.
- runFlow:
    when:
      visible:
        id: 'when-pick-week'
    commands:
      - evalScript: ${var d = new Date(Date.now() + 7 * 3600000 + 17 * 86400000); output.pickDate = d.toISOString().slice(0, 10)}
      - tapOn:
          id: 'when-pick-week'
      - runFlow:
          file: ../../happy/subflows/pick-days.yaml
          env:
            PICK_DATE: ${output.pickDate}
            PICK_DAYS: 4
      - takeScreenshot: new-b2-03-dates-again
      - tapOn:
          id: 'picker-lock'
      - extendedWaitUntil:
          visible:
            id: 'budget-lock|setup-rooms-lock|must-dos-add'
          timeout: 45000
          optional: true
      - runFlow:
          file: subflows/settle.yaml
          env:
            WAIT: 4000
      - takeScreenshot: new-b2-04-after-the-dates
- runFlow:
    when:
      visible:
        id: 'budget-lock'
    commands:
      - takeScreenshot: new-b2-05-budget-again
      - tapOn:
          id: 'budget-lock'
      - extendedWaitUntil:
          visible:
            id: 'setup-rooms-lock|must-dos-add'
          timeout: 30000
          optional: true
- runFlow:
    when:
      visible:
        id: 'setup-rooms-lock'
    commands:
      - takeScreenshot: new-b2-06-rooms
      - scrollUntilVisible:
          element:
            id: 'setup-rooms-lock'
          timeout: 10000
      - tapOn:
          id: 'setup-rooms-lock'
      - extendedWaitUntil:
          visible:
            id: 'must-dos-add'
          timeout: 30000
          optional: true
- runFlow:
    when:
      visible:
        id: 'must-dos-add'
    commands:
      - takeScreenshot: new-b2-07-must-dos
      - tapOn:
          id: 'must-dos-add'
      - extendedWaitUntil:
          visible:
            id: 'add-must-do-field'
          timeout: 10000
      - tapOn:
          id: 'add-must-do-field'
      - inputText: 'Crazy House'
      - extendedWaitUntil:
          visible:
            id: 'add-must-do-place-.*|add-must-do-none'
          timeout: 20000
          optional: true
      - tapOn:
          id: 'add-must-do-keep'
      - scrollUntilVisible:
          element:
            id: 'must-dos-draft'
          timeout: 10000
      - tapOn:
          id: 'must-dos-draft'
- extendedWaitUntil:
    visible:
      id: 'drafting-screen|draft-review'
    timeout: 30000
    optional: true
- takeScreenshot: new-b2-08-drafting
- extendedWaitUntil:
    visible:
      id: 'draft-review'
    timeout: 600000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: new-b2-09-draft-review
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: new-b2-10-draft-review-lower
- scrollUntilVisible:
    element:
      id: 'draft-propose'
    timeout: 15000
    optional: true
- tapOn:
    id: 'draft-propose'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'build-lock-alone'
    timeout: 30000
    optional: true
- takeScreenshot: new-b2-11-send-or-lock
- tapOn:
    id: 'build-lock-alone'
    optional: true
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: new-b2-12-after-the-lock
- runFlow: plan-views-subflows/back-to-trip-map.yaml
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 10000
- takeScreenshot: new-b2-13-plan-after-the-lock
