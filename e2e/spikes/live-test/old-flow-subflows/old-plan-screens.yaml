appId: app.critterpass.dev
---
# The trip as the earlier screens show it (the planning redesign off on this phone), from Home:
# Home, the hub, PLAN (the overview's day cards), each day's stops, a stop's sheet, the pass.
# A walk: every step is optional and every screen is shot. ${SHOTS} prefixes the screenshots.
- repeat:
    while:
      notVisible:
        id: 'tab-trips'
    times: 6
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'tab-home'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-01-home
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline|trip-hub-header-.*'
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-02-hub
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-03-hub-lower
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: UP
    timeout: 20000
    centerElement: true
    optional: true
- tapOn:
    id: 'trip-hub-tile-plan'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-day-1'
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${SHOTS}-04-plan-overview
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-05-plan-overview-lower
- scrollUntilVisible:
    element:
      id: 'plan-day-1'
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    id: 'plan-day-1'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-day-row-.*'
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-06-day-1
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-07-day-1-lower
- scrollUntilVisible:
    element:
      id: 'plan-day-row-.*'
    direction: UP
    timeout: 8000
    optional: true
- tapOn:
    id: 'plan-day-row-.*'
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-item-place|plan-item-move-.*'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-08-stop-sheet
- back
- waitForAnimationToEnd:
    timeout: 3000
- back
- extendedWaitUntil:
    visible:
      id: 'plan-day-2'
    timeout: 10000
    optional: true
- tapOn:
    id: 'plan-day-2'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-day-row-.*'
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-09-day-2
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-10-day-2-lower
- repeat:
    while:
      notVisible:
        id: 'tab-trips'
    times: 6
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'tab-pass'
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOTS}-11-pass
- tapOn:
    id: 'tab-home'
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
