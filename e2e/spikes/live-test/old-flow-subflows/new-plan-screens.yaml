appId: app.critterpass.dev
---
# The same trip as the new planning screens show it (this phone following the shared config, which
# is on), from Home: Home, the hub, PLAN (the trip map), every day's plan, a stop's sheet, a time
# changed, a place added from a day, the plan check, all days, Explore inside the trip, a place
# page and the pass. A walk: every step is optional, so a screen that does not open is shot as it
# is and the walk goes on. ${SHOTS} prefixes the screenshots; ${DAYS} is the trip's length.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-01-home
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-02-home-lower
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline|trip-hub-header-.*'
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-03-hub
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-04-hub-lower
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: UP
    timeout: 20000
    centerElement: true
    optional: true
- tapOn:
    id: 'trip-hub-tile-plan'
    optional: true
# PLAN: the trip map, as it first shows and once its tiles and routes are in.
- extendedWaitUntil:
    visible:
      id: 'trip-map-peek|trip-map|day-plan|plan-day-1'
    timeout: 60000
    optional: true
- takeScreenshot: ${SHOTS}-05-plan-at-once
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 12000
- takeScreenshot: ${SHOTS}-06-plan-settled
- swipe:
    start: 50%, 70%
    end: 50%, 46%
    duration: 700
- extendedWaitUntil:
    visible:
      id: 'trip-map-half'
    timeout: 10000
    optional: true
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: ${SHOTS}-07-trip-map-half-day-1
- tapOn:
    id: 'trip-map-all-days'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'trip-map-full'
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-08-the-whole-trip
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-09-the-whole-trip-lower
- runFlow: ../plan-views-subflows/back-to-trip-map.yaml
# Each day: its chip on the trip map, then the day's plan, top and lower.
- evalScript: ${output.dayNo = 0}
- repeat:
    times: ${DAYS}
    commands:
      - evalScript: ${output.dayNo = output.dayNo + 1}
      - runFlow: ../plan-views-subflows/back-to-trip-map.yaml
      - tapOn:
          id: ${'trip-map-day-chips-' + output.dayNo}
          optional: true
      - runFlow:
          file: ../subflows/settle.yaml
          env:
            WAIT: 6000
      - takeScreenshot: ${SHOTS + '-1' + output.dayNo + '-a-trip-map-day-' + output.dayNo}
      - tapOn:
          id: 'trip-map-peek-open-day-pill|trip-map-open-day-pill|trip-map-open-day'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'day-plan'
          timeout: 20000
          optional: true
      - runFlow:
          file: ../subflows/settle.yaml
          env:
            WAIT: 6000
      - takeScreenshot: ${SHOTS + '-1' + output.dayNo + '-b-day-plan-day-' + output.dayNo}
      - scroll
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${SHOTS + '-1' + output.dayNo + '-c-day-plan-day-' + output.dayNo + '-lower'}
      - scroll
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${SHOTS + '-1' + output.dayNo + '-d-day-plan-day-' + output.dayNo + '-end'}
# Day 1 again: the day's map, a stop's sheet and a time changed.
- runFlow: ../plan-views-subflows/back-to-trip-map.yaml
- tapOn:
    id: 'trip-map-day-chips-1'
    optional: true
- tapOn:
    id: 'trip-map-peek-open-day-pill|trip-map-open-day-pill|trip-map-open-day'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
    optional: true
- tapOn:
    id: 'day-plan-mini-map'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'day-map'
    timeout: 15000
    optional: true
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: ${SHOTS}-20-day-map-day-1
- runFlow:
    when:
      visible:
        id: 'day-map'
    commands:
      - tapOn:
          id: 'day-map-back'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      id: 'stop-2'
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    id: 'stop-2'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-item-sheet|plan-item-save'
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-21-stop-sheet
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-22-stop-sheet-lower
- scrollUntilVisible:
    element:
      id: 'plan-time-start-later'
    direction: UP
    timeout: 8000
    optional: true
- repeat:
    times: 2
    commands:
      - tapOn:
          id: 'plan-time-start-later'
          optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-23-time-half-an-hour-later
- scrollUntilVisible:
    element:
      id: 'plan-item-save'
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    id: 'plan-item-save'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'island-toast-message|plan-item-confirm'
    timeout: 10000
    optional: true
- takeScreenshot: ${SHOTS}-24-time-saved-at-once
- runFlow:
    when:
      visible:
        id: 'plan-item-confirm'
    commands:
      - tapOn: '(?i)change it anyway|Vẫn đổi.*'
      - extendedWaitUntil:
          visible:
            id: 'island-toast-message'
          timeout: 10000
          optional: true
      - takeScreenshot: ${SHOTS}-24b-time-saved-after-confirm
- runFlow:
    when:
      visible:
        id: 'plan-item-sheet'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: ${SHOTS}-25-day-1-after-the-time-change
# A place added from the foot of the day.
- scrollUntilVisible:
    element:
      id: 'day-plan-add'
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: 'day-plan-add'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
    optional: true
- takeScreenshot: ${SHOTS}-26-add-from-the-day
- tapOn:
    id: 'search-field'
    optional: true
- inputText: 'coffee'
- extendedWaitUntil:
    visible:
      id: 'search-row-add-0'
    timeout: 30000
    optional: true
- hideKeyboard
- takeScreenshot: ${SHOTS}-27-search-results
- tapOn:
    id: 'search-row-add-0'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-add-why'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${SHOTS}-28-add-sheet
- tapOn:
    id: 'plan-add-confirm'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'island-toast-message'
    timeout: 10000
    optional: true
- takeScreenshot: ${SHOTS}-29-added-at-once
- runFlow:
    when:
      notVisible:
        id: 'day-plan'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: ${SHOTS}-30-day-1-after-the-add
# All days, from the day.
- scrollUntilVisible:
    element:
      id: 'day-plan-all-days'
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    id: 'day-plan-all-days'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'all-days'
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${SHOTS}-31-all-days
# The plan check.
- runFlow: ../plan-views-subflows/back-to-trip-map.yaml
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 20000
- takeScreenshot: ${SHOTS}-32-trip-map-after-the-edits
- runFlow:
    file: ../plan-views-subflows/open-plan-check.yaml
    env:
      SHOT: ${SHOTS + '-33-the-whole-trip-check-line'}
- takeScreenshot: ${SHOTS}-34-plan-check
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-35-plan-check-lower
# The places list, and a place's page from it.
- runFlow: ../plan-views-subflows/back-to-trip-map.yaml
- tapOn:
    id: 'trip-map-list'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'places-list'
    timeout: 30000
    optional: true
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 6000
- takeScreenshot: ${SHOTS}-36-places-list
- tapOn:
    id: 'places-suggests-0|places-suggests-1'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'place-detail-name'
    timeout: 20000
    optional: true
- runFlow:
    file: ../subflows/settle.yaml
    env:
      WAIT: 5000
- takeScreenshot: ${SHOTS}-37-place-page
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-38-place-page-lower
# Explore inside the trip, from the hub.
- runFlow: ../plan-views-subflows/back-to-trip-map.yaml
- back
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan'
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      id: 'trip-hub-explore'
    direction: DOWN
    timeout: 20000
    centerElement: true
    optional: true
- tapOn:
    id: 'trip-hub-explore'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'explore-trip'
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible:
      id: 'explore-trip-(gap-when|gaps-full|gaps-empty|gaps)'
    timeout: 30000
    optional: true
- takeScreenshot: ${SHOTS}-39-explore-in-the-trip
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-40-explore-in-the-trip-lower
# The pass, and Home again.
- repeat:
    while:
      notVisible:
        id: 'tab-trips'
    times: 6
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'tab-pass'
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOTS}-41-pass
- tapOn:
    id: 'tab-trips'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-42-hub-after-the-walk
- tapOn:
    id: 'tab-home'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-43-home-after-the-walk
