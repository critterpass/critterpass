appId: app.critterpass.dev
---
# On the trip's first day, in English, on real staging: a fresh account's three-day Đà Nẵng trip
# that starts today, drafted and locked in alone. Day-of and the day plan name the same stop the
# same way; the day's search runs nearest first ("ca phe"), and coffee asked for from that day
# names that day in its fit lines. Shots are trip-day-<nn>-<what>.
- runFlow:
    file: subflows/on-trip-start-english.yaml
    env:
      SHOTS: trip-day-00-setup
- runFlow: subflows/on-trip-to-hub.yaml
- extendedWaitUntil:
    visible:
      id: 'trip-hub-next|trip-hub-today|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: trip-day-01-hub-next
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: trip-day-02-day-of
- runFlow: subflows/on-trip-to-hub.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'trip-map-peek'
    timeout: 60000
- swipe:
    start: 50%, 70%
    end: 50%, 46%
    duration: 700
- tapOn:
    id: 'trip-map-open-day'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: trip-day-03-day-plan
- scrollUntilVisible:
    element:
      id: 'day-plan-add'
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: 'day-plan-add'
- extendedWaitUntil:
    visible:
      id: 'search-screen'
    timeout: 15000
- tapOn:
    id: 'search-field'
    optional: true
- inputText: 'ca phe'
- extendedWaitUntil:
    visible:
      id: 'search-row-.*'
    timeout: 30000
    optional: true
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: trip-day-04-ca-phe-nearest-first
- tapOn:
    id: 'search-clear'
    optional: true
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'search-browse-coffee'
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    id: 'search-browse-coffee'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'search-plain-results|search-close-results|search-no-results|search-plain-failed'
    timeout: 90000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: trip-day-05-coffee-for-this-day
