      id: 'day-plan-day-chips-3'
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    id: 'day-plan-day-chips-3'
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: ${SHOTS}-69-last-day
- tapOn:
    id: 'day-plan-all-days'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'all-days'
    timeout: 15000
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: ${SHOTS}-70-all-days
- runFlow:
    when:
      visible:
        id: 'all-days'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: 'day-plan-back'
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: ${SHOTS}-71-day-plan-back-leads-to
- tapOn:
    id: 'trip-map-back'
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: ${SHOTS}-72-trip-map-back-leads-to
- runFlow: on-trip-to-hub.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-next|trip-hub-today'
    direction: UP
    timeout: 15000
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 2000
- takeScreenshot: ${SHOTS}-73-hub-end
- swipe:
    start: 50%, 75%
    end: 50%, 35%
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-74-hub-end-lower
# No signal on day-of and in GO (the runner turns Wi-Fi and data off, then on).
- runFlow: on-trip-to-hub.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-next|trip-hub-today'
    direction: UP
    timeout: 15000
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 2000
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trip-day-to-today'
    commands:
      - tapOn:
          id: 'trip-day-to-today'
- runFlow:
    file: settle.yaml
    env:
      WAIT: 3000
- takeScreenshot: ${SHOTS}-75-day-of-end
- evalScript: "${http.post('http://127.0.0.1:7788/network?state=off', { body: '' }).status}"
- extendedWaitUntil:
    visible:
      id: 'trip-day-offline'
    timeout: 40000
    optional: true
- takeScreenshot: ${SHOTS}-76-day-of-no-signal
- swipe:
    start: 50%, 75%
    end: 50%, 35%
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-77-day-of-no-signal-timeline
- scrollUntilVisible:
    element:
      id: 'trip-day-back'
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    id: 'trip-day-go'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'go-preview-offline'
    timeout: 30000
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 3000
- takeScreenshot: ${SHOTS}-78-go-no-signal
- tapOn:
    id: 'go-back'
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 2000
- runFlow: on-trip-open-day-plan.yaml
- takeScreenshot: ${SHOTS}-79-day-plan-no-signal
- evalScript: "${http.post('http://127.0.0.1:7788/network?state=on', { body: '' }).status}"
- runFlow:
    file: settle.yaml
    env:
      WAIT: 10000
- tapOn:
    id: 'tab-home'
    optional: true
- runFlow:
    file: settle.yaml
    env:
      WAIT: 4000
- takeScreenshot: ${SHOTS}-80-home-end
