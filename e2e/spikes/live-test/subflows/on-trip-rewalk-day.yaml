# The day of the trip, walked in the order a traveller lives it, from Home with the trip locked in
# and its first day today: Home, the hub, day-of, the day plan, a stop's sheet and its place page,
# GO without and with a position, I'm here, Done here, the next stop, running late (pushed, undone,
# pushed again), a stop skipped, a place added by typing and by kind, tomorrow's stop moved to
# today, a stop removed, tomorrow and the last day, then no signal on day-of and in GO.
# ${SHOTS} prefixes every frame. A walk, not a check: steps are optional so the frames keep coming
# where the app refuses.
