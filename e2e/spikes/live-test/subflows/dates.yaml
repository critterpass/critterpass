appId: app.critterpass.dev
---
# The set-up's When step in either language: three days, two weeks from today in Vietnam, picked
# by date on the week picker and locked. The frame before the lock shows which days were picked.
- evalScript: ${output.pickDate = new Date(Date.now() + 7 * 3600000 + 14 * 86400000).toISOString().slice(0, 10)}
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
- runFlow:
    file: ../../../happy/subflows/pick-days.yaml
    env:
      PICK_DATE: ${output.pickDate}
      PICK_DAYS: 3
- waitForAnimationToEnd
- takeScreenshot: collaboration-00-setup-dates-today
- tapOn:
    id: 'picker-lock'
# A press on LOCK has been seen to do nothing (the sheet stays, no message). When it is still up
# after a while, that is framed and the button pressed again.
- extendedWaitUntil:
    notVisible:
      id: 'picker-lock'
    timeout: 15000
    optional: true
- repeat:
    while:
      visible:
        id: 'picker-lock'
    times: 3
    commands:
      - takeScreenshot: collaboration-00b-lock-pressed-sheet-still-up
      - tapOn:
          id: 'picker-lock'
      - extendedWaitUntil:
          notVisible:
            id: 'picker-lock'
          timeout: 20000
          optional: true
