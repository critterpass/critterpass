appId: app.critterpass.dev
---
# The day's own actions, from Home with the trip under way. The assertions are the behaviour; the
# frames (`${SHOTS}-<nn>-<what>`) are the proof.
#   1. Day-of: GO and "Running late?" under the hero while a stop is still ahead.
#   2. A stop opened from day-of leads its sheet with GO, I'm here, Running late? and Skip.
#   3. GO before the phone has a position says so with "Try again"; when the position comes the
#      route draws by itself, with Grab's estimate; Start hands the maps app the place by name.
#   4. I'm here, then Done.
#   5. Running 30 minutes late: the running-late screen shows what moves before anything changes,
#      and the day plan has moved after the push.
#   6. Skip it, just me.
#   7. Running late from day-of's hero; no signal on day-of and in GO.
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-next|trip-hub-today|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
# 1. Day-of.
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOTS}-01-day-of-go-and-running-late
# 2. A stop's sheet on the day.
- scrollUntilVisible:
    element:
      id: 'trip-day-to-plan'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'trip-day-item-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'plan-item-sheet'
    timeout: 20000
- assertVisible:
    id: 'stop-day-actions'
- assertVisible:
    id: 'stop-day-here'
- assertVisible:
    id: 'stop-day-late-30'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-02-stop-sheet-leads-with-the-day
# 3. GO: no position yet, then one.
- tapOn:
    id: 'stop-day-go'
- extendedWaitUntil:
    visible:
      id: 'go-card'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'go-preview-no_fix'
    timeout: 30000
    optional: true
- takeScreenshot: ${SHOTS}-03-go-no-position-yet
# A hotel street behind Mỹ Khê beach, about three kilometres from the first stops.
- setLocation:
    latitude: 16.0605
    longitude: 108.2452
- extendedWaitUntil:
    visible:
      id: 'go-preview-routed|go-preview-straight'
    timeout: 90000
- runFlow:
    file: settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: ${SHOTS}-04-go-route-once-located
- assertVisible:
    id: 'go-back'
- extendedWaitUntil:
    visible:
      id: 'go-grab-estimate|go-grab-fare'
    timeout: 20000
    optional: true
- takeScreenshot: ${SHOTS}-05-go-grab-row
- tapOn:
    id: 'go-start'
- runFlow:
    file: settle.yaml
    env:
      WAIT: 20000
- takeScreenshot: ${SHOTS}-06-maps-app-gets-the-place
- runFlow:
    file: settle.yaml
    env:
      WAIT: 15000
- takeScreenshot: ${SHOTS}-07-maps-app-a-moment-later
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'go-card'
    timeout: 30000
- tapOn:
    id: 'go-back'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
# 4. I'm here, then Done.
- scrollUntilVisible:
    element:
      id: 'stop-1'
    direction: UP
    timeout: 15000
    optional: true
- tapOn:
    id: 'stop-1'
- extendedWaitUntil:
    visible:
      id: 'stop-day-here'
    timeout: 20000
- tapOn:
    id: 'stop-day-here'
- extendedWaitUntil:
    visible:
      id: 'stop-day-done'
    timeout: 10000
- assertVisible:
    id: 'stop-day-since'
- takeScreenshot: ${SHOTS}-08-here
- tapOn:
    id: 'stop-day-done'
- extendedWaitUntil:
    notVisible:
      id: 'stop-day-done'
    timeout: 10000
- takeScreenshot: ${SHOTS}-09-done
- back
- extendedWaitUntil:
    notVisible:
      id: 'plan-item-sheet'
    timeout: 10000
- takeScreenshot: ${SHOTS}-10-day-plan-before-running-late
# 5. Running 30 minutes late for the second stop.
- scrollUntilVisible:
    element:
      id: 'stop-2'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'stop-2'
- extendedWaitUntil:
    visible:
      id: 'stop-day-late-30'
    timeout: 20000
- tapOn:
    id: 'stop-day-late-30'
- extendedWaitUntil:
    visible:
      id: 'late-title'
    timeout: 20000
- assertVisible:
    id: 'late-option-push'
- assertVisible:
    id: 'late-option-skip'
- runFlow:
    file: settle.yaml
    env:
      WAIT: 5000
- takeScreenshot: ${SHOTS}-11-running-late-what-moves
- tapOn:
    id: 'late-choose'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- takeScreenshot: ${SHOTS}-12-day-moved-with-undo
- runFlow:
    file: settle.yaml
    env:
      WAIT: 6000
- takeScreenshot: ${SHOTS}-13-day-plan-after-the-push
# 6. Skip it, just me (the third stop, when the day has one).
- scrollUntilVisible:
    element:
      id: 'stop-3'
    direction: DOWN
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'stop-3'
    commands:
      - tapOn:
          id: 'stop-3'
      - extendedWaitUntil:
          visible:
            id: 'stop-day-skip'
          timeout: 20000
      - tapOn:
          id: 'stop-day-skip'
      - extendedWaitUntil:
          notVisible:
            id: 'plan-item-sheet'
          timeout: 15000
      - runFlow:
          file: settle.yaml
          env:
            WAIT: 8000
      - takeScreenshot: ${SHOTS}-14-skipped-just-me
# 7. Day-of again: running late from the hero, then no signal.
- runFlow: on-trip-to-hub.yaml
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${SHOTS}-15-day-of-after
- runFlow:
    when:
      visible:
        id: 'trip-day-late-15'
    commands:
      - tapOn:
          id: 'trip-day-late-15'
      - extendedWaitUntil:
          visible:
            id: 'late-title'
          timeout: 20000
      - runFlow:
          file: settle.yaml
          env:
            WAIT: 4000
      - takeScreenshot: ${SHOTS}-16-running-late-from-day-of
      - tapOn:
          id: 'late-back'
      - extendedWaitUntil:
          visible:
            id: 'trip-day'
          timeout: 15000
# Runner: /network turns Wi-Fi and data off, then on (Android only).
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: "${http.post('http://127.0.0.1:7788/network?state=off', { body: '' }).status}"
      - extendedWaitUntil:
          visible:
            id: 'trip-day-offline'
          timeout: 40000
          optional: true
      - takeScreenshot: ${SHOTS}-17-day-of-no-signal
      - runFlow:
          when:
            visible:
              id: 'trip-day-go'
          commands:
            - tapOn:
                id: 'trip-day-go'
            - extendedWaitUntil:
                visible:
                  id: 'go-preview-offline'
                timeout: 30000
                optional: true
            - takeScreenshot: ${SHOTS}-18-go-no-signal
            - tapOn:
                id: 'go-back'
      - evalScript: "${http.post('http://127.0.0.1:7788/network?state=on', { body: '' }).status}"
      - extendedWaitUntil:
          notVisible:
            id: 'trip-day-offline'
          timeout: 60000
          optional: true
