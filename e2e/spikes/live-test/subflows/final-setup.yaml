appId: app.critterpass.dev
---
# From first-run Home to the empty must-dos list: ${QUERY} found from "somewhere else", pitched with
# no crew (the page starts a crew of one), added to the vote, locked in from Home's board, then
# When (${DAYS} days: from ${PICK_DATE}, or the sheet's first window when PICK_DATE is ''), the
# budget, and rooms when they show. Frames ${P}-13…46.
- extendedWaitUntil:
    visible:
      id: 'home-first-run'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${P}-13-home-first-run
- scrollUntilVisible:
    element:
      id: 'home-somewhere-else'
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: 'home-somewhere-else'
- extendedWaitUntil:
    visible:
      id: 'place-search-field'
    timeout: 15000
- inputText: ${QUERY}
- extendedWaitUntil:
    visible:
      id: 'place-result-.*'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${P}-17-place-search-typed
- tapOn:
    id: 'place-result-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'explore-destination|guest-page'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${P}-18-destination-page
- swipe:
    direction: UP
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: ${P}-18b-destination-scrolled
- scrollUntilVisible:
    element:
      id: 'explore-pitch|guest-pitch'
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn:
    id: 'explore-pitch|guest-pitch'
- extendedWaitUntil:
    visible:
      id: 'explore-pitch-no-crew-start|crew-picker-none-start'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'explore-pitch-no-crew-start|crew-picker-none-start'
    direction: DOWN
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}-20-pitch-starts-a-crew
- evalScript: ${output.t0 = Date.now()}
- tapOn:
    id: 'explore-pitch-no-crew-start|crew-picker-none-start'
- extendedWaitUntil:
    visible:
      id: 'pitch-reasons'
    timeout: 90000
- evalScript: ${output.secs = Math.round((Date.now() - output.t0) / 1000)}
- waitForAnimationToEnd
- takeScreenshot: ${P}-30-pitch-card-after-${output.secs}s
- scrollUntilVisible:
    element:
      id: 'pitch-quote'
    direction: DOWN
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}-30a-pitch-card-end
- scrollUntilVisible:
    element:
      id: 'pitch-add'
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${P}-30b-after-add-to-the-vote
- repeat:
    while:
      notVisible:
        id: 'home-screen'
    times: 5
    commands:
      - back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${P}-31-home-board
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${P}-34-reveal
- tapOn:
    id: 'reveal-set-up'
- extendedWaitUntil:
    visible:
      id: 'setup-step-when'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${P}-35-when

# When.
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${P}-36-when-lower
- tapOn:
    id: 'when-pick-week'
- extendedWaitUntil:
    visible:
      id: 'picker-grid'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${P}-37-picker-open
- tapOn:
    id: ${'picker-length-' + DAYS}
- waitForAnimationToEnd
- takeScreenshot: ${P}-38-picker-length-asked
- runFlow:
    when:
      true: ${PICK_DATE != ''}
    commands:
      - runFlow:
          file: ../../../happy/subflows/pick-days.yaml
          env:
            PICK_DATE: ${PICK_DATE}
            PICK_DAYS: ${DAYS}
- runFlow:
    when:
      true: ${PICK_DATE == ''}
    commands:
      - runFlow:
          when:
            visible:
              id: 'picker-best-0'
          commands:
            - tapOn:
                id: 'picker-best-0'
      - runFlow:
          when:
            notVisible:
              id: 'picker-lock'
          commands:
            - evalScript: ${output.pickDate = new Date(Date.now() + 7 * 3600000 + 14 * 86400000).toISOString().slice(0, 10)}
            - runFlow:
                file: ../../../happy/subflows/pick-days.yaml
                env:
                  PICK_DATE: ${output.pickDate}
                  PICK_DAYS: ${DAYS}
- extendedWaitUntil:
    visible:
      id: 'picker-lock'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'picker-lock'
    direction: DOWN
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}-41-picker-picked
- evalScript: ${output.t0 = Date.now()}
- tapOn:
    id: 'picker-lock'

# Budget.
- extendedWaitUntil:
    visible:
      id: 'budget-track'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'budget-bars|budget-bars-missing'
    timeout: 30000
    optional: true
- evalScript: ${output.secs = Math.round((Date.now() - output.t0) / 1000)}
- waitForAnimationToEnd
- takeScreenshot: ${P}-42-budget-after-${output.secs}s
- swipe:
    from:
      id: 'budget-track'
    direction: RIGHT
    duration: 900
- waitForAnimationToEnd
- takeScreenshot: ${P}-43-budget-dragged
- scrollUntilVisible:
    element:
      id: 'budget-typed'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'budget-typed'
- inputText: ${BUDGET}
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ${P}-43b-budget-typed
- scrollUntilVisible:
    element:
      id: 'budget-lock'
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    id: 'budget-lock'

# Rooms only when a stay is on offer.
- extendedWaitUntil:
    visible:
      id: 'must-dos-add|must-dos-draft-without|setup-rooms-lock'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'setup-rooms-lock'
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: ${P}-45-rooms
      - tapOn:
          id: 'setup-rooms-lock'
- extendedWaitUntil:
    visible:
      id: 'must-dos-example-0'
    timeout: 60000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${P}-47-must-dos-empty
