appId: app.critterpass.dev
---
# What a returning person checks without being told: the inbox behind the bell, the crew chat, the
# trip hub, where Home's own button for their turn leads, and the phone's notifications. From Home,
# and back on Home at the end. ${SHOT} prefixes the frames (…-inbox, …-chat, …-hub, …-turn-opens,
# …-notifications).
- tapOn:
    id: 'home-header-inbox'
- extendedWaitUntil:
    visible:
      id: 'inbox-screen'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}-inbox
- runFlow: home.yaml
- tapOn:
    id: 'home-header-chat'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}-chat
- runFlow: home.yaml
- runFlow: trips-tab.yaml
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${SHOT}-hub
- runFlow: home.yaml
- runFlow:
    when:
      visible:
        id: 'home-turn-button'
    commands:
      - tapOn:
          id: 'home-turn-button'
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: ${SHOT}-turn-opens
      - runFlow: home.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 50%, 0%
          end: 50%, 70%
          duration: 400
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: ${SHOT}-notifications
      - back
      - runFlow: home.yaml
