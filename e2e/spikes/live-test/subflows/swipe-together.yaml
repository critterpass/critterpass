appId: app.critterpass.dev
---
# One person's turn at "Swipe places together", from the trip hub's row: ${FIRST} then ${SECOND}
# (explore-swipe-yes | explore-swipe-no), two cards each way, a frame per card. ${SHOT} prefixes
# the frames.
- tapOn:
    id: 'tab-trips'
- scrollUntilVisible:
    element:
      id: 'trip-hub-swipe'
    direction: DOWN
    timeout: 30000
    optional: true
- takeScreenshot: ${SHOT}-hub-swipe-row
- tapOn:
    id: 'trip-hub-swipe'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'explore-swipe-card'
    timeout: 90000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${SHOT}-swipe-first-card
- tapOn:
    id: 'explore-swipe-why'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-swipe-why
- runFlow:
    when:
      notVisible:
        id: 'explore-swipe-yes'
    commands:
      - runFlow: ../../../onboarding/subflows/back.yaml
- tapOn:
    id: ${FIRST}
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}-swipe-card-2
- tapOn:
    id: ${FIRST}
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}-swipe-card-3
- tapOn:
    id: ${SECOND}
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}-swipe-card-4
- tapOn:
    id: ${SECOND}
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}-swipe-card-5
- runFlow:
    file: walk-back.yaml
    env:
      SHOT: ${SHOT}-swipe
