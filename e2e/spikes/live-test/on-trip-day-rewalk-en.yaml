appId: app.critterpass.dev
---
# The day of a trip under way, walked again by a fresh account on real staging (a three-day Đà Nẵng
# trip whose first day is today), read in English: subflows/on-trip-rewalk-day.yaml.
- runFlow:
    file: subflows/on-trip-start-english.yaml
    env:
      SHOTS: day-en-00-setup
- runFlow:
    file: subflows/on-trip-rewalk-day.yaml
    env:
      SHOTS: day-en
