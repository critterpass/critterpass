appId: app.critterpass.dev
---
# One place searched by name (${QUERY}) from the trip map and its Add to plan sheet shot once the
# time has been worked out: the day and time it is suggested for, and why. Nothing is added.
# ${SHOT} names the screenshot.
- runFlow: search-again.yaml
- inputText: ${QUERY}
- extendedWaitUntil:
    visible:
      id: 'search-row-add-0'
    timeout: 30000
    optional: true
- hideKeyboard
- tapOn:
    id: 'search-row-add-0'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'plan-add-why'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      visible:
        id: 'plan-add-sheet'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 3000
