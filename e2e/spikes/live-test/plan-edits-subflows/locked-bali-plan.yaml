appId: app.critterpass.dev
---
# Set-up for the plan views walk, not part of it: a fresh account from Ho Chi Minh City starts a
# crew of one, pitches Bali and locks it in, sets the trip up two weeks out for five days with the
# budget and rooms as offered and one must-do (Tirta Empul), has the guide draft it and locks the
# plan in alone. The steps are e2e/happy/subflows/trip-under-way.yaml's, with five days instead of
# three. It ends on the screen the lock leaves the traveller on. ${SHOTS} prefixes the screenshots.
- runFlow:
    file: ../../../happy/subflows/fresh-account.yaml
    env:
      HOME_IATA: SGN
      HOME_QUERY: 'Ho Chi'
- runFlow:
    file: ../../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://crew/new
- extendedWaitUntil:
    visible:
      id: 'start-crew-name'
    timeout: 15000
- tapOn:
    id: 'start-crew-name'
- inputText: 'Bali with Linh'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-done'
    timeout: 30000
# The crew's join code, for flows that bring a second account onto the trip (iOS copies the spoken
# label, "Crew code E 2 X …": the code is its last six characters).
- copyTextFrom:
    id: 'start-crew-code'
- evalScript: ${output.crewCode = maestro.copiedText.replace(/[^A-Z0-9]/g, '').slice(-6)}
- tapOn:
    id: 'start-crew-done'
- extendedWaitUntil:
    visible:
      id: 'home-no-trip'
    timeout: 30000
- tapOn:
    id: 'home-pitch'
- extendedWaitUntil:
    visible:
      id: 'pitch-search'
    timeout: 15000
- tapOn:
    id: 'pitch-search'
- inputText: 'bali'
- extendedWaitUntil:
    visible:
      id: 'pitch-result-0'
    timeout: 20000
- tapOn:
    id: 'pitch-result-0'
- extendedWaitUntil:
    visible:
      id: 'pitch-quote'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'pitch-add'
- waitForAnimationToEnd
# The sheet usually closes onto Home by itself; back out only if it is still open.
- runFlow:
    when:
      visible:
        id: 'pitch-add'
    file: ../../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'destination-board'
    timeout: 30000
# One place on the board: the organiser locks it in, and it wins.
- scrollUntilVisible:
    element:
      id: 'board-lock-in'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'board-lock-in'
- extendedWaitUntil:
    visible:
      id: 'reveal-set-up'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'reveal-set-up'
- extendedWaitUntil:
    visible:
      id: 'setup-step-when'
    timeout: 20000
# Two weeks from today in Vietnam, five days: the first and the last day tapped by their dates.
- evalScript: ${var d = new Date(Date.now() + 7 * 3600000 + 14 * 86400000); output.pickDate = d.toISOString().slice(0, 10)}
- scrollUntilVisible:
    element:
      id: 'when-pick-week'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'when-pick-week'
- runFlow:
    file: ../../../happy/subflows/pick-days.yaml
    env:
      PICK_DATE: ${output.pickDate}
      PICK_DAYS: 5
# Set-up, not the walk: the length line's wording is not what this flow is about.
- assertVisible:
    id: 'picker-length'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-dates
- tapOn:
    id: 'picker-lock'
# The budget, in đồng, locked as the guide suggests it.
- extendedWaitUntil:
    visible:
      id: 'budget-track'
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: 'budget-bars|budget-bars-missing'
    timeout: 30000
- assertVisible:
    id: 'budget-track'
    text: '.*₫.*'
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-budget
- tapOn:
    id: 'budget-lock'
# Rooms: LOOKS GOOD accepts the rooms as offered (one room for a crew of one, split evenly).
- extendedWaitUntil:
    visible:
      id: 'setup-rooms-lock'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-rooms
- scrollUntilVisible:
    element:
      id: 'setup-rooms-lock'
    timeout: 10000
- tapOn:
    id: 'setup-rooms-lock'
- extendedWaitUntil:
    visible:
      id: 'must-dos-add'
    timeout: 30000
- tapOn:
    id: 'must-dos-add'
- extendedWaitUntil:
    visible:
      id: 'add-must-do-field'
    timeout: 10000
- tapOn:
    id: 'add-must-do-field'
- evalScript: ${output.mustDo = 'Tirta Empul'}
- inputText: ${output.mustDo}
# Kept as typed, once the place search has answered (places, or none) and the row stops moving.
- extendedWaitUntil:
    visible:
      id: 'add-must-do-place-.*|add-must-do-none'
    timeout: 20000
    optional: true
- tapOn:
    id: 'add-must-do-keep'
- extendedWaitUntil:
    visible:
      text: ${'(?i)' + output.mustDo + '.*'}
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'must-dos-draft'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-must-dos
- tapOn:
    id: 'must-dos-draft'
- extendedWaitUntil:
    visible:
      id: 'drafting-screen'
    timeout: 30000
# The draft job (outline, every day, checks) takes a few minutes on staging.
- extendedWaitUntil:
    visible:
      id: 'draft-review'
    timeout: 600000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}-draft-review
- runFlow:
    when:
      true: ${typeof STOP_AT_DRAFT === 'undefined' || STOP_AT_DRAFT !== 'yes'}
    commands:
      - scrollUntilVisible:
          element:
            id: 'draft-propose'
          timeout: 15000
      - tapOn:
          id: 'draft-propose'
      # Nobody to pitch it to: lock it in alone.
      - extendedWaitUntil:
          visible:
            id: 'build-lock-alone'
          timeout: 30000
      - waitForAnimationToEnd
      - takeScreenshot: ${SHOTS}-lock-alone
      - tapOn:
          id: 'build-lock-alone'
      - extendedWaitUntil:
          notVisible:
            id: 'build-lock-alone'
          timeout: 60000
