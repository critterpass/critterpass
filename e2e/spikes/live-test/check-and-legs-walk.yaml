appId: app.critterpass.dev
---
# Live walk, the plan check and the travel times: a first-time traveller with a locked five-day
# Bali plan changes one stop's time, then uses one fix. Real staging, a fresh account, no demo
# seed; the planning screens are turned on for this phone only. Shots are `check-legs-<nn>-<what>`;
# a step the app refuses is optional, so the walk goes on and the frames still come out.
#   1. The plan with its first check: the count on the trip map, the check's cards and their words.
#   2. Day 2 before the edit, then one stop an hour later: the day's travel times at once and a few
#      seconds on (they should read as before for every pair that did not change), the check right
#      after (running, never more to fix on days she did not touch) and a minute on.
#   3. One fix used: the card gone at once, the check running, and the day a minute on.
- runFlow:
    file: plan-views-subflows/locked-bali-plan.yaml
    env:
      SHOTS: check-legs-00-setup
- extendedWaitUntil:
    visible:
      id: 'home-mode-.*'
    timeout: 60000
- runFlow: ../../happy/subflows/dismiss-visit-offer.yaml
- waitForAnimationToEnd
- waitForAnimationToEnd
# 1. The plan and its first check.
- runFlow: plan-views-subflows/back-to-trip-map.yaml
- extendedWaitUntil:
    visible:
      id: 'trip-map-check'
    timeout: 120000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: check-legs-01-trip-map-first-check
- runFlow:
    file: plan-views-subflows/open-plan-check.yaml
    env:
      SHOT: check-legs-01b-whole-trip-first-check
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: check-legs-02-check-before-edit
- runFlow:
    when:
      visible:
        id: 'plan-check'
    commands:
      - scroll
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: check-legs-03-check-before-edit-lower
# 2. Day 2, one stop an hour later.
- runFlow: plan-views-subflows/back-to-trip-map.yaml
- runFlow:
    when:
      visible:
        id: 'trip-map-peek'
    commands:
      - tapOn:
          id: 'trip-map-day-chips-2'
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 46%
          duration: 700
      - extendedWaitUntil:
          visible:
            id: 'trip-map-half'
          timeout: 10000
          optional: true
- tapOn:
    id: 'trip-map-open-day'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'check-legs-wait'
    timeout: 4000
    optional: true
- takeScreenshot: check-legs-04-day-2-before
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: check-legs-05-day-2-before-lower
- scrollUntilVisible:
    element:
      id: 'stop-2'
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    id: 'stop-2'
- extendedWaitUntil:
    visible:
      id: 'plan-item-move-.*'
    timeout: 15000
- repeat:
    times: 4
    commands:
      - tapOn:
          id: 'plan-time-start-later'
- scrollUntilVisible:
    element:
      id: 'plan-item-save'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'plan-item-save'
- takeScreenshot: check-legs-06-day-2-time-saved-at-once
- extendedWaitUntil:
    visible:
      id: 'check-legs-wait'
    timeout: 6000
    optional: true
- takeScreenshot: check-legs-07-day-2-time-saved-settled
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: check-legs-08-day-2-time-saved-lower
# The check right after the edit, and a minute and a half on.
- runFlow: plan-views-subflows/back-to-trip-map.yaml
- takeScreenshot: check-legs-09-trip-map-right-after-edit
- runFlow:
    file: plan-views-subflows/open-plan-check.yaml
    env:
      SHOT: check-legs-09b-whole-trip-right-after-edit
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: check-legs-10-check-right-after-edit
- extendedWaitUntil:
    visible:
      id: 'check-legs-wait'
    timeout: 90000
    optional: true
- takeScreenshot: check-legs-11-check-a-minute-after-edit
# 3. One fix, used.
- runFlow:
    when:
      visible:
        id: 'plan-check'
    commands:
      - scrollUntilVisible:
          element:
            id: 'plan-check-fix-.*'
          direction: DOWN
          timeout: 15000
          optional: true
      - takeScreenshot: check-legs-12-check-card-before-fix
      - tapOn:
          id: 'plan-check-fix-.*'
          index: 0
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'check-legs-wait'
          timeout: 5000
          optional: true
      - takeScreenshot: check-legs-13-fix-tapped
      - runFlow:
          when:
            visible:
              id: 'plan-check-use-.*'
          commands:
            - tapOn:
                id: 'plan-check-use-.*'
                index: 0
            - extendedWaitUntil:
                visible:
                  id: 'check-legs-wait'
                timeout: 5000
                optional: true
            - takeScreenshot: check-legs-14-nearer-used
      - runFlow:
          when:
            visible:
              id: 'plan-less-driving|plan-rain'
          commands:
            - scroll
            - waitForAnimationToEnd:
                timeout: 3000
            - takeScreenshot: check-legs-15-fixer-screen
            - tapOn:
                id: 'plan-less-driving-use|plan-rain-use'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'check-legs-wait'
                timeout: 6000
                optional: true
            - takeScreenshot: check-legs-16-fixer-used
# Back on the check: the fixed card is gone and the check says it is running.
- runFlow:
    when:
      notVisible:
        id: 'plan-check'
    commands:
      - runFlow: plan-views-subflows/back-to-trip-map.yaml
      - runFlow:
          file: plan-views-subflows/open-plan-check.yaml
          env:
            SHOT: check-legs-16b-whole-trip-right-after-fix
- scrollUntilVisible:
    element:
      id: 'plan-check-title'
    direction: UP
    timeout: 8000
    optional: true
- takeScreenshot: check-legs-17-check-right-after-fix
- extendedWaitUntil:
    visible:
      id: 'check-legs-wait'
    timeout: 90000
    optional: true
- takeScreenshot: check-legs-18-check-a-minute-after-fix
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: check-legs-19-check-a-minute-after-fix-lower
