appId: app.critterpass.dev
---
# The morning's leave-by, walked in Vietnamese by a fresh account on real staging (a three-day
# Đà Nẵng trip that starts today, locked in alone). A drafted first day starts after noon, so no
# leave-by exists for today; tomorrow's first stop is moved to before eight, which gives it one.
# Then today's day-of leads to tomorrow's page: the leave-by hero, the alarm line and I'M UP.
# A walk: the steps after the edit are optional so the frames keep coming where the app refuses.
- runFlow:
    file: subflows/on-trip-start.yaml
    env:
      SHOTS: leave-by-vi-00-setup
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-next|trip-hub-today|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
# The guide's welcome rises on the hub once the trip is on: put it away first.
- extendedWaitUntil:
    visible:
      id: 'critters-hatch-later'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: 'critters-hatch-later'
    commands:
      - tapOn:
          id: 'critters-hatch-later'
      - waitForAnimationToEnd:
          timeout: 4000
- runFlow: subflows/on-trip-to-hub.yaml
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'trip-day-to-tomorrow'
    direction: DOWN
    timeout: 20000
- takeScreenshot: leave-by-vi-01-today-leads-to-tomorrow
# Tomorrow's first stop, moved to before eight from its sheet.
- tapOn:
    id: 'trip-day-to-plan'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- tapOn:
    id: 'day-plan-day-chips-2'
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'stop-1'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'stop-1'
- extendedWaitUntil:
    visible:
      id: 'plan-time-start-value'
    timeout: 15000
- copyTextFrom:
    id: 'plan-time-start-value'
- evalScript: ${var parts = maestro.copiedText.split(':'); var start = Number(parts[0]) * 60 + Number(parts[1]); output.taps = Math.max(0, Math.ceil((start - 420) / 15)); output.done = 0}
- repeat:
    while:
      true: ${output.done < output.taps}
    commands:
      - tapOn:
          id: 'plan-time-start-earlier'
      - evalScript: ${output.done = output.done + 1}
- takeScreenshot: leave-by-vi-02-tomorrows-first-stop-at-seven
- runFlow:
    when:
      true: ${output.taps > 0}
    commands:
      - tapOn:
          id: 'plan-item-save'
      - waitForAnimationToEnd:
          timeout: 6000
      - runFlow:
          when:
            visible:
              id: 'plan-item-confirm'
          commands:
            - tapOn:
                id: 'plan-item-confirm'
            - waitForAnimationToEnd:
                timeout: 6000
- runFlow:
    when:
      visible:
        id: 'plan-item-sheet'
    commands:
      - back
# The server works the leave-by out after the plan change; give it a minute.
- runFlow:
    file: subflows/settle.yaml
    env:
      WAIT: 60000
- takeScreenshot: leave-by-vi-03-tomorrows-plan-after-the-move
- runFlow: subflows/on-trip-to-hub.yaml
- runFlow:
    when:
      visible:
        id: 'critters-hatch-later'
    commands:
      - tapOn:
          id: 'critters-hatch-later'
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: leave-by-vi-04-hub
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
# To the end of the page and settled, so the link sits clear of the tab bar when it is tapped.
- scrollUntilVisible:
    element:
      id: 'trip-day-to-tomorrow'
    direction: DOWN
    timeout: 20000
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'trip-day-to-tomorrow'
- extendedWaitUntil:
    visible:
      id: 'trip-day-to-today'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'trip-day-hero-before|trip-day-hero-window'
    timeout: 90000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: leave-by-vi-05-tomorrow-leave-by-hero
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: leave-by-vi-06-tomorrow-lower
- scrollUntilVisible:
    element:
      id: 'trip-day-im-up'
    direction: UP
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trip-day-alarm-action'
    commands:
      - tapOn:
          id: 'trip-day-alarm-action'
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: leave-by-vi-07-alarm-sheet
      - back
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible:
        id: 'trip-day-im-up'
    commands:
      - tapOn:
          id: 'trip-day-im-up'
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: leave-by-vi-08-after-im-up
- scrollUntilVisible:
    element:
      id: 'trip-day-to-today'
    direction: DOWN
    timeout: 10000
    optional: true
- takeScreenshot: leave-by-vi-09-back-to-today-link
