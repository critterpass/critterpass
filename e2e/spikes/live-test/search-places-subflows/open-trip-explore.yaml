appId: app.critterpass.dev
---
# From wherever the walk is to the trip hub's EXPLORE row, tapped once it sits clear of the tab bar
# and the guide's button (a tap on a row half under them opens something else).
- runFlow: back-to-trip-map.yaml
- back
- extendedWaitUntil:
    visible:
      id: 'trip-hub'
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'trip-hub'
    commands:
      - tapOn:
          id: 'tab-trips'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'trip-hub'
          timeout: 15000
          optional: true
- scrollUntilVisible:
    element:
      id: 'trip-hub-explore'
    direction: DOWN
    timeout: 20000
    centerElement: true
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'trip-hub-explore'
    optional: true
