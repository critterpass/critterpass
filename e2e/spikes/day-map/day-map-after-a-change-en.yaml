appId: app.critterpass.dev
---
# The day plan's map after the day changes under it, walked by a fresh account on real staging (a
# three-day Đà Nẵng trip that starts today, the set-up of ../live-test), on the trip's second day
# so it never depends on the hour. Each change makes a new plan version; the frames show the day's
# map drawn on its stops after each one: 01 the day, 02 after a stop is removed, 03 after another
# removal and its UNDO, 04 after "Skip it, just me".
- runFlow:
    file: ../live-test/subflows/on-trip-start-english.yaml
    env:
      SHOTS: day-map-en-00-setup
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-next|trip-hub-today|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'trip-day-to-plan'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'trip-day-to-plan'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 30000
- tapOn:
    id: 'day-plan-day-chips-2'
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-01-day-two
# A stop removed.
- runFlow:
    file: subflows/remove-stop.yaml
    env:
      STOP: stop-2
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-02-after-remove
# Another removed, and put back with the toast's UNDO.
- runFlow:
    file: subflows/remove-stop.yaml
    env:
      STOP: stop-1
- extendedWaitUntil:
    visible:
      id: 'island-toast-open'
    timeout: 10000
- tapOn:
    id: 'island-toast-open'
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-03-after-undo
# Skip it, just me.
- runFlow:
    file: subflows/open-stop.yaml
    env:
      STOP: stop-1
- tapOn:
    id: 'plan-item-skip'
- extendedWaitUntil:
    notVisible:
      id: 'plan-item-sheet'
    timeout: 15000
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-04-after-skip
- assertVisible:
    id: 'day-plan-mini-map'
