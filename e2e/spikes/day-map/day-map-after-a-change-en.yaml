appId: app.critterpass.dev
---
# The day plan's map after the day changes under it, walked by a fresh account on real staging (a
# three-day Đà Nẵng trip that starts today, the set-up of ../live-test). Each change makes a new
# plan version; the frames show the day's map drawn on its stops after each one:
#   01 the day plan, 02 after running 30 minutes late (the stops after it move), 03 after its UNDO,
#   04 after "Skip it, just me".
- runFlow:
    file: ../live-test/subflows/on-trip-start-english.yaml
    env:
      SHOTS: day-map-en-00-setup
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-next|trip-hub-today|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: 'trip-hub-next|trip-hub-today'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'trip-day-to-plan'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'trip-day-to-plan'
- extendedWaitUntil:
    visible:
      id: 'day-plan-mini-map'
    timeout: 30000
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-01-day-plan
# Running 30 minutes late for the second stop, pushed.
- scrollUntilVisible:
    element:
      id: 'stop-2'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'stop-2'
- extendedWaitUntil:
    visible:
      id: 'stop-day-late-30'
    timeout: 20000
- tapOn:
    id: 'stop-day-late-30'
- extendedWaitUntil:
    visible:
      id: 'late-choose'
    timeout: 20000
- tapOn:
    id: 'late-choose'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
# Its UNDO, while the toast is up; the map is looked at after the push has synced either way.
- runFlow:
    when:
      visible:
        id: 'island-toast-open'
    commands:
      - takeScreenshot: day-map-en-02a-pushed-with-undo
      - tapOn:
          id: 'island-toast-open'
- scrollUntilVisible:
    element:
      id: 'day-plan-mini-map'
    direction: UP
    timeout: 15000
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-03-after-undo
# Skip it, just me (the third stop).
- scrollUntilVisible:
    element:
      id: 'stop-3'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'stop-3'
- extendedWaitUntil:
    visible:
      id: 'stop-day-skip'
    timeout: 20000
- tapOn:
    id: 'stop-day-skip'
- extendedWaitUntil:
    notVisible:
      id: 'plan-item-sheet'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'day-plan-mini-map'
    direction: UP
    timeout: 15000
- runFlow:
    file: ../live-test/subflows/settle.yaml
    env:
      WAIT: 8000
- takeScreenshot: day-map-en-04-after-skip
- assertVisible:
    id: 'day-plan-mini-map'
