appId: app.critterpass.dev
---
# Real, non-mocked flow: fetches the actual Da Nang PMTiles archive from the live public R2
# bucket, writes it to app storage, then re-points MapLibre's source at that on-disk file and
# confirms the custom dark style still renders — the offline proof this spike's ADR records
# (docs/decisions/<date>-maplibre-pmtiles-on-r2.md). Reaches the spike screen by tapping through
# the home screen's "Developer tools" entry and its Developer tools list
# (apps/mobile/src/app/(dev)/index.tsx), never via `openLink`: a deep link into a `(dev)` route is
# non-deterministic on EAS-hosted iOS simulators (mobile-dev-inc/Maestro#2610).
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 25000
- tapOn:
    id: 'dev-tools-entry'
# The spikes sit below the demo data, labs and live checks sections.
- scrollUntilVisible:
    element:
      id: 'dev-nav-spikes-map'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-spikes-map'
- extendedWaitUntil:
    visible: 'MapLibre + PMTiles on R2 spike'
    timeout: 20000
- extendedWaitUntil:
    visible: 'map loaded|style loaded'
    timeout: 30000
- takeScreenshot: map-remote-source-rendered
- tapOn: 'Download city pack (offline)'
- extendedWaitUntil:
    visible: 'downloaded'
    timeout: 20000
- takeScreenshot: map-city-pack-downloaded
- tapOn: 'Switch to downloaded local file'
- extendedWaitUntil:
    visible: 'source: local file'
    timeout: 10000
- extendedWaitUntil:
    visible: 'map loaded|style loaded'
    timeout: 20000
- takeScreenshot: map-local-source-rendered
