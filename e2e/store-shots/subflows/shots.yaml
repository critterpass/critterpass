appId: app.critterpass.dev
---
# One capture per store shot, named `store-${LANG}-<shot>` after the shot templates in
# packages/content/src/store/templates. Elements are found by id only, so the same steps run in
# every language. The expense comes last: it is the only step that writes.

# vote: the crew's destination board on Home.
- scrollUntilVisible:
    element:
      id: 'destination-board'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: store-${LANG}-vote

# critters: the Critterdex from the PASS tab, once the catalogue has synced.
- runFlow: ../../happy/subflows/open-critterdex.yaml
- waitForAnimationToEnd
- takeScreenshot: store-${LANG}-critters

# trip-day: the trip's hub, then its first day.
- runFlow: ../../happy/subflows/open-trip-hub.yaml
- runFlow: ../../happy/subflows/dismiss-visit-offer.yaml
- scrollUntilVisible:
    element:
      id: 'trip-hub-(next|today)'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'trip-hub-(next|today)'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: store-${LANG}-trip-day

# plan: the trip's plan on its map.
- runFlow: ../../happy/subflows/open-plan.yaml
# The map draws its tiles after the screen is up.
- extendedWaitUntil:
    visible:
      id: 'premium-map-drawn'
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: store-${LANG}-plan

# money: the wallet after the account adds 450,000 it paid, split evenly (the default split).
- runFlow:
    file: ../../happy/subflows/open-wallet.yaml
    env:
      HALF: money
- runFlow: ../../happy/subflows/open-add-expense.yaml
- tapOn:
    id: 'money-key-4'
- tapOn:
    id: 'money-key-5'
- tapOn:
    id: 'money-key-0'
- tapOn:
    id: 'money-key-000'
- tapOn:
    id: 'money-add-submit'
- extendedWaitUntil:
    visible:
      id: 'money-latest'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: store-${LANG}-money
