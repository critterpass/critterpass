appId: app.critterpass.dev
---
# A fresh install in ${LANG} (en or vi), onboarded through the real api, with the staging demo
# crew: four crewmates, a confirmed trip three weeks out and the crew's destination vote on its
# board. Ends on Home. Needs an api with DEV_SEED_ENABLED on.
- runFlow:
    file: ../../happy/subflows/fresh-install.yaml
    env:
      LANG: ${LANG}
- runFlow: ../../happy/subflows/onboard.yaml
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-vote
# The store's language: switched in Settings, then back to Home.
- runFlow:
    when:
      true: ${LANG != 'en'}
    commands:
      - runFlow:
          file: ../../_shared/switch-language.yaml
          env:
            LANG: ${LANG}
      - runFlow: ../../_shared/to-home.yaml
