appId: app.critterpass.dev
---
# The permissions page (2.13): every ask starts off, the OS prompt appears only after a card is
# tapped, a grant turns the card on, a refusal leaves it off and says how to turn it on later.
- launchApp:
    clearState: true
    permissions:
      notifications: unset
      location: unset
- runFlow:
    file: subflows/open-dev-screen.yaml
    env:
      SCREEN: permissions-primer
      READY: permissions-primer
- assertVisible:
    id: 'primer-notifications'
    checked: false
- assertVisible:
    id: 'primer-location'
    checked: false
- assertVisible:
    id: 'primer-calendar'
    checked: false
- tapOn:
    id: 'primer-notifications'
- tapOn:
    text: 'Allow'
    optional: false
- extendedWaitUntil:
    visible:
      id: 'primer-notifications'
      checked: true
    timeout: 10000
- tapOn:
    id: 'primer-location'
- tapOn:
    text: 'Don.t Allow'
- extendedWaitUntil:
    visible: '.*Off\. I.ll ask on your trip.*'
    timeout: 10000
- assertVisible:
    id: 'primer-location'
    checked: false
- takeScreenshot: premium-2.13-primer-denied-location-light
