appId: app.critterpass.dev
---
# After an OS denial only the Settings path is offered: the primer sheet says it is off in
# Settings and its action opens them; no OS prompt can appear.
- launchApp:
    clearState: true
    permissions:
      camera: deny
- runFlow:
    file: subflows/open-dev-screen.yaml
    env:
      SCREEN: permissions
      READY: dev-permissions
# Android can't tell a revoked permission from one never asked until the app asks: refuse the
# system dialog until the denial is final (or the ask lands straight on the app's settings page).
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            notVisible:
              id: 'dev-permission-camera-status'
              text: 'denied.*'
          times: 3
          commands:
            - tapOn:
                id: 'dev-permission-camera-primer'
            - tapOn:
                id: 'primer-sheet-accept'
            - extendedWaitUntil:
                visible: '(Don.t allow|App info)'
                timeout: 10000
            - runFlow:
                when:
                  visible: 'Don.t allow'
                commands:
                  - tapOn: 'Don.t allow'
            - runFlow:
                when:
                  visible: 'App info'
                commands:
                  - back
- extendedWaitUntil:
    visible:
      id: 'dev-permission-camera-status'
      text: 'denied.*'
    timeout: 10000
- tapOn:
    id: 'dev-permission-camera-primer'
- extendedWaitUntil:
    visible:
      text: 'It is switched off in Settings.*'
    timeout: 10000
- assertVisible:
    id: 'primer-sheet-accept'
    text: 'Open Settings'
- takeScreenshot: denied-settings
- tapOn:
    id: 'primer-sheet-decline'
