appId: app.critterpass.dev
---
# Before the crew has a plan, on the plan ideas lab: Ideas on an organiser's own draft (day chips,
# no PLACE THEM FOR ME), Ideas for a member who has no plan to see yet, and Add to plan for that
# member (it saves to Ideas and names no day), and the plan check on an organiser's own draft
# (each card opens its stop), in English then Vietnamese.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow: subflows/open-ideas-lab.yaml
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: ideas-own-draft
      SHOT: en-own-draft-ideas
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: ideas-before-plan
      SHOT: en-before-plan-ideas
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: add-to-plan-before-plan
      SHOT: en-before-plan-add-to-plan
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: check-own-draft
      SHOT: en-own-draft-check
# The app in Vietnamese, from a fresh start (picked for the running app, so no relaunch after).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow: ../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- runFlow: subflows/open-ideas-lab.yaml
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: ideas-own-draft
      SHOT: vi-own-draft-ideas
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: ideas-before-plan
      SHOT: vi-before-plan-ideas
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: add-to-plan-before-plan
      SHOT: vi-before-plan-add-to-plan
- runFlow:
    file: subflows/ideas-lab-shot.yaml
    env:
      SCENE: check-own-draft
      SHOT: vi-own-draft-check
