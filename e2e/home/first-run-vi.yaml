appId: app.critterpass.dev
---
# The same Home states in Vietnamese: the dev gallery switches the running app's language (not
# persisted), then two steps back return to the splash.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-locale-vi'
    timeout: 15000
- tapOn:
    id: 'gallery-locale-vi'
- runFlow: ../onboarding/subflows/back.yaml
- waitForAnimationToEnd
- runFlow: ../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow: subflows/onboard.yaml
- runFlow:
    file: subflows/home-screens.yaml
    env:
      PREFIX: vi
- runFlow:
    file: subflows/session-screens.yaml
    env:
      PREFIX: vi
