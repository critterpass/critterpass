appId: app.critterpass.dev
env:
  NAME: Rin
---
# A NUDGE answer in the inbox (an RSVP follow-up) asks the guide to nudge a crewmate. ${NAME} has
# the app but never allowed notifications, so the guide leaves the nudge in their inbox and the
# toast says so; the card leaves the list.
#
# Data: the staging demo seed (e2e/_shared/seed-demo.yaml): ${NAME} joined Bali Demo Crew without
# answering the trip's RSVP, and that card runs `send_nudge` for them. Each seed clears the
# account's earlier nudges, so the pair cooldown never carries over between runs.
- launchApp:
    clearState: true
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo
- openLink: critterpass-dev://inbox
- extendedWaitUntil:
    visible:
      id: 'inbox-action-.*-nudge'
    timeout: 15000
- takeScreenshot: en-nudge-card
- tapOn:
    id: 'inbox-action-.*-nudge'
- extendedWaitUntil:
    visible:
      text: '.* left ${NAME} a nudge in their inbox\.'
    timeout: 15000
- takeScreenshot: en-nudge-sent
