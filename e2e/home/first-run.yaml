appId: app.critterpass.dev
---
# A new user's Home: first run with the six guides (3b-1) and JOIN WITH A CODE, the first-ever empty
# inbox (3b-5) with Tokek opening one eye, then a crew with nothing planned yet.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-open'
    timeout: 60000
- runFlow: subflows/onboard.yaml
- runFlow:
    file: subflows/home-screens.yaml
    env:
      PREFIX: en
- runFlow:
    file: subflows/session-screens.yaml
    env:
      PREFIX: en
