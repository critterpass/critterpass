appId: app.critterpass.dev
---
# 3b-5: with nothing needing the user, Tokek sleeps where the cards were; a tap opens one eye (the
# toast), and Tokek goes back to sleep.
#
# Data: the staging demo seed's `caught_up` scenario: a crew and an inbox with nothing needing
# the user.
- runFlow: subflows/fresh-install.yaml
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-caught-up
- openLink: critterpass-dev://inbox
- extendedWaitUntil:
    visible:
      id: 'inbox-caught-up'
    timeout: 15000
- assertVisible: 'NEEDS YOU · 0'
# Tokek is awake for about two seconds and the toast for under three: don't wait for the screen
# to settle after the tap, or both are over before the next step looks.
- tapOn:
    id: 'inbox-tokek'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    # Android folds the island toast's lines into one node, so match within it.
    visible: '.*Nothing needs you yet\. Back to sleep\..*'
    timeout: 5000
- takeScreenshot: en-3b-5-all-caught-up
