appId: app.critterpass.dev
---
# Home through its link, then the developer tools list: a way out of any dev screen that doesn't
# depend on the iOS edge swipe, which a scene's own gestures or a sheet can swallow.
- openLink: critterpass-dev://
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 20000
- tapOn:
    id: 'dev-tools-entry'
