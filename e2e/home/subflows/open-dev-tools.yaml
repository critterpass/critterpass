appId: app.critterpass.dev
---
# The developer tools list from a cold start: a way out of any dev screen when the iOS edge swipe
# doesn't pop it. The app is stopped first, so the link opens a fresh navigator (a link launch is
# never restored to the saved screen). Opened over a running app, the link would put Home, or the
# pass flow for an account that hasn't finished it, on top of the dev screens, with a back that
# leads into them.
- stopApp
# The simulator's openurl can time out; the wait below still decides.
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 30000
- tapOn:
    id: 'dev-tools-entry'
