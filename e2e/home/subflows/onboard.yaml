appId: app.critterpass.dev
---
# The shortest pass flow from the splash to Home (iOS primer; Android taps "Allow" instead):
# a name, a guide avatar, six this-or-thats, Singapore as home, no save, no permissions yet.
- runFlow: ../../onboarding/subflows/through-name.yaml
- tapOn:
    id: 'onboarding-photo-guides-ajo'
- tapOn:
    id: 'onboarding-photo-next'
# A tap that lands while the page is still moving can miss: once everything has settled, tap Next
# again only if the photo page is still up (never when the quiz already opened).
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'onboarding-photo-next'
    commands:
      - tapOn:
          id: 'onboarding-photo-next'
- extendedWaitUntil:
    visible:
      id: 'taste-card-left'
    timeout: 10000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: 'taste-card-right'
      - waitForAnimationToEnd
- tapOn:
    id: 'taste-done'
# The nearest airports are offered first; search only when none is.
- runFlow:
    when:
      visible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-row-SGN'
- runFlow:
    when:
      notVisible:
        id: 'home-row-SGN'
    commands:
      - tapOn:
          id: 'home-search'
      - inputText: 'Sing'
      - extendedWaitUntil:
          visible:
            id: 'home-row-SIN'
          timeout: 10000
      - tapOn:
          id: 'home-row-SIN'
- hideKeyboard
- tapOn:
    id: 'onboarding-home-next'
- extendedWaitUntil:
    visible:
      id: 'onboarding-issued-save'
    timeout: 10000
- tapOn:
    id: 'onboarding-issued-save'
- tapOn:
    id: 'save-not-now'
- extendedWaitUntil:
    visible:
      id: 'permissions-primer-later'
    timeout: 10000
- tapOn:
    id: 'permissions-primer-later'
