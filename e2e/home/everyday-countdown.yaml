appId: app.critterpass.dev
---
# 3b-2: the crew's next trip counts down live (dd D hh:mm:ss in tabular figures) with PLAN n%, the
# bell carries the needs-you count and the tip strip speaks for the place's guide. Offline, Home
# renders the same from local rows and keeps counting.
#
# Data: a fresh account onboards, then the staging demo seed (e2e/_shared/seed-demo.yaml) gives
# it Bali Demo Crew with a confirmed Bali trip three weeks out, its countdown target, open needs-you
# items and an active tip. The runner toggles the network around the marked steps.
- launchApp:
    clearState: true
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo
- extendedWaitUntil:
    visible:
      id: 'home-mode-everyday'
    timeout: 30000
- assertVisible:
    id: 'home-countdown'
- assertVisible:
    id: 'home-plan-progress'
- assertVisible:
    id: 'home-header-inbox-badge'
- assertVisible:
    id: 'home-tip'
- waitForAnimationToEnd
- takeScreenshot: en-3b-2-home
# Runner: network off here.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-countdown'
    timeout: 30000
- assertNotVisible:
    id: 'home-loading'
- takeScreenshot: en-3b-2-home-offline
# Runner: network back on here.
