appId: app.critterpass.dev
---
# 3b-4: needs-you cards on top, answered inline: the card pops, slides off to the right and its
# row collapses, the NEEDS YOU count ticks down, and after the last one Tokek curls up (3b-5).
# UNDO on a guide's change settles it. MARK ALL READ keeps the cards (read is not resolved).
#
# Data: the staging demo seed's `inbox` scenario: exactly one open needs-you item (Maya's nudge,
# answered with "Take a look") and Tokek's plan change still inside its undo window in EARLIER.
- runFlow: subflows/fresh-install.yaml
- runFlow: subflows/onboard.yaml
- runFlow:
    file: ../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-inbox
- openLink: critterpass-dev://inbox
- extendedWaitUntil:
    visible:
      text: 'NEEDS YOU · 1'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: en-3b-4-inbox
- tapOn: 'MARK ALL READ'
- assertVisible: 'Marked read. The 1 on top still need you.'
- tapOn: 'Take a look'
- extendedWaitUntil:
    visible:
      text: 'NEEDS YOU · 0'
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'inbox-caught-up'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: en-3b-5-all-caught-up
- tapOn:
    id: 'inbox-undo-.*'
# The row settles (its UNDO turns into a check) once the undo has gone through.
- extendedWaitUntil:
    notVisible:
      id: 'inbox-undo-.*'
    timeout: 15000
- takeScreenshot: en-3b-4-undone
