appId: app.critterpass.dev
---
# SHARE RECAP from the recap scene: the share sheet opens with the picture drawn on the phone in
# the story shape (${LANG}-3m-1-share), then the sheet's ✕ closes it.
- scrollUntilVisible:
    element:
      id: 'recap-lab-3m-1-recap'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'recap-lab-3m-1-recap'
- scrollUntilVisible:
    element:
      id: 'recap-share'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'recap-share'
- extendedWaitUntil:
    visible:
      id: 'recap-share-image-story'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${LANG}-3m-1-share
- tapOn:
    id: 'recap-share-sheet-close'
- waitForAnimationToEnd
- runFlow: ../../screens/sweep/subflows/back.yaml
