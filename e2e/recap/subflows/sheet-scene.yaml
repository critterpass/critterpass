appId: app.critterpass.dev
---
# Like lab-scene.yaml for a scene that opens a sheet over its card: back closes the sheet, then
# leaves the scene.
- scrollUntilVisible:
    element:
      id: 'recap-lab-${SCENE}'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'recap-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: ${ROOT}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow: ../../screens/sweep/subflows/back.yaml
- runFlow:
    when:
      notVisible:
        id: 'recap-lab-${SCENE}'
    commands:
      - runFlow: ../../screens/sweep/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'recap-lab-${SCENE}'
    timeout: 10000
