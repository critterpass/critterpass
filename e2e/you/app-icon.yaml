appId: app.critterpass.dev
---
# The app icon picker (3n-5) from the profile lab, in English: the icons the app bundles with one
# earned icon open and new, an earned icon in use, and a locked icon saying how it is earned.
# Switching the home-screen icon itself is the system's (an alert on iOS, a launcher refresh on
# Android), so it is checked by hand on a device.
- runFlow:
    file: ../screens/sweep/subflows/start.yaml
    env:
      LANG: en
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-you-lab'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: 'dev-nav-you-lab'
- extendedWaitUntil:
    visible:
      id: 'you-lab-3n-1-profile'
    timeout: 15000
- runFlow:
    file: subflows/app-icon-scene.yaml
    env:
      SCENE: '3n-5-app-icon'
      ROOT: 'you-app-icon'
      SHOT: en-3n-5-app-icon
- runFlow:
    file: subflows/app-icon-scene.yaml
    env:
      SCENE: '3n-5-earned-in-use'
      ROOT: 'you-app-icon'
      SHOT: en-3n-5-earned-in-use
- runFlow:
    file: subflows/app-icon-scene.yaml
    env:
      SCENE: '3n-5-locked'
      ROOT: 'you-app-icon-problem'
      SHOT: en-3n-5-locked
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCENE: '3n-2-settings'
      ROOT: 'you-settings-guide'
      SHOT: en-3n-2-settings-app-icon
