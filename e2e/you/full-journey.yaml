appId: app.critterpass.dev
---
# One person's whole way through their profile and account, on a saved pass with nothing seeded
# (subflows/saved-test-account.yaml, the staging test number):
# 1. profile → Edit profile: a new name, saved, shows on the pass;
# 2. Change avatar: the critter tab offers the guides, initials is picked again, Done;
# 3. Settings → Language and currency: the app turns Vietnamese in place, then English again;
# 4. Download my data: the export is asked for and the row says it is on its way;
# 5. Delete account → Continue → hold: the account is closed for 30 days;
# 6. "Undo, keep my account" → sign in with the same number → Restore my account: Home is back
#    with the crew and the new name;
# 7. the account is erased again, leaving the number free.
# The app icon picker is not part of it: the profile has no icon row yet.
# Needs `-e OTP_TEST_CODE=<the api's OTP_TEST_CODE>`.
- runFlow: subflows/saved-test-account.yaml

# 1. A new name.
- runFlow: ../screens/sweep/subflows/home.yaml
- tapOn:
    id: 'home-header-profile'
- extendedWaitUntil:
    visible:
      id: 'you-profile-edit'
    timeout: 30000
- tapOn:
    id: 'you-profile-edit'
- extendedWaitUntil:
    visible:
      id: 'you-edit-name'
    timeout: 20000
- tapOn:
    id: 'you-edit-name'
- extendedWaitUntil:
    visible:
      id: 'you-edit-name-field'
    timeout: 15000
- tapOn:
    id: 'you-edit-name-field'
- eraseText: 40
- inputText: 'Journey'
- tapOn:
    id: 'you-edit-name-done'
- extendedWaitUntil:
    visible: '(?i).*journey.*'
    timeout: 15000
- tapOn:
    id: 'you-edit-save'
- extendedWaitUntil:
    visible:
      id: 'you-profile-name'
    timeout: 30000
- extendedWaitUntil:
    visible: '(?i).*journey.*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: you-journey-renamed

# 2. The avatar.
- tapOn:
    id: 'you-profile-edit'
- extendedWaitUntil:
    visible:
      id: 'you-edit-change-avatar'
    timeout: 20000
- tapOn:
    id: 'you-edit-change-avatar'
- extendedWaitUntil:
    visible:
      id: 'you-avatar-tabs'
    timeout: 20000
- tapOn: '(?i)critter'
- extendedWaitUntil:
    visible:
      id: 'you-avatar-guide.*'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: you-journey-avatar-critter
- tapOn: '(?i)initials'
- extendedWaitUntil:
    visible:
      id: 'you-avatar-initials'
    timeout: 15000
- tapOn:
    id: 'you-avatar-done'
- extendedWaitUntil:
    visible:
      id: 'you-edit'
    timeout: 20000
- tapOn:
    id: 'you-edit-back'
- runFlow:
    when:
      visible:
        id: 'you-edit-discard'
    commands:
      - tapOn:
          id: 'you-edit-discard'
- extendedWaitUntil:
    visible:
      id: 'you-profile-settings'
    timeout: 20000

# 3. The language, switched in place.
- tapOn:
    id: 'you-profile-settings'
- extendedWaitUntil:
    visible:
      id: 'you-settings'
    timeout: 30000
- scrollUntilVisible:
    element: 'Language and currency'
    direction: DOWN
    timeout: 20000
- tapOn: 'Language and currency'
- extendedWaitUntil:
    visible:
      id: 'you-language-title'
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: 'you-language-vi'
    commands:
      - tapOn:
          id: 'you-language-more'
- scrollUntilVisible:
    element:
      id: 'you-language-vi'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'you-language-vi'
- extendedWaitUntil:
    notVisible: 'Language and currency'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: you-journey-language-vi
- scrollUntilVisible:
    element:
      id: 'you-language-en'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'you-language-en'
- extendedWaitUntil:
    visible: 'Language and currency'
    timeout: 20000
- tapOn:
    id: 'you-language-back'
- extendedWaitUntil:
    visible:
      id: 'you-settings'
    timeout: 20000

# 4. The export is asked for.
- scrollUntilVisible:
    element: 'Download my data'
    direction: DOWN
    timeout: 20000
- tapOn: 'Download my data'
- extendedWaitUntil:
    visible: '.*(Getting it ready|Ready to download).*'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: you-journey-export-asked

# 5. Delete: closed for 30 days.
- scrollUntilVisible:
    element: 'Delete account'
    direction: DOWN
    timeout: 20000
- tapOn: 'Delete account'
- extendedWaitUntil:
    visible:
      id: 'you-delete-continue'
    timeout: 30000
- tapOn:
    id: 'you-delete-continue'
- extendedWaitUntil:
    visible:
      id: 'you-delete-hold'
    timeout: 15000
- longPressOn:
    id: 'you-delete-hold'
- extendedWaitUntil:
    visible:
      id: 'you-closed-closed'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: you-journey-closed

# 6. Keep it after all: signed out everywhere, so sign in again, then restore.
- tapOn:
    id: 'you-closed-keep'
- extendedWaitUntil:
    visible:
      id: 'phone-number|onboarding-sign-in'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'onboarding-sign-in'
    commands:
      - tapOn:
          id: 'onboarding-sign-in'
- runFlow: subflows/phone-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: 'you-closed-restore'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: you-journey-restore
- tapOn:
    id: 'you-closed-keep'
- extendedWaitUntil:
    visible:
      id: 'home-header-crew-name'
    timeout: 90000
- extendedWaitUntil:
    visible: '(?i).*cp test sign-out.*'
    timeout: 30000
- tapOn:
    id: 'home-header-profile'
- extendedWaitUntil:
    visible:
      id: 'you-profile-name'
    timeout: 30000
- assertVisible: '(?i).*journey.*'
- waitForAnimationToEnd
- takeScreenshot: you-journey-restored

# 7. Leave the test number free for the next run: still our own account, checked again.
- runFlow: ../screens/sweep/subflows/home.yaml
- runFlow: subflows/guard-test-number.yaml
- runFlow: subflows/start-fresh.yaml
