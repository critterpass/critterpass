appId: app.critterpass.dev
---
# Screenshots of every guide screen for `pnpm screens:compare`: the guide lab's scenes over fixed
# data, named by design id (3j-1, 4b-1, 3g-1, 3h-3) and by state.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow: subflows/open-lab.yaml
- runFlow:
    file: subflows/chat-scenes.yaml
    env: { PREFIX: en }
- runFlow:
    file: subflows/meter-scenes.yaml
    env: { PREFIX: en }
- runFlow:
    file: subflows/crew-scenes.yaml
    env: { PREFIX: en }
- runFlow:
    file: subflows/phrase-scenes.yaml
    env: { PREFIX: en }
- runFlow:
    file: subflows/dietary-scenes.yaml
    env: { PREFIX: en }
