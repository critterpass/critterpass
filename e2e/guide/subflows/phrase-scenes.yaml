appId: app.critterpass.dev
---
# Phrase cards (3h-3): with recorded audio, in the phone's voice, audio coming, the phone's voice
# when the audio is out of reach, and SHOW mode, prefixed `${PREFIX}`.
- runFlow:
    file: scene.yaml
    env: { SCENE: phrase-audio, READY: guide-phrase-card, SHOT: '${PREFIX}-3h-3-phrase-audio' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: phrase-show-only,
        READY: guide-phrase-card,
        SHOT: '${PREFIX}-3h-3-phrase-device-voice',
      }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: phrase-loading, READY: guide-phrase-loading, SHOT: '${PREFIX}-3h-3-phrase-loading' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: phrase-unavailable,
        READY: guide-phrase-device-voice,
        SHOT: '${PREFIX}-3h-3-phrase-device-voice-fallback',
      }
- runFlow:
    file: scene.yaml
    env: { SCENE: phrase-show-mode, READY: guide-phrase-show, SHOT: '${PREFIX}-3h-3-show-mode' }
