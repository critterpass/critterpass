appId: app.critterpass.dev
---
# Opens one guide lab scene (apps/mobile/src/app/(dev)/guide-lab.tsx), waits for `${READY}`, takes
# `${SHOT}` and goes back to the list (Android back; iOS drags back from the edge or reopens the lab).
# The row is centred before the tap: a row whose top edge alone peeks above the bottom of the screen
# counts as visible, and a tap on that sliver lands in the system gesture area and opens nothing.
- scrollUntilVisible:
    element:
      id: 'guide-lab-${SCENE}'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'guide-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow:
    when:
      platform: Android
    commands:
      - back
# iOS: a slow drag from the very edge pops the scene; when a scene's gestures or sheet take it
# and the list isn't back, the lab is reopened from Home.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 0%, 50%
          end: 85%, 50%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'guide-lab-${SCENE}'
    commands:
      - runFlow: ../../home/subflows/open-dev-tools.yaml
      - runFlow: open-lab.yaml
      # The reopened list starts at its top.
      - scrollUntilVisible:
          element:
            id: 'guide-lab-${SCENE}'
          direction: DOWN
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'guide-lab-${SCENE}'
    timeout: 10000
