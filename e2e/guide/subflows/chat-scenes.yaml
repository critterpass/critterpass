appId: app.critterpass.dev
---
# The guide sheet (3j-1) and its states, prefixed `${PREFIX}`, in the lab list's own order (each
# scene is found by scrolling down from the last).
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-group, READY: guide-plan-propose, SHOT: '${PREFIX}-3j-1-group' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-empty, READY: guide-empty, SHOT: '${PREFIX}-3j-1-empty' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-thinking, READY: guide-thinking, SHOT: '${PREFIX}-3j-1-thinking' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-streaming, READY: guide-answer-live, SHOT: '${PREFIX}-3j-1-streaming' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-checking, READY: guide-filler, SHOT: '${PREFIX}-3j-1-checking' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-sources, READY: guide-sources, SHOT: '${PREFIX}-3j-1-sources' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-rated, READY: guide-conversation, SHOT: '${PREFIX}-3j-1-rated' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-error, READY: guide-retry, SHOT: '${PREFIX}-3j-1-error' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-refused, READY: guide-error, SHOT: '${PREFIX}-3j-1-refused' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-help, READY: guide-help-card, SHOT: '${PREFIX}-3j-1-help' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-offline, READY: guide-offline-queue, SHOT: '${PREFIX}-3j-1-offline' }
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-sent, READY: guide-plan-outcome, SHOT: '${PREFIX}-3j-1-sent' }
# A long thread opens on its latest page, at the end; "Earlier messages" sits at its top and adds a
# page above without moving the line being read.
- scrollUntilVisible:
    element:
      id: 'guide-lab-chat-long-thread'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'guide-lab-chat-long-thread'
- extendedWaitUntil:
    visible: 'Answer 40.*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${PREFIX}-3j-1-long-thread-end
- scrollUntilVisible:
    element:
      id: 'guide-earlier'
    direction: UP
    timeout: 60000
- takeScreenshot: ${PREFIX}-3j-1-long-thread-earlier
- tapOn:
    id: 'guide-earlier'
- waitForAnimationToEnd:
    timeout: 3000
# Question 26 opened the latest page: it is still on screen with a page added above it.
- extendedWaitUntil:
    visible: 'Question 26.*'
    timeout: 10000
- takeScreenshot: ${PREFIX}-3j-1-long-thread-earlier-added
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 0%, 50%
          end: 85%, 50%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'guide-lab-chat-long-thread'
    commands:
      - runFlow: ../../home/subflows/open-dev-tools.yaml
      - runFlow: open-lab.yaml
      - scrollUntilVisible:
          element:
            id: 'guide-lab-chat-long-thread'
          direction: DOWN
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'guide-lab-chat-long-thread'
    timeout: 10000
- runFlow:
    file: scene.yaml
    env: { SCENE: chat-stopped, READY: guide-retry, SHOT: '${PREFIX}-3j-1-stopped' }
