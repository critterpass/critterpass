appId: app.critterpass.dev
---
# The guide in crew chat (3g-1): typing, a streamed reply, the spent-meter hint and the offer
# card's states, prefixed `${PREFIX}`.
- runFlow:
    file: scene.yaml
    env: { SCENE: crew-typing, READY: guide-crew-typing, SHOT: '${PREFIX}-3g-1-guide-typing' }
- runFlow:
    file: scene.yaml
    env: { SCENE: crew-streaming, READY: guide-crew-reply, SHOT: '${PREFIX}-3g-1-guide-reply' }
- runFlow:
    file: scene.yaml
    env: { SCENE: crew-spent, READY: guide-crew-spent, SHOT: '${PREFIX}-3g-1-guide-spent' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: crew-offer-confirm,
        READY: guide-offer-confirm,
        SHOT: '${PREFIX}-3g-1-offer-confirm',
      }
- runFlow:
    file: scene.yaml
    env: { SCENE: crew-offer-mine, READY: guide-offer-status, SHOT: '${PREFIX}-3g-1-offer-mine' }
- runFlow:
    file: scene.yaml
    env: { SCENE: crew-offer-full, READY: guide-offer-status, SHOT: '${PREFIX}-3g-1-offer-full' }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: crew-offer-expired, READY: guide-offer-status, SHOT: '${PREFIX}-3g-1-offer-expired' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: crew-offer-problem,
        READY: guide-offer-problem,
        SHOT: '${PREFIX}-3g-1-offer-problem',
      }
