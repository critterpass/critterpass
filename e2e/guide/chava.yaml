appId: app.critterpass.dev
---
# Chà Vá, the Đà Nẵng guide, in English: the guide lab's Chà Vá scenes over fixed data.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow: subflows/open-lab.yaml
- runFlow:
    file: subflows/chava-scenes.yaml
    env: { PREFIX: en }
