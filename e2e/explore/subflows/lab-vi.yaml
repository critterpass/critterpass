appId: app.critterpass.dev
---
# A fresh launch into the Explore lab in Vietnamese: the dev gallery switches the running app's
# language (not persisted), then back through the developer tools into the lab.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow: ../../screens/sweep/subflows/back.yaml
# The step back lands on the developer tools list or, on some runs, on the splash.
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- runFlow: open-lab.yaml
