appId: app.critterpass.dev
---
# Swipe together (7g-2): the deck, WHY THIS?, a solo traveller, the deck being built, an ended
# session, offline, long Vietnamese names (no photos: the category doodles), a place's own photo
# with its licence credit and a generic stock photo labelled as not the place; then a match going
# to Ideas with the faces of everyone who said yes, the finished deck listing its matches as Ideas,
# and a Vietnamese crew's match with long names. Prefixed `${PREFIX}`.
- runFlow:
    file: scene.yaml
    env: { SCENE: swipe, READY: explore-swipe-card, SHOT: '${PREFIX}-7g-2-swipe' }
- runFlow:
    file: scene.yaml
    env: { SCENE: swipe-why, READY: explore-swipe-why-sheet, SHOT: '${PREFIX}-7g-2-why-this' }
- runFlow:
    file: scene.yaml
    env: { SCENE: swipe-solo, READY: explore-swipe-card, SHOT: '${PREFIX}-7g-2-solo' }
- runFlow:
    file: scene.yaml
    env: { SCENE: swipe-building, READY: explore-swipe-building, SHOT: '${PREFIX}-7g-2-building' }
- runFlow:
    file: scene.yaml
    env: { SCENE: swipe-ended, READY: explore-swipe-summary, SHOT: '${PREFIX}-7g-2-session-ended' }
- runFlow:
    file: scene.yaml
    env: { SCENE: swipe-offline, READY: explore-swipe-offline, SHOT: '${PREFIX}-7g-2-offline' }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: swipe-da-nang, READY: explore-swipe-card, SHOT: '${PREFIX}-7g-2-da-nang-long-names' }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: swipe-photo, READY: explore-swipe-photo-credit, SHOT: '${PREFIX}-7g-2-place-photo' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: swipe-photo-generic,
        READY: explore-photo-generic,
        SHOT: '${PREFIX}-7g-2-generic-photo',
      }
- runFlow:
    file: scene.yaml
    env:
      { SCENE: swipe-idea-match, READY: explore-swipe-match-voters, SHOT: '${PREFIX}-7g-2-match' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: swipe-idea-summary,
        READY: explore-swipe-see-ideas,
        SHOT: '${PREFIX}-7g-2-deck-finished',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: swipe-idea-match-da-nang,
        READY: explore-swipe-match-voters,
        SHOT: '${PREFIX}-7g-2-match-long-names',
      }
