appId: app.critterpass.dev
---
# The destination guide, a month priced for the crew and each of its states, a Vietnamese crew's
# Đà Nẵng in đồng and the guest guide's page (3b-8), prefixed `${PREFIX}` and named by `${SCREEN}`
# (7g-3: the guide sits on the hero).
- runFlow:
    file: scene.yaml
    env: { SCENE: destination, READY: explore-months, SHOT: '${PREFIX}-${SCREEN}-destination' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-month,
        READY: explore-month-prices,
        SHOT: '${PREFIX}-${SCREEN}-month-priced',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-month-loading,
        READY: explore-month-loading,
        SHOT: '${PREFIX}-${SCREEN}-month-loading',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-no-airport,
        READY: explore-month-no-airport,
        SHOT: '${PREFIX}-${SCREEN}-month-no-home-airport',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-prices-unavailable,
        READY: explore-month-unavailable,
        SHOT: '${PREFIX}-${SCREEN}-month-unavailable',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-saved-offline,
        READY: explore-offline,
        SHOT: '${PREFIX}-${SCREEN}-saved-offline',
      }
- runFlow:
    file: scene.yaml
    env: { SCENE: destination-loading, READY: explore-loading, SHOT: '${PREFIX}-${SCREEN}-loading' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-unavailable,
        READY: explore-unavailable,
        SHOT: '${PREFIX}-${SCREEN}-unavailable',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-da-nang,
        READY: explore-month-prices,
        SHOT: '${PREFIX}-${SCREEN}-da-nang-vnd',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-writing,
        READY: explore-writing,
        SHOT: '${PREFIX}-${SCREEN}-being-written',
      }
- runFlow:
    file: scene.yaml
    env: { SCENE: destination-guest, READY: explore-limited, SHOT: '${PREFIX}-3b-8-guest-guide' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-learning,
        READY: explore-limited,
        SHOT: '${PREFIX}-${SCREEN}-guide-still-learning',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-pick-crew,
        READY: explore-pitch-crews,
        SHOT: '${PREFIX}-${SCREEN}-pick-crew',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-no-crew,
        READY: explore-pitch-no-crew,
        SHOT: '${PREFIX}-${SCREEN}-no-crew',
      }
- runFlow:
    file: scene.yaml
    env: { SCENE: destination-solo, READY: explore-solo-confirm, SHOT: '${PREFIX}-${SCREEN}-solo' }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-sponsored,
        READY: explore-sponsored-tag,
        SHOT: '${PREFIX}-${SCREEN}-sponsored-pick',
      }
- runFlow:
    file: scene.yaml
    env:
      {
        SCENE: destination-sponsored-why,
        READY: explore-sponsored-sheet,
        SHOT: '${PREFIX}-explore-sponsored-why',
      }
