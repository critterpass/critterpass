appId: app.critterpass.dev
---
# Swipe together (7g-2) in Vietnamese, from the Explore lab's scenes.
- runFlow: subflows/lab-vi.yaml
# The swipe scenes sit far down the lab's long list.
- scrollUntilVisible:
    element:
      id: 'explore-lab-swipe'
    direction: DOWN
    timeout: 120000
- runFlow:
    file: subflows/swipe-scenes.yaml
    env: { PREFIX: vi }
