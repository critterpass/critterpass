appId: app.critterpass.dev
---
# The place page (7e-2) with Foursquare's live facts, from the Explore lab: a Đà Nẵng beach with no
# photo of its own shows Foursquare's photo in the hero, then (scrolled) the rating, more photos,
# visitors' tips, call and website rows and the "Powered by Foursquare" line.
- runFlow: subflows/lab-en.yaml
- scrollUntilVisible:
    element:
      id: 'explore-lab-place-detail-live'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'explore-lab-place-detail-live'
- extendedWaitUntil:
    visible:
      id: 'explore-place-hero-live'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7e-2-foursquare
- scrollUntilVisible:
    element:
      id: 'explore-place-attribution'
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: 'explore-place-rating'
- assertVisible:
    id: 'explore-place-website'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-7e-2-foursquare-details
