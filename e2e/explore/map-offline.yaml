appId: app.critterpass.dev
---
# A destination's map and search for a brand-new account, online and then in airplane mode. A
# fresh install onboards (no crew, no trip), taps a guide on Home's first-run grid, and opens the
# destination's map from its page (never by link). Online, the cards are on the map and the list
# view shows the destination's places. With airplane mode on, search still answers from the places
# already on this phone, and the map says the region needs downloading to draw offline. Airplane
# mode is switched by Maestro on Android only, so the offline half runs there.
- runFlow:
    file: ../screens/sweep/subflows/start.yaml
    env:
      LANG: en
- runFlow: ../home/subflows/onboard.yaml
- extendedWaitUntil:
    visible:
      id: 'home-guide-pon'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'home-guide-pon'
- extendedWaitUntil:
    visible:
      id: 'explore-(picks|months|writing)'
    timeout: 45000
- scrollUntilVisible:
    element:
      id: 'explore-open-map'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'explore-open-map'
- extendedWaitUntil:
    visible:
      id: 'explore-map-carousel'
    timeout: 60000
# No screenshot of the map itself: the CI emulator draws neither the tiles nor the pins reliably
# (they are GL symbols), so the map canvas is judged on a real phone. The cards prove the places
# are here.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'explore-map-mode'
- extendedWaitUntil:
    visible:
      id: 'explore-map-row-0'
    timeout: 15000
- takeScreenshot: en-3d-4-fresh-account-list
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: 'explore-map-search'
      - inputText: 'kyoto'
      - hideKeyboard
      - extendedWaitUntil:
          visible:
            id: 'explore-map-row-0'
          timeout: 15000
      - takeScreenshot: en-3d-4-fresh-account-offline-search
      - tapOn:
          id: 'explore-map-mode'
      - extendedWaitUntil:
          visible:
            id: 'explore-map-unavailable'
          timeout: 30000
      - takeScreenshot: en-3d-4-fresh-account-offline-no-region
      - setAirplaneMode: disabled
