appId: app.critterpass.dev
---
# A destination's places map (7c-1, outside a trip) and its search for a brand-new account, online
# and then in airplane mode. A fresh install onboards (no crew, no trip), turns the planning
# redesign on for this phone, taps a guide on Home's first-run grid, and opens the destination's
# map from its page (never by link). Online, the peek counts the places and offers the region for
# offline; the list shows the destination's places. With airplane mode on, the map's own field
# still answers from the places already on this phone, and the map says the region needs
# downloading to draw offline. Airplane mode is switched by Maestro on Android only, so the offline
# half runs there.
- runFlow:
    file: ../screens/sweep/subflows/start.yaml
    env:
      LANG: en
- runFlow: ../home/subflows/onboard.yaml
- runFlow: ../_shared/planning-redesign-on.yaml
- extendedWaitUntil:
    visible:
      id: 'home-guide-pon'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'home-guide-pon'
- extendedWaitUntil:
    visible:
      id: 'explore-(picks|months|writing)'
    timeout: 45000
- scrollUntilVisible:
    element:
      id: 'explore-open-map'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'explore-open-map'
- extendedWaitUntil:
    visible:
      id: 'places-peek'
    timeout: 60000
# The CI emulator draws neither the tiles nor the dots reliably (they are GL layers), so the map
# canvas itself is judged on a real phone; the peek's count proves the places are here.
- waitForAnimationToEnd:
    timeout: 8000
# The tiles and layers draw after the screen: a fixed wait for them (an id that never shows).
- extendedWaitUntil:
    visible:
      id: 'places-tiles-wait'
    timeout: 10000
    optional: true
- takeScreenshot: en-7c-1-offline-fresh-account-map
- tapOn:
    id: 'places-peek-list'
- extendedWaitUntil:
    visible:
      id: 'places-suggests-0'
    timeout: 15000
- takeScreenshot: en-7c-1-offline-fresh-account-list
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: 'places-search-field'
      - inputText: 'kyoto'
      - hideKeyboard
      - extendedWaitUntil:
          visible:
            id: 'places-suggests-0'
          timeout: 15000
      - takeScreenshot: en-7c-1-offline-search
      - tapOn:
          id: 'places-to-map'
      - extendedWaitUntil:
          visible:
            id: 'places-map-unavailable'
          timeout: 30000
      - takeScreenshot: en-7c-1-offline-no-region
      - setAirplaneMode: disabled
