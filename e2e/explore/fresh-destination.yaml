appId: app.critterpass.dev
---
# A brand-new Vietnamese traveller reaches a destination guide: a fresh install in Vietnamese
# onboards from Ho Chi Minh City (no crew, no trip, no saved places, no demo data), taps a guide on
# Home's first-run grid and lands on that guide's destination page, read from staging. The page
# shows the guide's picks and, where the destination has a month curve, a tapped month answers
# with prices, a "no fares" line or the ask for a home airport (never a blank panel), SAVE flips
# to saved, PITCH says a pitch needs a crew, SOLO TRIP asks before it starts anything, the places
# list opens a place page, and Explore's front page and the saved hub show what was saved.
- runFlow:
    file: ../screens/sweep/subflows/start.yaml
    env:
      LANG: vi
- runFlow:
    file: ../home/subflows/onboard.yaml
    env:
      HOME_IATA: SGN
      HOME_QUERY: 'Ho Chi'
- extendedWaitUntil:
    visible:
      id: 'home-guide-pon'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'home-guide-pon'
- extendedWaitUntil:
    visible:
      id: 'explore-destination'
    timeout: 20000
# The page has loaded once the guide's picks, its month bars or the line saying they are still
# being written is on screen.
- extendedWaitUntil:
    visible:
      id: 'explore-(picks|months|writing)'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-3d-1-fresh-account
# A destination with a month curve prices a tapped month; one without has no bars to tap.
- runFlow:
    when:
      visible:
        id: 'explore-months'
    commands:
      - tapOn:
          id: 'explore-month-4'
      - extendedWaitUntil:
          visible:
            id: 'explore-month-panel'
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: 'explore-month-(prices|unavailable|no-airport)'
          direction: DOWN
          timeout: 45000
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: vi-3d-1-fresh-account-month
- scrollUntilVisible:
    element:
      id: 'explore-save'
    direction: UP
    timeout: 10000
- tapOn:
    id: 'explore-save'
- extendedWaitUntil:
    visible:
      id: 'explore-save'
      selected: true
    timeout: 10000
- tapOn:
    id: 'explore-pitch'
- extendedWaitUntil:
    visible:
      id: 'explore-pitch-no-crew'
    timeout: 10000
- tapOn:
    id: 'explore-solo'
- extendedWaitUntil:
    visible:
      id: 'explore-solo-confirm'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: vi-3d-1-fresh-account-solo
- tapOn:
    id: 'explore-solo-cancel'
- extendedWaitUntil:
    visible:
      id: 'explore-pitch'
    timeout: 10000
# The places map lists the destination's places, the guide's must-sees and written-up places first.
# Its list's first row opens the place page: with no trip, ♡ saves the place.
- scrollUntilVisible:
    element:
      id: 'explore-open-map'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'explore-open-map'
# The map opens on its peek (a count and LIST); a picked place shows the carousel instead.
- extendedWaitUntil:
    visible:
      id: 'places-peek|places-carousel'
    timeout: 60000
- tapOn:
    id: 'places-to-list'
- extendedWaitUntil:
    visible:
      id: 'places-[a-z]+-0'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: vi-7c-3-fresh-account
# Outside a trip the list leads with the guide's picks; the menu offers nearest and A–Z.
- tapOn:
    id: 'places-sort'
- extendedWaitUntil:
    visible:
      id: 'places-sort-menu'
    timeout: 10000
- takeScreenshot: vi-7c-3-no-trip-sort-menu
- tapOn:
    id: 'places-sort'
- tapOn:
    id: 'places-[a-z]+-0'
- extendedWaitUntil:
    visible:
      id: 'place-detail-save'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7e-1-fresh-account
- tapOn:
    id: 'place-detail-save'
- extendedWaitUntil:
    visible:
      id: 'place-detail-saved'
    timeout: 10000
- tapOn:
    id: 'place-detail-back|place-detail-header-back'
- extendedWaitUntil:
    visible:
      id: 'places-[a-z]+-0'
    timeout: 15000
- repeat:
    while:
      notVisible:
        id: 'explore-destination'
    times: 2
    commands:
      - tapOn:
          id: 'places-back'
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'explore-destination'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'explore-back'
    direction: UP
    timeout: 10000
- tapOn:
    id: 'explore-back'
- extendedWaitUntil:
    visible:
      id: 'home-guide-pon'
    timeout: 15000
# Explore's front page lists the guides' destinations (Kyoto now marked saved), and the saved hub
# holds the destination and the place saved above.
- runFlow:
    file: ../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://explore
- extendedWaitUntil:
    visible:
      id: 'explore-home-kyoto'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: vi-explore-home-fresh-account-real
- tapOn:
    id: 'explore-home-saved'
- extendedWaitUntil:
    visible:
      id: 'explore-saved-group'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: vi-explore-saved-fresh-account-real
- tapOn:
    id: 'explore-back'
- extendedWaitUntil:
    visible:
      id: 'explore-home-kyoto'
    timeout: 15000
