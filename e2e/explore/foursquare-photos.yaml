appId: app.critterpass.dev
---
# A place's kept Foursquare photo, credited, in English then Vietnamese: on a search result's tile
# (the screen draws "Powered by Foursquare" once under the results) and on the planning place page
# with a credited photo and both chips. All from lab scenes, so no Foursquare call is made.
- runFlow:
    file: subflows/search-lab-open.yaml
    env: { LOCALE: en }
- runFlow:
    file: subflows/search-lab-scene.yaml
    env:
      { SCENE: 7d-1-typing-foursquare, READY: photo-credit, SHOT: en-7d-1-typing-foursquare-photo }
- runFlow: subflows/lab-en.yaml
- runFlow:
    file: subflows/scene.yaml
    env: { SCENE: place-detail, READY: place-detail-cta, SHOT: en-7e-1-place-credit }
- runFlow:
    file: subflows/search-lab-open.yaml
    env: { LOCALE: vi }
- runFlow:
    file: subflows/search-lab-scene.yaml
    env:
      { SCENE: 7d-1-typing-foursquare, READY: photo-credit, SHOT: vi-7d-1-typing-foursquare-photo }
- runFlow: subflows/lab-vi.yaml
- runFlow:
    file: subflows/scene.yaml
    env: { SCENE: place-detail, READY: place-detail-cta, SHOT: vi-7e-1-place-credit }
