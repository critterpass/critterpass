appId: app.critterpass.dev
---
# The full-screen media viewer, from the Explore lab: opened on a lab strip's first photo (counter,
# caption and credit), paged to the second and dragged down to close; reopened on the third, paged
# back, zoomed with a double-tap and closed with ✕;
# then from a place page with Foursquare's live facts, on the hero photo and on the photo strip,
# each keeping its "Foursquare" credit.
- runFlow: subflows/lab-en.yaml
- scrollUntilVisible:
    element:
      id: 'explore-lab-media-lightbox'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'explore-lab-media-lightbox'
- extendedWaitUntil:
    visible:
      id: 'lab-lightbox-thumb-0'
    timeout: 20000
- tapOn:
    id: 'lab-lightbox-thumb-0'
- extendedWaitUntil:
    visible:
      id: 'lab-lightbox-counter'
    timeout: 15000
- assertVisible:
    id: 'lab-lightbox-credit'
- assertVisible:
    id: 'lab-lightbox-caption'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-lightbox-lab-first
- swipe:
    start: 85%, 50%
    end: 15%, 50%
    duration: 400
- extendedWaitUntil:
    visible: '2 / 4'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-lightbox-lab-second
# Dragged down, the viewer goes away.
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 400
- extendedWaitUntil:
    notVisible:
      id: 'lab-lightbox-counter'
    timeout: 10000
- assertVisible:
    id: 'lab-lightbox-thumb-0'
# Opened on the third photo, paged back, zoomed with a double-tap, closed with ✕.
- tapOn:
    id: 'lab-lightbox-thumb-2'
- extendedWaitUntil:
    visible: '3 / 4'
    timeout: 15000
- swipe:
    start: 15%, 50%
    end: 85%, 50%
    duration: 400
- extendedWaitUntil:
    visible: '2 / 4'
    timeout: 10000
- doubleTapOn:
    point: 50%, 50%
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-lightbox-lab-zoomed
- tapOn:
    id: 'lab-lightbox-close'
- extendedWaitUntil:
    notVisible:
      id: 'lab-lightbox-counter'
    timeout: 10000
- assertVisible:
    id: 'lab-lightbox-thumb-0'
- runFlow: subflows/lab-en.yaml
- scrollUntilVisible:
    element:
      id: 'explore-lab-place-detail-live'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'explore-lab-place-detail-live'
- extendedWaitUntil:
    visible:
      id: 'explore-place-hero-live'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    id: 'explore-place-hero-open'
- extendedWaitUntil:
    visible:
      id: 'place-hero-lightbox-credit'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7e-2-lightbox-hero
- tapOn:
    id: 'place-hero-lightbox-close'
- extendedWaitUntil:
    notVisible:
      id: 'place-hero-lightbox-credit'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'explore-place-photo-0'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'explore-place-photo-0'
- extendedWaitUntil:
    visible:
      id: 'place-live-lightbox-counter'
    timeout: 15000
- assertVisible:
    id: 'place-live-lightbox-credit'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7e-2-lightbox-foursquare
