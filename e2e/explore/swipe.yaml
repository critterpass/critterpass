appId: app.critterpass.dev
---
# Swipe together (7g-2) in English then Vietnamese, from the Explore lab's scenes: matches go to
# Ideas with everyone who said yes.
- runFlow: subflows/lab-en.yaml
# The swipe scenes sit far down the lab's long list.
- scrollUntilVisible:
    element:
      id: 'explore-lab-swipe'
    direction: DOWN
    timeout: 120000
- runFlow:
    file: subflows/swipe-scenes.yaml
    env: { PREFIX: en }
- runFlow: swipe-vi.yaml
