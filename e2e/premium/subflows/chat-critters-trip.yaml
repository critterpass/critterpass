appId: app.critterpass.dev
---
# The trip's critter and memory pages in ${LOOK}, from Home and back to Home: the trip from Home's
# live card (else the Trips tab), then its Quests tile (crew quests, 8.07) and its Album tile (the
# trip journal, 8.12).
- runFlow:
    file: trip-open-hub.yaml
    env:
      ZOOM: ''
- extendedWaitUntil:
    visible:
      id: 'trip-hub'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trip-hub'
    commands:
      - scrollUntilVisible:
          element:
            id: 'trip-hub-tile-quests'
          direction: DOWN
          timeout: 15000
          optional: true
      - tapOn:
          id: 'trip-hub-tile-quests'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'quests-screen'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'quests-screen'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '8.07'
                  NAME: crew-quests
                  LOOK: ${LOOK}
            - runFlow:
                file: tap.yaml
                env:
                  ID: 'quests-back'
                  LABEL: 'Back'
      - extendedWaitUntil:
          visible:
            id: 'trip-hub'
          timeout: 10000
          optional: true
      - scrollUntilVisible:
          element:
            id: 'trip-hub-tile-album'
          direction: DOWN
          timeout: 15000
          optional: true
      - tapOn:
          id: 'trip-hub-tile-album'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'album-screen'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'album-screen'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '8.12'
                  NAME: trip-journal
                  LOOK: ${LOOK}
            - runFlow:
                file: tap.yaml
                env:
                  ID: 'album-back'
                  LABEL: 'Back'
# Back out of the trip, so the next pass starts on Home.
- repeat:
    times: 3
    while:
      visible:
        id: 'trip-hub|quests-screen|album-screen'
    commands:
      - runFlow: back.yaml
- runFlow:
    file: tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 10000
    optional: true
