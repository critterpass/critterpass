appId: app.critterpass.dev
---
# Steps back until Home shows (at most eight steps), then opens the Home tab. Sheets and pushed
# pages the earlier steps left open are closed on the way. The plan map leaves by its own back
# button: on iOS an edge swipe over the map pans the map instead of going back.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'home-screen'
    commands:
      - runFlow:
          when:
            visible:
              id: 'plan-map-back'
          commands:
            - tapOn:
                id: 'plan-map-back'
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible:
              id: 'plan-map-back|home-screen'
          commands:
            - runFlow: back.yaml
- runFlow:
    when:
      notVisible:
        id: 'home-screen'
    commands:
      - runFlow:
          file: tab.yaml
          env:
            TAB: home
            LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 10000
    optional: true
