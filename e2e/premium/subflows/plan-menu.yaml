appId: app.critterpass.dev
---
# What the plan's ⋯ menu opens, in ${LOOK}, from Home: Ideas with must-do stars (4.40) and the
# guide placing them (4.41), all days (4.28), the plan check (4.43) with the first card's fix page
# (4.44 gap, 4.45 less driving, 4.46 rain, 4.48 review) and Balance the crew (4.47), then trip
# settings (4.53), change dates (4.54) and cancel the trip (4.55), each opened and left without
# confirming. Dark: trip settings only. Ends on Home.
- runFlow: plan-open-map.yaml
- runFlow:
    when:
      true: ${LOOK == 'light'}
    commands:
      - runFlow:
          file: plan-more.yaml
          env:
            ITEM: ideas
      - extendedWaitUntil:
          visible:
            id: 'ideas-sheet|ideas-empty'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'ideas-sheet|ideas-empty'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.40'
                  NAME: ideas
      # Placing the ideas adds stops to the seeded crew's plan; leaving keeps the guide working.
      - runFlow:
          when:
            visible:
              id: 'ideas-place'
          commands:
            - tapOn:
                id: 'ideas-place'
            - extendedWaitUntil:
                visible:
                  id: 'placing'
                timeout: 15000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'placing'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.41'
                        NAME: placing
            - tapOn:
                id: 'placing-leave'
                optional: true
      - runFlow: plan-home.yaml
      - runFlow: plan-open-map.yaml
      - runFlow:
          file: plan-more.yaml
          env:
            ITEM: days
      - extendedWaitUntil:
          visible:
            id: 'all-days'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'all-days'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.28'
                  NAME: all-days
      - runFlow:
          when:
            visible:
              id: 'all-days'
          commands:
            - runFlow: back.yaml
      - runFlow:
          file: plan-more.yaml
          env:
            ITEM: check
      - extendedWaitUntil:
          visible:
            id: 'plan-check'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'plan-check'
          commands:
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '4.43'
                  NAME: plan-check
      - runFlow:
          when:
            visible:
              id: 'plan-check-balance'
          commands:
            - tapOn:
                id: 'plan-check-balance'
            - extendedWaitUntil:
                visible:
                  id: 'plan-balance'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'plan-balance'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.47'
                        NAME: balance
            - runFlow:
                when:
                  visible:
                    id: 'plan-balance'
                commands:
                  - runFlow: back.yaml
      # The first card's fix: a page for the gap, the driving, the weather or a change list.
      - runFlow:
          when:
            visible:
              id: 'plan-check-fix-.*'
          commands:
            - tapOn:
                id: 'plan-check-fix-.*'
                index: 0
            - extendedWaitUntil:
                visible:
                  id: 'plan-gap|plan-less-driving|plan-rain|plan-review'
                timeout: 15000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'plan-gap'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.44'
                        NAME: fill-gap
            - runFlow:
                when:
                  visible:
                    id: 'plan-less-driving'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.45'
                        NAME: less-driving
            - runFlow:
                when:
                  visible:
                    id: 'plan-rain'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.46'
                        NAME: rain-crowds
            - runFlow:
                when:
                  visible:
                    id: 'plan-review'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.48'
                        NAME: review-changes
      - runFlow: plan-home.yaml
      - runFlow: plan-open-map.yaml
- runFlow:
    file: plan-more.yaml
    env:
      ITEM: settings
- extendedWaitUntil:
    visible:
      id: 'trip-settings-hero'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trip-settings-hero'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '4.53'
            NAME: trip-settings
- runFlow:
    when:
      true: ${LOOK == 'light'}
    commands:
      - runFlow:
          when:
            visible:
              id: 'trip-settings-dates'
          commands:
            - tapOn:
                id: 'trip-settings-dates'
            - extendedWaitUntil:
                visible:
                  id: 'change-dates|range-calendar'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'change-dates|range-calendar'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.54'
                        NAME: change-dates
            - runFlow:
                file: tap.yaml
                env:
                  ID: 'change-dates-close'
                  LABEL: 'Close'
            - runFlow:
                when:
                  notVisible:
                    id: 'trip-settings-hero'
                commands:
                  - runFlow: back.yaml
      # The cancel page only: its hold to confirm is never touched.
      - scrollUntilVisible:
          element:
            id: 'trip-settings-cancel'
          direction: DOWN
          timeout: 10000
          centerElement: true
          optional: true
      - runFlow:
          when:
            visible:
              id: 'trip-settings-cancel'
          commands:
            - tapOn:
                id: 'trip-settings-cancel'
            - extendedWaitUntil:
                visible:
                  id: 'cancel-trip-keep|cancel-trip-unavailable'
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'cancel-trip-keep|cancel-trip-unavailable'
                commands:
                  - runFlow:
                      file: shot.yaml
                      env:
                        CODE: '4.55'
                        NAME: cancel-trip
            - runFlow:
                when:
                  visible:
                    id: 'cancel-trip-keep'
                commands:
                  - tapOn:
                      id: 'cancel-trip-keep'
- runFlow: plan-home.yaml
