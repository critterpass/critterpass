appId: app.critterpass.dev
---
# Before the trip (the demo crew's Bali trip, three weeks out): the hub, and its crew map with
# nothing to show yet (6.13), in ${LOOK}.
- runFlow:
    file: trip-open-hub.yaml
    env:
      ZOOM: ''
- runFlow:
    when:
      visible:
        id: 'trip-hub-door-map'
    commands:
      - tapOn:
          id: 'trip-hub-door-map'
      - runFlow: trip-deny.yaml
      - extendedWaitUntil:
          visible:
            id: 'live-map-screen|live-map-gate'
          timeout: 20000
          optional: true
      - runFlow: trip-deny.yaml
      - runFlow:
          file: shot.yaml
          env:
            CODE: '6.13'
            NAME: before-trip
            LOOK: ${LOOK}
      - runFlow: back.yaml
