appId: app.critterpass.dev
---
# The booking detail open now, in ${LOOK}: a flight (7.10, and 1.13 in dark) or a stay (7.06); in
# light also its boarding pass (7.11, when the flight has one) and the booking options (7.15,
# closed without picking one). Ends back on the wallet.
- extendedWaitUntil:
    visible:
      id: 'bookings-detail'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'bookings-flight-ticket'
    commands:
      - runFlow:
          file: shot.yaml
          env:
            CODE: '7.10'
            NAME: flight
            LOOK: ${LOOK}
      - runFlow:
          when:
            true: ${LOOK == 'dark'}
          file: shot.yaml
          env:
            CODE: '1.13'
            NAME: dark-flight
            LOOK: ${LOOK}
      - scrollUntilVisible:
          element:
            id: 'bookings-doc-pass'
          direction: DOWN
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'bookings-doc-pass'
          commands:
            - tapOn:
                id: 'bookings-doc-pass'
            - extendedWaitUntil:
                visible:
                  id: 'bookings-pass'
                timeout: 10000
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '7.11'
                  NAME: boarding-pass
                  LOOK: ${LOOK}
            - tapOn:
                id: 'full-screen-close'
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'bookings-pass'
                commands:
                  - runFlow: back.yaml
- runFlow:
    when:
      visible:
        id: 'bookings-detail'
      notVisible:
        id: 'bookings-flight-ticket'
    file: shot.yaml
    env:
      CODE: '7.06'
      NAME: stay
      LOOK: ${LOOK}
- runFlow:
    when:
      true: ${LOOK == 'light'}
      visible:
        id: 'bookings-detail'
    commands:
      - runFlow:
          file: tap.yaml
          env:
            ID: 'bookings-options'
            LABEL: 'Booking options'
      - runFlow:
          file: shot.yaml
          env:
            CODE: '7.15'
            NAME: options
            LOOK: ${LOOK}
      # Closed without choosing: Close on the iPhone's action sheet, back on Android's list.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: 'Close|Cancel|Đóng|Huỷ'
                optional: true
      - runFlow:
          when:
            platform: Android
          commands:
            - back
            - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'bookings-detail'
    commands:
      - runFlow: back.yaml
