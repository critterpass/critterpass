appId: app.critterpass.dev
---
# Back to Home from a pushed screen: back up to three times (the first closes a keyboard on
# Android), then the Home tab.
- repeat:
    times: 3
    while:
      notVisible:
        id: 'home-screen'
    commands:
      - runFlow: back.yaml
- runFlow:
    when:
      notVisible:
        id: 'home-screen'
    commands:
      - runFlow:
          file: tab.yaml
          env:
            TAB: home
            LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 10000
    optional: true
