appId: app.critterpass.dev
---
# Back to Home, whatever screen or sheet the last steps ended on (up to four steps back).
- repeat:
    times: 4
    while:
      notVisible:
        id: 'home-screen'
    commands:
      - runFlow: back.yaml
- runFlow:
    file: tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 15000
    optional: true
