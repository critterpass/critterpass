appId: app.critterpass.dev
---
# Into the developer tools lab whose entry is ${NAV} and whose list shows ${LIST}: back out of any
# lab page to the tools list or a tab root, and from Home through "Developer tools" when needed.
- repeat:
    while:
      notVisible:
        id: 'dev-nav-.*|home-screen|guide-fab|tab-home'
    times: 4
    commands:
      - runFlow: back.yaml
- runFlow:
    when:
      notVisible:
        id: 'dev-nav-.*'
    commands:
      - runFlow:
          file: tab.yaml
          env:
            TAB: home
            LABEL: Home
      - scrollUntilVisible:
          element:
            id: 'dev-tools-entry'
          direction: DOWN
          timeout: 15000
          optional: true
      - tapOn:
          id: 'dev-tools-entry'
          optional: true
# The list keeps its place: look down, then up.
- scrollUntilVisible:
    element:
      id: '${NAV}'
    direction: DOWN
    timeout: 20000
    speed: 20
    optional: true
- scrollUntilVisible:
    element:
      id: '${NAV}'
    direction: UP
    timeout: 20000
    speed: 20
    optional: true
- tapOn:
    id: '${NAV}'
    optional: true
- extendedWaitUntil:
    visible:
      id: '${LIST}'
    timeout: 15000
    optional: true
