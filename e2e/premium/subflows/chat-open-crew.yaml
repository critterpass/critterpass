appId: app.critterpass.dev
---
# From Home to the Bali crew's chat by Home's chat button (3.02). When the button isn't there (no
# crew yet in this world), the inbox's "Jordan joined" row opens the crew chat instead. Ends on the
# chat, or on whatever showed up when a step was missing (a capture sweep keeps going).
- runFlow:
    file: tap.yaml
    env:
      ID: 'home-chat'
      LABEL: 'Crew chat'
- extendedWaitUntil:
    visible:
      id: 'chat-screen'
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'chat-screen'
    commands:
      - runFlow:
          file: tap.yaml
          env:
            ID: 'home-bell'
            LABEL: 'Inbox'
      - extendedWaitUntil:
          visible:
            id: 'inbox-screen'
          timeout: 10000
          optional: true
      - scrollUntilVisible:
          element:
            text: '.*joined.*'
          direction: DOWN
          timeout: 15000
          optional: true
      - tapOn:
          text: '.*joined.*'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'chat-screen'
          timeout: 15000
          optional: true
