appId: app.critterpass.dev
---
# A new account holding the api's ${SCENARIO} seed (see e2e/_shared/start-as.yaml), on Home, with
# the premium UI on, in ${LANG} (en by default, or vi; the app keeps the language over relaunches). ${output.crewCode} holds the crew's join code when the scenario answers one.
- evalScript: "${output.premiumLang = typeof LANG === 'undefined' || LANG === '' ? 'en' : LANG}"
- runFlow:
    file: ../../_shared/start-as.yaml
    env:
      SCENARIO: ${SCENARIO}
      LANG: ${output.premiumLang}
- runFlow: premium-on.yaml
# A trip that has turned on can show its welcome page over Home at any later step.
- runFlow:
    when:
      visible:
        id: 'critters-hatch-later'
    commands:
      - tapOn:
          id: 'critters-hatch-later'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
