appId: app.critterpass.dev
---
# The trip with no signal (Android: the runner cuts Wi-Fi and data), in ${LOOK}: the hub's offline
# line (6.15), the crew map with its last fixes fading (6.12), and a pack item added on the day page
# that waits to send, opened from the offline page (6.18, closed without cancelling it). The network
# always comes back at the end.
# Runner: Wi-Fi and data off.
- evalScript: "${output.cut = http.post('http://127.0.0.1:7788/network?state=off', { body: '{}' }).status}"
- runFlow:
    file: trip-open-hub.yaml
    env:
      ZOOM: ''
- extendedWaitUntil:
    visible:
      id: 'trip-hub-offline-(pill|day)'
    timeout: 10000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      CODE: '6.15'
      NAME: hub-offline
      LOOK: ${LOOK}
- runFlow:
    when:
      visible:
        id: 'trip-hub-door-map'
    commands:
      - tapOn:
          id: 'trip-hub-door-map'
      - runFlow: trip-deny.yaml
      - extendedWaitUntil:
          visible:
            id: 'live-map-screen|live-map-gate'
          timeout: 15000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '6.12'
            NAME: crew-map-offline
            LOOK: ${LOOK}
      - runFlow: back.yaml
- runFlow:
    when:
      notVisible:
        id: 'trip-hub'
    file: trip-open-hub.yaml
    env:
      ZOOM: ''
- scrollUntilVisible:
    element:
      id: 'trip-hub-(next|today)'
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    id: 'trip-hub-(next|today)'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      id: 'trip-day-pack-add'
    direction: DOWN
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trip-day-pack-add'
    commands:
      - tapOn:
          id: 'trip-day-pack-add'
      - extendedWaitUntil:
          visible:
            id: 'trip-day-pack-field'
          timeout: 5000
          optional: true
      - inputText: 'Raincoat'
      - pressKey: Enter
      - hideKeyboard:
          optional: true
- scrollUntilVisible:
    element:
      id: 'trip-day-offline'
    direction: DOWN
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trip-day-offline'
    commands:
      - tapOn:
          id: 'trip-day-offline'
      - extendedWaitUntil:
          visible:
            id: 'trip-offline-page'
          timeout: 10000
          optional: true
      - runFlow:
          file: shot.yaml
          env:
            CODE: '6.15'
            NAME: what-works-offline
            LOOK: ${LOOK}
      - scrollUntilVisible:
          element:
            id: 'trip-offline-send-.*'
          direction: DOWN
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'trip-offline-send-.*'
          commands:
            - tapOn:
                id: 'trip-offline-send-.*'
            - extendedWaitUntil:
                visible:
                  id: 'trip-offline-item-sheet'
                timeout: 10000
                optional: true
            - runFlow:
                file: shot.yaml
                env:
                  CODE: '6.18'
                  NAME: queued-send
                  LOOK: ${LOOK}
            - tapOn:
                id: 'trip-offline-item-close'
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'trip-offline-item-edit'
                commands:
                  - runFlow: back.yaml
      - runFlow: back.yaml
# Runner: Wi-Fi and data back on.
- evalScript: "${output.cut = http.post('http://127.0.0.1:7788/network?state=on', { body: '{}' }).status}"
- runFlow: back.yaml
- runFlow:
    file: tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 15000
    optional: true
