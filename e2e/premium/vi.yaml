appId: app.critterpass.dev
# The chat's offline capture switches the signal off; a stopped run must not leave it off.
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
# Premium design | device capture in Vietnamese: the key screens of Home, Pass, crew chat and the
# plan map for the Bali demo crew, so wrapped or clipped Vietnamese labels show in the sheets. The
# area subflows run with LOOK `vi`, which takes only their key screens (the ones they repeat in
# dark) and names the shots `premium-<code>-<state>-vi`.
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: everyday
      LANG: vi
- runFlow:
    file: subflows/home-crew.yaml
    env:
      LOOK: vi
- runFlow: subflows/vi-home.yaml
- runFlow:
    file: subflows/pass-steps.yaml
    env:
      LOOK: vi
- runFlow: subflows/vi-home.yaml
- runFlow:
    file: subflows/chat-crew.yaml
    env:
      LOOK: vi
- runFlow: subflows/vi-home.yaml
- runFlow:
    file: subflows/plan-map.yaml
    env:
      LOOK: vi
