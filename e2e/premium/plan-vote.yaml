appId: app.critterpass.dev
---
# Premium sweep, deciding the trip (design part 4). The `vote_final` crew's new poll in chat,
# showdown, winner stamp, setup steps and drafting (light: the vote plays once per account), then
# the `crew_with_code` crew pitching a place (search, destination guide, guest guide, solo pass)
# in light and the key screens in dark. A capture sweep: every step after the start is conditional, so a missing state
# skips its shot. The plan, its menu and Find are in plan.yaml.
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: vote_final
- runFlow:
    file: subflows/plan-poll.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/plan-decide.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: subflows/plan-places.yaml
    env:
      LOOK: light
# The places pitch ends deep in a stack of sheets: the dark pass starts from a fresh Home.
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: crew_with_code
- runFlow:
    file: subflows/appearance.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/plan-places.yaml
    env:
      LOOK: dark
