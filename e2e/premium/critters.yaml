appId: app.critterpass.dev
---
# Premium captures for critters and memories (design part 8): a Vietnamese crew's trip that is on
# today. Its egg hatches from the Critterdex (8.05); then the Critterdex
# (8.01), a critter (8.02), the legendary calendar (8.08), crew quests (8.07) and the trip journal
# (8.12) in light, and again in dark but for the hatch and the calendar. A capture sweep: every
# step after the setup is conditional or optional.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: trip_today
      LANG: en
- runFlow: subflows/premium-on.yaml
# The trip is on today, so the dex offers its egg (Hatch it): the hatch plays (8.05), then Later
# goes back to the dex and the flow returns Home. The hatch never opens over Home by itself.
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: pass
      LABEL: Pass
- scrollUntilVisible:
    element:
      id: 'you-profile-critterdex'
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: 'you-profile-critterdex'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'critters-egg-hatch'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'critters-egg-hatch'
    commands:
      - tapOn:
          id: 'critters-egg-hatch'
      - extendedWaitUntil:
          visible:
            id: 'critters-hatched'
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'critters-hatch'
          commands:
            - runFlow:
                file: subflows/shot.yaml
                env:
                  CODE: '8.05'
                  NAME: egg-hatch
                  LOOK: light
            - tapOn:
                id: 'critters-hatch-later'
                optional: true
- repeat:
    times: 3
    while:
      visible:
        id: 'critters-dex|critters-hatch'
    commands:
      - runFlow: subflows/back.yaml
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: home
      LABEL: Home
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 15000
- runFlow:
    file: subflows/chat-critters-dex.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/chat-critters-trip.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/appearance.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/chat-critters-dex.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/chat-critters-trip.yaml
    env:
      LOOK: dark
