appId: app.critterpass.dev
---
# Premium captures for critters and memories (design part 8): a Vietnamese crew's trip that is on
# today. Its welcome page hatches the trip's critter (8.05) as the app opens; then the Critterdex
# (8.01), a critter (8.02), the legendary calendar (8.08), crew quests (8.07) and the trip journal
# (8.12) in light, and again in dark but for the hatch and the calendar. A capture sweep: every
# step after the setup is conditional or optional.
- runFlow:
    file: ../_shared/start-as.yaml
    env:
      SCENARIO: trip_today
      LANG: en
- runFlow: subflows/premium-on.yaml
# The trip turned on today, so its welcome page comes up over Home and the egg hatches by itself.
- extendedWaitUntil:
    visible:
      id: 'critters-hatched'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'critters-hatch'
    commands:
      - runFlow:
          file: subflows/shot.yaml
          env:
            CODE: '8.05'
            NAME: egg-hatch
            LOOK: light
      - tapOn:
          id: 'critters-hatch-later'
          optional: true
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
- runFlow:
    file: subflows/chat-critters-dex.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/chat-critters-trip.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/appearance.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/chat-critters-dex.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/chat-critters-trip.yaml
    env:
      LOOK: dark
