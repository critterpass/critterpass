appId: app.critterpass.dev
# Signal comes back even when a step fails, so the next flow on this device starts online.
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
# Premium captures for the crew chat and the guide (design part 5, and the Foundations dark chat):
# the Bali demo crew with its chat and a trip three weeks out. Light first, every state; then dark
# for the chat, the sticker tray, the long-press menu and the guide's answer. A capture sweep:
# every step after the setup is conditional or optional.
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: subflows/chat-crew.yaml
    env:
      LOOK: light
- runFlow:
    file: subflows/chat-guide.yaml
    env:
      LOOK: light
# The guide leaves sheets and full-screen pages stacked: the dark pass starts from a fresh Home.
- runFlow:
    file: subflows/start.yaml
    env:
      SCENARIO: everyday
- runFlow:
    file: subflows/appearance.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/chat-crew.yaml
    env:
      LOOK: dark
- runFlow:
    file: subflows/chat-guide.yaml
    env:
      LOOK: dark
