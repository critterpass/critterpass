appId: app.critterpass.dev
---
# The drafting screen (3c-8) and its states, in English, from the fixed developer scenes: running,
# starting, slow, a step failed on the way, failed, waiting for signal, stopped, dates not locked.
- launchApp:
    clearState: true
- runFlow:
    file: ../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: draft
      READY: draft-scene-list
- scrollUntilVisible:
    element:
      id: 'draft-scene-3c-8-drafting'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-3c-8-drafting'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3c-8-drafting
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: Android
      notVisible:
        id: 'draft-scene-list'
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'draft-scene-list'
    commands:
      - tapOn:
          id: 'draft-scene-back'
- scrollUntilVisible:
    element:
      id: 'draft-scene-drafting-starting'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-drafting-starting'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-drafting-starting
- runFlow:
