appId: app.critterpass.dev
---
# Fill a gap (7h-2) from the plan ideas lab, in English then Vietnamese: Wednesday 16:00–19:00
# with four free, Tokek's three ideas and the button that follows the pick. Shots are named
# `<lang>-7h-2-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^check-7h-2$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-2$'
- extendedWaitUntil:
    visible:
      id: 'plan-gap-title'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-2-ideas
- tapOn:
    id: 'plan-gap-idea-1'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-7h-2-picked
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-2$'
    timeout: 10000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^check-7h-2$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-2$'
- extendedWaitUntil:
    visible:
      id: 'plan-gap-title'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7h-2-ideas
- tapOn:
    id: 'plan-gap-idea-1'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: vi-7h-2-picked
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-2$'
    timeout: 10000
