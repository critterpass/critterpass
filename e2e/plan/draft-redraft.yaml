appId: app.critterpass.dev
---
# Change a day (3c-11), the last free redraft (4f-3) and the redraft diff (3c-12) with their states,
# in English, from the fixed developer scenes.
- launchApp:
    clearState: true
- runFlow:
    file: ../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: draft
      READY: draft-scene-list
- scrollUntilVisible:
    element:
      id: 'draft-scene-3c-11-change-a-day'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-3c-11-change-a-day'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3c-11-change-a-day
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: Android
      notVisible:
        id: 'draft-scene-list'
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'draft-scene-list'
    commands:
      - tapOn:
          id: 'draft-scene-back'
- scrollUntilVisible:
    element:
      id: 'draft-scene-change-day-no-reason'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-change-day-no-reason'
- waitForAnimationToEnd:
