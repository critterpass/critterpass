      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-1-member$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^check-7h-1-too-far$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-1-too-far$'
- extendedWaitUntil:
