# The real screen, from Home: a brand-new traveller locks in a trip, the section 7 screens are on
# for this phone, and PLAN opens the trip map. Its CHECK shows once the check has run on the plan.
- runFlow:
    file: ../happy/subflows/trip-under-way.yaml
    env:
      SHOTS: plan-check
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-header-chat'
    timeout: 60000
- runFlow: ../happy/subflows/dismiss-visit-offer.yaml
- extendedWaitUntil:
    visible:
      id: 'home-header-chat'
    timeout: 30000
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'trip-map-peek'
    timeout: 60000
# The check runs by itself once the plan is locked in (a debounce, then the job); the guide's note on the sheet, with the way into the check, shows once it has.
# A trip whose first check has not run yet has no way in: the shot records that, and the walk ends.
- extendedWaitUntil:
    visible:
      id: 'trip-map-check'
    timeout: 240000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'trip-map-check'
    commands:
      - takeScreenshot: en-7h-1-entry-check-not-run
- runFlow:
    when:
      visible:
        id: 'trip-map-check'
    commands:
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: en-7h-1-entry
      # With something to fix or know the note carries CHECK; with nothing, SEE on the whole trip.
      - runFlow:
          when:
            visible: '(?i)check'
          commands:
            - tapOn: '(?i)check'
      - runFlow:
          when:
            notVisible:
              id: 'plan-check-title'
          commands:
            - swipe:
                start: 50%, 70%
                end: 50%, 46%
                duration: 700
            - extendedWaitUntil:
                visible:
                  id: 'trip-map-half'
                timeout: 10000
            - tapOn:
                id: 'trip-map-all-days'
            - extendedWaitUntil:
                visible:
                  id: 'trip-map-full'
                timeout: 10000
            - scrollUntilVisible:
                element:
                  id: 'trip-map-check-card'
                direction: DOWN
                timeout: 20000
            - tapOn: '(?i)see'
      - extendedWaitUntil:
          visible:
            id: 'plan-check-title'
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 8000
      - assertNotVisible: 'CHECKING…'
      - takeScreenshot: en-7h-1-live
