appId: app.critterpass.dev
---
# The plan check (7h-1) from the plan ideas lab, in English then Vietnamese: three to fix and two
# to know for an organiser, a member's SUGGEST with an organiser's private ask on top, a too-far
# card opened on its nearer place, the check running, and all clear. Then the real screen on a
# brand-new traveller's own trip (../happy/subflows/trip-under-way.yaml): Home, the trip, PLAN, and the trip map's CHECK once the check has run. Shots are named `<lang>-7h-1-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^check-7h-1$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-1$'
- extendedWaitUntil:
    visible:
      id: 'plan-check-title'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-1-check
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-1$'
    timeout: 10000
- scrollUntilVisible:
