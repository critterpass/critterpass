appId: app.critterpass.dev
---
# After a back out of a developer screen: the developer tools list, reopened from the splash when the
# back closed the whole developer stack (the iOS edge swipe can), and scrolled to its top: the list
# keeps its place, which can be below the row a flow looks for next.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-build-marker'
    direction: UP
    timeout: 15000
