appId: app.critterpass.dev
---
# From Home on a fresh trip: TRIPS, PLAN (the trip map, or the day plan when PLAN opens on the day),
# day 1's stops on the day plan, each named by its place, and the first stop's sheet. ${LANG}
# prefixes the screenshots.
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'trip-map|day-plan'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'trip-map'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'trip-map-peek'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: ${LANG}-fresh-trip-map
      - tapOn:
          id: 'trip-map-day-chips-1'
          optional: true
      - tapOn:
          id: 'trip-map-peek-open-day-pill'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 30000
- tapOn:
    id: 'day-plan-day-chips-1'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'stop-[0-9]+'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-fresh-day-stops
- tapOn:
    id: 'stop-[0-9]+'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'plan-item-place|plan-item-sheet-panel|plan-item-sheet'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${LANG}-fresh-day-item
