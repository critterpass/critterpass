appId: app.critterpass.dev
---
# The chat's approval cards for a change set (7h-7, in the crew chat), in English then Vietnamese:
# the plan views lab's fixed-data scene over the Bali week
# (apps/mobile/src/app/(dev)/plan-views-lab.tsx), named `<lang>-7h-7-chat-cards` so compare mode
# pairs it with its render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
# The lab's own title: the scenes at the top of its list change as screens come and go.
- extendedWaitUntil:
    visible:
      text: 'Plan views lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-review-chat-cards'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-views-lab-review-chat-cards'
- extendedWaitUntil:
    visible:
      id: 'plan-chat-cards'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-7-chat-cards
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-views-lab-review-chat-cards'
    timeout: 10000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
# Going back lands on the developer tools list or, on some runs, on the splash.
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
# The lab's own title: the scenes at the top of its list change as screens come and go.
- extendedWaitUntil:
    visible:
      text: 'Plan views lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-review-chat-cards'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-views-lab-review-chat-cards'
- extendedWaitUntil:
    visible:
      id: 'plan-chat-cards'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7h-7-chat-cards
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-views-lab-review-chat-cards'
    timeout: 10000
# Review changes in the section 7 layout (7h-7) from the plan ideas lab, in English then
# Vietnamese: six placed and two for you on Tokek's private draft, a row unticked with the totals
# recounted, the SEE explainer, a fix set, the crew's vote, and approved. Shots are named
# `<lang>-7h-7-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^review$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^review$'
- extendedWaitUntil:
    visible:
      id: 'plan-review-title'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-7-review
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^review$'
    timeout: 10000
- scrollUntilVisible:
