appId: app.critterpass.dev
---
# Review changes (3e-3), its states and the chat approval card, in English then Vietnamese: the plan views lab's fixed-data scenes over the Bali
# week (apps/mobile/src/app/(dev)/plan-views-lab.tsx), named `<lang>-<design id or route>-<state>`
# so compare mode pairs each with its render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
- extendedWaitUntil:
