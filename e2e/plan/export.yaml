appId: app.critterpass.dev
---
# The plan's export sheet (calendar subscribe, write to the phone's calendar, written, denied,
# revoked), in English then Vietnamese: the plan views lab's fixed-data scenes over the Bali week
# (apps/mobile/src/app/(dev)/plan-views-lab.tsx), named `<lang>-<design id or route>-<state>` so
# compare mode pairs each with its render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
# The lab's own title: the scenes at the top of its list change as screens come and go.
- extendedWaitUntil:
    visible:
      text: 'Plan views lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-export-subscribe'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-views-lab-export-subscribe'
- extendedWaitUntil:
    visible:
      id: 'plan-export'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-plan-export-subscribe
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-views-lab-export-subscribe'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-export-write'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
