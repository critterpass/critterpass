# Live collaboration (3g-2) from the plan editing lab (apps/mobile/src/app/(dev)/plan-edit-lab.tsx) in
# English then Vietnamese: the boat-day vote as drawn (Nusa Penida leading, Alex browsing Gili T,
# Jordan's comment with Rin's +1, Tokek's reply with KEEP IT / UNDO, Maya typing), my vote landing,
# a tie, closing soon, closed with the pick to put on the plan, three options stacked, a quiet thread,
# loading, and an item's comments in its sheet. A tap on an option in the drawn scene votes (the pop
# and +1 are caught in the vote-landed still). Screenshots are named <lang>-<design id>-<state>.
