appId: app.critterpass.dev
---
# A stop's sheet over the day plan (7b-1) when the crew's plan moved under a change she made for
# herself: from the plan editing lab, the sheet leads with the clash, KEEP MINE and GO WITH THE CREW.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-edit-lab'
    direction: DOWN
    timeout: 20000
# A list still settling from the scroll takes a tap as a stop on iOS: let it settle first.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'dev-nav-plan-edit-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-edit-lab-item-sheet'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-edit-lab-item-sheet-clash'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'plan-edit-lab-item-sheet-clash'
- extendedWaitUntil:
    visible:
      id: 'plan-clash-keep-.*'
    timeout: 15000
- assertVisible:
    id: 'plan-clash-drop-.*'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-7b-1-stop-sheet-clash
