# The day view (3e-2 outside planning mode) and its item and add sheets, from the plan editing lab
# (apps/mobile/src/app/(dev)/plan-edit-lab.tsx) in English then Vietnamese: the day as drawn, a
# queued offline edit with a member's change waiting for the crew, a free day, loading, read-only,
# the item sheet for an organiser and a member, a booked item's warning, an item someone else
# removed, and adding to the day. Screenshots are named <lang>-<design id>-<state> for compare mode.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-edit-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-edit-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-edit-lab-day'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-edit-lab-day'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'plan-edit-lab-day'
- extendedWaitUntil:
    visible:
      id: 'plan-day-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3e-2-list
- runFlow: ../onboarding/subflows/back.yaml
