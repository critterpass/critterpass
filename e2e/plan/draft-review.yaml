appId: app.critterpass.dev
---
# The private draft (3c-9) and its states, in English, from the fixed developer scenes: must-dos
# missing, over budget, stale setup, stays and closures, a redraft waiting, offline, quota reached,
# earlier drafts, no draft, a failed draft and what a crew member sees instead.
- launchApp:
    clearState: true
- runFlow:
    file: ../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: draft
      READY: draft-scene-list
- scrollUntilVisible:
    element:
      id: 'draft-scene-3c-9-draft'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-3c-9-draft'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-3c-9-draft
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: Android
      notVisible:
        id: 'draft-scene-list'
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'draft-scene-list'
    commands:
      - tapOn:
          id: 'draft-scene-back'
- scrollUntilVisible:
    element:
      id: 'draft-scene-draft-must-do-missing'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-draft-must-do-missing'
- waitForAnimationToEnd:
