appId: app.critterpass.dev
---
# The planning kit on a real device (apps/mobile/src/app/(dev)/planning-map-lab.tsx): every kit
# component in English, the trip map with 500 places drawn as map layers under the map sheet, the
# components again in Vietnamese, then the frame budget run, which pans and zooms the same camera
# script over today's 40-pin map and over the 500 places and fails when the layers miss more
# frames than the pins do.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-planning-map-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-planning-map-lab'
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-kit'
    timeout: 15000
- tapOn:
    id: 'planning-map-lab-kit'
- extendedWaitUntil:
    visible:
      id: 'planning-kit-scene'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-planning-kit-components-1
- scrollUntilVisible:
    element:
      id: 'planning-kit-TokekNote'
    direction: DOWN
    timeout: 20000
- takeScreenshot: en-planning-kit-components-2
- scrollUntilVisible:
    element:
      id: 'planning-kit-ReasonGrid'
    direction: DOWN
    timeout: 20000
- takeScreenshot: en-planning-kit-components-3
- scrollUntilVisible:
    element:
      id: 'planning-kit-OptionRadioCard'
    direction: DOWN
    timeout: 20000
- takeScreenshot: en-planning-kit-components-4
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-trip-map'
    timeout: 15000
- tapOn:
    id: 'planning-map-lab-trip-map'
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-snap-peek'
    timeout: 20000
# Tiles and the style's sprites arrive over the network.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-planning-kit-trip-map-peek
# The camera opens on a saved place in the middle of the map: a tap there shows its one label.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          point: '50%,50%'
      - extendedWaitUntil:
          visible:
            id: 'planning-map-lab-picked'
          timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: en-planning-kit-place-picked
# A drag on the map above the sheet pans the map and leaves the sheet where it was.
- swipe:
    start: 70%, 30%
    end: 30%, 35%
    duration: 600
- assertVisible:
    id: 'planning-map-lab-snap-peek'
# A day opens the sheet at half and traces that day's route from the villa.
- tapOn:
    id: 'planning-map-lab-day-3'
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-snap-half'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-planning-kit-day-half
- tapOn:
    id: 'planning-map-lab-all-days'
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-snap-full'
    timeout: 10000
- takeScreenshot: en-planning-kit-whole-trip-full
- runFlow:
    when:
      platform: Android
    commands:
      # Android back collapses the sheet one snap before it leaves the screen.
      - back
      - extendedWaitUntil:
          visible:
            id: 'planning-map-lab-snap-half'
          timeout: 10000
      - back
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
# Back on the developer tools list: the app in Vietnamese for the components again.
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-planning-map-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-planning-map-lab'
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-kit'
    timeout: 15000
- tapOn:
    id: 'planning-map-lab-kit'
- extendedWaitUntil:
    visible:
      id: 'planning-kit-scene'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: vi-planning-kit-components-1
- scrollUntilVisible:
    element:
      id: 'planning-kit-TokekNote'
    direction: DOWN
    timeout: 20000
- takeScreenshot: vi-planning-kit-components-2
- scrollUntilVisible:
    element:
      id: 'planning-kit-ReasonGrid'
    direction: DOWN
    timeout: 20000
- takeScreenshot: vi-planning-kit-components-3
- scrollUntilVisible:
    element:
      id: 'planning-kit-OptionRadioCard'
    direction: DOWN
    timeout: 20000
- takeScreenshot: vi-planning-kit-components-4
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'planning-map-lab-perf'
    timeout: 15000
- tapOn:
    id: 'planning-map-lab-perf'
- tapOn:
    id: 'perf-run'
- extendedWaitUntil:
    visible:
      id: 'perf-(ok|over)'
    timeout: 120000
- takeScreenshot: en-planning-kit-frame-budget
- assertVisible:
    id: 'perf-ok'
