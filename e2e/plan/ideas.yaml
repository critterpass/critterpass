appId: app.critterpass.dev
---
# Ideas (7f-2) from the plan ideas lab, in English then Vietnamese: eight saved places with
# their fit lines and PLACE THEM FOR ME, a row lifted over Saturday with the day chips lit by its
# fit. Shots are named `<lang>-7f-2-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^ideas$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^ideas$'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-2-ideas
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^ideas$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^ideas-dragging$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^ideas-dragging$'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-2-dragging
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^ideas-dragging$'
    timeout: 10000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^ideas$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^ideas$'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7f-2-ideas
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^ideas$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^ideas-dragging$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^ideas-dragging$'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7f-2-dragging
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^ideas-dragging$'
    timeout: 10000
