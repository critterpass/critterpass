appId: app.critterpass.dev
---
# Ideas (7f-2) from the plan ideas lab, in English then Vietnamese: eight saved places with
# their fit lines and PLACE THEM FOR ME, a row lifted over Saturday with the day chips lit by its
# fit, and Ideas empty. Shots are named `<lang>-7f-2-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-ideas-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-ideas-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-ideas'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-ideas'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-2-ideas
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-ideas'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-ideas-dragging'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-ideas-dragging'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-2-dragging
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-ideas-dragging'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-ideas-empty'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-ideas-empty'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-empty'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-2-empty
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-ideas-empty'
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
# Back lands on the developer tools list or, on some runs, on the splash.
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-ideas-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-ideas-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-ideas'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-ideas'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7f-2-ideas
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-ideas'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-ideas-dragging'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-ideas-dragging'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7f-2-dragging
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-ideas-dragging'
    timeout: 10000
