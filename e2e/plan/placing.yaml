appId: app.critterpass.dev
---
# Tokek is placing them (7h-6) from the plan ideas lab, in English then Vietnamese: the run
# with the first stop popped and Saturday being routed, a run with nothing to place, and a failed
# run. Shots are named `<lang>-7h-6-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-ideas-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-ideas-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-placing'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-placing'
- extendedWaitUntil:
    visible:
      id: 'plan-placing-step-routing-running'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-6-placing
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-placing'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-placing-nothing'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-placing-nothing'
- extendedWaitUntil:
    visible:
      id: 'plan-placing-action'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-6-nothing
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-placing-nothing'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-placing-failed'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-placing-failed'
- extendedWaitUntil:
    visible:
      id: 'plan-placing-action'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-6-failed
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-placing-failed'
    timeout: 10000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-ideas-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-ideas-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-placing'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-placing'
- extendedWaitUntil:
    visible:
      id: 'plan-placing-step-routing-running'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7h-6-placing
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-placing'
    timeout: 10000
