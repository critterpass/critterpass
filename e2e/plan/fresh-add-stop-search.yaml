appId: app.critterpass.dev
env:
  # An open-data record no curated name matches (the Japanese Covered Bridge in Hội An, a real
  # drive from the centre); matched loosely, since the Chùa Cầu records may be merged later.
  PLACE_QUERY: 'japanese bridge'
  PLACE_TEXT: '(?i).*(japanese covered bridge|ch[ùu]a c[ầa]u).*'
---
# Searching a real place to add to a fresh trip's day, on staging: a brand-new account locks in a
# Đà Nẵng trip for today (../happy/subflows/trip-under-way.yaml), opens day 1 and adds a stop by
# search. "My Son" is typed the way a keyboard writes it and still finds places written with their
# accents. Then a place only the server has (open data, ${PLACE_QUERY} → ${PLACE_TEXT}) is found
# after the phone's own rows, added, and shown on the day by its own name. A word no place has
# says "Nothing found".
- runFlow:
    file: ../happy/subflows/trip-under-way.yaml
    env:
      SHOTS: fresh-add
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-header-chat'
    timeout: 60000
- runFlow: ../happy/subflows/dismiss-visit-offer.yaml
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-day-1'
    timeout: 60000
- tapOn:
    id: 'plan-day-1'
- extendedWaitUntil:
    visible:
      id: 'plan-day-list'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'plan-day-add'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'plan-day-add'
- extendedWaitUntil:
    visible:
      id: 'plan-add-query'
    timeout: 15000
- tapOn:
    id: 'plan-add-query'
- inputText: 'My Son'
# A row, or the sheet saying the trip's places are still arriving: never an empty space. The places
# land within a couple of minutes on a fresh trip.
- extendedWaitUntil:
    visible:
      id: 'plan-add-place-.*|plan-add-searching'
    timeout: 20000
- takeScreenshot: en-fresh-add-search-first
- extendedWaitUntil:
    visible:
      id: 'plan-add-place-.*'
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: en-fresh-add-search-my-son
# A place the phone does not carry (open data, ${PLACE_TEXT}): its row comes from the server.
- tapOn:
    id: 'plan-add-query'
- eraseText: 20
- inputText: ${PLACE_QUERY}
- extendedWaitUntil:
    visible:
      text: ${PLACE_TEXT}
    timeout: 30000
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ${PLACE_TEXT}
    direction: DOWN
    timeout: 30000
- takeScreenshot: en-fresh-add-search-server-row
- tapOn:
    text: ${PLACE_TEXT}
- extendedWaitUntil:
    visible:
      id: 'plan-add-confirm'
      enabled: true
    timeout: 10000
- takeScreenshot: en-fresh-add-search-picked
- tapOn:
    id: 'plan-add-confirm'
# The new stop is named by its place, on this phone before the plan's record of it arrives and
# after.
- extendedWaitUntil:
    visible:
      text: ${PLACE_TEXT}
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: en-fresh-add-stop-added
# A word no place has, on the phone or the server, says so.
- scrollUntilVisible:
    element:
      id: 'plan-day-add'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'plan-day-add'
- extendedWaitUntil:
    visible:
      id: 'plan-add-query'
    timeout: 15000
- tapOn:
    id: 'plan-add-query'
- inputText: 'zzqx'
- extendedWaitUntil:
    visible:
      id: 'plan-add-none'
    timeout: 20000
- takeScreenshot: en-fresh-add-search-none
