appId: app.critterpass.dev
---
# Every drafting scene in Vietnamese: the dev gallery switches the running app's language (not
# persisted), then back through the developer tools into the scenes.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-locale-vi'
    timeout: 15000
- tapOn:
    id: 'gallery-locale-vi'
- swipe:
    start: 2%, 50%
    end: 90%, 50%
# The back swipe lands on the developer tools list or, on some runs, on the splash.
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-draft'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-draft'
- extendedWaitUntil:
    visible:
      id: 'draft-scene-list'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'draft-scene-3c-8-drafting'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'draft-scene-3c-8-drafting'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: vi-3c-8-drafting
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: Android
      notVisible:
        id: 'draft-scene-list'
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      notVisible:
