appId: app.critterpass.dev
---
# Chà Vá drafting and presenting a Đà Nẵng draft (3c-9) in English, from the fixed developer
# scenes: the draft review and the loading screen, voiced by the Đà Nẵng guide, not Tokek.
- launchApp:
    clearState: true
- runFlow:
    file: ../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: draft
      READY: draft-scene-list
- runFlow:
    file: subflows/draft-chava-scenes.yaml
    env: { PREFIX: en }
