appId: app.critterpass.dev
---
# A fresh trip's day as its traveller reads it: a brand-new account locks in a Đà Nẵng trip for
# today (../happy/subflows/trip-under-way.yaml), opens the trip's plan and one of the guide's
# stops. Each stop is named by its place (the plan's own record of it when the phone's place
# catalogue has none), never by the guide's sentence about it, which sits under Notes.
- runFlow:
    file: ../happy/subflows/trip-under-way.yaml
    env:
      SHOTS: fresh-day
- openLink:
    link: critterpass-dev://
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'home-header-chat'
    timeout: 60000
- runFlow: ../happy/subflows/dismiss-visit-offer.yaml
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-tile-plan|visit-consent-decline'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'visit-consent-decline'
    commands:
      - tapOn:
          id: 'visit-consent-decline'
      - waitForAnimationToEnd:
          timeout: 5000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-day-list'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-fresh-day-list
- tapOn:
    id: 'plan-day-row-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'plan-item-place|plan-item-move-.*'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: en-fresh-day-item
