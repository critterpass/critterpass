appId: app.critterpass.dev
---
# Balance the crew (7h-5) from the plan ideas lab, in English then Vietnamese: whose picks made it
# with Dev at zero and two saves that fit without moving anything, then the ask sent. Shots are
# named `<lang>-7h-5-<state>`.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^check-7h-5$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-5$'
- extendedWaitUntil:
    visible:
      id: 'plan-balance-offer'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-5-balance
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-5$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^check-7h-5-asked$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-5-asked$'
- extendedWaitUntil:
    visible:
      id: 'plan-balance-offer'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7h-5-asked
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-5-asked$'
    timeout: 10000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
# By its title: on iOS the row's id is folded into the list's accessibility tree.
- scrollUntilVisible:
    element:
      text: 'Plan ideas.*'
    direction: DOWN
    timeout: 90000
    # Slow, or iOS flings past it; the row is near the end of a long list.
    speed: 20
    centerElement: true
- tapOn:
    text: 'Plan ideas.*'
- extendedWaitUntil:
    visible:
      text: 'Plan ideas lab'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '^check-7h-5$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-5$'
- extendedWaitUntil:
    visible:
      id: 'plan-balance-offer'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7h-5-balance
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-5$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^check-7h-5-asked$'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^check-7h-5-asked$'
- extendedWaitUntil:
    visible:
      id: 'plan-balance-offer'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: vi-7h-5-asked
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      text: '^check-7h-5-asked$'
    timeout: 10000
