appId: app.critterpass.dev
---
# Add to plan (7f-1) from the plan ideas lab's fixed-data scenes over the Bali week
# (apps/mobile/src/app/(dev)/plan-ideas-lab.tsx), in English then Vietnamese: Tokek's Saturday 08:00
# with its reasons, a member's suggest, who's going, a place already in the plan, nowhere fitting
# and no signal. Shots are named `<lang>-7f-1-<state>` so compare mode pairs them with the render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-ideas-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-ideas-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-add-to-plan'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-add-to-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-add-why'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-1-add-to-plan
- tapOn:
    id: 'sheet-close'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-add-to-plan-member'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-add-to-plan-member'
- extendedWaitUntil:
    visible:
      id: 'plan-add-why'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-1-member
- tapOn:
    id: 'sheet-close'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan-member'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-add-to-plan-who'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-add-to-plan-who'
- extendedWaitUntil:
    visible:
      id: 'plan-add-who'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-1-who
- tapOn:
    id: 'sheet-close'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan-who'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-add-to-plan-already'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-ideas-lab-add-to-plan-already'
- extendedWaitUntil:
    visible:
      id: 'plan-add-note'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-7f-1-already
- tapOn:
    id: 'sheet-close'
- extendedWaitUntil:
    visible:
      id: 'plan-ideas-lab-add-to-plan-already'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-ideas-lab-add-to-plan-nowhere'
    direction: DOWN
