appId: app.critterpass.dev
---
# My own plan on the overview (3e-1): just-you days and a clash with the crew plan, in English then Vietnamese: the plan views lab's fixed-data scenes over the Bali
# week (apps/mobile/src/app/(dev)/plan-views-lab.tsx), named `<lang>-<design id or route>-<state>`
# so compare mode pairs each with its render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-views-lab-overview'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-overview-just-you'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-views-lab-overview-just-you'
- extendedWaitUntil:
    visible:
      id: 'plan-overview'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3e-1-just-you
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: 'plan-views-lab-overview-just-you'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-overview-clash'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'plan-views-lab-overview-clash'
- extendedWaitUntil:
