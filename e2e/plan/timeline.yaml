# Planning mode's timeline (3e-2) from the plan editing lab (apps/mobile/src/app/(dev)/plan-edit-lab.tsx)
# in English then Vietnamese: the day as drawn (rain band, the guide's ghost and banner, Maya's cursor),
# the ghost accepted, a friend dragging, no forecast yet, a concurrent-edit toast, and the editing states
# (lifted, mid-drag with the next block pushed along, dropped, a clash, read-only, an overnight axis).
# A drag is hard to catch in a still, so lifted, dragging and dropped are fixed scenes; the sandbox scene
# then proves a real drag on device: a swipe on a block's bottom edge resizes it in 15-minute steps and
# the commit is read back. Screenshots are named <lang>-<design id>-<state> for compare mode.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-edit-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-edit-lab'
- extendedWaitUntil:
    visible:
      id: 'plan-edit-lab-day'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'plan-edit-lab-planning'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'plan-edit-lab-planning'
- extendedWaitUntil:
    visible:
      id: 'plan-timeline'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3e-2-planning
- runFlow: ../onboarding/subflows/back.yaml
