appId: app.critterpass.dev
---
# The day plan (7b-1) and its map open (7b-2) over the Bali Six's Slow Ubud day in the plan views
# lab: the timeline with legs and the guide's note under the rainy walk, another day from the
# chips, the strip moving the label stop to stop, then Vietnamese.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-day-plan'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'plan-views-lab-day-plan'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-7b-1-day-plan
- scrollUntilVisible:
    element:
      id: 'stop-3-note'
    direction: DOWN
    timeout: 10000
- takeScreenshot: en-7b-1-day-plan-note
- tapOn:
    id: 'day-plan-day-chips-2'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: en-7b-1-day-plan-day-2
# Android back lowers a raised map sheet one snap before it leaves the screen.
- repeat:
    while:
      visible:
        id: 'day-plan'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-day-plan-map-open'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'plan-views-lab-day-plan-map-open'
- extendedWaitUntil:
    visible:
      id: 'day-map'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-7b-2-day-plan-map-open
# Swiping the strip moves the one label to the next stop.
- swipe:
    from:
      id: 'day-map-strip'
    direction: LEFT
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: en-7b-2-day-plan-map-next-stop
# Android back lowers a raised map sheet one snap before it leaves the screen.
- repeat:
    while:
      visible:
        id: 'day-map'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
- repeat:
    while:
      notVisible:
        id: 'dev-build-marker'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-day-plan'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'plan-views-lab-day-plan'
- extendedWaitUntil:
    visible:
      id: 'day-plan'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: vi-7b-1-day-plan
# Android back lowers a raised map sheet one snap before it leaves the screen.
- repeat:
    while:
      visible:
        id: 'day-plan'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-day-plan-map-open'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'plan-views-lab-day-plan-map-open'
- extendedWaitUntil:
    visible:
      id: 'day-map'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: vi-7b-2-day-plan-map-open
# Android back lowers a raised map sheet one snap before it leaves the screen.
- repeat:
    while:
      visible:
        id: 'day-map'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
