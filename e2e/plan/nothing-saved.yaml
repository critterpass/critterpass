appId: app.critterpass.dev
---
# Nothing saved yet (7i-1): the trip map of a trip with no plan and nothing saved, the guide
# floating where the stay will be and the ways to start, in English then Vietnamese.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-trip-map-nothing-saved'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'plan-views-lab-trip-map-nothing-saved'
- extendedWaitUntil:
    visible:
      id: 'trip-map-empty'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: en-7i-1-nothing-saved
# Android back lowers a raised map sheet one snap before it leaves the screen.
- repeat:
    while:
      visible:
        id: 'trip-map'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
- repeat:
    while:
      notVisible:
        id: 'dev-nav-plan-views-lab'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
- scrollUntilVisible:
    element:
      id: 'dev-build-marker'
    direction: UP
    timeout: 20000
- runFlow:
    file: ../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: 'dev-tools-entry'
    commands:
      - tapOn:
          id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-plan-views-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-plan-views-lab'
- scrollUntilVisible:
    element:
      id: 'plan-views-lab-trip-map-nothing-saved'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'plan-views-lab-trip-map-nothing-saved'
- extendedWaitUntil:
    visible:
      id: 'trip-map-empty'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: vi-7i-1-nothing-saved
# Android back lowers a raised map sheet one snap before it leaves the screen.
- repeat:
    while:
      visible:
        id: 'trip-map'
    times: 4
    commands:
      - runFlow: ../onboarding/subflows/back.yaml
      - waitForAnimationToEnd:
          timeout: 2000
