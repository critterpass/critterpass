appId: app.critterpass.dev
---
# Join with a code (3a-11): a wrong code shakes and says so; an expired code names its inviter.
#
# Needs before it can pass: an expired crew code ${EXPIRED_CODE} on the build's api.
- launchApp
- openLink: critterpass-dev://app/onboarding/invite/code
- extendedWaitUntil:
    visible:
      id: 'invite-code-boxes'
    timeout: 10000
- inputText: 'ZZZZ22'
- extendedWaitUntil:
    visible:
      id: 'invite-code-wrong'
    timeout: 10000
- eraseText: 6
- inputText: ${EXPIRED_CODE}
- extendedWaitUntil:
    visible:
      id: 'invite-problem-expired'
    timeout: 10000
