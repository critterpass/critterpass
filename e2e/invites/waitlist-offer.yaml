appId: app.critterpass.dev
---
# A waitlisted member sees their place on the crews sheet and, once a seat frees (a member left
# and the waitlist sweep offered it), takes it from the offer card.
#
# Needs before it can pass: this account waitlisted on a trip with an open seat offer ${OFFER_ID}
# on the build's api (worker running `waitlist.offer`).
- launchApp
- openLink: critterpass-dev://crew
- extendedWaitUntil:
    visible:
      id: 'waitlist-cards'
    timeout: 15000
- tapOn:
    id: 'seat-offer-take-${OFFER_ID}'
- extendedWaitUntil:
    visible:
      text: 'You’re in for .*'
    timeout: 10000
