appId: app.critterpass.dev
---
# A personal link whose named seat was already claimed, opened on another install: the ticket
# reads "A seat in {crew}" and never names the invitee.
#
# Needs before it can pass: ${INVITE_PATH} of a personal invite already claimed by someone else.
- launchApp:
    clearState: true
- openLink: critterpass-dev:/${INVITE_PATH}
- extendedWaitUntil:
    visible:
      id: 'invite-ticket'
    timeout: 15000
- assertVisible:
    text: 'A SEAT IN .*'
- assertNotVisible:
    text: '.*YOU’RE COMING TO.*'
