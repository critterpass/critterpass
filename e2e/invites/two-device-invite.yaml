appId: app.critterpass.dev
---
# Inviter side of the two-simulator run: a saved inviter opens their crew's composer, invites Rin
# by name and copies the link. The runner reads the copied link from this simulator's pasteboard,
# opens it on the second simulator with `xcrun simctl openurl` and runs fast-path.yaml there.
#
# Needs before it can pass: an onboarded, saved account on this simulator that organises crew
# ${CREW_ID}, and the build's api carrying this branch's migrations.
- launchApp
- openLink: critterpass-dev://crew/${CREW_ID}/invite
# The composer opens on the link and the crew code; a named seat is its second tab.
- extendedWaitUntil:
    visible:
      id: 'composer-mode'
    timeout: 10000
- tapOn: '(?i)a friend'
- extendedWaitUntil:
    visible:
      id: 'composer-name'
    timeout: 10000
- tapOn:
    id: 'composer-name'
- inputText: 'Rin'
- hideKeyboard
- tapOn:
    id: 'composer-send-copy'
- extendedWaitUntil:
    visible:
      text: 'Link copied'
    timeout: 10000
