appId: app.critterpass.dev
---
# 3g-3: the crews sheet lists the account's crews, choosing one closes the sheet onto Home, and
# START A CREW makes a crew and shows its code once it syncs.
#
# Needs before it can pass: an onboarded account with at least two crews, one named ${CREW_NAME}.
- launchApp
- openLink: critterpass-dev://crew
- extendedWaitUntil:
    visible:
      id: 'crews-sheet'
    timeout: 10000
- takeScreenshot: crew-3g-3-crews
- tapOn:
    text: ${CREW_NAME}
- extendedWaitUntil:
    notVisible:
      id: 'crews-sheet'
    timeout: 10000
- openLink: critterpass-dev://crew/new
- tapOn:
    id: 'start-crew-name'
- inputText: 'Maestro Crew'
- hideKeyboard
- tapOn:
    id: 'start-crew-create'
- extendedWaitUntil:
    visible:
      id: 'start-crew-code'
    timeout: 20000
