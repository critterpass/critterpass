appId: app.critterpass.dev
---
# At last-day midnight in the destination zone the share switches itself off: the map closes to
# the "Trip days are over" card and the channel is unsubscribed.
#
# Needs before it can pass: the share-and-meetup setup on a trip whose last day ends within the
# run. The runner fast-forwards the window the way `sim.ts --check` does (trip dates moved back,
# the share's end and its `location.expire` timer brought to now) and waits for the timer.
- launchApp
- openLink: critterpass-dev://map/${TRIP_ID}
- extendedWaitUntil:
    visible:
      id: 'live-map-screen'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'live-gate-outside_trip_days'
    timeout: 120000
- assertNotVisible:
    id: 'live-pause-chip'
- takeScreenshot: live-map-window-ended
