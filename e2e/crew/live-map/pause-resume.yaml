appId: app.critterpass.dev
---
# Pausing takes your pin off the crew's map at once and the header turns grey; resuming brings it
# back. On the boosted trip of subflows/seeded-crew.yaml, with the simulated crew walking.
- runFlow: subflows/seeded-crew.yaml
- tapOn:
    id: 'dev-seed-live-map-open'
- runFlow:
    when:
      visible: '(?i)while using the app|only this time|allow'
    commands:
      - tapOn: '(?i)while using the app|only this time|allow'
- extendedWaitUntil:
    visible:
      id: 'live-map-screen'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'live-share-on'
    commands:
      - tapOn:
          id: 'live-share-on'
- extendedWaitUntil:
    visible:
      id: 'live-pause-chip'
    timeout: 20000
- tapOn:
    id: 'live-pause-chip'
- extendedWaitUntil:
    visible:
      text: 'PAUSED'
    timeout: 10000
- takeScreenshot: live-map-paused
- tapOn:
    id: 'live-pause-chip'
- extendedWaitUntil:
    visible:
      text: 'LIVE'
    timeout: 10000
