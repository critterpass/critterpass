appId: app.critterpass.dev
---
# An unboosted trip in its trip days shows the Boost gate over a frozen map: no crewmates, no
# positions, even with the simulated crew sharing on the crew's other (boosted) trip.
- runFlow: subflows/seeded-crew.yaml
- tapOn:
    id: 'dev-seed-live-map-open-gate'
- extendedWaitUntil:
    visible:
      id: 'live-gate-boost_required'
    timeout: 20000
- assertNotVisible:
    id: 'live-bunch'
- takeScreenshot: live-map-gate-unboosted
