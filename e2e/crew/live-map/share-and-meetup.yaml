appId: app.critterpass.dev
---
# Share on a boosted trip day, see the simulated crew glide and bunch, set the meet-up and watch
# the ETAs recount after a minute. The crew, the trips and the walking crewmates come from
# subflows/seeded-crew.yaml.
- runFlow: subflows/seeded-crew.yaml
- tapOn:
    id: 'dev-seed-live-map-open'
- runFlow:
    when:
      visible: '(?i)while using the app|only this time|allow'
    commands:
      - tapOn: '(?i)while using the app|only this time|allow'
- extendedWaitUntil:
    visible:
      id: 'live-map-screen'
    timeout: 20000
- tapOn:
    id: 'live-share-on'
- extendedWaitUntil:
    visible:
      id: 'live-pause-chip'
    timeout: 20000
# The map's pins are drawn by the map view and are not in Android's hierarchy, so the crew is read
# from the panel under it: Maya and Rin walk together and share one row, and the meet-up is set.
- extendedWaitUntil:
    visible: '(?i)maya and rin'
    timeout: 60000
- takeScreenshot: live-map-crew-gliding
- extendedWaitUntil:
    visible: '(?i)meet-up.*'
    timeout: 30000
# Each crewmate's row carries when they arrive ("Arrives 03:20"), counted every 60 s.
- extendedWaitUntil:
    visible: 'Arrives .*'
    timeout: 150000
- copyTextFrom:
    text: 'Arrives .*'
    index: 0
- evalScript: ${output.before = maestro.copiedText}
- takeScreenshot: live-map-eta-shown
- extendedWaitUntil:
    notVisible:
      text: ${output.before}
    timeout: 150000
- takeScreenshot: live-map-eta-recounted
