appId: app.critterpass.dev
---
# Share on a boosted trip day, see the simulated crew glide and bunch, set the meet-up and watch
# the ETAs recount after a minute.
#
# Needs before it can pass: an onboarded account ${UID} seeded into a boosted trip in its trip
# days (`pnpm tsx tools/scripts/live-map-sim/sim.ts --api <api> --db <owner url> --join ${UID}`
# prints ${TRIP_ID} and keeps three crewmates moving). The runner sets the simulator's location
# (`xcrun simctl location <udid> set -8.5058,115.2569`, Android `adb emu geo fix 115.2569 -8.5058`).
- launchApp:
    permissions:
      location: inuse
- openLink: critterpass-dev://map/${TRIP_ID}
- extendedWaitUntil:
    visible:
      id: 'live-map-screen'
    timeout: 20000
- tapOn:
    id: 'live-share-on'
- extendedWaitUntil:
    visible:
      id: 'live-pause-chip'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'live-bunch'
    timeout: 30000
- takeScreenshot: live-map-crew-gliding
- extendedWaitUntil:
    visible:
      id: 'live-meetup-pin'
    timeout: 30000
- copyTextFrom:
    id: 'live-row-.*'
    index: 0
- evalScript: ${output.before = maestro.copiedText}
# ETAs recount every 60 s.
- extendedWaitUntil:
    notVisible:
      text: ${output.before}
    timeout: 75000
- takeScreenshot: live-map-eta-recounted
