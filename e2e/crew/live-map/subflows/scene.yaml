appId: app.critterpass.dev
---
# Opens one crew live map scene from the dev list (apps/mobile/src/app/(dev)/live-map.tsx), lets
# the map tiles settle, takes `${SHOT}` and goes back to the list. `READY` is the scene's own id.
- tapOn:
    id: 'live-map-scene-${SCENE}'
- extendedWaitUntil:
    visible:
      id: '${READY}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${SHOT}
# The header's back ("← CHAT") returns to the scene list.
- tapOn:
    id: 'live-back'
- extendedWaitUntil:
    visible:
      id: 'live-map-scene-${SCENE}'
    timeout: 10000
