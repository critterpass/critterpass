appId: app.critterpass.dev
---
# The leave-by (5a-1, 5a-5) and flight (5a-3) Live Activities as the system draws them: started
# locally from the domain builders by the Live Activities dev scene
# (apps/mobile/src/app/(dev)/live-activities.tsx), one at a time (the island shows one activity per
# app), then seen in the Dynamic Island (compact and expanded, from the Home Screen) and in
# Notification Center, which shows the lock-screen presentation. Screenshots are named
# `<lang>-<design id>-<state>` so compare mode pairs each with its render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
# Slow: a fast swipe on iOS flings the list past the row before it is read.
- scrollUntilVisible:
    element:
      id: 'dev-nav-live-activities'
    direction: DOWN
    timeout: 20000
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: 'dev-nav-live-activities'
- extendedWaitUntil:
    visible:
      id: 'dev-la-start-leave-by'
    timeout: 15000
- tapOn:
    id: 'dev-la-start-leave-by'
- extendedWaitUntil:
    visible: 'Leave-by started'
    timeout: 10000
# Home Screen: a long press on the Dynamic Island expands it; a tap elsewhere leaves it compact.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 4000
- longPressOn:
    point: '50%, 2%'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-5a-5-expanded
- tapOn:
    point: '50%, 70%'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-5a-5-compact
# Notification Center draws Live Activities as the lock screen does.
- swipe:
    start: 25%, 0%
    end: 25%, 70%
    duration: 600
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-5a-1-lock-screen
- swipe:
    start: 50%, 95%
    end: 50%, 20%
    duration: 400
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'dev-la-end-all'
    timeout: 15000
- tapOn:
    id: 'dev-la-end-all'
- extendedWaitUntil:
    visible: 'Ended [0-9]+'
    timeout: 10000
- tapOn:
    id: 'dev-la-start-flight'
- extendedWaitUntil:
    visible: 'Flight started'
    timeout: 10000
# Home Screen: a long press on the Dynamic Island expands it; a tap elsewhere leaves it compact.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 4000
- longPressOn:
    point: '50%, 2%'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-5a-3-island-expanded
- tapOn:
    point: '50%, 70%'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-5a-3-island-compact
# Notification Center draws Live Activities as the lock screen does.
- swipe:
    start: 25%, 0%
    end: 25%, 70%
    duration: 600
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: en-5a-3-lock-screen
- swipe:
    start: 50%, 95%
    end: 50%, 20%
    duration: 400
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'dev-la-end-all'
    timeout: 15000
- tapOn:
    id: 'dev-la-end-all'
- extendedWaitUntil:
    visible: 'Ended [0-9]+'
    timeout: 10000
