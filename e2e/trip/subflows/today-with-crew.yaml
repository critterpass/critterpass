appId: app.critterpass.dev
---
# A trip to Đà Nẵng that is on today, built in the app by a brand-new traveller and joined by five
# simulated travellers (crew-of-six.yaml), then its day-of screen from the hub's next row, on
# today. ${SHOTS} prefixes the screenshots; ${CREW_NAME} names the crew; ${UP} is how many of the
# simulated travellers say they are up (none when unset); ${MUST_DO} (optional) is the must-do the
# guide drafts the plan around.
- runFlow:
    file: ../../happy/subflows/trip-under-way.yaml
    env:
      SHOTS: ${SHOTS}
      CREW_NAME: ${CREW_NAME}
      MUST_DO: ${typeof MUST_DO === 'undefined' ? '' :MUST_DO}
- runFlow:
    file: crew-of-six.yaml
    env:
      UP: ${UP}
- runFlow: ../../happy/subflows/wait-for-trip-start.yaml
- runFlow: to-hub.yaml
- assertVisible:
    id: 'trip-hub-header-in'
- tapOn:
    id: 'trip-hub-next'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- runFlow: ../../happy/subflows/dismiss-visit-offer.yaml
- runFlow:
    when:
      visible:
        id: 'trip-day-to-today'
    commands:
      - tapOn:
          id: 'trip-day-to-today'
      - extendedWaitUntil:
          notVisible:
            id: 'trip-day-to-today'
          timeout: 15000
