appId: app.critterpass.dev
---
# The offline card (3k-4) through a reconnect and its states, and Settings > Offline (3n-2), in English then Vietnamese: the trip day lab's fixed-data scenes
# (apps/mobile/src/app/(dev)/trip-day-lab.tsx), named `<lang>-<design id or route>-<state>` so
# compare mode pairs each with its render.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-trip-day-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-trip-day-lab'
- extendedWaitUntil:
    visible:
      id: 'trip-day-lab-3k-1-pre-trip'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'trip-day-lab-3k-4-offline'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'trip-day-lab-3k-4-offline'
- extendedWaitUntil:
    visible:
      id: 'trip-offline-page'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: en-3k-4-offline
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- waitForAnimationToEnd:
    timeout: 3000
# A sheet scene closes its sheet on the first back; the second leaves the scene.
- runFlow:
    when:
      notVisible:
        id: 'trip-day-lab-3k-4-offline'
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - runFlow:
