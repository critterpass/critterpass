appId: app.critterpass.dev
---
# A returning install started with no network (Android: the runner turns Wi-Fi and data off; an iOS
# simulator shares its host's network, so there the start is online): Home shows the trip that is
# on the phone; on Android an expense added with no signal waits, and the trip hub's offline card
# lists it in words (never the app's own bookkeeping); once the network is back the card lifts and
# sync delivers a change
# made on the server (the demo seed's inbox card; `dev-seed-demo-done` only shows when it has
# arrived on this phone).
- runFlow:
    file: ../../happy/subflows/fresh-account.yaml
    env:
      SEED: dev-seed-demo-caught-up
- extendedWaitUntil:
    visible:
      id: 'home-countdown'
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - evalScript: "${http.post('http://127.0.0.1:7788/network?state=off', { body: '' }).status}"
- stopApp
- launchApp:
    stopApp: false
# A slow iOS simulator can still be bringing the process up when launchApp returns, and Maestro
# takes an app it cannot read yet for a crash. The wait for the first screen is looked at again
# rather than the app launched again: an app that really died stays down and still fails here.
- retry:
    maxRetries: 2
    commands:
      - extendedWaitUntil:
          visible:
            id: 'home-countdown'
          timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: en-3b-2-home-cold-start-offline
- runFlow:
    when:
      platform: Android
    commands:
      # An expense added with no signal waits on the phone, and the hub's card lists it.
      - tapOn:
          id: 'tab-wallet'
      - extendedWaitUntil:
          visible:
            id: 'money-balances'
          timeout: 30000
      - tapOn:
          id: 'money-empty'
          optional: true
      - runFlow:
          when:
            notVisible:
              id: 'money-add-keypad'
          commands:
            - tapOn: 'ADD'
      - extendedWaitUntil:
          visible:
            id: 'money-add-keypad'
          timeout: 10000
      - tapOn: '4'
      - tapOn: '5'
      - tapOn: '0'
      - tapOn: '000|Three zeros'
      - runFlow:
          file: ../../happy/subflows/type-expense-name.yaml
          env:
            NAME: 'Banh mi'
      - tapOn:
          id: 'money-add-split'
          optional: true
      - tapOn: 'EVENLY'
      - tapOn:
          id: 'money-add-submit'
      - extendedWaitUntil:
          visible:
            id: 'money-latest-row'
          timeout: 20000
      - tapOn:
          id: 'tab-trips'
      - extendedWaitUntil:
          visible:
            id: 'trip-offline-card'
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: '(?i)expense: banh mi'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: en-3k-1-hub-cold-start-offline
      - evalScript: "${http.post('http://127.0.0.1:7788/network?state=on', { body: '' }).status}"
      - extendedWaitUntil:
          notVisible:
            id: 'trip-offline-card'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: en-3k-1-hub-back-online
      - tapOn:
          id: 'tab-home'
# Back online: a change made on the server reaches this phone.
- runFlow:
    file: ../../_shared/seed-demo.yaml
    env:
      SEED: dev-seed-demo-inbox
