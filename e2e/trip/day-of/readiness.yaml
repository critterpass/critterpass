appId: app.critterpass.dev
---
# Crew readiness on the morning of a trip day: a crew of six (the device and five simulated
# travellers, who never answer), and the day's first leave-by. The hero reads "0 of 6 are up"; I'M
# UP turns the device's face on and the count to one, and after a relaunch the count still holds,
# read back from the server.
- runFlow:
    file: ../subflows/today-with-crew.yaml
    env:
      SHOTS: readiness
      CREW_NAME: 'Ready Crew'
- extendedWaitUntil:
    visible:
      id: 'trip-day-im-up'
    timeout: 30000
- extendedWaitUntil:
    visible: '(?i).*0 of 6 .*up.*'
    timeout: 60000
- assertVisible:
    id: 'trip-day-readiness'
- waitForAnimationToEnd
- takeScreenshot: day-of-readiness-asleep
- tapOn:
    id: 'trip-day-im-up'
- extendedWaitUntil:
    visible: '(?i).*1 of 6 .*up.*'
    timeout: 15000
- assertNotVisible:
    id: 'trip-day-im-up'
- waitForAnimationToEnd
- takeScreenshot: day-of-readiness-up
- launchApp
- runFlow: ../subflows/to-hub.yaml
- tapOn:
    id: 'trip-hub-next'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'trip-day-to-today'
    commands:
      - tapOn:
          id: 'trip-day-to-today'
- extendedWaitUntil:
    visible: '(?i).*1 of 6 .*up.*'
    timeout: 30000
