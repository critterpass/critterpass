appId: app.critterpass.dev
---
# A cold start with the app left on a trip's day-of screen: the app comes back on that screen, with
# no tap. While the session starts the screen shows the loading state (never an empty page), then
# the day itself. The screenshots are checked for drawn content (EMPTY_SCREEN).
- runFlow:
    file: ../../happy/subflows/fresh-account.yaml
    env:
      SEED: dev-seed-demo-caught-up
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub-next'
    timeout: 30000
- tapOn:
    id: 'trip-hub-next'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: en-3k-2-day-before-restart
- stopApp
- launchApp:
    stopApp: false
# The first look is taken once the app has drawn its shell (the tab bar): the views exist a moment
# before the first frame is on screen.
# A slow iOS simulator can still be bringing the process up when launchApp returns, and Maestro
# takes an app it cannot read yet for a crash. The wait for the first screen is looked at again
# rather than the app launched again: an app that really died stays down and still fails here.
- retry:
    maxRetries: 2
    commands:
      - extendedWaitUntil:
          visible:
            id: 'tab-trips'
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'trip-waiting|trip-day-loading|trip-day'
    timeout: 30000
- takeScreenshot: en-3k-2-day-restored-first-look
- extendedWaitUntil:
    visible:
      id: 'trip-day-pack'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: en-3k-2-day-restored
