appId: app.critterpass.dev
---
# The day's pack list on a trip with a crew of six: an item added is listed as the traveller's own,
# packing it ticks it, removing another takes it off, and both survive a relaunch.
- runFlow:
    file: ../subflows/today-with-crew.yaml
    env:
      SHOTS: packing
      CREW_NAME: 'Pack Crew'
- scrollUntilVisible:
    element:
      id: 'trip-day-pack-add'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'trip-day-pack-add'
- tapOn:
    id: 'trip-day-pack-input'
- inputText: 'Sunscreen'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: 'SUNSCREEN|Sunscreen, just you'
    timeout: 10000
- tapOn:
    id: 'trip-day-pack-add'
- tapOn:
    id: 'trip-day-pack-input'
- inputText: 'Umbrella'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: 'UMBRELLA|Umbrella, just you'
    timeout: 10000
- hideKeyboard
- tapOn:
    text: 'SUNSCREEN|Sunscreen, just you'
- runFlow: ../../happy/subflows/sunscreen-packed.yaml
# Only unpacked items of one's own can be removed: Umbrella's is the one left.
- tapOn:
    id: 'trip-day-pack-remove-.*'
- extendedWaitUntil:
    notVisible:
      text: 'UMBRELLA|Umbrella, just you'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: day-of-packing
- launchApp
- runFlow: ../subflows/to-hub.yaml
- tapOn:
    id: 'trip-hub-next'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'trip-day-to-today'
    commands:
      - tapOn:
          id: 'trip-day-to-today'
- scrollUntilVisible:
    element:
      text: 'SUNSCREEN|Sunscreen, just you'
    direction: DOWN
    timeout: 20000
- runFlow: ../../happy/subflows/sunscreen-packed.yaml
- assertNotVisible:
    text: 'UMBRELLA|Umbrella, just you'
