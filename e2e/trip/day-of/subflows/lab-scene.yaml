appId: app.critterpass.dev
---
# From the trip day lab's list: opens ${SCENE}, takes the screenshot ${SHOT} and goes back to the list.
- scrollUntilVisible:
    element:
      id: 'trip-day-lab-${SCENE}'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'trip-day-lab-${SCENE}'
- extendedWaitUntil:
    visible:
      id: 'trip-day'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOT}
- runFlow: ../../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'trip-day-lab-${SCENE}'
    timeout: 15000
