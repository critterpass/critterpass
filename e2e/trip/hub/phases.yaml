appId: app.critterpass.dev
---
# The trip hub before the trip: a brand-new traveller's trip to Đà Nẵng that starts tomorrow (built
# in the app, e2e/happy/subflows/trip-under-way.yaml), joined by five simulated travellers through
# the api. The hub's header counts down to the trip, and counts six going once they have joined,
# without a reload.
- runFlow:
    file: ../../happy/subflows/trip-under-way.yaml
    env:
      SHOTS: hub-pre
      START_OFFSET_DAYS: '1'
      CREW_NAME: 'Phase Crew'
- runFlow: ../subflows/to-hub.yaml
- assertVisible:
    id: 'trip-hub-header-pre'
- assertVisible:
    id: 'trip-hub-countdown'
- waitForAnimationToEnd
- takeScreenshot: hub-pre-alone
- runFlow: ../subflows/crew-of-six.yaml
# The joins reach the hub through sync: the header counts six going.
- extendedWaitUntil:
    visible: '(?i).*6.going.*'
    timeout: 60000
- assertVisible:
    id: 'trip-hub-header-pre'
- waitForAnimationToEnd
- takeScreenshot: hub-pre-crew
# Relaunched, the hub comes back in the same phase from what the phone holds.
- launchApp
- runFlow: ../subflows/to-hub.yaml
- assertVisible:
    id: 'trip-hub-header-pre'
- assertVisible:
    id: 'trip-hub-countdown'
