appId: app.critterpass.dev
---
# Running late, live (3k-9), Android, as a brand-new traveller with no demo world. A fresh
# account's Đà Nẵng trip is under way (it turns in_trip at noon Vietnam time, so this runs after
# 12:00 ICT). Day 1's last item, which comes after the stay's check-in, is moved to start about
# half an hour from now, so its leave-by (with a travel leg) falls due within the run. With
# location and notifications granted through the app's own primers, the phone sits in Tam Kỳ, far
# too far to make it: the app's once-a-minute journey check (only while the leave-by is due) sends
# the ETA, the server opens the running-late disruption on the second late check, and the guide's
# push opens `/late/{id}`. One option is sent; back in central Đà Nẵng the screen says the
# traveller is on time again. Needs the staging client config `disruptions.journey_check` on for
# the run (it is off by default). A crew of one has nobody waiting, so no crew-chat line is posted.
# The trip only turns in_trip from noon in Vietnam.
- assertTrue: ${new Date(Date.now() + 7 * 3600000).getUTCHours() >= 12}
- runFlow:
    file: ../../happy/subflows/trip-under-way.yaml
    env:
      SHOTS: late-live
- extendedWaitUntil:
    visible:
      id: 'home-in-trip'
    timeout: 900000
- runFlow: ../../happy/subflows/dismiss-visit-offer.yaml

# Day 1's last item, moved to the first quarter hour at least 25 minutes from now (Vietnam time).
- tapOn:
    id: 'tab-trips'
- extendedWaitUntil:
    visible:
      id: 'trip-hub'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'trip-hub-tile-plan'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'trip-hub-tile-plan'
- extendedWaitUntil:
    visible:
      id: 'plan-day-1'
    timeout: 30000
- tapOn:
    id: 'plan-day-1'
- extendedWaitUntil:
    visible:
      id: 'plan-day-list'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'plan-day-add'
    direction: DOWN
    timeout: 15000
- evalScript: ${output.rows = 0}
- repeat:
    while:
      visible:
        id: 'plan-day-row-.*'
        index: ${output.rows}
    commands:
      - evalScript: ${output.rows = output.rows + 1}
- tapOn:
    id: 'plan-day-row-.*'
    index: ${output.rows - 1}
- extendedWaitUntil:
    visible:
      id: 'plan-time-start-value'
    timeout: 15000
- waitForAnimationToEnd
- copyTextFrom:
    id: 'plan-time-start-value'
- evalScript: >-
    ${var m = /(\d{1,2})[:.h](\d{2})\s*([AaPp][Mm])?/.exec(maestro.copiedText);
    var h = Number(m[1]) % 12 + (m[3] && m[3].toLowerCase() === 'pm' ? 12 : m[3] ? 0 : Number(m[1]) >= 12 ? 12 : 0);
    var current = h * 60 + Number(m[2]);
    var now = Math.floor((Date.now() / 60000 + 7 * 60) % 1440);
    var target = Math.ceil((now + 25) / 15) * 15;
    output.later = Math.max(0, (target - current) / 15);
    output.earlier = Math.max(0, (current - target) / 15)}
- repeat:
    times: ${output.later}
    commands:
      - tapOn:
          id: 'plan-time-start-later'
- repeat:
    times: ${output.earlier}
    commands:
      - tapOn:
          id: 'plan-time-start-earlier'
- scrollUntilVisible:
    element:
      id: 'plan-item-save'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'plan-item-save'
- runFlow:
    when:
      visible:
        id: 'plan-item-confirm'
    commands:
      - tapOn: 'Change it anyway'
- extendedWaitUntil:
    notVisible:
      id: 'plan-item-sheet'
    timeout: 15000
- takeScreenshot: late-live-moved
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'plan-day-1'
    file: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'trip-hub'
    commands:
      - tapOn:
          id: 'tab-home'

# Location and notifications, each through the app's primer and then the OS prompt.
- setLocation:
    latitude: 15.5736
    longitude: 108.474
- runFlow:
    file: ../../permissions/subflows/open-dev-screen.yaml
    env:
      SCREEN: permissions
      READY: dev-permissions
- tapOn:
    id: 'dev-permission-location-primer'
- extendedWaitUntil:
    visible:
      id: 'primer-sheet-accept'
    timeout: 10000
- tapOn:
    id: 'primer-sheet-accept'
- tapOn:
    text: '(Allow While Using App|While using the app)'
- runFlow:
    when:
      visible:
        id: 'dev-permission-notifications-primer'
    commands:
      - tapOn:
          id: 'dev-permission-notifications-primer'
      - extendedWaitUntil:
          visible:
            id: 'primer-sheet-accept'
          timeout: 10000
      - tapOn:
          id: 'primer-sheet-accept'
      - runFlow:
          when:
            visible: '(Allow|ALLOW)'
          commands:
            - tapOn: '(Allow|ALLOW)'
- back
- extendedWaitUntil:
    visible:
      id: 'dev-nav-permissions'
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: 'home-in-trip'
    timeout: 20000

# Stay in Tam Kỳ with fresh fixes until the guide's push arrives (the leave-by falls due within
# about half an hour; two late checks a minute apart open the disruption).
- evalScript: ${output.found = false}
- repeat:
    times: 40
    while:
      true: ${!output.found}
    commands:
      - travel:
          points:
            - 15.5736,108.4740
            - 15.5740,108.4744
            - 15.5736,108.4740
          speed: 7
      - swipe:
          start: 50%, 0%
          end: 50%, 80%
      - runFlow:
          when:
            visible: '.*min late.*'
          commands:
            - evalScript: ${output.found = true}
            - takeScreenshot: late-live-push
            - tapOn: '.*min late.*'
      - runFlow:
          when:
            true: ${!output.found}
          commands:
            - back
# The running-late push arrived.
- assertTrue: ${output.found}
- extendedWaitUntil:
    visible:
      id: 'late-title'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: en-3k-9-live
- tapOn:
    id: 'late-option-.*'
    index: 0
- tapOn:
    id: 'late-choose'
- extendedWaitUntil:
    visible:
      id: 'late-choose'
      text: 'Sent'
    timeout: 20000
- takeScreenshot: en-3k-9-live-chosen

# Back in central Đà Nẵng, by the Dragon Bridge: the next checks are on time.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'late-on-time'
    commands:
      - travel:
          points:
            - 16.0613,108.2275
            - 16.0617,108.2279
            - 16.0613,108.2275
          speed: 7
- extendedWaitUntil:
    visible:
      id: 'late-on-time'
    timeout: 120000
- takeScreenshot: en-3k-9-live-on-time
