appId: app.critterpass.dev
---
# The flight-delayed screen (3k-5). First the real route as a brand-new account sees it (a real
# onboarding, no demo seed): no disruption of theirs exists, so the screen says there is nothing
# to sort. Then every state from
# the disruptions lab's fixed data (apps/mobile/src/app/(dev)/disruption-lab.tsx), in English and
# in Vietnamese, named `<lang>-3k-5-<state>` so compare mode pairs each with its render.
- runFlow: ../../happy/subflows/fresh-account.yaml
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://disruption/0190f0a0-0000-7000-8000-00000000dead
- extendedWaitUntil:
    visible:
      id: 'disruption-missing'
    timeout: 30000
- takeScreenshot: en-3k-5-missing-fresh
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'tab-home'
    commands:
      - tapOn:
          id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
    visible:
      id: 'disruption-lab-3k-5'
    timeout: 15000
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5'
      SHOT: 'en-3k-5'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-decided-by-other'
      SHOT: 'en-3k-5-decided-by-other'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-other-member'
      SHOT: 'en-3k-5-other-member'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-in-progress'
      SHOT: 'en-3k-5-in-progress'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-no-answer'
      SHOT: 'en-3k-5-no-answer'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-cancelled'
      SHOT: 'en-3k-5-cancelled'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-diverted'
      SHOT: 'en-3k-5-diverted'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-landed'
      SHOT: 'en-3k-5-landed'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-undone'
      SHOT: 'en-3k-5-undone'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-offline'
      SHOT: 'en-3k-5-offline'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-loading'
      SHOT: 'en-3k-5-loading'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-missing'
      SHOT: 'en-3k-5-missing'
# The same states in Vietnamese: the dev gallery switches the running app's language.
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-disruption-lab'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 20000
- tapOn:
    id: 'dev-tools-entry'
- extendedWaitUntil:
    visible:
      id: 'dev-nav-gallery'
    timeout: 10000
- tapOn:
    id: 'dev-nav-gallery'
- extendedWaitUntil:
    visible:
      id: 'gallery-locale-vi'
    timeout: 15000
- tapOn:
    id: 'gallery-locale-vi'
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-gallery'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
