      SHOT: 'vi-3k-5-cancelled'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-diverted'
      SHOT: 'vi-3k-5-diverted'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-landed'
      SHOT: 'vi-3k-5-landed'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-undone'
      SHOT: 'vi-3k-5-undone'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-offline'
      SHOT: 'vi-3k-5-offline'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
