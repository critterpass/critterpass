      SCENE: '3k-5-in-progress'
      SHOT: 'vi-3k-5-in-progress'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'disruption-screen'
      SCENE: '3k-5-no-answer'
      SHOT: 'vi-3k-5-no-answer'
- runFlow:
