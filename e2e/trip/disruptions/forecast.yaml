appId: app.critterpass.dev
---
# The forecast screen (3k-7). First the real route as a brand-new account sees it (a real onboarding, no demo
# seed): a trip that is not theirs has no forecast, and the screen says it is not here. Then every state from the disruptions lab's fixed data
# (apps/mobile/src/app/(dev)/disruption-lab.tsx), in English and in Vietnamese, named
# `<lang>-3k-7-<state>` so compare mode pairs each with its render.
- runFlow: ../../happy/subflows/fresh-account.yaml
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://forecast/0190f0a0-0000-7000-8000-00000000dead
- extendedWaitUntil:
    visible:
      id: 'forecast-missing'
    timeout: 30000
- takeScreenshot: en-3k-7-missing-trip
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'tab-home'
    commands:
      - tapOn:
          id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
    visible:
      id: 'disruption-lab-3k-5'
    timeout: 15000
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7'
      SHOT: 'en-3k-7'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-all-clear'
      SHOT: 'en-3k-7-all-clear'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-stale'
      SHOT: 'en-3k-7-stale'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-offline'
      SHOT: 'en-3k-7-offline'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-no-forecast'
      SHOT: 'en-3k-7-no-forecast'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-long-trip'
      SHOT: 'en-3k-7-long-trip'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-loading'
      SHOT: 'en-3k-7-loading'
# The same states in Vietnamese: the dev gallery switches the running app's language.
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-disruption-lab'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 20000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-gallery'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
    visible:
      id: 'disruption-lab-3k-5'
    timeout: 15000
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7'
      SHOT: 'vi-3k-7'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-all-clear'
      SHOT: 'vi-3k-7-all-clear'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-stale'
      SHOT: 'vi-3k-7-stale'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-offline'
      SHOT: 'vi-3k-7-offline'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-no-forecast'
      SHOT: 'vi-3k-7-no-forecast'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-long-trip'
      SHOT: 'vi-3k-7-long-trip'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'forecast-screen'
      SCENE: '3k-7-loading'
      SHOT: 'vi-3k-7-loading'
