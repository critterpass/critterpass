appId: app.critterpass.dev
---
# The storm screen (3k-8). First the real route as a brand-new account sees it (a real onboarding, no demo
# seed): no storm decision of theirs exists, so the screen says there is nothing to decide. Then every state from the disruptions lab's fixed data
# (apps/mobile/src/app/(dev)/disruption-lab.tsx), in English and in Vietnamese, named
# `<lang>-3k-8-<state>` so compare mode pairs each with its render.
- runFlow: ../../happy/subflows/fresh-account.yaml
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://storm/0190f0a0-0000-7000-8000-00000000dead
- extendedWaitUntil:
    visible:
      id: 'storm-missing'
    timeout: 30000
- takeScreenshot: en-3k-8-missing-fresh
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'tab-home'
    commands:
      - tapOn:
          id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
    visible:
      id: 'disruption-lab-3k-5'
    timeout: 15000
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8'
      SHOT: 'en-3k-8'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-voted'
      SHOT: 'en-3k-8-voted'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-no-votes'
      SHOT: 'en-3k-8-no-votes'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-not-voting'
      SHOT: 'en-3k-8-not-voting'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-decided'
      SHOT: 'en-3k-8-decided'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-booker-pay'
      SHOT: 'en-3k-8-booker-pay'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-waiting-on-booker'
      SHOT: 'en-3k-8-waiting-on-booker'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-seats-not-confirmed'
      SHOT: 'en-3k-8-seats-not-confirmed'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-moved'
      SHOT: 'en-3k-8-moved'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-no-swap-day'
      SHOT: 'en-3k-8-no-swap-day'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-deadline-passed'
      SHOT: 'en-3k-8-deadline-passed'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-forecast-improved'
      SHOT: 'en-3k-8-forecast-improved'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-offline'
      SHOT: 'en-3k-8-offline'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-loading'
      SHOT: 'en-3k-8-loading'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'storm-screen'
      SCENE: '3k-8-missing'
      SHOT: 'en-3k-8-missing'
# The same states in Vietnamese: the dev gallery switches the running app's language.
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-disruption-lab'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 20000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-gallery'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
