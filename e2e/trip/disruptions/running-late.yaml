appId: app.critterpass.dev
---
# The running-late screen (3k-9). First the real route as a brand-new account sees it (a real
# onboarding, no demo seed): no disruption of theirs exists, so the screen says there is nothing
# to sort. Then every state from the disruptions lab's fixed data
# (apps/mobile/src/app/(dev)/disruption-lab.tsx), in English and in Vietnamese, named
# `<lang>-3k-9-<state>` so compare mode pairs each with its render.
- runFlow: ../../happy/subflows/fresh-account.yaml
- runFlow:
    file: ../../screens/sweep/subflows/open-link.yaml
    env:
      URL: critterpass-dev://late/0190f0a0-0000-7000-8000-00000000dead
- extendedWaitUntil:
    visible:
      id: 'late-missing'
    timeout: 30000
- takeScreenshot: en-3k-9-missing-fresh
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'tab-home'
    commands:
      - tapOn:
          id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
    visible:
      id: 'disruption-lab-3k-5'
    timeout: 15000
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9'
      SHOT: 'en-3k-9'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-vendor-said-yes'
      SHOT: 'en-3k-9-vendor-said-yes'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-walk'
      SHOT: 'en-3k-9-walk'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-no-ride'
      SHOT: 'en-3k-9-no-ride'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-chosen'
      SHOT: 'en-3k-9-chosen'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-stale'
      SHOT: 'en-3k-9-stale'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-waiting-crew'
      SHOT: 'en-3k-9-waiting-crew'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-on-time'
      SHOT: 'en-3k-9-on-time'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-no-map'
      SHOT: 'en-3k-9-no-map'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-loading'
      SHOT: 'en-3k-9-loading'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-missing'
      SHOT: 'en-3k-9-missing'
# The same states in Vietnamese: the dev gallery switches the running app's language.
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-disruption-lab'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 20000
- tapOn:
    id: 'dev-tools-entry'
- runFlow:
    file: ../../home/subflows/pick-gallery-locale.yaml
    env:
      LOCALE: vi
- runFlow: ../../onboarding/subflows/back.yaml
- runFlow:
    when:
      visible:
        id: 'dev-nav-gallery'
    file: ../../onboarding/subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-disruption-lab'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'dev-nav-disruption-lab'
- extendedWaitUntil:
    visible:
      id: 'disruption-lab-3k-5'
    timeout: 15000
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9'
      SHOT: 'vi-3k-9'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-vendor-said-yes'
      SHOT: 'vi-3k-9-vendor-said-yes'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-walk'
      SHOT: 'vi-3k-9-walk'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-no-ride'
      SHOT: 'vi-3k-9-no-ride'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-chosen'
      SHOT: 'vi-3k-9-chosen'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-stale'
      SHOT: 'vi-3k-9-stale'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-waiting-crew'
      SHOT: 'vi-3k-9-waiting-crew'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-on-time'
      SHOT: 'vi-3k-9-on-time'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-no-map'
      SHOT: 'vi-3k-9-no-map'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-loading'
      SHOT: 'vi-3k-9-loading'
- runFlow:
    file: subflows/lab-scene.yaml
    env:
      SCREEN: 'late-screen'
      SCENE: '3k-9-missing'
      SHOT: 'vi-3k-9-missing'
