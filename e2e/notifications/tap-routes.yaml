appId: app.critterpass.dev
---
# Tapping a notification opens the screen its deep link names: the guide nudge opens the inbox,
# the crew chat message opens that crew's chat. Both platforms; the app is in the background.
#
# Needs before it can pass: an onboarded account that is an active member of crew ${CREW_ID}
# (named ${CREW_NAME}), notification permission granted, and on Android an e2e-test build carrying
# the app's messaging service. The runner delivers each fixture at its marked step exactly as
# ios-sender.yaml (iOS) and android-sender.yaml (Android) describe.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 30000
- pressKey: Home
# Runner: deliver the guide nudge fixture (fixtures/ios-guide-nudge.json or
# fixtures/android-guide-nudge.json) here.
- swipe:
    start: 20%, 0%
    end: 20%, 80%
- extendedWaitUntil:
    visible:
      text: '.*Your crew has a vote waiting in the inbox\..*'
    timeout: 60000
- tapOn:
    text: '.*Your crew has a vote waiting in the inbox\..*'
- extendedWaitUntil:
    visible:
      id: 'inbox-screen'
    timeout: 20000
- takeScreenshot: notifications-tap-inbox
- pressKey: Home
# Runner: deliver the crew chat fixture (fixtures/ios-crew-chat.json or
# fixtures/android-crew-chat.json) here.
- swipe:
    start: 20%, 0%
    end: 20%, 80%
- extendedWaitUntil:
    visible:
      text: '.*Landing at 6, who.s up for dinner\?.*'
    timeout: 60000
- tapOn:
    text: '.*Landing at 6, who.s up for dinner\?.*'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 20000
- takeScreenshot: notifications-tap-crew-chat
