appId: app.critterpass.dev
---
# The monetization lab scenes (apps/mobile/src/features/monetize/dev/lab-scenes.tsx; the crew's
# boost card, the seventh-seat sheet and their states are in lab-crew-en.yaml) in en, from
# the splash of a fresh install: the paywall and its purchase states (4e-1), what is in each plan
# (4e-2), the welcome (4e-3), Your plan and its states (4d-1), before you go (4d-2), the payment
# page (4d-3), the boost sheet (4b-3) and the stamp (4b-5). The lab scenes are pure views over
# fixed rows; no store is involved.
- runFlow:
    file: ../screens/sweep/subflows/start.yaml
    env:
      LANG: en
- extendedWaitUntil:
    visible:
      id: 'dev-tools-entry'
    timeout: 60000
- tapOn:
    id: 'dev-tools-entry'
- scrollUntilVisible:
    element:
      id: 'dev-nav-monetize-lab'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- tapOn:
    id: 'dev-nav-monetize-lab'
- extendedWaitUntil:
    visible:
      id: 'monetize-lab-4e-1-paywall'
    timeout: 15000
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-1-paywall'
      READY: 'paywall'
      SHOT: en-4e-1-paywall
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-1-not-available'
      READY: 'paywall'
      SHOT: en-4e-1-not-available
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-1-pending'
      READY: 'paywall'
      SHOT: en-4e-1-pending
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-1-paid-unconfirmed'
      READY: 'paywall'
      SHOT: en-4e-1-paid-unconfirmed
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-1-subscribed'
      READY: 'paywall'
      SHOT: en-4e-1-subscribed
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-2-compare'
      READY: 'compare'
      SHOT: en-4e-2-compare
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-2-not-available'
      READY: 'compare'
      SHOT: en-4e-2-not-available
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-3-welcome'
      READY: 'welcome'
      SHOT: en-4e-3-welcome
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4e-3-confirming'
      READY: 'welcome'
      SHOT: en-4e-3-confirming
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4d-1-yearly'
      READY: 'plan'
      SHOT: en-4d-1-yearly
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4d-1-free'
      READY: 'plan'
      SHOT: en-4d-1-free
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4d-1-free-no-store'
      READY: 'plan'
      SHOT: en-4d-1-free-no-store
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
