      ITEM: 'monetize-lab-4d-1-ending'
      READY: 'plan'
      SHOT: en-4d-1-ending
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4d-1-grace'
      READY: 'plan'
      SHOT: en-4d-1-grace
- runFlow:
