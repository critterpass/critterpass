    env:
      ITEM: 'monetize-lab-4b-3-locked'
      READY: 'boost'
      SHOT: en-4b-3-locked
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4b-3-already-boosted'
      READY: 'boost'
      SHOT: en-4b-3-already-boosted
- runFlow:
    file: ../screens/sweep/subflows/lab-scene.yaml
    env:
      ITEM: 'monetize-lab-4b-3-not-available'
      READY: 'boost'
      SHOT: en-4b-3-not-available
- runFlow:
