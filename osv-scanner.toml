reason = "http-cache-semantics 4.2.0 (CVE-2026-93748, cross-user disclosure from a shared cache via max-stale): no patched release exists (4.2.0 is the latest). Used only by astro's remote-image fetch cache during the static web site compile (output: 'static', imageService: 'compile'); nothing serves a shared HTTP cache to users through it. Override to the fix once one ships."

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-11-04T00:00:00Z
reason = "node-forge 1.4.0 (CVE-2026-85393, RSA PKCS#1 v1.5 signature forgery in verify): no patched release exists (1.4.0 is the latest). @parse/node-apn uses it only to parse certificate/p12 credentials, and the worker authenticates to APNs with token (p8) auth, so forge never verifies a signature at runtime; @expo/cli and @expo/code-signing-certificates use it on the developer machine to create and self-check our own dev certificates. Override to the fix once node-forge ships one."
