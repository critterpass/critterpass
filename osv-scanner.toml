reason = "braces 3.0.3 (CVE-2026-93687, stack exhaustion on deeply nested patterns): no patched release exists (3.0.3 is the latest, micromatch 4.0.8 pins ^3.0.3). Reached only through micromatch in dev tooling (jest, eslint-plugin-boundaries, eslint-plugin-lingui, @lingui/cli, metro and @expo file maps), which expands glob patterns from our own config; no service or app bundle passes user input to braces. Override to the fix once braces ships one."

