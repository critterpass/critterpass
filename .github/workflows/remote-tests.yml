name: remote tests

# Runs one package's suite on a GitHub runner instead of this Mac: database suites (Testcontainers)
# and other heavy tests, so agents never need the local Docker. Start it with
# `pnpm test:remote <package> [--script test:db] [-- <test files or -t pattern>]`, which dispatches
# this workflow on the pushed branch, waits and prints the result.

on:
  workflow_dispatch:
    inputs:
      package:
        description: pnpm filter of the package, e.g. @cp/api
        required: true
      script:
        description: package script to run (test:db, test, e2e)
        default: test:db
      args:
        description: arguments passed to the script after --, e.g. a test file or -t "pattern"
        default: ''
      label:
        description: tag that lets the caller find this run
        default: ''

run-name: remote tests · ${{ inputs.package }} ${{ inputs.script }} ${{ inputs.args }} ${{ inputs.label }}

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.package }} ${{ inputs.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The worker's media and voice-note suites run the real ffmpeg, as the worker image does.
      - name: Install ffmpeg
        if: contains(inputs.package, 'worker')
        timeout-minutes: 12
        run: tools/scripts/install-ffmpeg.sh
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-node26_
      # Database suites, and @cp/db's own (its `test` script), start Testcontainers: as in CI's
      # database legs, pull their images first with retries, and build the test Postgres image once
      # here instead of in the first files' hooks, all at once.
      - name: Pull the suites' images
        if: inputs.script == 'test:db' || inputs.package == '@cp/db'
        timeout-minutes: 12
        run: pnpm exec tsx tools/scripts/test-images.ts --pull
      - name: Build the test Postgres image
        if: inputs.script == 'test:db' || inputs.package == '@cp/db'
        timeout-minutes: 10
        env:
          DEBUG: testcontainers:build # the build log, which Testcontainers otherwise drops
          TESTCONTAINERS_RYUK_DISABLED: 'true' # the build starts no container to reap
        run: pnpm --filter @cp/db exec tsx -e "import('./test/helpers/containers.ts').then((m) => m.buildPostgresImage())"
      - name: Run the suite
        env:
          PACKAGE: ${{ inputs.package }}
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        # ARGS is split like a shell would (several files, or -t "a pattern"), without evaluating it.
        run: |
          mapfile -t argv < <(python3 -c 'import os, shlex; print("\n".join(shlex.split(os.environ["ARGS"])))')
          if [ "${#argv[@]}" -gt 0 ] && [ -n "${argv[0]}" ]; then
            pnpm turbo run "$SCRIPT" --filter="$PACKAGE" --continue -- "${argv[@]}"
          else
            pnpm turbo run "$SCRIPT" --filter="$PACKAGE" --continue
          fi
