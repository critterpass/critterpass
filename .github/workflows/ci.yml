name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Affected-package detection: PRs compare with their base, pushes with the previous main commit.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    # One leg, on the Node version the services run in production (the node:26 images).
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      # Every branch's history for turbo's --affected, without the files of that history (the
      # screenshots branch alone holds every device run's images and videos): the commits and trees
      # are a few megabytes and arrive in seconds, where the full fetch took a minute or more.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Turborepo remote cache served from the GitHub Actions cache, one entry per task hash.
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-node26_
      - name: Format
        run: pnpm format:check
      # Reads every package's source, so it runs on every change: turbo runs the tools/scripts suite
      # only when that package is affected, which let an id in the app's tests reach main.
      - name: No plan ids in source
        run: pnpm --filter @cp/scripts exec vitest run no-plan-ids.test.ts
      # The content factory starts Testcontainers Postgres from its `test` script, so that suite
      # runs in this job: when it is affected, pull the suites' images and build the test Postgres
      # image before turbo starts everything else on this runner (the database job explains why).
      - name: Pull the suites' images and build the test Postgres image
        timeout-minutes: 20
        env:
          DEBUG: testcontainers:build # the build log, which Testcontainers otherwise drops
          TESTCONTAINERS_RYUK_DISABLED: 'true' # the build starts no container to reap
        run: |
          if pnpm turbo run test --affected --dry-run=json |
            jq -e 'any(.tasks[]; .taskId == "@cp/content-factory#test")' > /dev/null; then
            pnpm exec tsx tools/scripts/test-images.ts --pull
            pnpm --filter @cp/db exec tsx -e "import('./test/helpers/containers.ts').then((m) => m.buildPostgresImage())"
          fi
      # Every affected package's lint, typecheck, build and tests, in one run, except two suites
      # that were this job's long poles and now have runners of their own: the app's Jest suite
      # (the app tests job) and @cp/db's container suite (a database leg). Turbo has no flag to
      # leave one package's task out, so the tests are named one by one.
      - name: Affected packages
        run: |
          set -o pipefail
          tests=$(pnpm turbo run test --affected --filter='!@cp/mobile' --filter='!@cp/db' --dry-run=json |
            jq -r '[.tasks[] | select(.task == "test" and .command != "<NONEXISTENT>") | .taskId] | join(" ")')
          pnpm turbo run lint typecheck build $tests --affected --continue

  app-tests:
    # The app's Jest suite, split across runners: on one it took 12 to 16 minutes. Turbo still
    # decides whether the app is affected; the `app` filter of the changes job only spares the
    # runners when the change cannot reach it.
    name: app tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.app_tests == 'true'
    runs-on: ubuntu-latest
    # A shard takes about five minutes; a runner that hangs is not worth six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-node26_
      # The arguments after `--` reach Jest and are part of turbo's task hash, so each shard is
      # cached on its own.
      - run: >-
          pnpm turbo run test --affected --filter=@cp/mobile --
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  database:
    # One runner per suite: every database test file starts its own Postgres (often Redis too), and
    # the api, worker and app suites sharing a runner starved each other's container starts.
    name: database suites (${{ matrix.suite }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            task: test:db
            filter: '--filter=@cp/api'
            server: true
          - suite: worker
            task: test:db
            filter: '--filter=@cp/worker'
            server: true
          # @cp/db's own suite is its `test` script: every file starts a Postgres, one file at a
          # time, 20 minutes on a runner of its own (in the lint/typecheck/test job it took that
          # job from 12 minutes to 30). Three runners take a third of the files each.
          - suite: db 1/3
            task: test
            filter: '--filter=@cp/db'
            shard: '-- --shard=1/3'
            server: true
          - suite: db 2/3
            task: test
            filter: '--filter=@cp/db'
            shard: '-- --shard=2/3'
            server: true
          - suite: db 3/3
            task: test
            filter: '--filter=@cp/db'
            shard: '-- --shard=3/3'
            server: true
          # Every other package with a test:db script (the app's suites today), so a package that
          # gains the script runs here without a new leg.
          - suite: other packages
            task: test:db
            filter: '--filter=!@cp/api --filter=!@cp/worker'
    env:
      # Turbo counts the api and worker suites as affected by any change in a package they depend
      # on, message catalogs included: the worker depends on @cp/i18n, and nearly every app change
      # touches packages/i18n/locales. No database test reads a catalog (the unit tests cover the
      # server's strings), so the server legs run only when the change reaches past the catalogs:
      # the `server` filter of the changes job. Turbo's --affected still decides after that.
      RUN_SUITE: ${{ !matrix.server || needs.changes.outputs.server_suites == 'true' }}
    steps:
      - if: env.RUN_SUITE != 'true'
        run: echo 'Skipped. Nothing this suite runs has changed (message catalogs do not count).'
      - uses: actions/checkout@v7
        if: env.RUN_SUITE == 'true'
        with: { fetch-depth: 0, filter: 'blob:none' }
      - uses: pnpm/action-setup@v6
        if: env.RUN_SUITE == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN_SUITE == 'true'
        with: { node-version: 26, cache: pnpm }
      - if: env.RUN_SUITE == 'true'
        run: pnpm install --frozen-lockfile
      # Only the builds the suites depend on come from cache: turbo.json never caches test:db
      # (@cp/db's `test` is cached like any other package's).
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        if: env.RUN_SUITE == 'true'
        with:
          cache-prefix: turbo-node26_
      - name: Suites to run
        id: suites
        if: env.RUN_SUITE == 'true'
        env:
          TASK: ${{ matrix.task }}
          FILTER: ${{ matrix.filter }}
          # The app's database suites start the api's own test harness by its path, which turbo
          # does not see, so they also run for every change that reaches the server suites.
          WITH_APP: ${{ matrix.suite == 'other packages' && needs.changes.outputs.server_suites == 'true' }}
        run: |
          set -o pipefail
          tasks=$(pnpm turbo run "$TASK" --affected $FILTER --dry-run=json |
            jq -r --arg task "$TASK" '[.tasks[] | select(.task == $task and .command != "<NONEXISTENT>") | .taskId] | join(" ")')
          if [ "$WITH_APP" = true ] && [[ " $tasks " != *' @cp/mobile#test:db '* ]]; then
            tasks="$tasks @cp/mobile#test:db"
          fi
          tasks=$(echo $tasks)
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Suites: ${tasks:-none here is affected by this change}"
      # The worker's media and voice-note suites run the real ffmpeg, as the worker image does.
      - name: Install ffmpeg
        if: steps.suites.outputs.tasks != '' && matrix.suite == 'worker'
        timeout-minutes: 12
        run: tools/scripts/install-ffmpeg.sh
      # The suites' images come from Docker Hub, which now and then answers 500 or stalls: pull
      # them first, three tries each, so a hiccup costs a retry instead of a suite.
      - name: Pull the suites' images
        if: steps.suites.outputs.tasks != ''
        timeout-minutes: 12
        run: pnpm exec tsx tools/scripts/test-images.ts --pull
      # Each test file's worker builds the Postgres image; all but the first build come from
      # Docker's layer cache. Left to the suites, the first workers run that first build all at
      # once inside their beforeAll hooks and run out of hook time. Build it once here instead,
      # with the suites' own helper so their builds find every layer cached.
      - name: Build the test Postgres image
        if: steps.suites.outputs.tasks != ''
        timeout-minutes: 10
        env:
          DEBUG: testcontainers:build # the build log, which Testcontainers otherwise drops
          TESTCONTAINERS_RYUK_DISABLED: 'true' # the build starts no container to reap
        run: pnpm --filter @cp/db exec tsx -e "import('./test/helpers/containers.ts').then((m) => m.buildPostgresImage())"
      # A shard's arguments reach the test runner and are part of turbo's task hash.
      - if: steps.suites.outputs.tasks != ''
        run: pnpm turbo run ${{ steps.suites.outputs.tasks }} --continue ${{ matrix.shard }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      critter_art: ${{ steps.filter.outputs.critter_art }}
      critter_macos: ${{ steps.filter.outputs.critter_macos }}
      services: ${{ steps.filter.outputs.services }}
      synced_schema: ${{ steps.filter.outputs.synced_schema }}
      ai_evals: ${{ steps.filter.outputs.ai_evals }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      sync_e2e: ${{ steps.filter.outputs.sync_e2e }}
      ios_native: ${{ steps.filter.outputs.ios_native }}
      android_native: ${{ steps.filter.outputs.android_native }}
      admin_e2e: ${{ steps.filter.outputs.admin_e2e }}
      app_tests: ${{ steps.suites.outputs.app }}
      server_suites: ${{ steps.suites.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'tools/scripts/check-release-bundle.ts'
            critter_art:
              - 'packages/critter-art/src/core/**'
              - 'packages/critter-art/src/kinds/**'
              - 'packages/critter-art/src/data/**'
              - 'packages/critter-art/src/forms/**'
              - 'packages/critter-art/src/backends/canvas2d/**'
              - 'packages/critter-art/golden/**'
              - 'packages/critter-art/package.json'
              - 'design/**'
            critter_macos:
              - 'packages/critter-art/**'
              - 'packages/critter-bake/**'
              - 'apps/mobile/assets/fonts/**'
              - 'apps/mobile/plugins/**'
              - 'apps/mobile/app.config.ts'
              - 'apps/mobile/generated/critter-art/**'
              - 'apps/mobile/targets/**'
              - 'apps/mobile/jest.config.js'
              - 'design/**'
              - '.github/workflows/ci.yml'
            synced_schema:
              - 'packages/db/src/schema/**'
              - 'packages/db/src/publication.ts'
              - 'infra/powersync/**'
              - 'apps/mobile/src/data/powersync/**'
            services:
              - 'services/api/**'
              - 'services/worker/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            ai_evals:
              - 'packages/ai/**'
              - 'packages/domain/src/ai/**'
              - 'packages/domain/src/guide-actions/**'
              - '.github/workflows/ai-evals.yml'
            lockfile:
              - 'pnpm-lock.yaml'
              - '.github/workflows/osv.yml'
            sync_e2e:
              - 'apps/mobile/src/data/**'
              - 'services/api/src/**'
              - 'services/worker/src/**'
              - 'packages/db/**'
              - 'packages/domain/**'
              - 'infra/docker-compose.yml'
              - 'infra/docker/postgres/**'
              - 'infra/powersync/**'
              - 'infra/centrifugo/**'
              - 'tools/scripts/sync-e2e/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/sync-e2e.yml'
            ios_native:
              - 'apps/mobile/modules/*/ios/**'
              - 'apps/mobile/modules/*/expo-module.config.json'
              - 'apps/mobile/targets/**'
              - 'apps/mobile/plugins/**'
              - 'apps/mobile/app.config.ts'
              - 'apps/mobile/package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            android_native:
              - 'apps/mobile/modules/*/android/**'
              - 'apps/mobile/modules/*/expo-module.config.json'
              - 'apps/mobile/modules/*/package.json'
              - 'apps/mobile/plugins/**'
              - 'apps/mobile/modules/*/plugin/**'
              - 'apps/mobile/app.config.ts'
              - 'apps/mobile/package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            admin_e2e:
              - 'apps/admin/**'
              - 'packages/db/seed/**'
              - 'services/api/src/admin/**'
              - 'packages/domain/src/admin/**'
              - 'packages/db/migrations/**'
              - 'infra/docker/postgres/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
      # Which suites a change can reach. Turbo's --affected still decides inside each job; these
      # only keep runners from starting for a change that cannot matter to them. A step of its own
      # because an exclusion (`!`) needs this quantifier, which applies to every filter of a step.
      - uses: dorny/paths-filter@v4
        id: suites
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # What turbo counts as a change to every package: its own defaults and turbo.json's
            # globalDependencies.
            every_package: &every_package
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            app:
              - *every_package
              - 'apps/mobile/**'
              - 'packages/**'
            # The api and worker database suites: server code, and every package but its message
            # catalogs, which no database test reads.
            server:
              - *every_package
              - 'services/**'
              - 'infra/**'
              - 'packages/**'
              - '!packages/i18n/locales/**'

  critter-art-golden:
    name: critter art golden (Chromium + Node parity)
    needs: changes
    if: needs.changes.outputs.critter_art == 'true'
    # Parity thresholds are validated on macOS arm64. On Linux x64, @napi-rs/canvas rasterizes
    # small anti-aliased edges differently from Chromium (24pt cases exceed the threshold while the
    # browser comparison stays bit-perfect), so the gate runs on the reference platform.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 24: Playwright's browser installer hung after downloading on Node 26 runners.
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @cp/critter-art exec playwright install chromium
      - run: pnpm --filter @cp/critter-art golden
      - name: Upload golden report and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: critter-art-golden
          path: packages/critter-art/golden/out/
          retention-days: 7

  # Suites excluded from the Linux `checks` job by `CP_MACOS_SUITES` (see the vitest/jest configs of
  # @cp/critter-art, @cp/critter-bake and @cp/mobile): real-Chromium tests, share-card goldens
  # rendered on macOS arm64, and the config plugin's check of `expo prebuild` output.
  critter-art-macos:
    name: critter art macOS suites (Chromium, share goldens, prebuild plugin)
    needs: changes
    if: needs.changes.outputs.critter_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CP_MACOS_SUITES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 24: Playwright's browser installer hung after downloading on Node 26 runners.
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @cp/critter-art exec playwright install chromium
      - name: critter-art browser and share-card golden suites
        run: >-
          pnpm --filter @cp/critter-art exec vitest run
          src/web/critter-sticker.test.ts src/share/templates/templates.test.ts
      - name: critter-bake app icon design fidelity
        run: pnpm --filter @cp/critter-bake exec vitest run src/templates/app-icons-design-fidelity.test.ts
      - name: Expo prebuild
        run: pnpm --filter @cp/mobile exec expo prebuild --clean --no-install
      - name: Config plugin output
        run: pnpm --filter @cp/mobile exec jest --maxWorkers=2 plugins/__tests__/with-critter-art
      - name: Remove prebuild output
        if: always()
        run: rm -rf apps/mobile/ios apps/mobile/android

  release-bundle:
    name: release bundle excludes dev routes
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx tools/scripts/check-release-bundle.ts

  synced-schema:
    # The mobile app's local schema is generated from the server's Drizzle schema and the powersync
    # publication. The app may not depend on @cp/db, so turbo never reruns its tests for a schema
    # change; this job runs the drift check whenever either side changes.
    name: mobile synced schema matches the server
    needs: changes
    if: needs.changes.outputs.synced_schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cp/mobile exec jest src/data/powersync/__tests__/synced-schema

  service-images:
    # Builds the api and worker images exactly as Railway does, so a dependency or Dockerfile change
    # that breaks a deploy fails its pull request instead of the next deploy.
    name: service images build (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f services/${{ matrix.service }}/Dockerfile -t cp-${{ matrix.service }}-check .
      - name: worker boots to its health server
        if: matrix.service == 'worker'
        # Railway marks a deployment successful once the container starts, so a worker that hangs
        # before serving its health port looks deployed while no job runs. Boot the image with
        # unreachable dependencies and require the health server within a minute.
        run: |
          docker run -d --name worker-boot \
            -e DATABASE_DIRECT_URL=postgres://ci:ci@127.0.0.1:1/ci -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/ci \
            -e REDIS_URL=redis://127.0.0.1:1 -e APP_ENV=staging -e COMMIT_SHA=ci cp-worker-check
          for i in $(seq 1 60); do
            if docker logs worker-boot 2>&1 | grep -q 'worker health listening'; then echo "worker booted"; exit 0; fi
            sleep 1
          done
          docker logs worker-boot 2>&1 | tail -30
          echo "::error::the worker image never reached its health server"
          exit 1

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          # A pull request scans only its own commits, so a finding on another branch never fails it;
          # a push to main scans main's full history, so nothing unscanned lands there.
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha) || 'HEAD' }}
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1 --log-opts="$LOG_OPTS"

  # These workflows also run on their own for pushes to main, nightly and on dispatch.
  ai-evals:
    name: ai evals
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ai_evals == 'true'
    uses: ./.github/workflows/ai-evals.yml

  osv:
    name: dependency audit
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.lockfile == 'true'
    uses: ./.github/workflows/osv.yml

  sync-e2e:
    name: sync e2e
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.sync_e2e == 'true'
    uses: ./.github/workflows/sync-e2e.yml

  # Compiles the iOS app the way the e2e-test EAS profile does (development variant, simulator SDK)
  # so a native compile error (Swift 6 concurrency in a local module, a target or a config plugin)
  # fails its pull request instead of a paid EAS build. Swift language modes come from the generated
  # project and each module's podspec, exactly as on EAS.
  ios-native:
    name: iOS native compile (simulator, development variant)
    needs: changes
    if: needs.changes.outputs.ios_native == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The Xcode of EAS's `latest` iOS image, which the e2e-test profile builds on.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Expo prebuild
        run: pnpm --filter @cp/mobile exec expo prebuild --platform ios --clean --no-install
      # Pods only: Xcode keys DerivedData on file timestamps, which every checkout and install
      # resets, so a restored DerivedData would rebuild everything anyway.
      - uses: actions/cache@v6
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json', 'pnpm-lock.yaml', 'apps/mobile/modules/*/ios/*.podspec') }}
          restore-keys: pods-${{ runner.os }}-
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          xcodebuild build \
            -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          # Compiler errors, the result line and the failed-command summary, each once.
          grep -E ': error:|^\*\* BUILD|^\t[A-Za-z]' "$RUNNER_TEMP/xcodebuild.log" | awk '!seen[$0]++' || true
          exit "${status:-0}"
      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

  # The Android counterpart: prebuilds the development variant, runs the local modules' JVM unit
  # tests and compiles the app's Kotlin, so a native compile error fails its pull request instead
  # of a paid EAS build. arm64-v8a only, like every EAS Android build of the app.
  android-native:
    name: Android native compile (debug, unit tests)
    needs: changes
    if: needs.changes.outputs.android_native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Expo prebuild
        run: pnpm --filter @cp/mobile exec expo prebuild --platform android --clean --no-install
      - name: Unit tests and Kotlin compile
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :cp-notifications:testDebugUnitTest :cp-ocr:testDebugUnitTest :app:compileDebugKotlin

  # The ops console Playwright suite against its own throwaway Postgres (the Testcontainers image),
  # the api and the Vite dev server, exactly as `pnpm --filter @cp/admin e2e` runs it locally.
  admin-e2e:
    name: admin console e2e (Playwright, Chromium)
    needs: changes
    if: needs.changes.outputs.admin_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.8.3-alpine
        ports: ['63790:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build the test Postgres image
        uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgres
          tags: critterpass-postgres:test
          load: true
          cache-from: type=gha,scope=critterpass-postgres
          cache-to: type=gha,scope=critterpass-postgres,mode=max
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @cp/admin exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @cp/admin exec playwright install --with-deps --only-shell chromium
      - name: Console suite
        run: pnpm --filter @cp/admin e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-e2e-traces
          path: apps/admin/test-results/
          retention-days: 7

  # The single required check for merging: every job above reports on every pull request, and a job
  # skipped by its path filter counts as passing.
  ci-passed:
    name: ci passed
    if: always()
    needs:
      - checks
      - app-tests
      - database
      - changes
      - critter-art-golden
      - critter-art-macos
      - release-bundle
      - synced-schema
      - service-images
      - secrets
      - ai-evals
      - osv
      - sync-e2e
      - ios-native
      - android-native
      - admin-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
