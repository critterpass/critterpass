name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Affected-package detection: PRs compare with their base, pushes with the previous main commit.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: lint · typecheck · test · build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node }}-
      - name: Format
        if: matrix.node == 26
        run: pnpm format:check
      - name: Affected packages
        run: pnpm turbo run lint typecheck test build --affected --continue

  database:
    name: database suites (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:db --affected --continue

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      critter_art: ${{ steps.filter.outputs.critter_art }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'tools/scripts/check-release-bundle.ts'
            critter_art:
              - 'packages/critter-art/src/core/**'
              - 'packages/critter-art/src/kinds/**'
              - 'packages/critter-art/src/data/**'
              - 'packages/critter-art/src/forms/**'
              - 'packages/critter-art/src/backends/canvas2d/**'
              - 'packages/critter-art/golden/**'
              - 'packages/critter-art/package.json'
              - 'design/**'

  critter-art-golden:
    name: critter art golden (Chromium + Node parity)
    needs: changes
    if: needs.changes.outputs.critter_art == 'true'
    # Parity thresholds are validated on macOS arm64. On Linux x64, @napi-rs/canvas rasterizes
    # small anti-aliased edges differently from Chromium (24pt cases exceed the threshold while the
    # browser comparison stays bit-perfect), so the gate runs on the reference platform.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cp/critter-art exec playwright install chromium
      - run: pnpm --filter @cp/critter-art golden
      - name: Upload golden report and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: critter-art-golden
          path: packages/critter-art/golden/out/
          retention-days: 7

  release-bundle:
    name: release bundle excludes dev routes
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx tools/scripts/check-release-bundle.ts

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
