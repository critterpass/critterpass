name: deploy edge

# Web, admin and the media Worker: staging on every push to main, production on manual dispatch.
# The Astro site selects its Cloudflare environment at bundle time (CLOUDFLARE_ENV), not at deploy time.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'services/media-worker/**'
      - 'packages/domain/**'
      - 'packages/design-tokens/**'
      - 'packages/critter-art/**'
      - 'packages/i18n/**'
      - 'packages/content/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-edge-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare credentials present
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with: { node-version: 26, cache: pnpm }
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Media Worker
        if: steps.creds.outputs.ready == 'true'
        run: pnpm --filter @cp/media-worker exec wrangler deploy --env "$TARGET"

      - name: Web
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
        run: |
          pnpm --filter @cp/web run build
          pnpm --filter @cp/web exec wrangler deploy

      - name: Admin
        if: steps.creds.outputs.ready == 'true'
        run: |
          pnpm --filter @cp/admin run build
          pnpm --filter @cp/admin exec wrangler deploy --env "$TARGET"
