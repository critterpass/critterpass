name: deploy edge

# Web, admin and the media Worker: staging on every push to main, production on manual dispatch.
# The Astro site selects its Cloudflare environment at bundle time (CLOUDFLARE_ENV), not at deploy time.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'services/media-worker/**'
      - 'packages/domain/**'
      - 'packages/design-tokens/**'
      - 'packages/critter-art/**'
      - 'packages/i18n/**'
      - 'packages/content/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-edge-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Without both credentials nothing can be deployed: the run fails instead of reporting a
      # deploy that never happened (the site would keep serving whatever was last deployed by hand).
      - name: Cloudflare credentials present
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Nothing was deployed::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Media Worker
        run: pnpm --filter @cp/media-worker exec wrangler deploy --env "$TARGET"

      - name: Web
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
        run: |
          pnpm --filter @cp/web run build
          pnpm --filter @cp/web exec wrangler deploy

      - name: Admin
        run: |
          pnpm --filter @cp/admin run build
          pnpm --filter @cp/admin run deploy --env "$TARGET"
