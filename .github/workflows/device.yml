# Maestro device runs on GitHub-hosted runners: flows, screenshot captures and design | device sheets,
# sharded across parallel simulators and emulators. See e2e/README.md ("Device runs on GitHub Actions").
#
# Every run is isolated: the prepare job exports this commit's JS once per platform (Hermes bytecode,
# with the commit inlined as EXPO_PUBLIC_JS_COMMIT), and each shard swaps it into its own copy of the
# reused EAS e2e-test build with expo-updates turned off, so no run ever loads JS another run
# published to the shared e2e-test update channel.
#
# The `sweep` preset (and the nightly schedule on main) runs e2e/screens/sweep: every user-facing
# screen and sheet in English and Vietnamese, in compare mode, posted to a pull request or, without
# one, to the "Nightly UI sweep" issue.
#
# The `happy` preset (and a daily schedule on main, Android) is the release gate: e2e/happy runs every
# user flow end to end against staging with fresh accounts, records each flow on video and posts a
# report (pass or fail, time, a GIF preview, the MP4, the failing step and its screen) to the
# "Release gate" issue.
name: device
# Tells queued runs apart: mode, branch, pull request, platform and flows (GitHub cuts a long title).
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('device flows · {0} · #{1} · android', github.head_ref, github.event.pull_request.number)
  || github.event_name == 'schedule' && github.event.schedule == '0 22 * * *' && 'device release gate · main · android'
  || github.event_name == 'schedule' && 'device nightly sweep · main · android, ios'
  || format('device {0} · {1}{2} · {3}{4}', inputs.preset != 'none' && inputs.preset || inputs.mode,
  github.ref_name, inputs.pr && format(' · #{0}', inputs.pr) || '', inputs.platform,
  inputs.flows && format(' · {0}', inputs.flows) || '') }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, both]
        default: ios
      flows:
        description: Flow files, directories or globs (space or comma separated); empty runs the full suite
        type: string
        default: ''
      mode:
        description: flows (pass/fail), capture (screenshots to the PR) or compare (design | device sheets to the PR)
        type: choice
        options: [flows, capture, compare]
        default: flows
      pr:
        description: Pull request number to publish screenshots to (capture and compare modes)
        type: string
        default: ''
      build_url:
        description: Artifact URL(s) to use instead of the fingerprint-matched e2e-test build (.apk for Android, .tar.gz for iOS)
        type: string
        default: ''
      shards:
        description: Parallel shards per platform
        type: string
        default: '3'
      appearance:
        description: Device appearance
        type: choice
        options: [light, dark]
        default: light
      preset:
        description: sweep runs every screen (e2e/screens/sweep) in compare mode, pr empty posts to the nightly issue; happy is the release gate (e2e/happy, videos, the "Release gate" issue)
        type: choice
        options: [none, sweep, happy]
        default: none
      flow_timeout:
        description: Minutes one flow may run before it is stopped and reported as timed out; empty is 90
        type: string
        default: ''
      hierarchy:
        description: Save each Android flow's last screen as a view hierarchy (hierarchy/*.json in the shard artifact) for the accessibility scan; always on for the happy preset
        type: boolean
        default: false
  schedule:
    # Nightly on main: the full UI sweep (02:30 in Vietnam).
    - cron: '30 19 * * *'
    # Daily on main: the release gate on Android (05:00 in Vietnam). The Settings step and run-name
    # tell the two schedules apart by this exact string.
    - cron: '0 22 * * *'
  pull_request:
    types: [labeled, opened, synchronize, reopened]

# A pull request's runs supersede each other; so does re-dispatching the same flows on a branch.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
    && format('device-{0}-{1}-{2}-{3}-{4}', github.ref_name, inputs.mode, inputs.platform, inputs.preset, inputs.flows)
    || format('device-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TSX_VERSION: 4.23.15
  EAS_CLI: eas-cli@24.8.0
  MAESTRO_VERSION: 2.0.10
  # Pull requests run the head commit's JS, not the merge commit.
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare:
    name: prepare (builds, bundles, shards)
    # Manual runs, or same-repo pull requests labelled `device-run` (never forks).
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'device-run') &&
       (github.event.action != 'labeled' || github.event.label.name == 'device-run'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ios: ${{ steps.settings.outputs.ios }}
      android: ${{ steps.settings.outputs.android }}
      mode: ${{ steps.settings.outputs.mode }}
      pr: ${{ steps.settings.outputs.pr }}
      appearance: ${{ steps.settings.outputs.appearance }}
      preset: ${{ steps.settings.outputs.preset }}
      video: ${{ steps.settings.outputs.video }}
      js_commit: ${{ steps.settings.outputs.js_commit }}
      ios_url: ${{ steps.ios_build.outputs.url }}
      android_url: ${{ steps.android_build.outputs.url }}
      ios_matrix: ${{ steps.ios_shards.outputs.matrix }}
      android_matrix: ${{ steps.android_shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.CHECKOUT_REF }}' }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Settings
        id: settings
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_FLOWS: ${{ inputs.flows }}
          IN_MODE: ${{ inputs.mode }}
          IN_PR: ${{ inputs.pr }}
          IN_BUILD_URL: ${{ inputs.build_url }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_APPEARANCE: ${{ inputs.appearance }}
          IN_PRESET: ${{ inputs.preset }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A scheduled run has no build_url input. While no Android e2e-test build matches the
          # native fingerprint, this repo variable names the APK it installs (e2e/README.md).
          SCHEDULED_ANDROID_BUILD_URL: ${{ vars.DEVICE_SCHEDULED_ANDROID_BUILD_URL }}
        run: |
          # iOS shards share a handful of macOS runners; Android shards run on Linux (KVM) runners,
          # so everything that isn't iOS-specific runs on Android.
          ios_flows='' ios_shards=''
          if [ "$EVENT" = pull_request ]; then
            # A labelled pull request runs the full suite on Android, pass/fail only.
            platform=android flows='' mode=flows pr=$PR_NUMBER build_url='' shards=3 appearance=light preset=none
          elif [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '0 22 * * *' ]; then
            # Daily release gate: every happy-path flow on Android.
            platform=android flows='' mode=flows pr='' build_url='' shards=3 appearance=light preset=happy
          elif [ "$EVENT" = schedule ]; then
            # Nightly: the whole sweep on Android, and its English half on one iOS shard for what only
            # iOS shows (safe areas, the keyboard, modal presentation). The labs-* flows draw their
            # scenes on Android only, so the iOS shard leaves them out.
            platform=both flows='' mode=compare pr='' build_url='' shards=7 appearance=light preset=sweep
            ios_flows='e2e/screens/sweep/!(labs-*)-en.yaml' ios_shards=1
          else
            platform=$IN_PLATFORM flows=$IN_FLOWS mode=$IN_MODE pr=$IN_PR build_url=$IN_BUILD_URL
            shards=$IN_SHARDS appearance=$IN_APPEARANCE preset=$IN_PRESET
          fi
          if [ "$EVENT" = schedule ] && [ -n "$SCHEDULED_ANDROID_BUILD_URL" ]; then
            build_url=$SCHEDULED_ANDROID_BUILD_URL
            line="scheduled run uses the build in DEVICE_SCHEDULED_ANDROID_BUILD_URL: $build_url"
            echo "::notice::$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$preset" = sweep ]; then
            # Every screen in both languages; sheets unless screenshots alone were asked for.
            [ -z "$flows" ] && flows='e2e/screens/sweep/*.yaml'
            [ "$mode" = flows ] && mode=compare
            # Without a pull request the images go to the nightly issue.
            [ -z "$pr" ] && pr=nightly
          fi
          video=false
          if [ "$preset" = happy ]; then
            # Flows are independent and each onboards its own account: ten Android shards, balanced
            # by recorded flow time (plan-shards.ts); iOS keeps the shards input.
            [ -z "$flows" ] && flows='e2e/happy/*.yaml'
            mode=flows video=true
            ios_shards=$shards shards=10
            # Without a pull request the report goes to the "Release gate" issue.
            [ -z "$pr" ] && pr=nightly
          fi
          if [ "$mode" != flows ] && ! [[ "$pr" =~ ^([0-9]+|nightly)$ ]]; then
            echo "::error::mode $mode publishes to a pull request: set pr"; exit 1
          fi
          [[ "$shards" =~ ^[1-9][0-9]*$ ]] || { echo "::error::shards must be a positive number"; exit 1; }
          [ -z "$ios_flows" ] && ios_flows=$flows
          [ -z "$ios_shards" ] && ios_shards=$shards
          {
            echo "ios=$([ "$platform" != android ] && echo true || echo false)"
            echo "android=$([ "$platform" != ios ] && echo true || echo false)"
            echo "mode=$mode"; echo "pr=$pr"; echo "appearance=$appearance"; echo "shards=$shards"
            echo "ios_shards=$ios_shards"
            echo "preset=$preset"; echo "video=$video"
            echo "js_commit=$(git rev-parse --short=12 HEAD)"
            echo "flows<<EOF"; echo "$flows"; echo "EOF"
            echo "ios_flows<<EOF"; echo "$ios_flows"; echo "EOF"
            echo "build_url<<EOF"; echo "$build_url"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve the iOS build
        id: ios_build
        if: steps.settings.outputs.ios == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ steps.settings.outputs.build_url }}
        run: pnpm exec tsx tools/scripts/ci-device/resolve-build.ts --platform ios --override "$OVERRIDE"
      - name: Resolve the Android build
        id: android_build
        if: steps.settings.outputs.android == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ steps.settings.outputs.build_url }}
        run: pnpm exec tsx tools/scripts/ci-device/resolve-build.ts --platform android --override "$OVERRIDE"
      - name: Plan iOS shards
        id: ios_shards
        if: steps.settings.outputs.ios == 'true'
        env:
          FLOWS: ${{ steps.settings.outputs.ios_flows }}
          SHARDS: ${{ steps.settings.outputs.ios_shards }}
        run: pnpm exec tsx tools/scripts/ci-device/plan-shards.ts --platform ios --shards "$SHARDS" --flows "$FLOWS"
      - name: Plan Android shards
        id: android_shards
        if: steps.settings.outputs.android == 'true'
        env:
          FLOWS: ${{ steps.settings.outputs.flows }}
          SHARDS: ${{ steps.settings.outputs.shards }}
        run: pnpm exec tsx tools/scripts/ci-device/plan-shards.ts --platform android --shards "$SHARDS" --flows "$FLOWS"
      - name: Export the JS bundles
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS: ${{ steps.settings.outputs.ios }}
          ANDROID: ${{ steps.settings.outputs.android }}
          EXPO_PUBLIC_JS_COMMIT: ${{ steps.settings.outputs.js_commit }}
        working-directory: apps/mobile
        run: |
          export APP_VARIANT=development NODE_ENV=production
          out=$RUNNER_TEMP/bundles
          for platform in ios android; do
            [ "$platform" = ios ] && [ "$IOS" != true ] && continue
            [ "$platform" = android ] && [ "$ANDROID" != true ] && continue
            file=$([ "$platform" = ios ] && echo main.jsbundle || echo index.android.bundle)
            mkdir -p "$out/$platform"
            cmd="pnpm exec expo export:embed --platform $platform --dev false --minify true --bytecode --entry-file node_modules/expo-router/entry.js --bundle-output $out/$platform/$file --assets-dest $out/$platform"
            # The EAS development environment's EXPO_PUBLIC_* values, as the e2e-test build had them.
            if [ -n "$EXPO_TOKEN" ]; then
              npx --yes "$EAS_CLI" env:exec development "$cmd" --non-interactive
            else
              echo "::warning::No EXPO_TOKEN: the bundle uses code defaults for EXPO_PUBLIC_* values"
              $cmd
            fi
            grep -q "$EXPO_PUBLIC_JS_COMMIT" "$out/$platform/$file" ||
              { echo "::error::The $platform bundle does not carry $EXPO_PUBLIC_JS_COMMIT"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: device-bundles
          path: ${{ runner.temp }}/bundles
          retention-days: 3

  ios:
    name: ios shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    # Xcode 26.6 on macOS 26: the image the e2e-test build is made on. Three at a time, leaving two
    # of the plan's five macOS slots to CI.
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.ios_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.CHECKOUT_REF }}' }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/download-artifact@v8
        with: { name: device-bundles, path: '${{ runner.temp }}/bundles' }
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Run the flows
        env:
          BUILD_URL: ${{ needs.prepare.outputs.ios_url }}
          FLOWS: tools/scripts/ci-device/js-commit.yaml ${{ matrix.flows }}
          JS_COMMIT: ${{ needs.prepare.outputs.js_commit }}
          OTP_TEST_CODE: ${{ secrets.OTP_TEST_CODE }}
          # The crew the push fixtures and chat flows address (repository variables).
          CREW_ID: ${{ vars.E2E_CREW_ID }}
          CREW_NAME: ${{ vars.E2E_CREW_NAME }}
          # The api the build talks to: runner scenarios drive other people through it.
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL || 'https://api-staging-de92.up.railway.app' }}
          APPEARANCE: ${{ needs.prepare.outputs.appearance }}
          RECORD_VIDEO: ${{ needs.prepare.outputs.video }}
          # A failed flow runs once more; one past this many minutes is stopped (flow-attempts.ts).
          FLOW_TIMEOUT_MINUTES: ${{ inputs.flow_timeout }}
        run: tools/scripts/ci-device/ios-device.sh "$BUILD_URL" "$RUNNER_TEMP/bundles/ios" "$RUNNER_TEMP/out" "$FLOWS"
      # Launch and first-screen timings from Maestro's own command log, into the shard's artifact
      # (perf/device-timings.json) and the job summary. Recorded only: it never fails a shard.
      - name: Record launch timings
        if: always()
        continue-on-error: true
        run: npx --yes tsx@4 tools/scripts/perf/device-timings.ts --dir "$RUNNER_TEMP/out" --platform ios || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-ios-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  android:
    name: android shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.CHECKOUT_REF }}' }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@v8
        with: { name: device-bundles, path: '${{ runner.temp }}/bundles' }
      - name: Patch the APK with this commit's JS
        env:
          BUILD_URL: ${{ needs.prepare.outputs.android_url }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/e2e-test.apk" "$BUILD_URL"
          tools/scripts/ci-device/patch-android-apk.sh "$RUNNER_TEMP/e2e-test.apk" \
            "$RUNNER_TEMP/bundles/android/index.android.bundle" "$RUNNER_TEMP/app.apk"
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOWS: tools/scripts/ci-device/js-commit.yaml ${{ matrix.flows }}
          JS_COMMIT: ${{ needs.prepare.outputs.js_commit }}
          OTP_TEST_CODE: ${{ secrets.OTP_TEST_CODE }}
          # The crew the push fixtures and chat flows address (repository variables).
          CREW_ID: ${{ vars.E2E_CREW_ID }}
          CREW_NAME: ${{ vars.E2E_CREW_NAME }}
          # The api the build talks to: runner scenarios drive other people through it.
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL || 'https://api-staging-de92.up.railway.app' }}
          APPEARANCE: ${{ needs.prepare.outputs.appearance }}
          RECORD_VIDEO: ${{ needs.prepare.outputs.video }}
          # A failed flow runs once more; one past this many minutes is stopped (flow-attempts.ts).
          FLOW_TIMEOUT_MINUTES: ${{ inputs.flow_timeout }}
          # View hierarchies for the accessibility scan: an artifact only, never a failure.
          SAVE_HIERARCHY: ${{ inputs.hierarchy == true || needs.prepare.outputs.video == 'true' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          disk-size: 6000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          # The emulator connects to an adb server that is already running, instead of racing to start one.
          pre-emulator-launch-script: adb start-server
          script: tools/scripts/ci-device/android-device.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/out" "$FLOWS"
      # Launch and first-screen timings from Maestro's own command log, into the shard's artifact
      # (perf/device-timings.json) and the job summary. Recorded only: it never fails a shard.
      - name: Record launch timings
        if: always()
        continue-on-error: true
        run: npx --yes tsx@4 tools/scripts/perf/device-timings.ts --dir "$RUNNER_TEMP/out" --platform android || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-android-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  publish:
    name: publish images and reports
    needs: [prepare, ios, android]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode != 'flows' || needs.prepare.outputs.preset == 'happy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.CHECKOUT_REF }}' }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with: { pattern: 'device-*-shard-*', path: '${{ runner.temp }}/shards' }
      - name: Keep each shard in its own folder
        env:
          IOS: ${{ needs.prepare.outputs.ios }}
        run: |
          # A lone matching artifact is extracted straight into the path, without its folder.
          shards=$RUNNER_TEMP/shards
          if [ -d "$shards" ] && ! ls -d "$shards"/device-*-shard-* >/dev/null 2>&1; then
            platform=$([ "$IOS" = true ] && echo ios || echo android)
            mkdir -p "$RUNNER_TEMP/one" && mv "$shards"/* "$RUNNER_TEMP/one/" 2>/dev/null || true
            mv "$RUNNER_TEMP/one" "$shards/device-$platform-shard-1"
          fi
      - name: Collect the screenshots
        if: needs.prepare.outputs.preset != 'happy'
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          images=$RUNNER_TEMP/images
          mkdir -p "$images"
          for platform in ios android; do
            dirs=$(ls -d "$RUNNER_TEMP/shards/device-$platform-shard-"*/screenshots 2>/dev/null || true)
            [ -z "$dirs" ] && continue
            mkdir -p "$RUNNER_TEMP/device/$platform"
            for dir in $dirs; do cp "$dir"/*.png "$RUNNER_TEMP/device/$platform/" 2>/dev/null || true; done
            [ -z "$(ls "$RUNNER_TEMP/device/$platform")" ] && continue
            if [ "$MODE" = compare ]; then
              pnpm screens:compare -- --from "$RUNNER_TEMP/device/$platform" --out "$images/$platform-sheets" || true
            fi
            # No sheets (no design-id names, or the compare failed): post the screenshots themselves.
            if [ "$MODE" != compare ] || ! find "$images/$platform-sheets" -name '*.png' 2>/dev/null | grep -q .; then
              [ "$MODE" = compare ] && echo "SHEETLESS=true" >> "$GITHUB_ENV"
              rm -rf "$images/$platform-sheets"
              mkdir -p "$images/$platform" && cp -R "$RUNNER_TEMP/device/$platform/." "$images/$platform/"
            fi
          done
          if ! find "$images" -name '*.png' | grep -q .; then
            echo "::notice title=No screenshots::No shard captured a screenshot; the comment carries the check summary only."
          fi
      - name: Summarise the checks
        if: needs.prepare.outputs.preset != 'happy'
        env:
          PRESET: ${{ needs.prepare.outputs.preset }}
          # The plan: a planned flow with no report is listed as having no result, never as passed.
          IOS_MATRIX: ${{ needs.prepare.outputs.ios_matrix }}
          ANDROID_MATRIX: ${{ needs.prepare.outputs.android_matrix }}
        run: |
          args=()
          [ "$PRESET" = sweep ] && args+=(--coverage)
          pnpm exec tsx tools/scripts/ci-device/run-summary.ts "$RUNNER_TEMP/shards" "${args[@]}" \
            --out "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Find the nightly issue
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
          PRESET: ${{ needs.prepare.outputs.preset }}
        run: |
          if [ "$PR" != nightly ]; then echo "number=$PR" >> "$GITHUB_OUTPUT"; exit 0; fi
          title='Nightly UI sweep'
          about="Every night the device workflow sweeps every screen of main (e2e/screens/sweep) and comments here with the design | device sheets, the screen checks and the sweep coverage."
          if [ "$PRESET" = happy ]; then
            title='Release gate'
            about="The device workflow's happy preset runs every user flow (e2e/happy) end to end against staging, daily on main and before each TestFlight build, and comments here with each flow's result, time, video and failing step."
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$about")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: needs.prepare.outputs.preset != 'happy'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.target.outputs.number }}
          MODE: ${{ needs.prepare.outputs.mode }}
          JS_COMMIT: ${{ needs.prepare.outputs.js_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          heading="Device screenshots"
          [ "$MODE" = compare ] && [ "${SHEETLESS:-}" != true ] && heading="Design | device sheets"
          tools/scripts/ci-device/publish-screenshots.sh "$PR" "$RUNNER_TEMP/images" "$heading ($JS_COMMIT)"
      - name: Build the release gate report
        if: needs.prepare.outputs.preset == 'happy'
        env:
          ISSUE: ${{ steps.target.outputs.number }}
          JS_COMMIT: ${{ needs.prepare.outputs.js_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The plan: a planned flow with no report is a failed row of the gate.
          IOS_MATRIX: ${{ needs.prepare.outputs.ios_matrix }}
          ANDROID_MATRIX: ${{ needs.prepare.outputs.android_matrix }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          # Where publish-screenshots.sh puts this run's files on the screenshots branch.
          dir="screenshots/$ISSUE/run-$GITHUB_RUN_ID"
          pnpm exec tsx tools/scripts/ci-device/release-gate.ts "$RUNNER_TEMP/shards" \
            --media "$RUNNER_TEMP/gate" --out "$RUNNER_TEMP/gate.md" --commit "$JS_COMMIT" --run-url "$RUN_URL" \
            --raw-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$dir" \
            --blob-url "https://github.com/$GITHUB_REPOSITORY/blob/$dir"
          cat "$RUNNER_TEMP/gate.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release gate
        if: needs.prepare.outputs.preset == 'happy'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.target.outputs.number }}
          BODY_FILE: ${{ runner.temp }}/gate.md
          # About a month of daily runs; older videos leave the branch's tree.
          PRUNE_KEEP: '30'
        run: tools/scripts/ci-device/publish-screenshots.sh "$PR" "$RUNNER_TEMP/gate" "Release gate"
