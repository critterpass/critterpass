name: native-build

# Builds the app on GitHub's runners (`eas build --local`, no EAS build minutes): Android on Linux,
# iOS on macOS. See native-build-job.yml for where the build goes. Production builds go through
# release.yml.
#   gh workflow run native-build.yml -f ref=main -f profile=e2e-test -f platform=android
#   gh workflow run native-build.yml -f ref=main -f profile=staging -f platform=ios [-f submit=true]
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
      profile:
        description: eas.json build profile
        required: true
        type: choice
        options: [staging, e2e-test]
      platform:
        description: Platform
        required: true
        type: choice
        options: [ios, android, all]
      submit:
        description: Send a staging build to TestFlight / Play internal testing when it is built
        required: false
        type: boolean
        default: false

run-name: native build ${{ inputs.profile }} ${{ inputs.platform }} at ${{ inputs.ref }}

# One build per ref, profile and platform at a time: a second dispatch waits instead of doubling up.
concurrency:
  group: native-build-${{ inputs.ref }}-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-build-job.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ inputs.ref }}
      profile: ${{ inputs.profile }}
      platform: ${{ inputs.platform }}
      submit: ${{ inputs.submit }}
    secrets: inherit
