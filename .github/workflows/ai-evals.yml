name: ai-evals

# The quality gate for prompts, personas, tools and routing (packages/ai/evals/README.md).
# Pull requests call it from ci.yml when these same paths change, so its result feeds `ci passed`.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'packages/ai/**'
      - 'packages/domain/src/ai/**'
      - 'packages/domain/src/guide-actions/**'
      - '.github/workflows/ai-evals.yml'
  schedule:
    # Nightly full run, 02:30 Asia/Saigon.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: replay (recorded responses) or live (DeepSeek and Tavily, needs the secrets)
        type: choice
        options: [replay, live]
        default: replay

concurrency:
  group: ai-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: promptfoo suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Changed suites
        if: github.event_name == 'pull_request'
        run: pnpm --filter @cp/ai eval --changed origin/${{ github.base_ref }}
      - name: Generation suites
        if: github.event_name != 'pull_request'
        env:
          # Live against DeepSeek on the nightly or a manual live run; the thresholds gate both modes.
          EVAL_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && secrets.ANTHROPIC_API_KEY != '' && 'live' || 'replay' }}
          # The DeepSeek key (the gateway speaks DeepSeek's Anthropic-format API).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional repository variable overriding the graded endpoint; unset = DeepSeek.
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          # Web search cases search through Tavily; unset, they answer without search.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: pnpm --filter @cp/ai eval chat persona grounding injection autonomy
      - name: Compliance against Jev
        # The decision suite runs live on its own key; its fast-tier twin uses the DeepSeek key.
        if: github.event_name != 'pull_request'
        env:
          EVAL_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && secrets.TYPESAFE_API_KEY != '' && 'live' || 'replay' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
        run: pnpm --filter @cp/ai eval compliance
