<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>critter-art gallery</title>
    <style>
      :root {
        --bg: #f4efe4;
        --fg: #17142a;
        --card-bg: #ffffff;
        --card-border: #e0d8c8;
      }
      body.dark {
        --bg: #17142a;
        --fg: #f4efe4;
        --card-bg: #221e3a;
        --card-border: #3a3466;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        background: var(--card-bg);
        border-bottom: 1px solid var(--card-border);
      }
      header label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      header input,
      header select,
      header button {
        font: inherit;
        padding: 4px 6px;
      }
      #search {
        width: 160px;
      }
      #status {
        margin-left: auto;
        font-size: 12px;
        opacity: 0.7;
        white-space: nowrap;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
        padding: 14px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
      }
      .cell canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .cell .label {
        font-size: 11px;
        text-align: center;
        line-height: 1.3;
        word-break: break-word;
      }
      .cell .undesigned {
        font-size: 9px;
        opacity: 0.6;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <header>
      <label>Search<input id="search" type="text" placeholder="name or cp-id" /></label>
      <label>
        Rarity
        <select id="rarity">
          <option value="common">Common</option>
          <option value="rare">Rare</option>
          <option value="epic">Epic</option>
          <option value="legendary">Legendary</option>
        </select>
      </label>
      <label>
        Pose override
        <select id="poseOverride">
          <option value="">Auto (from rarity)</option>
          <option value="idle">idle</option>
          <option value="wave">wave</option>
          <option value="cheer">cheer</option>
          <option value="think">think</option>
          <option value="point">point</option>
          <option value="sleep">sleep</option>
          <option value="crack">crack</option>
          <option value="tilt">tilt</option>
          <option value="hop">hop</option>
        </select>
      </label>
      <label>
        Variant
        <select id="variant">
          <option value="color">color</option>
          <option value="mask">mask</option>
          <option value="mono">mono</option>
          <option value="stamp">stamp</option>
        </select>
      </label>
      <label>
        Size
        <select id="size">
          <option value="24">24pt</option>
          <option value="96" selected>96pt</option>
          <option value="150">150pt</option>
          <option value="300">300pt</option>
        </select>
      </label>
      <label>
        Seed mode
        <select id="seedMode">
          <option value="stable" selected>stable</option>
          <option value="design">design</option>
        </select>
      </label>
      <label>
        Background
        <select id="background">
          <option value="light" selected>light</option>
          <option value="dark">dark</option>
        </select>
      </label>
      <label>
        Sticker
        <input id="sticker" type="checkbox" checked />
      </label>
      <label>
        Blink
        <input id="blink" type="checkbox" />
      </label>
      <button id="replay" type="button">Replay draw-on</button>
      <span id="status"></span>
    </header>
    <main id="grid"></main>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
