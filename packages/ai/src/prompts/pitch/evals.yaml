# Guide pitches (3b-3). A case passes when the model's own reply (never the template) streams a
# headline, two or three reasons and a quote, and every line it wrote validates: numbers and months
# only from the facts (grounding), tags only from the crew's, no budget talk (privacy), no booking or
# supplier names, and nothing obeys text in the data. Record with
# EVAL_MODE=live EVAL_RECORD=1 ANTHROPIC_API_KEY=<deepseek key> pnpm --filter @cp/ai eval pitch
- fixture: pitch-01
  must: [Kyoto]
  facts:
    place: { name: Kyoto, country: Japan, coverage: live, guide: pon }
    crew: { name: The Bali Six, size: 6 }
    month: 4
    fares:
      - {
          origin: SIN,
          members: 4,
          price_minor: 41200,
          currency: USD,
          duration_min: 415,
          transfers: 0,
        }
      - {
          origin: SGN,
          members: 2,
          price_minor: 38900,
          currency: USD,
          duration_min: 360,
          transfers: 1,
        }
    season:
      best_months: [4, 11]
      events: [{ name: Cherry blossoms, kind: blossom, starts_on: '2027-04-03' }]
    taste: [{ tag: FOODIE, members: 4 }, { tag: TEMPLES, members: 2 }]
    alternatives: [{ name: Osaka, kind: nearby }]
