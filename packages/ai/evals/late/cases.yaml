# Running-late cases: the sheet as the planner works it out (one item per offered option, ids are
# the option ids). Numbers only from the facts; no closure without a cited source; nobody "said
# yes" before they did; no refund the booking does not show.
- id: late-01
  description: two late for the spa, the others waiting, split push or skip
  guide: tokek
  input:
    facts: { title: Karsa Spa, names: Wes and Jordan, late_min: 25, start: '14:00', eta: '14:25' }
    headlineTemplate: Running 25 min late
    detailTemplate: Traffic is heavy on the way to Karsa Spa.
    items:
      - {
          id: push,
          kind: push,
          facts: { title: Karsa Spa, from: '14:00', to: '14:25', minutes: 25 },
          template: 'The others start at 14:00. You slot in at 14:25.',
        }
      - {
          id: skip,
          kind: skip,
          facts: { title: Karsa Spa },
          template: The others go ahead without you.,
        }
  must: ['25']
  forbid: [closed, procession, said yes, refund]
