- description: A reply that moves the slot to a time the tool never gave is caught
  vars:
    route: guide.chat
    persona: tokek
    question: Does Tegallalang fit on day 3?
    trip_context: *bali
    tool_results:
      - tool: fit_check
        output:
          grade: good
          day_no: 3
          starts_at: '08:30'
          ends_at: '10:30'
          reasons: []
    seeded: true
    replay:
      text: Day 3 works. Head out at 07:15 and you're done by 10:30.
  assert:
    - type: javascript
      value: file://../graders.ts:flags_unverified_time
