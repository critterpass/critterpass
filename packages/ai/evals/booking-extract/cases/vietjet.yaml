# VietJet e-tickets bought in the MoMo wallet: redacted copies (fake names, codes, contacts and payment details;
# every date moved by whole weeks per email), graded against labels read from the redacted text.
- description: a VietJet e-ticket bought in MoMo, Saigon to Hanoi at dawn
  fixture: booking-extract-vietjet-01
  provider: vietjet
  email: vietjet-01.txt
  subject: 'Xác nhận đặt vé máy bay Vietjet Air thành công trên ví MoMo - Mã giao dịch: 3980911000'
  expect:
    status: parsed
    bookings:
      - kind: flight
        supplier_ref: 4JB22W
        starts_at: 2024-03-14T22:25:00.000Z
        flights:
          - VJ198
        price_minor: 1016400
        currency: VND
        free_cancel_until: null
  excluded:
    - 'cancel_policy: the e-ticket prints no cancellation policy, only a note on delayed flights'
