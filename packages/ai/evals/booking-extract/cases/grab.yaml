# Grab advance bookings, GrabFood receipts and finished-ride receipts: redacted copies (fake names, codes, contacts and payment details;
# every date moved by whole weeks per email), graded against labels read from the redacted text.
- description: 'a Grab advance booking: an electric car to a riverside hotel'
  fixture: booking-extract-grab-01
  provider: grab
  email: grab-01.txt
  subject: 'Advance Booking: Your ride is all booked!'
  expect:
    status: parsed
    bookings:
      - kind: transfer
        supplier_ref: A-9F3XPWY469G4AV
        starts_at: 2025-10-04T00:30:00.000Z
        cancel_policy: true
  excluded:
    - 'price: an advance booking prints no fare'
    - 'free_cancel_until: the policy is relative ("up to 1 hour before your pickup"), no date is
      printed'
- description: 'a Grab advance booking: a car out of the city on a provincial road'
