        field: notes,
        text: 'Tell the driver to wait at the lower gate, the upper one closes early.',
      }

- id: translate-14
  description: the critters of a place are thổ địa for a Vietnamese reader, not a literal translation
  guide: chava
  locale: vi
  lines:
    - { kind: quest, field: title, text: 'Local friends' }
    - { kind: quest, field: body, text: 'Befriend 2 locals around Son Tra before sunset.' }
    - {
        kind: briefing_item,
        field: text,
        text: 'A local is out near Dragon Bridge this evening. Go and say hello.',
      }
  must: ['2']
  glossary: ['thổ địa']
  forbid: ['bạn địa phương', 'người địa phương']

- id: translate-12
  description: Seeded slip, a time changed and a price reformatted are refused, the clean line kept
  guide: chava
  locale: vi
  seeded: true
  lines:
    - { kind: briefing_item, field: text, text: 'Leave by 7:10 for the Ba Na Hills cable car.' }
    - { kind: briefing_item, field: text, text: 'You owe 250,000 VND to the crew.' }
    - { kind: plan_day, field: theme, text: 'Beach day, slow start' }
  reply:
    items:
      - { id: t1, text: 'Đi từ 7:30 để kịp cáp treo Bà Nà Hills.' }
      - { id: t2, text: 'Bạn nợ nhóm 250.000 VND.' }
      - { id: t3, text: 'Ngày biển, khởi động chậm' }
  expect_rejected:
    - { id: t1, reason: numbers_changed }
    - { id: t2, reason: numbers_changed }

- id: translate-13
  description: Seeded slip, a glossed dish, a title that became a sentence and a skipped line
  guide: chava
  locale: vi
  seeded: true
  lines:
    - {
        kind: plan_item,
        field: notes,
        text: 'Mì Quảng at Ba Mua: order the one with shrimp and pork.',
      }
    - { kind: quest, field: title, text: 'Bridge watchers' }
    - { kind: plan_day, field: theme, text: 'Up Ba Na Hills, early' }
  reply:
    items:
      - {
          id: t1,
          text: 'Mì Quảng (turmeric noodles with pork and shrimp) ở Ba Mua: gọi phần có tôm và thịt heo.',
        }
      - { id: t2, text: 'Những người cùng nhau đứng ngắm cây cầu phun lửa mỗi tối' }
  expect_rejected:
    - { id: t1, reason: added_aside }
    - { id: t2, reason: too_long }
    - { id: t3, reason: missing }

- id: translate-15
  description: a flight delay and a rough-seas watch row, Vietnamese reader, times and numbers intact
  guide: chava
  locale: vi
  lines:
    - { kind: disruption, field: title, text: 'VN 123 lands at 19:30' }
    - {
        kind: disruption,
        field: summary,
        text: 'Two of you land at 19:30. I moved the surf lesson and need a yes on dinner.',
      }
    - { kind: watch_item, field: title, text: 'Cham Island boat · waves 2.5 m' }
    - {
        kind: watch_item,
        field: detail,
        text: 'Forecast shows waves 2.5 m, wind 35 km/h. The harbour might close.',
      }
  must: ['19:30', '2.5', '35']
  keep: ['VN 123']
