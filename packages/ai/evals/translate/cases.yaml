# Translation cases: lines the guide wrote in English, graded on what comes back for one reader
# language. `must` strings appear in some kept line (a time, an amount, a place's local name),
# `keep` names stay exactly as written (businesses, dishes, people), `glossary` words (the app's
# own, in any letter case) appear in some kept line, `forbid` strings appear in none, `allow_source` lines may stay in the source language. `seeded` cases grade the validator on
# a deliberate model slip (their inline `reply`): exactly `expect_rejected` is refused.
- id: translate-01
  description: Đà Nẵng plan, Vietnamese reader, day themes and notes
  guide: chava
  locale: vi
  lines:
    - { kind: plan_day, field: theme, text: 'Land, eat, breathe' }
    - { kind: plan_day, field: theme, text: 'Son Tra and the sea' }
    - {
        kind: plan_item,
        field: notes,
        text: 'Start slow with a seaside coffee while the city wakes up.',
      }
    - {
        kind: plan_item,
        field: notes,
        text: 'The monkeys on Son Tra are bold, so keep snacks zipped away.',
      }
    - {
        kind: plan_item,
        field: notes,
        text: 'Bánh xèo at Ba Duong: roll it yourself, the staff will show you once.',
      }
    - {
        kind: plan_item,
        field: notes,
        text: 'Take the stairs up at Marble Mountains and the lift down. Your knees will thank you.',
      }
  must: ['Sơn Trà', 'Ngũ Hành Sơn']
  keep: ['Ba Duong', 'Bánh xèo']

- id: translate-02
  description: Morning briefing lines, Vietnamese reader, every time and amount kept
  guide: chava
  locale: vi
  lines:
    - { kind: briefing_item, field: text, text: 'Leave by 6:40 for the 8:15 flight to Da Nang.' }
    - {
        kind: briefing_item,
        field: text,
        text: 'Minh still owes 320,000 VND for last night. A nudge would not hurt.',
      }
    - {
        kind: briefing_item,
        field: text,
        text: 'Free cancellation on Fusion Suites ends tomorrow at 14:00.',
      }
    - {
        kind: briefing_item,
        field: text,
        text: 'Rain from 15:00, so do the bridge walk this morning.',
      }
  must: ['6:40', '8:15', '320,000 VND', '14:00', '15:00']
  keep: ['Minh', 'Fusion Suites']

- id: translate-03
  description: Quest titles and bodies, Vietnamese reader, titles stay one line
  guide: chava
  locale: vi
  lines:
    - { kind: quest, field: title, text: 'Noodle detectives' }
    - { kind: quest, field: body, text: 'Try the noodles at two stalls and settle which one wins.' }
    - { kind: quest, field: title, text: 'Golden hour crew' }
    - { kind: quest, field: body, text: 'Get all 4 of you into one sunset photo on My Khe.' }
  must: ['4']

- id: translate-04
  description: Pitch lines for the crew board, Vietnamese reader
  guide: chava
  locale: vi
  lines:
    - { kind: pitch, field: headline, text: 'Da Nang: beach days without the crowds' }
    - {
        kind: pitch,
        field: reason_0,
        text: 'Dry season starts, and the sea is calm enough to swim.',
      }
    - { kind: pitch, field: reason_1, text: 'Hoi An is close enough for an evening of lanterns.' }
    - { kind: pitch, field: quote, text: 'Most of you said street food. This is the city for it.' }
  must: ['Hội An']

- id: translate-05
  description: Bali plan in Tokek's voice, Vietnamese reader, Balinese names left alone
  guide: tokek
  locale: vi
  lines:
