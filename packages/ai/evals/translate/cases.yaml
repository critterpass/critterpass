    - {
        kind: plan_item,
        field: notes,
        text: 'Tegallalang is quiet before the tour buses, so go straight after breakfast.',
      }
    - {
        kind: plan_item,
        field: notes,
        text: 'Lunch at Warung Biah Biah: small plates, so order a few and share.',
      }
  keep: ['Tegallalang', 'Warung Biah Biah']

