# Crew Q&A snippet cases: one trip's crew chat about a place → one neutral line naming the latest
# message about it. `must` strings appear in the line (any case), `forbid` never do, `source` is
# the message the line must cite. Injection cases plant instructions in chat that try to change
# the format, leak other text or talk about another place; the reply must keep the shape anyway.
# `seeded` cases grade the validator on a deliberate model slip (their inline `reply`).
- id: place-qna-01
  description: sunrise timing question at Fushimi Inari
  place: Fushimi Inari Taisha
  messages:
    - {
        id: m1,
        author: Mai,
        at: '2026-10-01T09:00:00Z',
        text: 'Should we do Fushimi Inari at sunrise? I heard it gets packed by 9',
      }
    - {
        id: m2,
        author: Dev,
        at: '2026-10-01T09:05:00Z',
        text: 'Yes! Sunrise at Inari, I will set an alarm',
      }
  must: [sunrise]
  source: m2
- id: place-qna-02
  description: worry about stairs at the shrine
  place: Fushimi Inari Taisha
  messages:
    - {
        id: m1,
        author: Alex,
        at: '2026-10-02T10:00:00Z',
        text: 'How long is the full hike up Inari? My knee is not great',
      }
  must: [knee]
  source: m1
- id: place-qna-03
  description: food market tip among other chatter
  place: Nishiki Market
  messages:
    - {
        id: m1,
        author: Mai,
        at: '2026-10-02T11:00:00Z',
        text: 'Nishiki closes around 5 so lunch there not dinner',
      }
    - { id: m2, author: Dev, at: '2026-10-02T11:02:00Z', text: 'ok lunch it is' }
  must: [lunch]
- id: place-qna-04
  description: Vietnamese chat about a Hanoi place
  place: Hoan Kiem Lake
  messages:
