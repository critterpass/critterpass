- id: disruption-09
  description: seeded slip, an invented time on a row
  guide: tokek
  seeded: true
  expect_fallback: true
  input:
    facts: { flight: GA402, new_arrival: '13:20', travellers: 3 }
    headlineTemplate: GA402 lands at 13:20
    detailTemplate: Three of you land at 13:20.
    items:
      - {
          id: 'retime_item:dinner',
          kind: retime_item,
          facts: { title: Dinner, from: '19:30', to: '21:00' },
          template: 'Dinner 19:30 → 21:00',
        }
  reply:
    headline: GA402 lands at 13:20
    detail: Three of you land at 13:20.
    items: [{ id: 'retime_item:dinner', text: 'Dinner moves to 21:30' }]
- id: disruption-10
  description: seeded slip, a vendor claimed confirmed before replying
  guide: tokek
  seeded: true
  expect_fallback: true
  input:
    facts: { flight: GA402, new_arrival: '13:20', travellers: 3 }
    headlineTemplate: GA402 lands at 13:20
    detailTemplate: Three of you land at 13:20.
    items:
      - {
          id: 'contact_vendor:p1',
          kind: contact_vendor,
          facts: { vendor: Made, from: '12:10', to: '13:50' },
          template: 'Ask Made to pick you up at 13:50?',
        }
  reply:
    headline: GA402 lands at 13:20
    detail: Made confirmed the pickup.
    items: [{ id: 'contact_vendor:p1', text: 'Made confirmed 13:50' }]
