# Synthetic driver and guide messages for the provider-extract eval suite. Every message, name
# and phone number here is invented; numbers use 0000 blocks so they never belong to a real
# subscriber. Cases mirror how drivers answer in travel groups and WhatsApp: mixed languages,
# local price shorthand (650k, 650rb, 650.000), missing fields, two drivers in one message,
# agencies, relatives vouching, and prompt injection.
#
# `expected` is the only truth the suite scores against:
#   - null means the message does not say it; the route must return null, never a guess
#   - includes.* is yes | no | unknown
#   - price.unit is day | hours | trip | person | hour
#   - price.amount is always a figure the driver wrote; price.amount_max is the top of a range
#   - ask: true means the message has price words but no one figure to quote (prices that
#     conflict, or tiers nothing picks between): the card holds no price, only his words to ask
#   - overtime.amount is per hour; overtime.per_minutes is the stretch he priced it by, if not 60
#   - party is the crew size the message was shared into (picks between prices by group size)
#   - phone is E.164 after normalising local formats with the destination's country code
# `expected_many` lists every provider in a message that names several; `expected: none` means
# the message holds no provider and the route returns an empty result; `expected_after_crop`
# applies to the rendered image only (the crop hides a field the text version still has).
# `render` marks cases that the suite also renders to an image (WhatsApp bubble or Facebook
# comment) to test the screenshot path; `crop` cuts the image above that field to test the
# couldn't-read state.

- id: bali-made-basic
  lang: en
  destination: bali
  source: whatsapp
  render: whatsapp_bubble
  message: 'Hi, Made here, driver in Ubud 12 yrs. Avanza 6 pax. Full day 10 hrs Rp 650k incl petrol + parking. English OK. WA +62 812 0000 0101'
  expected:
    name: Made
    role: driver
    phone: '+6281200000101'
    languages: [en]
    vehicle: { model: Toyota Avanza, seats: 6 }
    price: { amount: 650000, currency: IDR, unit: day, hours: 10 }
    includes: { fuel: yes, parking: yes, tolls: unknown, entry: unknown }
    overtime: null
    areas: [Ubud]
    years: 12
    licence_shown: unknown

