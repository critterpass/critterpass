# Seeded replies that miss the printed total the way models slip on photographed receipts. Code
# corrects them only when one smallest correction makes the lines add up exactly, with every amount
# read from a printed line; otherwise the lines stay and the doubtful ones are named for review.
- description: seeded, a unit price listed beside its line total is left out
  currency_hint: VND
  lines:
    - { id: l0, text: Tra da }
    - { id: l1, text: '3,000' }
    - { id: l2, text: '5' }
    - { id: l3, text: '15,000' }
    - { id: l4, text: Com rang }
    - { id: l5, text: '120,000' }
    - { id: l6, text: 'Tong 135,000' }
  reply:
    merchant: null
    datetime: null
    currency: VND
    lines:
      - { line_id: l1, label: Tra da, qty: null, amount: '3,000', kind: item }
      - { line_id: l3, label: Tra da, qty: 5, amount: '15,000', kind: item }
      - { line_id: l5, label: Com rang, qty: null, amount: '120,000', kind: item }
    total: { line_id: l6, amount: '135,000' }
  expect:
    currency: VND
    total_minor: 135000
    matches_total: true
    lines:
      - { line_id: l3, kind: item, amount_minor: 15000 }
      - { line_id: l5, kind: item, amount_minor: 120000 }
    review: []
