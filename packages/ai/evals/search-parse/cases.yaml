# Plain-words search cases (40 English, 40 Vietnamese) over the trips in trips.yaml. `expect` lists
# only what a case grades: meal, categories (must include), attrs (must include), no_attrs, cheap
# (attribute cheap or price level 1), open_past ('none' = unset), near (from stay | poi | day_route,
# ref, min/max minutes; 'none' = unset), exclude (exact day refs), reason, text (words the
# left-over text must hold, accents folded), inert (no filter at all but the text). `seeded` cases
# grade the validator on an inline model slip it must reject (the result falls back to a name search).
- {
    id: sp-01,
    trip: bali,
    q: 'quiet dinner near the villa, open late',
    expect:
      {
        meal: dinner,
        attrs: [quiet],
        near: { from: stay, max: 20 },
        open_past: '22:00',
        exclude: [day3],
        reason: day_has_meal,
      },
  }
- {
    id: sp-02,
    trip: bali,
    q: 'somewhere for dinner with a view, not Wednesday because dinner is booked',
    expect: { meal: dinner, attrs: [view], exclude: [day3], reason: day_has_meal },
  }
