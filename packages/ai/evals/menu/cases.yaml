- id: menu-11
  description: Seeded slips, a dish on a line the phone never sent, a member nobody named, prices in the prose
  seeded: true
  locale: en
  currency: VND
  lines:
    - 'l1: Mì Quảng gà 45.000'
    - 'l2: Bún chả cá 40.000đ'
  crew:
    - { first_name: Alex, flags: [no_peanuts] }
  reply:
    language: vi
    suggestion: 'Two bowls come to 85.000đ, a good deal.'
    items:
      - ocr_line_id: l1
        translation: 'Quảng noodles with chicken (45k)'
        description: 'Turmeric noodles with chicken and 2 rice crackers.'
        spice: 1
        flags:
          - { member: Alex, verdict: clash, reason: peanuts on top }
          - { member: Jordan, verdict: ok, reason: no meat stock }
      - ocr_line_id: l9
        translation: 'Grilled pork skewers'
        description: 'A dish the menu does not list.'
        spice: 0
        flags: []
  expect_items: [l1]
  dishes: [l1]
  clash:
    - { line: l1, member: Alex }
  language: vi
  prices: { l1: 45000 }
