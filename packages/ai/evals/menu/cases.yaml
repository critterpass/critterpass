# Menu cases: the lines a phone read (`id: text`, top to bottom; a `p` line is a price column
# entry on the row of the dish above it in this file) and the crew whose flags may be checked.
# `dishes` must come back as items and `not_dishes` must not; `clash` and `ok` are the verdicts a
# member must get on a line; `language` is the menu's own; `prices` are the amounts (minor units)
# the code must read from the menu's print. `seeded` cases grade the validator on a deliberate
# model slip (their inline `reply`): `expect_items` are the only lines kept.
- id: menu-01
  description: Đà Nẵng noodle shop, peanuts on the mì Quảng, a vegetarian and a peanut allergy
  locale: en
  currency: VND
  lines:
    - 'l0: QUÁN MÌ QUẢNG BÀ MUA'
    - 'l1: Mì Quảng gà 45.000'
    - 'l2: Mì Quảng tôm thịt 50.000'
    - 'l3: Gỏi cuốn chay 30.000'
    - 'l4: Đậu hũ sốt đậu phộng 35.000'
  crew:
    - { first_name: Alex, flags: [no_peanuts] }
    - { first_name: Jordan, flags: [vegetarian] }
  dishes: [l1, l2, l3, l4]
  not_dishes: [l0]
  clash:
    - { line: l1, member: Jordan }
    - { line: l2, member: Jordan }
    - { line: l4, member: Alex }
  ok:
    - { line: l3, member: Jordan }
  language: vi
  prices: { l1: 45000, l2: 50000, l3: 30000, l4: 35000 }

