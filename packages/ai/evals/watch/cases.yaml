# Watch list cases: rows as the watcher scores them (ids `<row>:title` / `<row>:detail`).
- id: watch-01
  description: rough seas put the boat on plan B
  guide: tokek
  input:
    facts: {}
    headlineTemplate: "Friday's boat looks rough."
    detailTemplate: ''
    items:
      - {
          id: 'boat:title',
          kind: plan_b,
          facts: { title: Nusa Penida boat, waves_m: '2.5', wind_kmh: 35 },
          template: 'Nusa Penida boat · waves 2.5 m',
        }
      - {
          id: 'boat:detail',
          kind: plan_b,
          facts: { title: Nusa Penida boat, waves_m: '2.5', wind_kmh: 35 },
          template: 'Forecast shows waves 2.5 m, wind 35 km/h. The harbour might close.',
        }
  must: ['2.5']
  forbid: [closed, cancelled]
