- description: Recommends a close spa from curation, without inventing ratings (VI)
  vars:
    route: guide.chat
    persona: chava
    locale: vi
    now: '2026-10-02T20:30:00+07:00'
    trip_context: *trip
    history:
      - role: user
        content: massage gần ks avatar
      - role: guide
        content: Herbal Spa cách khách sạn chừng 160 m, còn mở tối nay; Sen Spa xa hơn, chừng 4,1 km.
    question: chỗ nào gần mà đánh giá cao
    expect_tools: [places_search]
    tool_results:
      - tool: places_search
        output:
          - poi_id: 0199a000-0000-7000-8000-0000000000cb
            name: Mộc Spa Mỹ Khê
            category: health
            distance_m: 650
            open_now: true
            price_level: 2
            tags: [massage, spa]
            distance_from: Avatar Danang Hotel
            match: exact
            recommended: true
            why_go: Hot-stone and herbal massages by the beach, run by a family from Huế.
          - poi_id: 0199a000-0000-7000-8000-0000000000c8
            name: Sen Spa
            category: health
            distance_m: 4100
            open_now: true
            price_level: 3
            tags: [massage, spa]
            distance_from: Avatar Danang Hotel
            match: exact
            recommended: true
            why_go: Vietnamese herbal massage in a quiet garden.
    replay:
      fixtures: [guide-eval-trip-rated-vi-1, guide-eval-trip-rated-vi-2]
  assert:
    - type: javascript
      value: file://../graders.ts:never_asks_for_trip
    - type: javascript
      value: file://../graders.ts:calls_expected_tools
    - type: javascript
      value: file://../graders.ts:replies_in_locale
    - type: javascript
      value: file://../graders.ts:no_invented_rating
    - type: javascript
      value: file://../graders.ts:grounded
    - type: llm-rubric
      value: Recommends Mộc Spa Mỹ Khê (and possibly Sen Spa) with its distance from the hotel, and makes clear it is the guide's own recommendation rather than a rating; invents no star rating, score or review count.

