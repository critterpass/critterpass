# The guide inside a trip, from a traveller's first real Đà Nẵng trip: it works in the thread's trip
# and never asks for a trip code; reads the plan for "what's next" and a day; adds a place to a day as
# a proposal to confirm; finds the hotel however it was typed and measures from it; and, with no
# ratings in the data, recommends from curation without inventing a score. Vietnamese and English.
- description: Adds the café from the last answer to day 1 as a proposal, without asking for a trip code (VI)
  vars:
    route: guide.chat
    persona: chava
    locale: vi
    now: '2026-10-02T10:20:00+07:00'
    trip_context: &trip |
      destination_name: Đà Nẵng
      destination_country: VN
      start_date: 2026-10-02
      end_date: 2026-10-04
      tz: Asia/Ho_Chi_Minh
      local_currency: VND
      status: active
      phase: in_trip
      is_solo: false
      guide_slug: chava
      participants (2):
      - Khánh (organiser, rsvp in)
      - Linh (member, rsvp in)
    history:
      - role: user
        content: cà phê gần sân bay đà nẵng
      - role: guide
        content: Gần sân bay có Cộng Cà Phê Sân Bay, cách ga quốc nội chừng 450 m, cà phê dừa ngon lắm.
    question: thêm vào lịch ngày 1
    expect_tools: [plan_read, propose_plan_changes]
    tool_results: &add_tools
      - tool: places_search
        output:
          - poi_id: 0199a000-0000-7000-8000-0000000000c1
            name: Cộng Cà Phê Sân Bay
            category: food
            distance_m: null
            open_now: true
            price_level: 1
            tags: [coffee]
            distance_from: null
            match: exact
            recommended: false
            why_go: null
      - tool: plan_read
        output: &plan
          version: 0199a000-0000-7000-8000-0000000000a1
          days:
            - day_no: 1
              date: '2026-10-02'
              items:
                - item_id: 0199a000-0000-7000-8000-0000000000b1
                  title: Bãi biển Mỹ Khê
                  poi_id: 0199a000-0000-7000-8000-0000000000c2
                  starts_at: '2026-10-02T16:00:00+07:00'
                  ends_at: '2026-10-02T18:00:00+07:00'
                  category: beach
            - day_no: 2
              date: '2026-10-03'
              items:
                - item_id: 0199a000-0000-7000-8000-0000000000b2
                  title: Bà Nà Hills
                  poi_id: 0199a000-0000-7000-8000-0000000000c3
                  starts_at: '2026-10-03T08:30:00+07:00'
                  ends_at: '2026-10-03T13:00:00+07:00'
                  category: nature
                - item_id: 0199a000-0000-7000-8000-0000000000b3
                  title: Chợ Hàn
                  poi_id: 0199a000-0000-7000-8000-0000000000c4
                  starts_at: '2026-10-03T15:00:00+07:00'
                  ends_at: '2026-10-03T16:30:00+07:00'
                  category: market
                - item_id: 0199a000-0000-7000-8000-0000000000b4
                  title: Cầu Rồng
                  poi_id: 0199a000-0000-7000-8000-0000000000c5
                  starts_at: '2026-10-03T21:00:00+07:00'
                  ends_at: '2026-10-03T21:30:00+07:00'
                  category: other
            - day_no: 3
              date: '2026-10-04'
              items: []
      - tool: propose_plan_changes
        output:
          changeset_id: 0199a000-0000-7000-8000-0000000000d1
          violations: []
          cost_delta: null
    replay:
      fixtures: [guide-eval-trip-add-vi-1, guide-eval-trip-add-vi-2, guide-eval-trip-add-vi-3]
  assert: &add_asserts
    - type: javascript
      value: file://../graders.ts:never_asks_for_trip
    - type: javascript
      value: file://../graders.ts:no_trip_ids_from_model
    - type: javascript
      value: file://../graders.ts:calls_expected_tools
    - type: javascript
      value: file://../graders.ts:replies_in_locale
    - type: not-icontains-any
      value: ['đã thêm', 'đã được thêm', "i've added", 'i have added', 'is now on day']
    - type: llm-rubric
      value: Says it has proposed Cộng Cà Phê Sân Bay for day 1 for the traveller to confirm, briefly; never asks for a trip code or says the plan cannot be opened.

