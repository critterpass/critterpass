    trip_context: *trip
    question: is the Sheraton Grand Danang close to us?
    expect_tools: [places_search]
    tool_results:
      - tool: places_search
        output:
          - poi_id: 0199a000-0000-7000-8000-0000000000ca
            name: Four Points by Sheraton Danang
            category: stay
            distance_m: null
            open_now: null
            price_level: 3
            tags: [hotel]
            distance_from: null
            match: close
            recommended: false
            why_go: null
    replay:
      fixtures: [guide-eval-trip-notfound-en-1, guide-eval-trip-notfound-en-2]
  assert:
    - type: javascript
      value: file://../graders.ts:never_asks_for_trip
    - type: javascript
      value: file://../graders.ts:calls_expected_tools
    - type: javascript
      value: file://../graders.ts:replies_in_locale
