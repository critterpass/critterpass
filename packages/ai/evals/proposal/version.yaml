- id: proposal-suggestion-01
  kind: suggestion
  description: a resend and an anonymous offer, worded without tying anyone to a reason
  forbid: [opened, watched, worried]
  input:
    guide: pon
    crewNames: [Maya, Dev, Rin, Alex, Jordan]
    cards:
      - id: 'resend:dev'
        kind: resend
        name: Dev
        facts: { name: Dev, time: '21:00' }
        template: Resend to Dev at 21:00 their time?
      - id: 'offer:cost'
        kind: offer
        name: null
        facts: { topic: cost }
        template: Someone asked about cost. Offer everyone the cheaper room option?
