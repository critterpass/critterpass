# Proposal cases. `version`: one member's personal version from the facts guide_reader and the
# cost engine give it; `forbid` lists what must never appear (other members' names, another
# member's budget or private reason, a stay "held"). `objection`: the private reply over the
# options code decided. `suggestion`: the organiser's cards. `intent`: a free-text reply read as
# in / maybe / out / question. `seeded_reply` cases grade a validator on a deliberate slip.
- id: proposal-version-01
  kind: version
  description: Rin's Kyoto version leads with her must-do and names nobody else
  forbid: [Maya, Dev, Alex, Jordan, held, hold the, '2,400', afford]
  expect_lead: 0199a0f2-0000-7000-8000-00000000f001
  input:
    guide: pon
    recipientFirstName: Rin
    destination: Kyoto
    dates: 2026-11-12 to 2026-11-18
    tasteTags: [temples, food, early_riser]
    share: '$1,310'
    savings: [{ id: 'skip:nara', label: 'Skip the Nara day', amount: '$64' }]
    otherNames: [Maya, Dev, Alex, Jordan]
    items:
      - {
          id: 0199a0f2-0000-7000-8000-00000000f001,
          title: Fushimi Inari at dawn,
          day: 2,
          category: sight,
          must_do: true,
        }
      - {
          id: 0199a0f2-0000-7000-8000-00000000f002,
          title: Nishiki Market,
          day: 1,
          category: food,
