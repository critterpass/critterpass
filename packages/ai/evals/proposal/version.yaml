- id: proposal-objection-01
  kind: objection
  description: cost, worded kindly, every option kept, no organiser name
  forbid: [Maya, held, promise]
  input:
    guide: pon
    reason: cost
    organiser: Maya
    text: Money is tight after my move.
    options:
      - { id: 'skip:nara', kind: skip_item, label: Skip the Nara day, saves: '$64' }
      - { id: 'skip:kayak', kind: skip_item, label: Skip the kayak trip, saves: '$120' }
      - { id: ask_crew, kind: ask_crew, label: Ask the crew without saying who asked, saves: null }
      - { id: follow_up, kind: follow_up, label: 'Still thinking, ask me later', saves: null }
