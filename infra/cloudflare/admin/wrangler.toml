# cp-admin: the ops console Worker. Serves apps/admin's Vite build as static assets and proxies
# /v1/admin/* same-origin to the api (apps/admin/worker/index.ts). Every request runs the Worker
# first so assets get the console's security headers too. No secrets live here: the api holds all
# credentials; Cloudflare Access (Zero Trust) is configured on the host in the dashboard.
#
# Build and deploy (from the repo root):
#   pnpm --filter @cp/admin build
#   pnpm --filter @cp/admin exec wrangler deploy -c ../../infra/cloudflare/admin/wrangler.toml --env staging

name = "cp-admin"
main = "../../../apps/admin/worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "../../../apps/admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Local `wrangler dev` against a local api.
[vars]
API_ORIGIN = "http://localhost:8787"

[env.staging]
routes = [{ pattern = "admin.staging.critterpass.app", custom_domain = true }]

[env.staging.vars]
API_ORIGIN = "https://api-staging-de92.up.railway.app"

[env.production]
# Enabled at launch together with the Access application for admin.critterpass.app:
# routes = [{ pattern = "admin.critterpass.app", custom_domain = true }]

[env.production.vars]
API_ORIGIN = "https://api.critterpass.app"
