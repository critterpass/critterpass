# P2: email during working hours; no page.
group: p2
interval: 5m
rules:
  - uid: cp-p2-error-rate
    title: API error rate over 2 %
    severity: P2
    for: 10m
    expr: >-
      sum(rate(http_server_request_duration_seconds_count{service_name="api",http_response_status_code=~"5.."}[10m]))
      / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="api"}[10m])), 1)
    op: gt
    threshold: 0.02
    summary: More than 2 % of api requests fail with a server error.
  - uid: cp-p2-command-p95
    title: Command p95 over budget for 30 min
    severity: P2
    for: 30m
    expr: histogram_quantile(0.95, sum by (le) (rate(cp_cmd_duration_ms_milliseconds_bucket[10m])))
    op: gt
    threshold: 300
    summary: Command round trip p95 is above the 300 ms budget.
  - uid: cp-p2-ai-cost-per-day
    title: AI spend per day over threshold
    severity: P2
    for: 15m
    expr: sum(increase(cp_llm_cost_micros_total[1d])) / 1e6
    op: gt
    threshold: 50
    summary: Model spend over the last 24 h is above 50 USD.
  - uid: cp-p2-push-failures
    title: Push failures over 5 %
    severity: P2
    for: 30m
    expr: >-
      sum(rate(cp_push_total{outcome="failed"}[30m])) / clamp_min(sum(rate(cp_push_total[30m])), 0.001)
    op: gt
    threshold: 0.05
    summary: More than 5 % of push sends fail.
  - uid: cp-p2-db-connections
    title: Database connections over 80 % of max_connections
    severity: P2
    runbook: db-connections
    for: 10m
    expr: >-
      max(sum by (env) (cp_pg_connections_count{role!="system"})
      / on (env) max by (env) (pg_settings_max_connections))
    op: gt
    threshold: 0.8
    summary: >-
      Client connections are above 80 % of max_connections; new connections soon fail with
      "remaining connection slots are reserved".
