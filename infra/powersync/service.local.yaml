# Local PowerSync Service (Open Edition). Staging/production config lives in Railway variables.
replication:
  connections:
    - type: postgresql
      uri: postgresql://app_owner:app_owner@postgres:5432/critterpass
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://powersync_storage:powersync_storage@powersync-storage:5432/powersync_storage
  sslmode: disable

port: 8080

# Sync streams are generated from infra/powersync/streams/*.yaml by the sync phase; none exist yet.
sync_config:
  content: |
    config:
      edition: 3
    streams: {}

client_auth:
  jwks_uri: http://host.docker.internal:8787/api/auth/jwks
  audience: ['sync']

healthcheck:
  probes:
    use_http: true

telemetry:
  disable_telemetry_sharing: true
