# Generated by infra/powersync/build-config.ts from infra/powersync/streams/*.yaml.
# Do not edit by hand: change the area file and run `pnpm tsx infra/powersync/build-config.ts`.
config:
  edition: 3
with:
  my_crews: SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active'
streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM agent_jobs WHERE user_id = auth.user_id()
      - SELECT * FROM users WHERE id = auth.user_id()
      - SELECT *, user_id AS id FROM user_settings WHERE user_id = auth.user_id()
      - SELECT * FROM consents WHERE user_id = auth.user_id()
      - SELECT * FROM account_deletions WHERE user_id = auth.user_id()
      - SELECT *, op_id AS id FROM cmd_results WHERE uid = auth.user_id()
      - SELECT *, user_id AS id FROM user_entitlements WHERE user_id = auth.user_id()
      - SELECT * FROM usage_counters WHERE subject_kind = 'user' AND subject_id = auth.user_id()
      - SELECT * FROM devices WHERE user_id = auth.user_id()
      - SELECT * FROM notifications WHERE user_id = auth.user_id()
      - SELECT *, user_id AS id FROM notification_prefs WHERE user_id = auth.user_id()
      - SELECT * FROM ping_ledger WHERE user_id = auth.user_id()
      - SELECT * FROM roundups WHERE user_id = auth.user_id()
      - SELECT * FROM inbox_items WHERE user_id = auth.user_id()
      - SELECT * FROM scheduled_deliveries WHERE user_id = auth.user_id()
  trip:
    queries:
      - |-
        SELECT * FROM guide_offers
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM guide_offer_claims
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN my_crews
      - |-
        SELECT * FROM trip_participants
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND visibility = 'crew'
      - |-
        SELECT * FROM plan_days
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'crew')
      - |-
        SELECT * FROM plan_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'crew')
      - |-
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'crew')
      - |-
        SELECT * FROM guide_actions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM activity_events
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT *, trip_id AS id FROM trip_entitlements
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM usage_counters
        WHERE subject_kind = 'trip'
          AND subject_id = subscription.parameter('trip_id')
          AND subject_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
  trip_draft:
    with:
      organised_trips: SELECT trip_id FROM trip_participants WHERE user_id = auth.user_id() AND role = 'organiser'
    queries:
      - |-
        SELECT * FROM agent_jobs
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND visibility = 'organiser'
      - |-
        SELECT * FROM plan_days
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'organiser')
      - |-
        SELECT * FROM plan_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'organiser')
      - |-
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'organiser')
  crews:
    auto_subscribe: true
    queries:
      - SELECT * FROM crews WHERE id IN my_crews
      - SELECT * FROM crew_members WHERE crew_id IN my_crews
      - SELECT * FROM trips WHERE crew_id IN my_crews
  crew_people:
    auto_subscribe: true
    query: |-
      SELECT * FROM users
      WHERE id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)
  crew_invites:
    auto_subscribe: true
    queries:
      - SELECT * FROM join_codes WHERE crew_id IN my_crews
      - SELECT * FROM join_codes WHERE created_by = auth.user_id()
  catalog:
    auto_subscribe: true
    queries:
      - SELECT * FROM guides
      - SELECT * FROM destinations
      - SELECT *, key AS id FROM client_config
      - SELECT *, key AS id FROM products
      - SELECT *, key AS id FROM perks
  fx:
    auto_subscribe: true
    queries:
      - |-
        SELECT * FROM fx_snapshots
        WHERE quote IN (SELECT home_currency FROM users WHERE id = auth.user_id())
      - |-
        SELECT * FROM fx_snapshots
        WHERE quote IN (SELECT settlement_currency FROM crews WHERE id IN my_crews)
      - |-
        SELECT * FROM fx_snapshots
        WHERE quote IN (SELECT local_currency FROM trips WHERE crew_id IN my_crews)
  trip_pack:
    with:
      trip_destination: |-
        SELECT destination_id FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN (SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active')
    queries:
      - |-
        SELECT id, destination_id, name, name_local, category, lat, lng, address, hours,
          hours_verified_at, price_level, editorial, tags, status, curation, visit_radius_m, timezone,
          last_live_check_at, created_at, updated_at
        FROM pois
        WHERE destination_id IN trip_destination
          AND status != 'hidden'
          AND merged_into_id IS NULL
      - SELECT * FROM map_regions WHERE destination_id IN trip_destination
  explore:
    accept_potentially_dangerous_queries: true
    query: |-
      SELECT id, destination_id, name, name_local, category, lat, lng, address, hours,
        hours_verified_at, price_level, editorial, tags, status, curation, visit_radius_m, timezone,
        last_live_check_at, created_at, updated_at
      FROM pois
      WHERE destination_id = subscription.parameter('destination_id')
        AND status != 'hidden'
        AND merged_into_id IS NULL
