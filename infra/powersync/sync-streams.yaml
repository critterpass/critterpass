# Generated by infra/powersync/build-config.ts from infra/powersync/streams/*.yaml.
# Do not edit by hand: change the area file and run `pnpm tsx infra/powersync/build-config.ts`.
config:
  edition: 3
with:
  my_crews: SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active'
streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM agent_jobs WHERE user_id = auth.user_id()
      - SELECT * FROM users WHERE id = auth.user_id()
      - SELECT *, user_id AS id FROM user_settings WHERE user_id = auth.user_id()
      - SELECT * FROM consents WHERE user_id = auth.user_id()
      - SELECT * FROM account_deletions WHERE user_id = auth.user_id()
      - SELECT *, op_id AS id FROM cmd_results WHERE uid = auth.user_id()
      - |-
        SELECT * FROM trip_participants
        WHERE user_id = auth.user_id() AND rsvp = 'waitlisted'
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM seat_waitlist_offers
        WHERE user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - SELECT * FROM invite_opens WHERE inviter_id = auth.user_id()
      - |-
        SELECT id, referrer_id, referee_id, code, invite_id, via, status, void_reason, qualified_at,
               reward_kind, reward_ref, created_at, updated_at
        FROM referrals
        WHERE referrer_id = auth.user_id()
      - |-
        SELECT id, referrer_id, referee_id, code, invite_id, via, status, void_reason, qualified_at,
               reward_kind, reward_ref, created_at, updated_at
        FROM referrals
        WHERE referee_id = auth.user_id()
      - SELECT *, user_id AS id FROM user_entitlements WHERE user_id = auth.user_id()
      - SELECT * FROM usage_counters WHERE subject_kind = 'user' AND subject_id = auth.user_id()
      - SELECT * FROM saved_items WHERE user_id = auth.user_id()
      - SELECT * FROM reminders WHERE user_id = auth.user_id()
      - SELECT * FROM nudges WHERE sender_id = auth.user_id()
      - SELECT * FROM nudges WHERE target_id = auth.user_id()
      - |-
        SELECT * FROM trip_participants
        WHERE user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - SELECT * FROM devices WHERE user_id = auth.user_id()
      - SELECT * FROM notifications WHERE user_id = auth.user_id()
      - SELECT *, user_id AS id FROM notification_prefs WHERE user_id = auth.user_id()
      - SELECT * FROM ping_ledger WHERE user_id = auth.user_id()
      - SELECT * FROM roundups WHERE user_id = auth.user_id()
      - SELECT * FROM inbox_items WHERE user_id = auth.user_id()
      - SELECT * FROM scheduled_deliveries WHERE user_id = auth.user_id()
      - SELECT * FROM passes WHERE user_id = auth.user_id()
      - SELECT * FROM stamps WHERE user_id = auth.user_id()
      - SELECT * FROM taste_profiles WHERE user_id = auth.user_id()
      - SELECT * FROM avatars WHERE user_id = auth.user_id()
  trip:
    queries:
      - |-
        SELECT * FROM guide_offers
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM guide_offer_claims
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN my_crews
      - |-
        SELECT * FROM trip_participants
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND visibility = 'crew'
      - |-
        SELECT * FROM plan_days
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'crew')
      - |-
        SELECT * FROM plan_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'crew')
      - |-
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'crew')
      - |-
        SELECT * FROM guide_actions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM activity_events
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM cost_components
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM trip_share_totals
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM share_calcs
        WHERE trip_id = subscription.parameter('trip_id')
          AND user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM seat_waitlist_offers
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT *, trip_id AS id FROM trip_entitlements
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM usage_counters
        WHERE subject_kind = 'trip'
          AND subject_id = subscription.parameter('trip_id')
          AND subject_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM meetups
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND trip_id IN (SELECT trip_id FROM trip_entitlements WHERE boost_active = true)
      - |-
        SELECT * FROM location_shares
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM price_quotes
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
  trip_draft:
    with:
      organised_trips: SELECT trip_id FROM trip_participants WHERE user_id = auth.user_id() AND role = 'organiser'
    queries:
      - |-
        SELECT * FROM agent_jobs
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |-
        SELECT * FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND visibility = 'organiser'
      - |-
        SELECT * FROM plan_days
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'organiser')
      - |-
        SELECT * FROM plan_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'organiser')
      - |-
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE visibility = 'organiser')
  crew_chat:
    auto_subscribe: true
    with:
      kept_chats: |-
        SELECT crew_id FROM crew_members
        WHERE user_id = auth.user_id() AND status = 'former' AND keep_in_chat = true
    queries:
      - SELECT * FROM messages WHERE crew_id IN my_crews AND hidden_at IS NULL
      - SELECT * FROM messages WHERE crew_id IN kept_chats AND hidden_at IS NULL
      - SELECT * FROM message_reactions WHERE crew_id IN my_crews
      - SELECT * FROM message_reactions WHERE crew_id IN kept_chats
  catalog:
    auto_subscribe: true
    queries:
      - SELECT * FROM critter_sets
      - SELECT * FROM critters
      - SELECT * FROM critter_forms
      - SELECT * FROM legendary_windows
      - SELECT * FROM phrase_cards
      - SELECT * FROM emergency_numbers
      - SELECT * FROM guides
      - SELECT * FROM destinations
      - SELECT *, key AS id FROM client_config
      - SELECT * FROM destination_cost_indices WHERE reviewed_at IS NOT NULL
      - SELECT *, key AS id FROM products
      - SELECT *, key AS id FROM perks
      - SELECT * FROM season_months WHERE reviewed_at IS NOT NULL
      - SELECT * FROM season_events WHERE reviewed_at IS NOT NULL
  trip_pack:
    with:
      trip_destination: |-
        SELECT destination_id FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN (SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active')
    queries:
      - SELECT * FROM spawn_rules WHERE destination_id IN trip_destination
      - SELECT * FROM facilities WHERE destination_id IN trip_destination
      - |-
        SELECT id, destination_id, name, name_local, category, lat, lng, address, hours,
          hours_verified_at, price_level, editorial, tags, status, curation, visit_radius_m, timezone,
          last_live_check_at, created_at, updated_at
        FROM pois
        WHERE destination_id IN trip_destination
          AND status != 'hidden'
          AND merged_into_id IS NULL
      - SELECT * FROM map_regions WHERE destination_id IN trip_destination
      - SELECT * FROM weather_snapshots WHERE destination_id IN trip_destination
      - SELECT * FROM hazard_alerts WHERE destination_id IN trip_destination
      - |-
        SELECT * FROM crowd_forecasts
        WHERE poi_id IN (SELECT id FROM pois WHERE destination_id IN trip_destination)
  help:
    accept_potentially_dangerous_queries: true
    query: |-
      SELECT id, slug, locale, category, title, summary, body_md, release_id, created_at, updated_at
      FROM help_articles
      WHERE locale = subscription.parameter('locale')
  crews:
    auto_subscribe: true
    queries:
      - SELECT * FROM crews WHERE id IN my_crews
      - SELECT * FROM crew_members WHERE crew_id IN my_crews
      - SELECT * FROM trips WHERE crew_id IN my_crews
      - SELECT * FROM crew_contact_cards WHERE crew_id IN my_crews
      - |-
        SELECT * FROM crews
        WHERE id IN (SELECT crew_id FROM invites
                     WHERE invitee_user_id = auth.user_id() AND status = 'pending')
      - |-
        SELECT * FROM crews
        WHERE id IN (SELECT crew_id FROM invites
                     WHERE invitee_user_id = auth.user_id() AND status = 'later')
      - SELECT * FROM home_tips WHERE crew_id IN my_crews AND status = 'active'
  crew_people:
    auto_subscribe: true
    queries:
      - |-
        SELECT * FROM users
        WHERE id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)
      - |-
        SELECT * FROM passes
        WHERE user_id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)
      - |-
        SELECT * FROM stamps
        WHERE user_id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)
      - |-
        SELECT * FROM taste_profiles
        WHERE visibility = 'crew'
          AND user_id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)
      - |-
        SELECT * FROM avatars
        WHERE user_id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)
  crew_invites:
    auto_subscribe: true
    queries:
      - SELECT * FROM join_codes WHERE crew_id IN my_crews
      - SELECT * FROM join_codes WHERE created_by = auth.user_id()
      - |-
        SELECT id, crew_id, trip_id, inviter_id, join_code_id, kind, invitee_user_id, channel,
               status, waitlist_position, expires_at, claimed_by, claimed_at, created_at, updated_at
        FROM invites
        WHERE crew_id IN my_crews
      - |-
        SELECT id, crew_id, trip_id, inviter_id, join_code_id, kind, invitee_user_id, channel,
               status, waitlist_position, expires_at, claimed_by, claimed_at, created_at, updated_at
        FROM invites
        WHERE invitee_user_id = auth.user_id()
  fx:
    auto_subscribe: true
    queries:
      - |-
        SELECT * FROM fx_snapshots
        WHERE quote IN (SELECT home_currency FROM users WHERE id = auth.user_id())
      - |-
        SELECT * FROM fx_snapshots
        WHERE quote IN (SELECT settlement_currency FROM crews WHERE id IN my_crews)
      - |-
        SELECT * FROM fx_snapshots
        WHERE quote IN (SELECT local_currency FROM trips WHERE crew_id IN my_crews)
  explore:
    accept_potentially_dangerous_queries: true
    query: |-
      SELECT id, destination_id, name, name_local, category, lat, lng, address, hours,
        hours_verified_at, price_level, editorial, tags, status, curation, visit_radius_m, timezone,
        last_live_check_at, created_at, updated_at
      FROM pois
      WHERE destination_id = subscription.parameter('destination_id')
        AND status != 'hidden'
        AND merged_into_id IS NULL
