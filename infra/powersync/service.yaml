# PowerSync Service (Open Edition) config shared by every environment.
# Environment-specific values come from PS_* variables (docker compose locally, Railway variables in the cloud).
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: !env PS_DATA_SOURCE_SSLMODE

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: !env PS_STORAGE_SSLMODE

port: !env PS_PORT::number

# Generated from infra/powersync/streams/*.yaml by build-config.ts; resolved next to this file.
sync_config:
  path: sync-streams.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience: ['sync']

api:
  # Bearer tokens for the admin API (diagnostics, used by the health smoke and operators).
  tokens:
    - !env PS_ADMIN_API_TOKEN
  parameters:
    # Per api instance; scale powersync-api out rather than raising this (system-architecture §2).
    max_concurrent_connections: 200

healthcheck:
  probes:
    use_http: true

telemetry:
  disable_telemetry_sharing: true
  # Scraped by the Alloy collector over the private network (infra/monitoring/alloy).
  prometheus_port: 9464
