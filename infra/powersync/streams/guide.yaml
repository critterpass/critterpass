# Guide chat streams (docs/data-model-sync-and-privacy.md §4). Filters mirror each table's RLS
# SELECT policy: private threads, their messages, queued questions and custom phrase cards reach
# their owner only; a trip's group thread rides the trip stream to its crew. Stream filters cannot
# compare against now(), so the 90-day message window is kept by retention, not by the filter.
# guide_crew_turns never syncs.

streams:
  guide_chat:
    auto_subscribe: true
    queries:
      - SELECT * FROM guide_threads WHERE user_id = auth.user_id() AND mode = 'private'
      - |
        SELECT * FROM guide_messages
        WHERE thread_id IN (
          SELECT id FROM guide_threads WHERE user_id = auth.user_id() AND mode = 'private'
        )
      - SELECT * FROM queued_guide_questions WHERE user_id = auth.user_id()
      - SELECT * FROM custom_phrase_cards WHERE user_id = auth.user_id()

  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM phrase_progress WHERE user_id = auth.user_id()

  trip:
    queries:
      - |
        SELECT * FROM guide_threads
        WHERE trip_id = subscription.parameter('trip_id')
          AND mode = 'group'
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM guide_messages
        WHERE trip_id = subscription.parameter('trip_id')
          AND thread_id IN (SELECT id FROM guide_threads WHERE mode = 'group')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
