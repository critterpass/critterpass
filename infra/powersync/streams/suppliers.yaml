# Supplier streams (docs/data-model-sync-and-privacy.md §4). A trip's supplier orders, their items
# its providers, Grab quotes and logged rides sync with the trip to every active member of its crew (app.is_trip_member).
# Explicit columns: status, amounts and hold deadlines only, never a supplier reference, a payment
# session or a provider's sealed contact. Affiliate clicks and conversions are never published.

streams:
  trip:
    queries:
      - |
        SELECT id, trip_id, buyer_id, supplier, stable_id, status, pricing_status,
               availability_status, hold_valid_until, total_minor, currency, voucher_booking_id,
               version, created_at, updated_at
        FROM supplier_orders
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT id, order_id, trip_id, product_code, product_option_code, travel_date, start_time,
               traveller_count, price_minor, participant_ids, created_at
        FROM supplier_order_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT id, trip_id, kind, name, vehicle, policies, added_by, version, created_at, updated_at
        FROM providers
        WHERE trip_id = subscription.parameter('trip_id')
          AND deleted_at IS NULL
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT id, trip_id, user_id, provider, from_poi_id, to_poi_id, service_name, fare_low_minor,
               fare_high_minor, currency, eta_min, surge, fetched_at, created_at
        FROM ride_quotes
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT id, trip_id, leg_ref, provider, mode, provider_id, booking_id, quote_id, eta_text,
               status, price_minor, currency, expense_id, attendee_ids, logged_by, version,
               created_at, updated_at
        FROM rides
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
