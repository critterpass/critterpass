# Crew live map stream (docs/data-model-sync-and-privacy.md §4): the trip's meet-ups sync with the
# trip while it is boosted, so the pin and the panel render offline. The in-trip window is enforced
# by `meetups` RLS and the api; a stream filter cannot compare against now(). Positions and ETAs
# never sync: they travel over Centrifugo `trip_locations:` while the crew map is open.

streams:
  trip:
    queries:
      - |
        SELECT * FROM meetups
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND trip_id IN (SELECT trip_id FROM trip_entitlements WHERE trip_id = subscription.parameter('trip_id') AND boost_active = true)
