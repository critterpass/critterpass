# Planning and places streams (docs/data-model-sync-and-privacy.md §4). Ideas, stances, the plan
# check and stored legs of crew versions ride the trip stream to the trip's crew (app.is_trip_member,
# legs and issues also by app.is_version_visible); legs and check issues of an organiser-only
# version ride trip_draft to organisers. A person's hidden places and the private asks they made or received ride their own
# `me` stream: neither ever reaches the trip stream. Unsent change set drafts are filtered in
# core.yaml; a guide's draft reaches organisers here. Legs and issues ride only the versions phones
# read (core.yaml explains why a lookup over every version must not grow with each edit).
# `live_versions`, `replaced_versions`, `organised_trips` and `live_drafts` repeat core.yaml's CTEs
# verbatim (a stream named in several files shares its CTEs, which must be identical).

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM place_hides WHERE user_id = auth.user_id()
      - |
        SELECT * FROM member_asks
        WHERE asked_by = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM member_asks
        WHERE member_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)

  trip:
    with:
      live_versions: |
        SELECT id FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew' AND status != 'superseded'
      replaced_versions: |
        SELECT id FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew'
          AND id IN (SELECT parent_id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew' AND status != 'superseded')
    queries:
      # A removed idea leaves the stream, so it leaves every phone.
      - |
        SELECT * FROM trip_ideas
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND deleted_at IS NULL
      - |
        SELECT * FROM place_stances
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT *, trip_id AS id FROM plan_checks
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM plan_check_issues
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND (version_id IN live_versions OR version_id IN replaced_versions)
      - |
        SELECT * FROM plan_legs
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND (version_id IN live_versions OR version_id IN replaced_versions)

  trip_draft:
    with:
      organised_trips: |
        SELECT trip_id FROM trip_participants
        WHERE trip_id = subscription.parameter('trip_id') AND user_id = auth.user_id() AND role = 'organiser'
      live_drafts: |
        SELECT id FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'organiser' AND status != 'superseded'
    queries:
      - |
        SELECT * FROM plan_legs
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND version_id IN live_drafts
      # What the plan check found on the organiser's own draft, before the crew sees the plan.
      - |
        SELECT * FROM plan_check_issues
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND version_id IN live_drafts
      # A guide's unsent draft on the crew's plan (a swipe match waiting for approval). A draft whose
      # base was replaced can never apply (it would go stale), so only drafts on a live version ride.
      - |
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew' AND status != 'superseded')
          AND status = 'draft'
          AND author_kind = 'guide'
