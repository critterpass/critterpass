# Money streams (docs/data-model-sync-and-privacy.md §4): a trip's expenses, shares and edit
# history sync with the trip to every active member of its crew (app.is_trip_member); the crew's
# ledger, payments and crew-wide stickers ride crews, so balances cover every trip of the crew; a
# member's own receipt scans and stickers ride me. Payout methods are C3 and never published, so
# no stream can name them.

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM receipts WHERE user_id = auth.user_id()
      - SELECT * FROM stickers WHERE user_id = auth.user_id()

  crews:
    auto_subscribe: true
    queries:
      - SELECT * FROM ledger_entries WHERE crew_id IN my_crews
      - SELECT * FROM payments WHERE crew_id IN my_crews
      - SELECT * FROM stickers WHERE user_id IS NULL AND crew_id IN my_crews

  trip:
    queries:
      - |
        SELECT * FROM expenses
        WHERE trip_id = subscription.parameter('trip_id')
          AND deleted_at IS NULL
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM expense_shares
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM expense_edits
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
