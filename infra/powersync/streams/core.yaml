# Core Sync Streams over the identity, crew, trip and plan tables (docs/data-model-sync-and-privacy.md §4).
# Merged with every other streams/*.yaml by ../build-config.ts; a stream named in several files gets the
# union of their queries. Filters mirror the tables' RLS SELECT policies: PowerSync replicates with a
# role that bypasses RLS, so these WHERE clauses are the only thing standing between a row and a client.
# Every synced row needs an `id` column; tables keyed by something else alias their key to `id`.
# Every subquery is a PowerSync parameter query, and one connection may hold at most 1,000 parameter
# results across all its subscriptions; past that the whole sync request fails. So each subquery is
# bounded by the caller (auth.user_id()) or, in the trip streams, by the subscribed trip, never by a
# catalogue-wide filter such as `visibility = 'crew'` or `mode = 'group'` alone
# (packages/db/test/permissions/sync-streams-parameter-bounds.test.ts).

with:
  # Crews the caller is an active member of (app.is_crew_member). Ex-members ('left', 'removed',
  # 'former') fall out of every crew and trip stream the moment their row changes status.
  my_crews: SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active'

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM users WHERE id = auth.user_id()
      - SELECT *, user_id AS id FROM user_settings WHERE user_id = auth.user_id()
      - SELECT * FROM consents WHERE user_id = auth.user_id()
      - SELECT * FROM account_deletions WHERE user_id = auth.user_id()
      - SELECT *, op_id AS id FROM cmd_results WHERE uid = auth.user_id()

  crews:
    auto_subscribe: true
    queries:
      - SELECT * FROM crews WHERE id IN my_crews
      - SELECT * FROM crew_members WHERE crew_id IN my_crews
      - SELECT * FROM trips WHERE crew_id IN my_crews

  # Co-members' profiles (app.shares_crew): both sides of the shared crew must be active.
  crew_people:
    auto_subscribe: true
    query: |
      SELECT * FROM users
      WHERE id IN (SELECT user_id FROM crew_members WHERE status = 'active' AND crew_id IN my_crews)

  # Join codes, mirroring join_codes RLS: every code of the caller's crews, plus the caller's own
  # codes (referral codes have no crew).
  crew_invites:
    auto_subscribe: true
    queries:
      - SELECT * FROM join_codes WHERE crew_id IN my_crews
      - SELECT * FROM join_codes WHERE created_by = auth.user_id()

  # One trip, subscribed by the client with {trip_id}; membership is re-checked through the trip's crew
  # (app.is_trip_member). Plan rows follow app.is_version_visible: crew-visible versions only.
  trip:
    queries:
      - |
        SELECT * FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN my_crews
      - |
        SELECT * FROM trip_participants
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND visibility = 'crew'
      - |
        SELECT * FROM plan_days
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew')
      - |
        SELECT * FROM plan_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew')
      - |
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'crew')
      - |
        SELECT * FROM guide_actions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM activity_events
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)

  # Organiser-only drafts of one trip ({trip_id}): an organiser seat (app.is_trip_organiser) while still
  # an active crew member (app.is_trip_member), matching the itinerary_versions SELECT policy.
  trip_draft:
    with:
      organised_trips: |
        SELECT trip_id FROM trip_participants
        WHERE trip_id = subscription.parameter('trip_id') AND user_id = auth.user_id() AND role = 'organiser'
    queries:
      - |
        SELECT * FROM itinerary_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND visibility = 'organiser'
      - |
        SELECT * FROM plan_days
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'organiser')
      - |
        SELECT * FROM plan_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'organiser')
      - |
        SELECT * FROM change_sets
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
          AND base_version_id IN (SELECT id FROM itinerary_versions WHERE trip_id = subscription.parameter('trip_id') AND visibility = 'organiser')

  # Global reference data every signed-in client keeps offline.
  catalog:
    auto_subscribe: true
    queries:
      - SELECT * FROM guides
      - SELECT * FROM destinations
      - SELECT *, key AS id FROM client_config
