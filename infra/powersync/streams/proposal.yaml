# Proposal streams (docs/data-model-sync-and-privacy.md §4). Filters mirror each table's RLS SELECT
# policy: the crew sees a proposal, its reactions, hype and anonymous suggestions once it is sent;
# a recipient's own version rides trip_me; the organiser's trip_draft carries every version,
# the unsent proposal and the reply suggestions. Engagement, private threads and follow-ups never
# sync. Every subquery is bounded by the subscribed trip (core.yaml explains the parameter limit).

streams:
  trip:
    queries:
      - |
        SELECT * FROM proposals
        WHERE trip_id = subscription.parameter('trip_id')
          AND sent_at IS NOT NULL
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM proposal_reactions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM hype_aggregates
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM anonymous_suggestions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM trip_dropouts
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)

  trip_me:
    queries:
      - |
        SELECT * FROM proposal_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND recipient_id = auth.user_id()
          AND proposal_id IN (SELECT id FROM proposals WHERE trip_id = subscription.parameter('trip_id') AND sent_at IS NOT NULL)
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)

  trip_draft:
    with:
      organised_trips: |
        SELECT trip_id FROM trip_participants
        WHERE trip_id = subscription.parameter('trip_id') AND user_id = auth.user_id() AND role = 'organiser'
    queries:
      - |
        SELECT * FROM proposals
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM proposal_versions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM rsvp_suggestions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN organised_trips
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
