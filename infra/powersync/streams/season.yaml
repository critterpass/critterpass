# Travel-data streams (docs/data-model-sync-and-privacy.md §4): a trip's frozen price quotes sync
# with the trip; its weather snapshots and hazard alerts ride in its offline pack. Season months and
# events and crowd curves are read over HTTP (`/v1/destinations/{id}/season`,
# `/v1/places/{id}/crowd-forecasts`), never synced. `trip_destination` repeats places.yaml's CTE
# verbatim (a stream named in several files shares its CTEs, which must be identical).

streams:
  # Destination-level quotes (trip_id null) are served over HTTP, never synced.
  trip:
    queries:
      - |
        SELECT * FROM price_quotes
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)

  trip_pack:
    with:
      trip_destination: |
        SELECT destination_id FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN (SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active'
                          AND crew_id IN (SELECT crew_id FROM trips WHERE id = subscription.parameter('trip_id')))
    queries:
      - SELECT * FROM weather_snapshots WHERE destination_id IN trip_destination
      - SELECT * FROM hazard_alerts WHERE destination_id IN trip_destination
