# Crew chat stream (docs/data-model-sync-and-privacy.md §4): the latest 1,000 messages of every crew
# the caller is an active member of, plus crews they left while keeping the chat (read-only on the
# device). Filters mirror messages / message_reactions RLS (app.is_crew_chat_member);
# moderation-hidden messages never sync, and hiding one removes it from every device.
#
# The window is the row's own `in_sync_window` flag, kept by the message insert trigger: a stream
# filter cannot compare a row with another table's value, only with the row itself. A reaction
# carries its message's flag, so nothing syncs for a message outside the window; older messages are
# read from `GET /v1/crews/{crew_id}/chat/messages`.

streams:
  crew_chat:
    auto_subscribe: true
    with:
      kept_chats: |
        SELECT crew_id FROM crew_members
        WHERE user_id = auth.user_id() AND status = 'former' AND keep_in_chat = true
    queries:
      - SELECT * FROM messages WHERE crew_id IN my_crews AND hidden_at IS NULL AND in_sync_window = true
      - SELECT * FROM messages WHERE crew_id IN kept_chats AND hidden_at IS NULL AND in_sync_window = true
      - SELECT * FROM message_reactions WHERE crew_id IN my_crews AND in_sync_window = true
      - SELECT * FROM message_reactions WHERE crew_id IN kept_chats AND in_sync_window = true
