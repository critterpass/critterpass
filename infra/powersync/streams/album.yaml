# Album streams (docs/data-model-sync-and-privacy.md §4). Filters mirror each table's RLS SELECT
# policy: the album's photos (metadata only; bytes through media Worker HMAC URLs), picks, self
# tags, postcards and mailing progress ride the trip stream to the crew; a traveller's own album
# settings ride trip_me and their own exports ride me. Mailing addresses are never streamed.

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM album_exports WHERE user_id = auth.user_id()

  trip_me:
    queries:
      - |
        SELECT * FROM album_prefs
        WHERE trip_id = subscription.parameter('trip_id')
          AND user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)

  trip:
    queries:
      - |
        SELECT * FROM photos
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM album_picks
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM photo_people
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM postcards
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM postcard_mailings
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM album_curations
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
