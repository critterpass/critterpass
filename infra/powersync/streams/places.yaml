# Places streams (docs/data-model-sync-and-privacy.md §4): the offline pack for one trip's destination
# and on-demand exploration of any destination. Only editorial POIs are sent: a destination's open-data
# import runs to hundreds of thousands of rows, which search reaches over HTTP, while the phone carries
# the curated few hundred. Hidden POIs and POIs merged into another are never sent. Columns are listed so the search vector and PostGIS shapes stay
# server-side (lat/lng carry the position). A CTE cannot reference another CTE, so
# trip_destination repeats core.yaml's `my_crews` membership filter inline.

streams:
  # Subscribed with {trip_id} alongside `trip` while the trip is upcoming or live.
  trip_pack:
    with:
      trip_destination: |
        SELECT destination_id FROM trips
        WHERE id = subscription.parameter('trip_id')
          AND crew_id IN (SELECT crew_id FROM crew_members WHERE user_id = auth.user_id() AND status = 'active')
    queries:
      - |
        SELECT id, destination_id, name, name_local, category, lat, lng, address, hours,
          hours_verified_at, price_level, editorial, tags, status, curation, visit_radius_m, timezone,
          last_live_check_at, created_at, updated_at
        FROM pois
        WHERE destination_id IN trip_destination
          AND curation = 'editorial'
          AND status != 'hidden'
          AND merged_into_id IS NULL
      - SELECT * FROM map_regions WHERE destination_id IN trip_destination

  # Subscribed with {destination_id} while browsing a destination. The parameter is unauthenticated
  # on purpose: every destination's public POIs are open to any signed-in client.
  explore:
    accept_potentially_dangerous_queries: true
    queries:
      - |
        SELECT id, destination_id, name, name_local, category, lat, lng, address, hours,
          hours_verified_at, price_level, editorial, tags, status, curation, visit_radius_m, timezone,
          last_live_check_at, created_at, updated_at
        FROM pois
        WHERE destination_id = subscription.parameter('destination_id')
          AND curation = 'editorial'
          AND status != 'hidden'
          AND merged_into_id IS NULL
