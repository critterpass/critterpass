# Trip setup streams (docs/data-model-sync-and-privacy.md §4): the crew-visible setup rows (derived
# counts, window options, the budget aggregate and plan, rooms, must-dos and consented dietary
# flags) sync with the trip to every active member of its crew, mirroring their RLS
# (app.is_trip_member); a member's own room chips ride me. Raw calendars, availability asks,
# budget maxes and dietary profiles are C3 and never published, so no stream can name them.

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM room_prefs WHERE user_id = auth.user_id()

  trip:
    queries:
      - |
        SELECT * FROM availability_summaries
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM date_window_options
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM trip_budget_aggregates
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM budget_plans
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM room_plans
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM room_assignments
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM must_dos
        WHERE trip_id = subscription.parameter('trip_id')
          AND deleted_at IS NULL
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM participant_dietary_flags
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
