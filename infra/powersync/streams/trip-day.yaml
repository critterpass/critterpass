# Trip day streams (docs/data-model-sync-and-privacy.md §4). Filters mirror each table's RLS
# SELECT policy: a member's briefing and its items ride trip_me to that member alone; leave-bys,
# readiness, shared packing rows and the day bundle manifests ride the trip stream to its crew, and
# a personal packing row only to its owner; the device alarm mirror rides me.

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM alarms WHERE user_id = auth.user_id()

  trip_me:
    queries:
      - |
        SELECT * FROM briefings
        WHERE trip_id = subscription.parameter('trip_id')
          AND user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM briefing_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM packing_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND owner_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)

  trip:
    queries:
      - |
        SELECT * FROM leave_bys
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM readiness
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM packing_items
        WHERE trip_id = subscription.parameter('trip_id')
          AND owner_id IS NULL
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
      - |
        SELECT * FROM offline_bundles
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE crew_id IN my_crews)
