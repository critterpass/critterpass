# Explore streams (docs/data-model-sync-and-privacy.md §4): group swiping on the trip and the
# caller's saved lists. Filters mirror each table's RLS SELECT policy. swipe_votes is never synced
# (it holds every "no"); the crew sees swipe_yes_votes, the yes-only mirror. Guide tips
# (place_tips) are not synced: no phone reads them from its own database.

streams:
  trip:
    queries:
      - |
        SELECT * FROM swipe_sessions
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT * FROM swipe_yes_votes
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT * FROM swipe_matches
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)

  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM saved_lists WHERE user_id = auth.user_id()
