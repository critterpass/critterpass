# Critter streams (docs/data-model-sync-and-privacy.md §4). Filters mirror each table's RLS SELECT
# policy: a traveller's own eggs, encounters (never their evidence, which lives in the unpublished
# encounter_evidence table), collection and guide skins ride `me`; crewmates' counts ride
# `crew_people` (a member who hides their collection has no rows); on a trip, crewmates' eggs ride
# `trip` with the hatch status columns only (the caller's own egg comes whole through `me`).

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM eggs WHERE user_id = auth.user_id()
      - SELECT * FROM encounters WHERE user_id = auth.user_id()
      - SELECT * FROM collection_entries WHERE user_id = auth.user_id()
      - SELECT * FROM guide_skins WHERE user_id = auth.user_id()

  crew_people:
    auto_subscribe: true
    queries:
      - SELECT * FROM crew_collection_counts WHERE crew_id IN my_crews

  trip:
    queries:
      - |
        SELECT id, trip_id, user_id, granted_at, hatched_at FROM eggs
        WHERE trip_id = subscription.parameter('trip_id')
          AND user_id != auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
