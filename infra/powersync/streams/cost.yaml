# Cost streams (docs/data-model.md §3.4): a trip's cost components and every member's total sync
# with the trip; a member's own share calc (their lines and personal option deltas) syncs to that
# member only. Reviewed editorial cost indices are read over HTTP
# (`/v1/destinations/{id}/cost-indices`), never synced.

streams:
  trip:
    queries:
      - |
        SELECT * FROM cost_components
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT * FROM trip_share_totals
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
      - |
        SELECT * FROM share_calcs
        WHERE trip_id = subscription.parameter('trip_id')
          AND user_id = auth.user_id()
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN trip_crew)
