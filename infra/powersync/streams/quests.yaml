# Quest and XP streams (docs/data-model-sync-and-privacy.md §4). Filters mirror each table's RLS
# SELECT policy: a trip's quests, sign-ups and progress sync with the trip to every active member of
# its crew; a member's own XP rows ride me; the crew's XP rows (user_id null) and its running total
# ride crews. Every column is C1, so each row looks the same in every bucket it syncs through.

streams:
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM xp_ledger WHERE user_id = auth.user_id()

  crews:
    auto_subscribe: true
    queries:
      - SELECT * FROM xp_ledger WHERE user_id IS NULL AND crew_id IN my_crews
      - SELECT * FROM crew_xp WHERE crew_id IN my_crews

  trip:
    queries:
      - |
        SELECT * FROM quests
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM quest_signups
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
      - |
        SELECT * FROM quest_progress
        WHERE trip_id = subscription.parameter('trip_id')
          AND trip_id IN (SELECT id FROM trips WHERE id = subscription.parameter('trip_id') AND crew_id IN my_crews)
