# Full config for the local/test image (replaces the stock file).
listen_addresses = '*'
port = 5432
max_connections = 200
shared_buffers = 256MB
dynamic_shared_memory_type = posix

# Logical replication for PowerSync (production uses PlanetScale's failover-safe slot).
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10

shared_preload_libraries = 'pg_stat_statements'

timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
