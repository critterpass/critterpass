# Railway config-as-code for `powersync-api`: the client sync endpoint (PS_ROLE=api), scaled out
# horizontally (max_concurrent_connections per replica is pinned in infra/powersync/service.yaml).
# Set this file as the service's "Railway config file" in the dashboard (see README.md). Variables
# (names only) are listed in infra/powersync/README.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/railway/powersync.Dockerfile"
watchPatterns = ["infra/powersync/**", "infra/railway/powersync.Dockerfile", "infra/railway/powersync-api.toml"]

[deploy]
healthcheckPath = "/probes/readiness"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Open sync streams reconnect to another replica; give them time to move before shutdown.
drainingSeconds = 30

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 2
